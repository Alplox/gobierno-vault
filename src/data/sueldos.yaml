# Sueldo bruto mensual del Presidente por gobierno (serie histórica, más reciente
# primero). `ipc` = índice IPC mensual empalmado base dic-2023=100 (BCCh BDE) del
# mes al que corresponde el sueldo; `ratio_minimo_fecha` fija el divisor del ratio
# contra el sueldo mínimo. `vigencias` documenta cada monto conocido del mandato
# con su ventana temporal y su fuente (seguimiento anti-stale).
presidentes:
  - presidente_id: jose_antonio_kast
    gobierno: Kast
    periodo: 2026–2030
    sueldo: 11070064
    fecha_ref: '2026-03-01'
    fecha_label: >-
      marzo 2026 (dieta fijada; el Registro Público de mayo 2026 consigna
      $11.304.748)
    ipc: 110.75
    ratio_minimo_fecha: '2026-05-01'
    refs: [5, 8, 9, 10, 11, 12, 13, 14, 15, 28]
    vigencias:
      - monto: 10269076
        fuente: cfr-informe-tecnico-resolucion-5
        descripcion: Monto original fijado por la Resolución N°5/2024 (18 meses de anticipación), vigente desde el 11/03/2026
      - monto: 11070064
        fuente: cfr-oficio-n26-2025
        descripcion: Dieta ajustada (+7,8% IPC excepcional del Oficio N°26/2025), vigente desde el 11/03/2026
      - monto: 11304748
        fuente: cfr-registro-publico-38bis
        descripcion: Bruta reportada al Registro Público, periodo 2026-05 (+$237.970 sobre la dieta ajustada; exceso sistemático bajo investigación)
      - monto: 11308034
        fuente: cfr-registro-publico-38bis
        descripcion: Bruta reportada al Registro Público, periodo 2026-06 (+$237.970 sobre la dieta ajustada)
      - monto: 7536499
        fuente: cfr-registro-publico-38bis
        descripcion: Bruta del mes proporcional marzo 2026 (asunción 11/03; 2/3 del mes)
    detalle: >-
      Fijado por la Comisión para la Fijación de Remuneraciones (Resolución N°5 de
      2024, Ley 21.233), vigente desde el 11/03/2026: $10.269.076 originales +
      adecuación excepcional por IPC (+7,8%, Oficio N°26/2025) = $11.070.064. El
      Registro Público de la Comisión consigna $11.304.748 brutos en mayo 2026 y
      $11.308.034 en junio 2026 — $237.970 sobre el monto ajustado. Verificado
      23-ago-2026: el exceso es sistemático en cargos de confianza (ministros
      +$261.098, subsecretarios +$251.171), mientras parlamentarios y SEREMIs cobran
      exactamente el monto ajustado; sin documento público que desglose la
      diferencia. Emol lo reporta en $11,3
      millones. En marzo de 2026 Kast anunció su intención de rebajarlo de forma
      estructural. El monto contradice su promesa de campaña de 2021 de rebajarse
      el sueldo a la mitad ("gobernar con el ejemplo"); al ser consultado en
      diciembre de 2025 respondió que el monto "es una norma legal" que "decidió el
      Congreso".
