# Ingresos laborales individuales de la ESI 2025. Todos los montos son netos
# mensuales por persona ocupada; no son remuneraciones brutas ni ingresos de hogar.
ingresos_esi:
  ano: 2025
  periodo: 'octubre–diciembre de 2025'
  unidad: 'pesos netos mensuales por persona ocupada'
  fuente: ine-2026-07-14-esi-2025-ingresos
  mediana: 680000
  promedio: 962945
  asalariados_publicos_promedio: 1321228
  porcentaje_1m_o_mas: 29.4
  porcentaje_3m_o_mas: 4.3
  nota: >-
    La mediana divide a la población ocupada en dos mitades; el promedio
    resume el total de ingresos y puede ser influido por los ingresos altos.
    El dato de asalariados públicos es un promedio de esa categoría, no la
    remuneración del Presidente.

