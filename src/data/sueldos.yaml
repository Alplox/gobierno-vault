# Datos de la página /sueldos — fuente de verdad de montos, series y referencias.
# La prosa y el layout viven en src/pages/sueldos.astro; los números que aparecen
# en el texto se calculan en src/lib/sueldos.ts a partir de ESTE archivo (nada de
# cifras escritas a mano en el template).
#
# Convenciones:
# - Montos en pesos nominales (enteros, sin separador de miles).
# - Fechas ISO 'YYYY-MM-DD' entre comillas.
# - Personas: referenciar por ID de entities.yaml (`presidente_id`, `persona_id`,
#   `firmante_id`) — NUNCA nombre plano. src/lib/sueldos.ts resuelve el nombre y
#   falla el build si el ID no existe.
# - Fuentes: TODAS las referencias son IDs de sources.yaml (nada de URLs locales).
#   `orden_refs` fija la numeración [N] visible; los <SRef n={N} /> resuelven
#   medio/título/url desde el registro de fuentes.
# - Cada monto lleva `vigencias` (qué monto rigió cuándo y con qué fuente) para
#   que el dato no quede stale ni huérfano de origen.

# Orden de numeración [N] de las referencias inline de toda la página (1-based).
# Al insertar/eliminar una fuente aquí NO hay que tocar el template: los <SRef />
# resuelven por posición contra esta lista.
