    unidad_default: casos
    notas: "De 190 a 157 casos, una baja del 17% con foco en las provincias bajo estado de excepción, según fuentes de gobierno citadas por La Tercera (30 de julio de 2026)."
  quema_maquinaria_macrozona_sur:
    nombre: Reducción de quema de maquinaria en la Macrozona Sur
    unidad_default: "%"
