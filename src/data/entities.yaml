    tipo: ong
    pais: Chile
    notas: "ONG ambientalista chilena. En agosto de 2026 solicitó al Tribunal Constitucional abrir una instancia de participación ciudadana en el proceso de la megarreforma, permitiendo que la sociedad civil exponga los efectos de las normas impugnadas sobre sus derechos."
