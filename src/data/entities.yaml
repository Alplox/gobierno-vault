    notas: Anunció Comisión Investigadora por respuesta tardía al sistema frontal
  gonzalo_fuentes:
    nombre: Gonzalo Fuentes
    cargo: Gobernador Regional
    notas: Acusó al ministro Poduje de crear conflictos artificiales
  patricia_rojas:
    nombre: Patricia Rojas
    cargo: Vicepresidenta de la UDI
    notas: Acusó a Sedini de ser desleal y no tener códigos
  nelson_haase_mazzei:
    nombre: Nelson Haase Mazzei
    cargo: Exoficial del Ejército (r)
    notas: Último prófugo condenado por homicidio y secuestro de Víctor Jara y
      Littré Quiroga. Detenido el 25 de julio de 2026 en Puyehue. Exintegrante
      de Tejas Verdes y la DINA
  nelson_venegas:
    nombre: Nelson Venegas
    cargo: Diputado (PS)
    cargos:
