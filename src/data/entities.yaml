    nombre: Álvaro Corbalán
    cargo: Teniente coronel (r) del Ejército
    notas: "Exjefe de operaciones de la CNI. Condenado por crímenes de lesa humanidad, incluyendo la Operación Albania. Recluso en el ex penal Punta Peuco."
  carlos_herrera_jimenez:
    nombre: Carlos Herrera Jiménez
    cargo: Mayor (r) del Ejército
    notas: "Exagente de la CNI. Condenado por el asesinato del presidente de la ANEF, Tucapel Jiménez. Recluso en el ex penal Punta Peuco."
  raul_iturriaga:
    nombre: Raúl Iturriaga Neumann
    cargo: General (r) del Ejército
    notas: "Exjefe de la División Exterior de la DINA. Condenado por crímenes de lesa humanidad. Recluso en el ex penal Punta Peuco."
  jaime_gajardo:
    nombre: Jaime Gajardo
    cargo: Exministro de Justicia
    notas: "Exministro de Justicia del gobierno de Gabriel Boric. Criticó la idea de restituir a Punta Peuco como cárcel especial."
  maria_jesus_wulf:
    nombre: María Jesús Wulf
    cargo: Ministra de Desarrollo Social y Familia
    organizacion: ministerio_desarrollo_social
    notas: "Ministra de Desarrollo Social y Familia del gobierno de José Antonio Kast. Anunció el proyecto que estudia usar ClaveÚnica para verificación de edad en redes sociales."
  diego_schalper:
    nombre: Diego Schalper
    cargo: Diputado (Renovación Nacional)
    organizacion: renovacion_nacional
    notas: "Diputado RN. Impulsor del proyecto que prohíbe el acceso de menores de 16 años a redes sociales y plataformas digitales."
  joel_velasco:
    nombre: Joel Velasco
    cargo: Vicepresidente de UnitedHealth Group
    organizacion: unitedhealth_group
    notas: "Ejecutivo estadounidense, vicepresidente de UnitedHealth Group, dueño del 96% de Banmédica desde 2018. Participó en el almuerzo de José Antonio Kast en Washington D.C. en noviembre de 2021."
  maria_paulina_uribe:
    nombre: María Paulina Uribe
    cargo: Gerenta de Marketing de PepsiCo
    organizacion: pepsico
    notas: "Ejecutiva colombiana, gerenta de Marketing de PepsiCo. Participó en el almuerzo de José Antonio Kast en Washington D.C. en noviembre de 2021."
  isa_kort:
    nombre: Isa Kort
    cargo: Embajador de Chile ante la OEA
    notas: "Embajador de Chile ante la Organización de Estados Americanos (OEA). Llegó y se retiró del restaurante La Taberna del Alabardero a la misma hora que José Antonio Kast durante su almuerzo en Washington D.C. (noviembre de 2021), aunque no participó de la reunión."
  luis_araya_valdecchy:
    nombre: Luis Araya Valdecchy
    cargo: Candidato a vicepresidencia regional del Partido Republicano en Arica
    organizacion: partido_republicano
    notas: "Representante en Chile del Grupo de Transporte Internacional Vargas Nogales SRL de Bolivia. Imputado por contaminación grave imprudente tras el derrame de aceite en el Lago Chungará (noviembre de 2025). Excandidato a consejero regional y aspirante a la vicepresidencia regional del Partido Republicano en Arica. Fue requerido por Interpol por presunto contrabando en Perú."
  diego_paco:
    nombre: Diego Paco
    cargo: Gobernador regional de Arica y Parinacota
    notas: "Gobernador regional de Arica y Parinacota. Solicitó al Consejo de Defensa del Estado ampliar la querella por el derrame de aceite en el Lago Chungará a la empresa transportista."
  stephani_jeldres:
    nombre: Stephani Jeldres
    cargo: Diputada
    notas: "Diputada. Apareció haciendo campaña en redes sociales junto a Luis Araya Valdecchy, candidato a la vicepresidencia regional del Partido Republicano en Arica."
  osvaldo_zuniga:
    nombre: Osvaldo Zúñiga
    cargo: Presidente de la Confederación Nacional Ranquil
    organizacion: confederacion_ranquil
    notas: "Dirigente agrario. Presidente de la Confederación Nacional Ranquil, que agrupa sindicatos y federaciones de campesinos. Rechazó la consulta pública del SAG sobre comercialización de semillas (2026) por permitir la privatización de semillas vía UPOV 91."
  danae_castanon:
    nombre: Danae Castañón
    cargo: Integrante de Semilla Soberana
    organizacion: semilla_soberana
    notas: "Integrante de Semilla Soberana, red que agrupa a Colectivo Ecológico en Acción, Escuela de Activismo Agroecológico Reberde, Dedos Verdes, Ruka Wichan Mapu de Laja, Agrupación Cultural Newen Mapuche y Coordinadora No al TPP. Se opuso a la consulta no vinculante del SAG sobre semillas (2026)."
  aly_valderrama:
    nombre: Aly Valderrama
    cargo: Ex delegada presidencial de Linares
    notas: "Ingeniera agrónoma y doctora en ciencias con mención en investigación y desarrollo de productos bioactivos de la Universidad de Talca; posdoctorada de la Universidad Autónoma de México. Ex delegada presidencial de Linares. Advirtió riesgos para la seguridad alimentaria por la resolución del SAG sobre semillas (2026)."
  maria_elena_rozas:
    nombre: María Elena Rozas
    cargo: Coordinadora nacional de RAP-Chile
    organizacion: rap_chile
    notas: "Coordinadora nacional de la Red de Acción en Plaguicidas y sus Alternativas (RAP-Chile). Autora de la columna 'Una aclaración no protege las semillas' en Interferencia (julio 2026), que pidió retirar el proyecto de resolución del SAG sobre comercialización de semillas."
  leo_ferres:
    nombre: Leo Ferres
    cargo: Investigador principal del Instituto de Data Science UDD
    organizacion: instituto_data_science_udd
    notas: "Científico de datos. Investigador principal del estudio sobre el impacto de las alertas SAE durante los incendios de Valparaíso de 2024, colaboración entre la UDD, L3S (Alemania), Central European University (Austria) e ISI Foundation (Italia)."
  natalia_flores_gonzalez:
    nombre: Natalia Flores González
    cargo: Coordinadora de Feminismo del Instituto Igualdad
    organizacion: instituto_igualdad
    notas: "Autora de la columna de opinión en El Mostrador sobre el fin del Programa Mujeres Rurales (julio 2026)."
  jose_joaquin_brunner:
    nombre: José Joaquín Brunner
    cargo: Académico y exministro secretario general de Gobierno
    notas: "Sociólogo, académico y político chileno. Exministro secretario general de Gobierno de Eduardo Frei Ruiz-Tagle y exdirector de FLACSO. Autor de la columna 'La estrategia de Kast: lo que conocemos y lo que aún desconocemos' en El Líbero (diciembre 2025), que analiza la estrategia de ocultamiento valórico de José Antonio Kast."
  rodrigo_paz:
    nombre: Rodrigo Paz
    cargo: Presidente de Bolivia
    cargos:
      - cargo: Presidente de Bolivia
        organizacion: bolivia
        desde: 2025-11-01
    organizacion: bolivia
    notas: "Presidente de Bolivia. Asistió a la investidura de José Antonio Kast en marzo de 2026 y ha manifestado su intención de avanzar en una nueva agenda comercial con Chile. Su gobierno enfrentó protestas y bloqueos de carreteras en 2026 promovidos por sindicatos campesinos, la COB y sectores afines a Evo Morales."
  evo_morales:
    nombre: Evo Morales
    cargo: Expresidente de Bolivia (2006-2019)
    cargos:
      - cargo: Presidente de Bolivia
        organizacion: bolivia
        desde: 2006-01-22
        hasta: 2019-11-10
    organizacion: bolivia
    notas: "Expresidente de Bolivia (2006-2019). Sectores afines a Morales impulsaron las protestas y bloqueos de carreteras contra el gobierno de Rodrigo Paz en 2026 que provocaron desabastecimiento en el país."
  jaime_gazmuri:
    nombre: Jaime Gazmuri
    cargo: Embajador de Chile en Venezuela (retirado 2024)
    notas: "Embajador de Chile en Venezuela. En abril de 2024 fue llamado a consultas por el presidente Gabriel Boric en medio de las tensiones bilaterales, y en julio de 2024 Nicolás Maduro ordenó su retiro junto al resto del cuerpo diplomático chileno tras las críticas del gobierno de Boric al proceso electoral venezolano."
  felix_plasencia:
    nombre: Félix Plasencia
    cargo: Canciller de Venezuela
    cargos:
      - cargo: Canciller de Venezuela
        organizacion: venezuela
        desde: 2026-01-05
    organizacion: venezuela
    notas: "Canciller de Venezuela durante la presidencia encargada de Delcy Rodríguez. Difundió en redes sociales el anuncio conjunto del 30 de julio de 2026 sobre la reactivación de las relaciones consulares con Chile."
  pavel_castillo:
    nombre: Pavel Castillo
    cargo: Gerente de Intelligence y economista conductual de CORPA
    organizacion: corpa
    notas: "Gerente de Intelligence y economista conductual de la consultora CORPA. Comentó el estudio de victimización del bimestre mayo-junio 2026 de la Región Metropolitana."
  marcelo_pena:
    nombre: Marcelo Peña
    cargo: Académico de la Universidad Central
    notas: "Académico de la Universidad Central. Explicó a The Clinic el significado de los umbrales de detección en test de drogas de pelo (500 ng/g vs 300 ng/g) en el contexto del caso del exsubsecretario de Hacienda Juan Pablo Rodríguez."
  gabriel_rodriguez:
    nombre: Gabriel Rodríguez
    cargo: Periodista y escritor
    notas: "Periodista y escritor, Premio Nacional a la Trayectoria Literaria 2024. Autor del libro 'Auschwitz, Colonia Dignidad y más, historias de héroes y canallas'. Denunció que el seremi de las Culturas del Maule, Pablo Amaro, censuró la presentación de su libro en el Museo O'Higginiano de Talca (agosto 2026)."
  rocio_alorda:
    nombre: Rocío Alorda
    cargo: Presidenta del Colegio de Periodistas de Chile
    notas: "Periodista, presidenta del Colegio de Periodistas de Chile. Calificó como censura previa la suspensión de la presentación del libro de Gabriel Rodríguez en Talca (agosto 2026)."
  roberto_celedon:
    nombre: Roberto Celedón
    cargo: Diputado independiente
    notas: "Diputado independiente afín al Frente Amplio. Criticó como censura previa la suspensión de la presentación del libro de Gabriel Rodríguez en Talca (agosto 2026)."
  rosanna_costa:
    nombre: Rosanna Costa
    cargo: Presidenta del Banco Central de Chile
    notas: "Presidenta del Banco Central de Chile. Impulsó mesas de trabajo con la industria para desarrollar pagos inmediatos interoperables estilo Pix; se refirió al tema en el Chile Day de Nueva York (mayo 2026)."
  juan_antonio_figueroa:
    nombre: Juan Antonio Figueroa
    cargo: Director ejecutivo de ChilePay
    notas: "Director ejecutivo de ChilePay, organismo que reúne a los medios de pago en Chile. Comentó el desarrollo de un sistema de pagos inmediatos estilo Pix chileno (agosto 2026)."
  sergio_bobadilla:
    nombre: Sergio Bobadilla
    cargo: Diputado (UDI)
    cargos:
      - cargo: Diputado
        organizacion: udi
        desde: 2026-03-11
    notas: "Diputado por el distrito 20 (Provincia de Concepción). Encabezó el ranking de gastos 2025 en arriendo de vehículos de los diputados del Biobío con $20.446.757, según reportaje de Aquí Biobío/El Mostrador (julio 2026). Justificó arrendar dos vehículos: uno para el distrito y otro para viajar de Santiago a Valparaíso."
  francesca_munoz:
    nombre: Francesca Muñoz
    cargo: Diputada (PSC)
    cargos:
      - cargo: Diputada
        organizacion: partido_social_cristiano
        desde: 2026-03-11
    notas: "Diputada por el distrito 20 o 21 (Región del Biobío). Gastó $11.689.442 en arriendo de vehículos en 2025 (4° del ranking del Biobío) y $915.241 en taxis, según reportaje de Aquí Biobío/El Mostrador (julio 2026)."
  leonidas_romero:
    nombre: Leonidas Romero
    cargo: Diputado (PNL)
    cargos:
      - cargo: Diputado
        organizacion: partido_nacional_libertario
        desde: 2026-03-11
    notas: "Diputado por el distrito 20 o 21 (Región del Biobío). Gastó $8.378.429 en arriendo de vehículos en 2025, según reportaje de Aquí Biobío/El Mostrador (julio 2026)."
  felix_gonzalez:
    nombre: Félix González
    cargo: Diputado (PEV)
    cargos:
      - cargo: Diputado
        organizacion: partido_ecologista_verde
        desde: 2026-03-11
    notas: "Diputado por el distrito 20 (Provincia de Concepción), del Partido Ecologista Verde. Gastó $5.903.504 en arriendo de vehículos en 2025 (no arrendó en febrero) y $390.607 en mantención de auto particular, según reportaje de Aquí Biobío/El Mostrador (julio 2026)."
  joanna_perez:
    nombre: Joanna Pérez
    cargo: Diputada (Demócratas)
    cargos:
      - cargo: Diputada
        organizacion: partido_democratas
        desde: 2026-03-11
    notas: "Diputada por el distrito 21 (Región del Biobío). No registró arriendos de vehículos con fondos públicos en 2025, pero pidió $2.439.760 para mantención de su auto particular, el mayor monto de ese ítem entre los diputados del Biobío. Explicó que no usa arriendos y que en 2025 sufrió la pérdida total de un vehículo de trabajo (Aquí Biobío/El Mostrador, julio 2026)."
  eric_aedo:
    nombre: Eric Aedo
    cargo: Diputado (DC)
    cargos:
      - cargo: Diputado
        organizacion: partido_democratacristiano
        desde: 2026-03-11
    notas: "Diputado por el distrito 20 (Provincia de Concepción). No registró arriendos de vehículos con fondos públicos en 2025, según reportaje de Aquí Biobío/El Mostrador (julio 2026)."
  maria_candelaria_acevedo:
    nombre: María Candelaria Acevedo
    cargo: Diputada (PC)
    cargos:
      - cargo: Diputada
        organizacion: partido_comunista
        desde: 2026-03-11
    notas: "Diputada por el distrito 20 o 21 (Región del Biobío). No registró arriendos de vehículos con fondos públicos en 2025, según reportaje de Aquí Biobío/El Mostrador (julio 2026)."
  clara_sagardia:
    nombre: Clara Sagardía
    cargo: Diputada (FA)
    cargos:
      - cargo: Diputada
        organizacion: frente_amplio
        desde: 2026-03-11
    notas: "Diputada por el distrito 20 o 21 (Región del Biobío). No registró arriendos de vehículos en 2025, pero solicitó $811.104 para mantención de auto particular y $1.254.209 en peajes y tag, según reportaje de Aquí Biobío/El Mostrador (julio 2026)."
  karen_medina:
    nombre: Karen Medina
    cargo: Diputada (PDG)
    cargos:
      - cargo: Diputada
        organizacion: pdg
        desde: 2026-03-11
    notas: "Diputada por el distrito 20 o 21 (Región del Biobío). No registró arriendos de vehículos, pero rindió $1.965.000 en taxis, el mayor monto de ese ítem entre los diputados del Biobío (Aquí Biobío/El Mostrador, julio 2026)."
  jorge_guzman:
    nombre: Jorge Guzmán
    cargo: Diputado (Evópoli)
    cargos:
      - cargo: Diputado
        organizacion: evopoli
        desde: 2026-03-11
    notas: "Diputado de Evópoli. Calificó de 'paradójico que el Partido Republicano, que es el corazón del Gobierno, sea el primero en poner obstáculos' a la agenda del Ejecutivo, emplazando a Kast a 'dejar de escuchar tanto al corazón' (julio 2026)."
  tomas_hirsch:
    nombre: Tomás Hirsch
    cargo: Exdiputado y activista humanista
    notas: "Exdiputado humanista y activista. Autor del proyecto de ley que busca prohibir y sancionar la organización de carreras de perros en Chile (tramitado en la Cámara de Diputados, votación del 3 de agosto de 2026)."
  mayra_cabezas:
    nombre: Mayra Cabezas
    cargo: Directora de Incidencia de la Fundación Derecho y Defensa Animal
    organizacion: fundacion_derecho_defensa_animal
    notas: "Directora de Incidencia de la Fundación Derecho y Defensa Animal. Ante la votación sobre carreras de perros y canódromos (julio 2026) señaló que 'regular canódromos sin resolver las apuestas ilegales, el dopaje y el maltrato documentado no es ordenar una actividad, es blanquearla' y llamó a que Chile se sume a la región y las prohíba."
  diego_rojas:
    nombre: Diego Rojas
    cargo: Abogado
    notas: "Abogado citado por El Desconcierto en el análisis del decreto que modifica el Reglamento de Seguridad Minera (julio 2026). Cuestionó el traslado del análisis de riesgos desde la Administración a los particulares y el desacople de la RCA respecto de la autorización minera de Sernageomin."
  felipe_sepulveda:
    nombre: Felipe Sepúlveda
    cargo: Fiscal jefe de Alta Complejidad (Metropolitana Oriente)
    notas: "Fiscal jefe de Alta Complejidad de la Fiscalía Metropolitana Oriente. Argumentó en el juicio abreviado del Caso Factop (julio 2026) que varias personas aportaron fondos a Factop y que Álvaro Jalaff tuvo participación relevante para que los engaños se produjeran."
  sergio_gahona:
    nombre: Sergio Gahona
    cargo: Senador UDI
    organizacion: senado
    notas: "Senador UDI. En el marco de la votación de la Ley de Reconstrucción Nacional (agosto 2026), habría terminado votando a favor del informe de la Comisión Mixta, pese a haber condicionado su voto."
  eduardo_cretton:
    nombre: Eduardo Cretton
    cargo: Diputado UDI
    organizacion: camara_diputados
    notas: "Diputado UDI. Junto al subjefe de bancada Sergio Bobadilla anunció (agosto 2026) el reingreso en septiembre del proyecto que establece el pago de la dieta de expresidentes desde los 65 años, en reacción al reposteo del expresidente Gabriel Boric."
  andres_longton:
    nombre: Andrés Longton
    cargo: Senador RN
    organizacion: senado
    notas: "Senador de Renovación Nacional. Ante la propuesta del gobierno de crear un quinto estado de excepción con despliegue de FF.AA. (agosto 2026), pidió conocer primero en qué se diferenciaría esta nueva herramienta del actual estado de emergencia."
  luis_fernando_sanchez:
    nombre: Luis Fernando Sánchez
    cargo: Diputado Partido Republicano
    organizacion: partido_republicano
    notas: "Diputado del Partido Republicano. Valoró el avance del proyecto que faculta a militares a realizar controles de identidad en estados de excepción (junio 2026), señalando que permite un uso más eficiente del recurso humano."
  jaime_mulet:
    nombre: Jaime Mulet
    cargo: Diputado y presidente de la Comisión de Constitución de la Cámara (FRVS)
    organizacion: frente_regionalista_verde_social
    notas: "Diputado de la Federación Regionalista Verde Social (FRVS) y presidente de la Comisión de Constitución de la Cámara. Aprobó en general el proyecto de controles de identidad de militares (junio 2026) pero advirtió sobre un eventual uso malicioso en un golpe de Estado, planteando la hipótesis de que un presidente use las FF.AA. para detener opositores."
  ximena_ossandon:
    nombre: Ximena Ossandón
    cargo: Diputada (RN)
    organizacion: renovacion_nacional
    cargos:
      - cargo: Diputada (RN)
        organizacion: renovacion_nacional
        desde: 2026-03-11
    notas: "Diputada RN. En febrero de 2026 advirtió que 'las lealtades se construyen con gestos' ante la baja representación partidaria en la nómina de subsecretarios de José Antonio Kast. Junto al jefe de bancada Diego Schalper solicitó al Gobierno (agosto 2026) poner urgencia al proyecto que permite el apoyo de las Fuerzas Armadas a las policías, presentado el 6 de julio de 2026. Fue coautora del proyecto 'Escucha su corazón'; posteriormente retiró su patrocinio."
  henry_leal:
    nombre: Henry Leal
    cargo: Diputado UDI
    organizacion: udi
    notas: "Diputado UDI. En febrero de 2026 defendió el derecho de José Antonio Kast a armar su gabinete de subsecretarios sin condiciones partidarias, ante el debate por la baja representación de Chile Vamos."
  stephan_schubert:
    nombre: Stephan Schubert
    cargo: Diputado y presidente de la Comisión de Relaciones Exteriores de la Cámara
    organizacion: camara_diputados
    notas: "Diputado y presidente de la Comisión de Relaciones Exteriores de la Cámara de Diputados. Valoró el cambio en la relación bilateral con Venezuela tras la reactivación consular (agosto 2026)."
  gilberto_aranda:
    nombre: Gilberto Aranda
    cargo: Analista internacional de la Universidad de Chile
    notas: "Analista internacional de la Universidad de Chile. Sobre la reactivación consular con Venezuela (agosto 2026) destacó que recuperar los servicios permitirá resolver problemas de documentos de venezolanos y cooperar contra el crimen organizado."
  luis_felipe_vergara:
    nombre: Luis Felipe Vergara
    cargo: Analista internacional de la Universidad Andrés Bello
    notas: "Analista internacional de la Universidad Andrés Bello. Sobre la reactivación consular con Venezuela (agosto 2026) señaló que el acercamiento debería consolidarse en el corto y mediano plazo."
  nicolas_valenzuela:
    nombre: Nicolás Valenzuela
    cargo: Jefe de diseño de la Secretaría de Comunicaciones (Secom)
    organizacion: secom
    notas: "Jefe de diseño de la Secom del gobierno de José Antonio Kast. En un chat de WhatsApp filtrado admitió que la gráfica presentada el 11 de marzo de 2026 era 'horrible' y no un logo nuevo, sino 'una acción rápida para instaurar rápido el slogan', aclarando que el logo original (de 2020) se mantiene con nuevo slogan."
  hernan_nunez:
    nombre: Hernán Núñez
    cargo: Director general de Asuntos Consulares
    notas: "Director general de Asuntos Consulares de la Cancillería. Encabezó la avanzada que viajó a Caracas a inicios de agosto de 2026 para habilitar los servicios consulares entre Chile y Venezuela."
  claudio_soto:
    nombre: Claudio Soto Solís
    cargo: Concejal de Lago Verde
    notas: "Concejal de Lago Verde (Aysén), de 43 años. Falleció en un incendio en el hospedaje Casona El Bosque, en Villa Amengual, donde se alojaba con la delegación municipal que participaría en el Festival de la Lana (1 agosto 2026)."
  claudia_valdes:
    nombre: Claudia Valdés
    cargo: Alcaldesa de Lago Verde
    notas: "Alcaldesa de Lago Verde (Aysén). Tras el incendio en que falleció el concejal Claudio Soto (agosto 2026) expresó sus condolencias y calificó lo sucedido como una tragedia que enluta a la comunidad."
  luz_maria_vicuna:
    nombre: Luz María Vicuña
    cargo: Delegada presidencial regional de Aysén
    notas: "Delegada presidencial regional de Aysén. Confirmó que la Fiscalía instruyó diligencias a la SIP y al Labocar de Coyhaique tras el incendio en Villa Amengual que cobró la vida del concejal Claudio Soto (agosto 2026)."
  daniel_diaz:
    nombre: Daniel Díaz Olguín
    cargo: Director de Codelco (cupo FTC)
    organizacion: codelco
    notas: "Dirigente del Sindicato Minero de Chuquicamata y consejero nacional de la Federación de Trabajadores del Cobre. El 28 de mayo de 2026 fue designado por el presidente José Antonio Kast como director de Codelco en representación de los trabajadores (2026-2030), elegido de la quina de la FTC. La investigación de Contrapoder Chile (mayo 2026) denunció que posee empresas ligadas a la minería (NEDX SpA, Global Commodity Brokers SpA) y nexos con empresarios chinos en Calama, lo que él desmintió."
  hector_roco:
    nombre: Héctor Roco Aguilar
    cargo: Presidente de la Federación de Trabajadores del Cobre
    organizacion: federacion_trabajadores_cobre
    notas: "Presidente de la Federación de Trabajadores del Cobre. La investigación de Contrapoder Chile (mayo 2026) señaló que habría impulsado activamente la nominación de Daniel Díaz Olguín al cupo laboral del directorio de Codelco."
  juan_carlos_olguin:
    nombre: Juan Carlos Olguín
    cargo: Expresidente de la Federación de Trabajadores del Cobre
    organizacion: federacion_trabajadores_cobre
    notas: "Expresidente de la FTC. Mencionado en la investigación de Contrapoder Chile sobre la designación de Daniel Díaz al directorio de Codelco (mayo 2026); ejerció su derecho a réplica señalando que su relación con Díaz fue institucional y que la sociedad que compartieron fue un emprendimiento familiar de helados que nunca operó."
  osvaldo_urrutia:
    nombre: Osvaldo Urrutia
    cargo: Subsecretario de Pesca y Acuicultura
    notas: "Subsecretario de Pesca y Acuicultura (SUBPESCA). A inicios de agosto de 2026 manifestó que el gobierno está abierto a evaluar el levantamiento de la veda y una eventual caza selectiva de lobos marinos ante los conflictos con la pesca artesanal del sur, lo que generó rechazo ambientalista. El 3 de agosto respondió a la petición de los pescadores ante la Comisión de Pesca señalando que cualquier cambio requerirá respaldo técnico y científico."
  dionisio_ulloa:
    nombre: Dionisio Ulloa
    cargo: Abogado defensor
    notas: "Abogado defensor del excarabinero de la Subcomisaría de Paillaco absuelto en agosto de 2026 en el segundo juicio por violación. Tras la absolución por deficiencia probatoria, anunció que presentará recursos administrativos para buscar el reintegro del exfuncionario a Carabineros."
  jorge_bustos:
    nombre: Jorge Bustos
    cargo: Presidente del Consejo Regional para la Pesca Artesanal (Corepa)
    organizacion: corepa
    notas: "Presidente del Consejo Regional para la Pesca Artesanal (Corepa). Expuso ante la Comisión de Pesca de la Cámara de Diputados en agosto de 2026 pidiendo levantar la veda de caza del lobo marino por los daños a las faenas de pesca artesanal."
  jose_verdugo:
    nombre: José Verdugo
    cargo: Representante de pescadores artesanales de Puerto Montt
    notas: "Pescador artesanal de Puerto Montt. Ante la Comisión de Pesca de la Cámara en agosto de 2026 denunció el daño económico que los lobos marinos causan a las capturas de merluza, jurel y a los equipos de pesca."
  carlos_gatica:
    nombre: Carlos Gatica
    cargo: Alcalde de Coyhaique
    notas: "Alcalde de Coyhaique (Aysén). Presentó en agosto de 2026 la 'aldea de emergencia' municipal con capacidad para 200 personas ante la ola de frío y nevadas, financiada por el GORE de Aysén y el municipio."
  lorena_castillo:
    nombre: Lorena Castillo
    cargo: Directora nacional subrogante del IND
    notas: "Directora nacional subrogante del Instituto Nacional de Deportes. La ministra del Deporte Natalia Duco habría solicitado su destitución, según reportó ADN Radio (agosto 2026), en el marco de las tensiones por el concierto de BTS en el Estadio Nacional."
  jorge_silva:
    nombre: Jorge Silva
    cargo: Jefe subrogante del Departamento de Alto Rendimiento del IND
    notas: "Jefe subrogante del Departamento de Alto Rendimiento del IND. El Mindep defendió su asignación por su trayectoria en gestión deportiva, en el contexto del conflicto entre la ministra Natalia Duco y los funcionarios del IND (agosto 2026)."
  andres_otero:
    nombre: Andrés Otero
    cargo: Subsecretario del Deporte
    notas: "Subsecretario del Deporte. Junto a la ministra Natalia Duco fue señalado por la Asociación Nacional de Funcionarios de Chiledeportes (ANFUCHID) como responsable de no responder a las solicitudes de reunión de los trabajadores del IND (julio-agosto 2026)."
  sebastian_edwards:
    nombre: Sebastián Edwards
    cargo: Economista de la UCLA
    notas: "Economista de la Universidad de California en Los Ángeles. En el seminario de Moneda Patria Investment (julio 2026) dijo que Codelco necesita una 'cirugía' mayor, en el marco del debate sobre capitales privados en la estatal."
  felipe_morande:
    nombre: Felipe Morandé
    cargo: Presidente del Consejo Directivo del Sistema de Empresas SEP
    notas: "Presidente del Consejo Directivo del Sistema de Empresas Públicas (SEP). Descartó en agosto de 2026 una privatización inmediata de las empresas del sistema, aunque no descartó la entrada de privados en un plazo mayor si hay estabilidad financiera."
  marcos_barraza:
    nombre: Marcos Barraza
    cargo: Diputado Partido Comunista
    organizacion: partido_comunista
    notas: "Diputado del Partido Comunista. Participó junto a Jaime Araya y Consuelo Veloso en el streaming 'Un Día Menos' donde se originó la polémica por los dichos sobre el Servel (julio 2026)."
  dario_quiroga:
    nombre: Darío Quiroga
    cargo: Exasesor de Jeannette Jara y conductor del streaming 'Un Día Menos'
    notas: "Exasesor de la exministra del Trabajo Jeannette Jara. Conduce el streaming 'Un Día Menos', espacio donde los diputados Jaime Araya y Consuelo Veloso cuestionaron la credibilidad del Servel (julio 2026)."
  alejandro_riquelme:
    nombre: Alejandro Riquelme
    cargo: Diputado Partido Republicano
    organizacion: partido_republicano
    notas: "Diputado del Partido Republicano. Tras los dichos de Araya y Veloso sobre el Servel (julio 2026) calificó como 'impresionante la desfachatez' de los parlamentarios y defendió la institucionalidad electoral."
  felipe_ross:
    nombre: Felipe Ross
    cargo: Diputado Partido Republicano
    organizacion: partido_republicano
    notas: "Diputado del Partido Republicano. Cuestionó especialmente a la diputada Consuelo Veloso por los dichos sobre el Servel (julio 2026), señalando que 'está cuestionando la votación más contundente de la historia de nuestra democracia'."
  alejandra_valdebenito:
    nombre: Alejandra Valdebenito
    cargo: Diputada UDI
    organizacion: udi
    notas: "Diputada de la UDI e integrante de la Comisión de Derechos Humanos de la Cámara. En agosto de 2026 impulsó la ofensiva presupuestaria de su bancada contra el INDH por el contrato de $250 millones con la productora Ditecsur, afirmando que 'este despilfarro de plata' justifica la posición de eliminar la institución por considerarla 'políticamente capturada por la extrema izquierda'."
  juan_antonio_coloma:
    nombre: Juan Antonio Coloma
    cargo: Secretario general de la UDI
    organizacion: udi
    notas: "Secretario general de la UDI. El 4 de agosto de 2026 adelantó que la directiva del partido llevaría al Presidente José Antonio Kast, en la cita en Cerro Castillo, peticiones de seguridad centradas en la protección y fortalecimiento de las policías."
  consuelo_contreras:
    nombre: Consuelo Contreras
    cargo: Exdirectora del INDH
    organizacion: indh
    notas: "Exdirectora del Instituto Nacional de Derechos Humanos. Sus viajes a la sede de la ONU en Ginebra (Suiza) para las asambleas anuales de la GANHRI —por $8.183.208 en marzo de 2023 y $4.440.910 en marzo de 2025— fueron cuestionados por la bancada UDI en su ofensiva presupuestaria de agosto de 2026 contra el organismo."
  gaston_saavedra:
    nombre: Gastón Saavedra
    cargo: Senador PS por la Región del Biobío
    organizacion: partido_socialista
    notas: "Senador del Partido Socialista por la circunscripción del Biobío (2022-2030), exalcalde de Talcahuano. Autor de la columna de opinión en BioBioChile del 4 de agosto de 2026 'Tantos años queriendo ser Presidente de Chile para que quien mande... sea el Ministro de Hacienda', que critica que Hacienda paralice la inversión pública anunciada por el Presidente."
  marcos_oviedo:
    nombre: Marcos Oviedo González
    cargo: Director regional (S) del Sernac de Arica y Parinacota
    organizacion: sernac
    notas: "Director regional subrogante del Servicio Nacional del Consumidor de Arica y Parinacota y excandidato a consejero regional por Renovación Nacional (2017). Según la Unidad de Investigación de El Mostrador (agosto 2026), solicitó por correo a la seremi de Economía de la región autorización para contrataciones directas de militantes de 'RN o Republicanos'."
  evelyn_milos:
    nombre: Evelyn Milos Cáceres
    cargo: Asistente social contratada en el Sernac de Arica
    organizacion: renovacion_nacional
    notas: "Asistente social, militante de Renovación Nacional desde el 4 de abril de 2026. Fue contratada a contrata en el Sernac de Arica desde el 1 de julio de 2026 (grado 8, $4.030.777). En octubre de 2017 fue detenida en Tacna (Perú) junto a otras tres mujeres de su familia con 47 kilos de marihuana cripy ocultos en un vehículo con patente chilena. Caso revelado por El Mostrador en agosto de 2026."
  romina_cifuentes:
    nombre: Romina Cifuentes González
    cargo: Seremi de Economía de Arica y Parinacota
    organizacion: ministerio_economia
    notas: "Seremi de Economía de la Región de Arica y Parinacota y vicepresidenta nacional del Partido Republicano. Según la Unidad de Investigación de El Mostrador (agosto 2026), recibió el correo del director (S) del Sernac de Arica, Marcos Oviedo, solicitando autorización para contrataciones directas de militantes de 'RN o Republicanos'."
  francisco_undurraga:
    nombre: Francisco Undurraga
    cargo: Ministro de las Culturas, las Artes y el Patrimonio
    organizacion: ministerio_culturas
    notas: "Ministro de las Culturas, las Artes y el Patrimonio. Ante la interpelación de la senadora Beatriz Sánchez en la Comisión de Cultura del Senado (3 de agosto de 2026) por la suspensión del lanzamiento del libro de Gabriel Rodríguez en Talca, declaró que la decisión 'inconsulta' del seremi del Maule, Pablo Amaro, no era de conocimiento del ministerio."
  fidel_espinoza:
    nombre: Fidel Espinoza
    cargo: Senador PS
    organizacion: partido_socialista
    notas: "Senador del Partido Socialista. Se inhabilitó en la votación del Senado del 4 de agosto de 2026 que aprobó el mecanismo de compensación a los municipios de la megarreforma, sin efectos en el resultado (27 a favor, 22 en contra)."
  elia_piedras:
    nombre: Elia Piedras
    cargo: Presidenta del Colegio de Periodistas de Maule Norte
    organizacion: colegio_periodistas
    notas: "Presidenta del Colegio de Periodistas de Maule Norte. En agosto de 2026 calificó como 'acto de censura' la suspensión del lanzamiento del libro de Gabriel Rodríguez en Talca ordenada por el seremi de las Culturas del Maule, Pablo Amaro, señalando que atenta contra la libertad de expresión y el derecho de la ciudadanía a acceder a la cultura."
  michelle_vera:
    nombre: Michelle Vera Machuca
    cargo: Seremi de la Mujer y Equidad de Género del Bío Bío
    organizacion: ministerio_mujer
    notas: "Fonoaudióloga egresada de la Universidad de Las Américas (UDLA) con posgrado en la Universidad Católica de Temuco, militante del Partido Cristiano de Chile (PCC). Asumió el 1 de agosto de 2026 como seremi de la Mujer y Equidad de Género del Bío Bío, completando el gabinete regional tras la vacancia dejada por la licencia por embarazo de Camila Contreras."
  claudio_orrego:
    nombre: Claudio Orrego
    cargo: Gobernador de la Región Metropolitana
    organizacion: gore_metropolitano
    notas: "Gobernador de la Región Metropolitana. En el marco del caso ProCultura impulsó desde el inicio las acciones administrativas y judiciales para cobrar las pólizas de garantía del programa 'Quédate' a la aseguradora ASPOR, que la Corte Suprema confirmó el 4 de agosto de 2026: 'Lo dijimos desde el primer día, Aspor debía pagar'."
  daniel_pacheco:
    nombre: Daniel Pacheco
    cargo: Seremi de Gobierno del Bío Bío
    organizacion: segegob
    notas: "Seremi de Gobierno de la Región del Bío Bío. En agosto de 2026 confirmó la designación de Michelle Vera como seremi de la Mujer y Equidad de Género, señalando que con ella el gabinete regional quedó completo."
  camila_contreras:
    nombre: Camila Contreras
    cargo: Exseremi de la Mujer del Bío Bío
    organizacion: ministerio_mujer
    notas: "Exseremi de la Mujer y Equidad de Género del Bío Bío. Presentó licencia por embarazo durante 2026, lo que impidió que su reemplazante, Antaris Varela, asumiera la titularidad; la vacancia se resolvió en agosto de 2026 con la designación de Michelle Vera."
  yerko_ljubetic:
    nombre: Yerko Ljubetic
    cargo: Director Nacional del INDH
    organizacion: indh
    notas: "Director Nacional del Instituto Nacional de Derechos Humanos. El 4 de agosto de 2026, en Radio 13C, discrepó de la absolución de Claudio Crespo: 'un joven perdió la vista y el autor de esas lesiones quedó sin castigo'."
  raul_leiva:
    nombre: Raúl Leiva
    cargo: Diputado (PS)
    organizacion: partido_socialista
    notas: "Diputado del Partido Socialista. El 4 de agosto de 2026 sostuvo que los Presidentes no debieran emitir opiniones calificando resoluciones judiciales, en el marco del fallo de Crespo."
  marcos_ilabaca:
    nombre: Marcos Ilabaca
    cargo: Diputado (PS)
    organizacion: partido_socialista
    notas: "Diputado del Partido Socialista. El 4 de agosto de 2026 señaló que los fallos se respetan y que no corresponde comentarlos desde el Ejecutivo, en el marco del caso Crespo."
  tatiana_urrutia:
    nombre: Tatiana Urrutia
    cargo: Diputada (Frente Amplio)
    organizacion: frente_amplio
    notas: "Diputada del Frente Amplio. El 4 de agosto de 2026 emplazó al Presidente Kast a frenar los indultos para carabineros condenados que promueven diputados de su partido, tras su opinión sobre el fallo de Crespo."
  benjamin_moreno:
    nombre: Benjamín Moreno
    cargo: Jefe de bancada de diputados republicanos
    organizacion: partido_republicano
    notas: "Diputado y jefe de bancada del Partido Republicano. El 4 de agosto de 2026 defendió el pronunciamiento del Presidente Kast sobre el fallo de Crespo: 'es la justicia la que señala si se actuó conforme a la ley'."
  francisco_orrego:
    nombre: Francisco Orrego
    cargo: Diputado (Ind-RN)
    organizacion: renovacion_nacional
    notas: "Diputado independiente en renovación nacional. El 4 de agosto de 2026 celebró el post de Kast sobre Crespo y pidió una ley de indultos para carabineros condenados por el estallido social."
  maria_jose_zaldivar:
    nombre: María José Zaldívar
    cargo: Directora General de Fundación Teletón
    organizacion: fundacion_teleton
    notas: "Directora General de la Fundación Teletón. El 4 de agosto de 2026 valoró el respaldo transversal del Senado al proyecto del Día Nacional de la Teletón y confió en igual acogida en la Cámara de Diputadas y Diputados."
  sebastian_keitel:
    nombre: Sebastián Keitel
    cargo: Senador, presidente de la Comisión de Adulto Mayor y Discapacidad
    organizacion: senado
    notas: "Senador y presidente de la Comisión de Adulto Mayor y Discapacidad, que aprobó por unanimidad el proyecto del Día Nacional de la Teletón. El 4 de agosto de 2026 destacó en Sala que la iniciativa busca que el día posterior a la campaña sea una instancia de encuentro familiar."
  claudia_pascual:
    nombre: Claudia Pascual
    cargo: Senadora (PC)
    notas: "Senadora. El 4 de agosto de 2026 hizo reserva de constitucionalidad de la fórmula de compensación municipal de la megarreforma aprobada por la Sala."
  francisco_huenchumilla:
    nombre: Francisco Huenchumilla
    cargo: Senador (DC)
    notas: "Senador. El 4 de agosto de 2026 hizo reserva de constitucionalidad de la fórmula de compensación municipal de la megarreforma y votó en contra de ella en la Sala."
  ruth_hurtado:
    nombre: Ruth Hurtado
    cargo: Secretaria general del Partido Republicano
    organizacion: partido_republicano
    notas: "Secretaria general del Partido Republicano durante la campaña presidencial de segunda vuelta de 2025. Integró la barra de Kast en el debate ARCHI del 3 de diciembre y, previo al debate ANATEL del 9 de diciembre, expresó su esperanza de que el foro 'no sea algo tan confrontacional'."
  alejandra_krauss:
    nombre: Alejandra Krauss
    cargo: Exministra del Trabajo (DC)
    organizacion: partido_democratacristiano
    notas: "Figura de la Democracia Cristiana y exministra del Trabajo. Integró el comando de Jeannette Jara en la campaña de segunda vuelta de 2025 y acompañó a la candidata en el debate ARCHI del 3 de diciembre de 2025."
  susana_gonzalez:
    nombre: Susana González
    cargo: Jefa de comunicaciones del comando de Jeannette Jara
    organizacion: partido_comunista
    notas: "Jefa de comunicaciones del comando de Jeannette Jara en la campaña de segunda vuelta de 2025. Participó junto a Ricardo Solari en la preparación de la candidata previo al debate ARCHI del 3 de diciembre."
  ricardo_solari:
    nombre: Ricardo Solari
    cargo: Exministro del Trabajo (PS)
    organizacion: partido_socialista
    notas: "Exministro del Trabajo durante el gobierno de Ricardo Lagos. Uno de los principales asesores del comando de Jeannette Jara en la campaña de segunda vuelta de 2025; participó en la preparación de la candidata previo al debate ARCHI del 3 de diciembre."
  carlos_montes:
    nombre: Carlos Montes
    cargo: Ministro de Vivienda y Urbanismo (PS)
    notas: "Ministro de Vivienda y Urbanismo del gobierno de Gabriel Boric. En el debate ANATEL del 9 de diciembre de 2025, la candidata Jeannette Jara discrepó públicamente de sus dichos sobre las filas para acceder a la vivienda en el contexto de la megatoma de San Antonio."
  jose_carlos_meza:
    nombre: José Carlos Meza
    cargo: Diputado (Partido Republicano)
    organizacion: partido_republicano
    notas: "Diputado del Partido Republicano. Sus dichos sobre la posibilidad de otorgar indultos humanitarios a violadores de niños con enfermedades terminales abrieron uno de los mayores flancos de la campaña de José Antonio Kast en la segunda vuelta de 2025 y fueron abordados en el debate ANATEL del 9 de diciembre."
  carolina_urrejola:
    nombre: Carolina Urrejola
    cargo: Periodista (TVN)
    organizacion: tvn
    notas: "Periodista de TVN. Moderó el debate presidencial ANATEL del 9 de diciembre de 2025 entre Jeannette Jara y José Antonio Kast."
  julia_vial:
    nombre: Julia Vial
    cargo: Periodista (TV+)
    notas: "Periodista de TV+. Moderó el debate presidencial ANATEL del 9 de diciembre de 2025 entre Jeannette Jara y José Antonio Kast."
  ivan_valenzuela:
    nombre: Iván Valenzuela
    cargo: Periodista (Canal 13)
    notas: "Periodista de Canal 13. Moderó el debate presidencial ANATEL del 9 de diciembre de 2025 entre Jeannette Jara y José Antonio Kast."
  constanza_santa_maria:
    nombre: Constanza Santa María
    cargo: Periodista (Mega)
    notas: "Periodista de Mega. Moderó el debate presidencial ANATEL del 9 de diciembre de 2025 entre Jeannette Jara y José Antonio Kast."
  macarena_pizarro:
    nombre: Macarena Pizarro
    cargo: Periodista (Chilevisión)
    notas: "Periodista de Chilevisión. Moderó el debate presidencial ANATEL del 9 de diciembre de 2025 entre Jeannette Jara y José Antonio Kast."
  javier_iturriaga:
    nombre: Javier Iturriaga del Campo
    cargo: General de Ejército (r), ex jefe de la Defensa Nacional
    organizacion: ejercito_chile
    notas: "General de Ejército designado como jefe de la Defensa Nacional tras el estado de emergencia decretado el 19 de octubre de 2019 por el estallido social, con el Ejército a cargo de la seguridad en Santiago. Decretó el primer toque de queda en la capital desde 1987 y declaró que 'no estoy en guerra con nadie', contrastando con la frase de Piñera de estar 'en guerra'."
  sergio_micco:
    nombre: Sergio Micco
    cargo: Ex director del Instituto Nacional de Derechos Humanos
    organizacion: indh
    notas: "Director del Instituto Nacional de Derechos Humanos entre 2018 y 2022. El 23 de diciembre de 2019 presentó el Informe Anual 2019 del INDH, centrado en el estallido social, calificando las violaciones a los derechos humanos como 'graves y muy numerosas' y 'las más graves desde 1989'."
  jaime_quintana:
    nombre: Jaime Quintana
    cargo: Senador (PPD), expresidente del Senado
    notas: "Senador PPD y presidente del Senado en 2019. Encabezó el anuncio del Acuerdo por la Paz Social y la Nueva Constitución, firmado el 15 de noviembre de 2019 en el ex Congreso Nacional."
  carmen_hertz:
    nombre: Carmen Hertz
    cargo: Diputada (PC), abogada de derechos humanos
    organizacion: partido_comunista
    notas: "Diputada del Partido Comunista y abogada de derechos humanos. Impulsora de la acusación constitucional contra Sebastián Piñera por las violaciones a los DD.HH. del estallido social (2019). Tras su rechazo en la Cámara (12 de diciembre de 2019) declaró que buscarían 'otras vías' porque 'esto ha sido una política de Estado'."

organizations:
  criteria:
    nombre: Criteria
    tipo: encuestadora
    notas: Encuestadora chilena, realiza sondeos de opinion publica y aprobacion
      presidencial.
  black_white:
    nombre: Black & White
    tipo: encuestadora
    notas: "Encuestadora chilena. Su sondeo semanal de abril 2026 midió el apoyo al Plan de Reconstrucción Nacional de José Antonio Kast: 52% de acuerdo en general, con 74% a favor de eliminar el IVA a viviendas nuevas y 71% del subsidio a la contratación."
  centro_uc_encuestas:
    nombre: Centro UC de Encuestas y Estudios Longitudinales
    tipo: centro_estudios
    pais: Chile
    notas: "Centro de investigación de la Pontificia Universidad Católica de Chile dirigido por David Bravo. Sus académicos alertaron sobre el impacto en costos y empleo de la segunda etapa de la Ley de 40 horas (abril 2026)."
  ocec_udp:
    nombre: Observatorio del Contexto Económico de la Universidad Diego Portales (OCEC-UDP)
    tipo: centro_estudios
    pais: Chile
    notas: "Observatorio económico de la Universidad Diego Portales, dirigido por Juan Bravo. Analizó el impacto de las 42 horas en los costos laborales (abril 2026)."
  cies_udd:
    nombre: Centro de Investigación en Empresa y Sociedad de la Universidad del Desarrollo (CIES-UDD)
    tipo: centro_estudios
    pais: Chile
    notas: "Centro de investigación de la Universidad del Desarrollo. Su investigador Carlos Smith alertó tras la ENE abril-junio 2026 que Chile 'no está creando empleo, está cambiando empleo bueno por empleo precario'."
  universidad_autonoma:
    nombre: Universidad Autónoma de Chile
    tipo: universidad
    pais: Chile
    notas: "Universidad chilena. Su académico Guillermo Riquelme advirtió tras la ENE abril-junio 2026 sobre la intensificación de la informalidad, especialmente entre las mujeres, y un posible deterioro mayor del mercado laboral en julio-agosto."
  cut:
    nombre: Central Unitaria de Trabajadores (CUT)
    tipo: sindicato
    pais: Chile
    notas: "Principal central sindical de Chile. Su dirigente provincial del Bío Bío, Mikel Capetillo, exigió soluciones concretas ante el desempleo regional de 10,4% (julio 2026)."
  cadem:
    nombre: Cadem
    tipo: encuestadora
    notas: Encuestadora chilena, sondeo Plaza Publica semanal de opinion politica.
  descifra:
    nombre: Descifra
    tipo: encuestadora
    notas: "Encuestadora chilena, sondeo Termometro Politico (Alianza Copesa-Artool). Su medicion de julio-agosto 2026 registro 63% de rechazo a la gestion del ministro de Hacienda Jorge Quiroz y 50% de escepticismo sobre los resultados de la megarreforma."
  contrapoder_chile:
    nombre: Contrapoder Chile
    tipo: medio_comunicacion
    pais: Chile
    notas: "Medio digital chileno de investigacion y actualidad. Publico el reportaje sobre los ministros del gabinete de Kast beneficiados por la exencion de contribuciones (abril 2026) y la investigacion sobre la designacion de Daniel Diaz en el directorio de Codelco (mayo 2026)."
  cchc:
    nombre: Camara Chilena de la Construccion
    tipo: gremio
    pais: Chile
    notas: "Gremio del sector construccion. Su presidente Alfredo Echavarria celebro la ampliacion del subsidio a la tasa hipotecaria a 6.000 UF (agosto 2026). Publica el Informe Nacional Inmobiliario con datos de oferta de viviendas."
  panimex:
    nombre: Panimex
    tipo: empresa_quimica
    pais: Chile
    notas: "Empresa quimica de Quilicura dedicada a resinas, plastificantes y materias primas para plasticos y pinturas. Acumula cuatro incendios de gran magnitud en 13 anos (2013, 2014, 2017 y 2026)."
  agrosuper:
    nombre: Agrosuper
    tipo: empresa_agroindustrial
    pais: Chile
