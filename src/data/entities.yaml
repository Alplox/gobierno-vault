    notas: Cuestionó al Gobierno por los homicidios en la comuna (31 julio 2026). Propuso salida de la ACHM por apoyo a megarreforma
  jaime_bassa:
    nombre: Jaime Bassa
    cargo: Constitucionalista (FA)
    notas: Dice que Sedini reveló lucha fratricida en las derechas
  tomas_brito:
