    tipo: servicio_publico
    pais: Chile
    notas: "Servicio público dependiente del Ministerio de Minería. Un decreto de 2026 modificó el Reglamento de Seguridad Minera reemplazando 21 autorizaciones previas por declaraciones juradas y cambiando su rol de aprobador a fiscalizador posterior."
  partido_ecologista_verde:
    nombre: Partido Ecologista Verde
    tipo: partido_politico
    pais: Chile
    notas: "Partido político ecologista. El diputado Félix González, del distrito 20 (Concepción), militó en esta colectividad."
  partido_democratas:
    nombre: Partido Demócratas
    tipo: partido_politico
    pais: Chile
    notas: "Partido político de centro, surgido de la fusión de Ciudadanos y Demócratas. La diputada Joanna Pérez (distrito 21) es una de sus parlamentarias."
  fundacion_derecho_defensa_animal:
    nombre: Fundación Derecho y Defensa Animal
    tipo: organizacion_social
    pais: Chile
    notas: "ONG de protección animal. Ante la votación sobre carreras de perros y canódromos (julio-agosto 2026) llamó a aprobar la prohibición y rechazar la legalización de los canódromos, habilitando el sitio #No más carreras."
  instituto_nacional_deportes:
    nombre: Instituto Nacional de Deportes (IND)
    tipo: servicio_publico
    pais: Chile
    notas: "Organismo público encargado del deporte. En agosto de 2026 la Asociación Nacional de Funcionarios de Chiledeportes (ANFUCHID) se declaró en 'alerta institucional' tras las tensiones con la ministra del Deporte Natalia Duco."
  anfuchid:
    nombre: Asociación Nacional de Funcionarios de Chiledeportes (ANFUCHID)
    tipo: sindicato
    pais: Chile
    notas: "Asociación de funcionarios del deporte. En agosto de 2026 acusó a la ministra Natalia Duco de presentar ante el presidente Kast una propuesta para modificar la institucionalidad del IND sin diálogo y se declaró en 'estado de alerta institucional'."
  corepa:
    nombre: Consejo Regional para la Pesca Artesanal (Corepa)
    tipo: gremio
    pais: Chile
    notas: "Consejo Regional para la Pesca Artesanal, gremio del sector. Su presidente, Jorge Bustos, expuso en agosto de 2026 ante la Comisión de Pesca de la Cámara de Diputados pidiendo levantar la veda de caza del lobo marino por los daños a las faenas."
  subpesca:
    nombre: Subsecretaría de Pesca y Acuicultura (SUBPESCA)
    tipo: servicio_publico
    pais: Chile
    notas: "Organismo dependiente del Ministerio de Economía que administra la actividad pesquera. En agosto de 2026 evaluó alternativas frente a los conflictos entre la pesca artesanal y los lobos marinos, generando debate por una eventual cuota de caza."
  ministerio_del_deporte:
    nombre: Ministerio del Deporte (Mindep)
    tipo: ministerio
    pais: Chile
    notas: "Cartera liderada por la ministra Natalia Duco. En agosto de 2026 desmintió que la ministra haya presentado al presidente un proyecto de reestructuración del IND y confirmó que las modificaciones se trabajarán en una mesa técnica."
  municipalidad_coyhaique:
    nombre: Municipalidad de Coyhaique
    tipo: municipalidad
    pais: Chile
    notas: "Comuna capital de la Región de Aysén. En agosto de 2026 instaló una 'aldea de emergencia' municipal con capacidad para 200 personas ante la ola de frío y nevadas."
  gore_aysen:
    nombre: Gobierno Regional de Aysén
    tipo: institucion_publica
    pais: Chile
    notas: "Gobierno Regional de Aysén. Cofinanció junto al municipio la 'aldea de emergencia' de Coyhaique (agosto 2026)."
  ditecsur:
    nombre: Ditecsur
    tipo: empresa
    pais: Chile
    notas: "Productora de eventos contratada por el INDH en noviembre de 2025 por $250 millones, vigente durante 2026, para la organización de eventos institucionales como la ceremonia de entrega del Informe Anual sobre la Situación de los Derechos Humanos, la Cuenta Pública y el Premio Nacional de Derechos Humanos. Su contrato fue cuestionado por la bancada UDI y defendido por el INDH como adjudicado mediante licitación pública."
  sernac:
    nombre: Servicio Nacional del Consumidor (Sernac)
    tipo: servicio_publico
    pais: Chile
    notas: "Servicio público encargado de la protección de los derechos de las y los consumidores. En agosto de 2026, su dirección regional subrogante de Arica y Parinacota fue vinculada por El Mostrador a contrataciones directas de militantes de RN o Republicanos."
  injuv:
    nombre: Instituto Nacional de la Juventud (INJUV)
    tipo: servicio_publico
    pais: Chile
    notas: "Instituto Nacional de la Juventud. Según la respuesta oficial del Sernac de Arica, la asistente social Evelyn Milos provenía del INJUV, lo que habría justificado no requerir su certificado de antecedentes por 'continuidad en el desempeño dentro de la Administración del Estado'."
  ministerio_culturas:
    nombre: Ministerio de las Culturas, las Artes y el Patrimonio
    tipo: ministerio
    pais: Chile
    notas: "Cartera responsable de las políticas culturales y patrimoniales. En agosto de 2026 su seremi del Maule, Pablo Amaro, fue señalado como responsable de la suspensión de la presentación del libro de Gabriel Rodríguez en Talca, decisión que el ministro Francisco Undurraga dijo desconocer."
  partido_cristiano:
    nombre: Partido Cristiano de Chile (PCC)
    tipo: partido
    pais: Chile
    notas: "Partido político chileno. Conservó el cupo de la seremi de la Mujer del Bío Bío con la designación de Michelle Vera Machuca en agosto de 2026, tras la vacancia dejada por la licencia por embarazo de Camila Contreras."
  senama:
    nombre: Servicio Nacional del Adulto Mayor (Senama)
    tipo: servicio_publico
    pais: Chile
    notas: "Servicio público dependiente del Ministerio de Desarrollo Social. Antaris Varela, la primera designada como seremi de la Mujer del Bío Bío del gobierno de Kast, se trasladó al Senama como coordinadora regional tras ejercer solo como subrogante."
  gore_metropolitano:
    nombre: Gobierno Regional Metropolitano (Gobierno de Santiago)
    tipo: gobierno_regional
    pais: Chile
    notas: "Gobierno Regional de la Región Metropolitana. Financió en 2022 con $1.600 millones el programa de prevención del suicidio 'Quédate', ejecutado por ProCultura; en el caso ProCultura exigió a la aseguradora ASPOR el pago de las pólizas de garantía por cerca de $1.000 millones sin ejecutar."
  procultura:
    nombre: Fundación ProCultura
    tipo: organizacion_civil
    pais: Chile
    notas: "Fundación ejecutora del programa 'Quédate' (prevención del suicidio) financiado por el Gobierno de Santiago. Su cese de funciones en el marco del caso Convenios (2023) dejó cerca de $1.000 millones sin ejecutar, desencadenando el cobro de las pólizas de garantía a la aseguradora ASPOR."
  aspor:
    nombre: Aseguradora Porvenir S.A. (ASPOR)
    tipo: empresa
    pais: Chile
    notas: "Aseguradora que emitió las pólizas de garantía del programa 'Quédate' de ProCultura. La CMF la multó con 1.000 UF por no pagar al primer requerimiento del Gobierno de Santiago; la Corte Suprema confirmó la multa el 4 de agosto de 2026, quedando pendiente el cobro de cerca de $1.000 millones en una causa civil paralela."
  cmf:
    nombre: Comisión para el Mercado Financiero (CMF)
    tipo: regulador
    pais: Chile
    notas: "Organismo regulador del mercado financiero. Aplicó la multa de 1.000 UF a la aseguradora ASPOR por incumplir el pago de las pólizas de garantía del programa 'Quédate' (caso ProCultura), sanción confirmada por la Corte Suprema el 4 de agosto de 2026."
  cordon_secundario:
    nombre: Cordón Secundario
    tipo: organizacion_social
    pais: Chile
    notas: "Coordinadora que agrupa a centros de estudiantes de Santiago. El 4 de agosto de 2026 convocó la marcha de secundarios en la Alameda contra el gobierno de José Antonio Kast para 'visibilizar el descontento de los estudiantes'."
  liceo_instituto_nacional:
    nombre: Instituto Nacional José Miguel Carrera
    tipo: establecimiento_educacional
    pais: Chile
    notas: "Liceo emblemático de Santiago Centro. Fue tomado por sus estudiantes en la mañana del 4 de agosto de 2026, en el marco de la movilización de secundarios convocada por el Cordón Secundario."
  liceo_barros_borgoño:
    nombre: Liceo Manuel Barros Borgoño
    tipo: establecimiento_educacional
    pais: Chile
    notas: "Liceo emblemático de Santiago Centro. Fue tomado por sus estudiantes el 4 de agosto de 2026; la comunidad resguardó a los estudiantes del Programa de Integración Escolar (PIE) y de 7° y 8° básico a la espera de sus apoderados."
  inba:
    nombre: Internado Nacional Barros Arana (INBA)
    tipo: establecimiento_educacional
    pais: Chile
    notas: "Liceo emblemático de Santiago Centro. El 23 de octubre de 2024 un cóctel molotov que estudiantes manipulaban en el baño del establecimiento explotó, dejando 35 heridos —15 de gravedad y 4 en riesgo vital— cuando se preparaban para salir a manifestarse en el aniversario del estallido social. La Fiscalía Centro Norte investigó el caso."
  ministerio_del_interior:
    nombre: Ministerio del Interior y Seguridad Pública
    tipo: ministerio
    pais: Chile
  defensoria_de_la_ninez:
    nombre: Defensoría de la Niñez
    tipo: organismo_publico
    pais: Chile
    notas: "Organismo público autónomo creado en 2018 para la protección de los derechos de niños, niñas y adolescentes. En el caso Pío Nono (octubre de 2020) se querelló contra Carabineros y pidió prisión preventiva para el carabinero Sebastián Zamora, condenando la 'acción criminal' contra el adolescente lanzado desde el puente."
  anid:
    nombre: Agencia Nacional de Investigación y Desarrollo (ANID)
    tipo: organismo_publico
    pais: Chile
    notas: "Agencia pública chilena que financia la investigación científica y tecnológica, responsable de administrar el Fondo Nacional de Desarrollo Científico y Tecnológico (Fondecyt) y las Becas Chile."
  universidad_diego_portales:
    nombre: Universidad Diego Portales
    tipo: universidad
    pais: Chile
  universidad_de_chile:
    nombre: Universidad de Chile
    tipo: universidad
    pais: Chile
  ideas_republicanas:
    nombre: Ideas Republicanas
    tipo: centro_de_estudios
    pais: Chile
    notas: "Centro de estudios asociado al Partido Republicano. Su directora ejecutiva fue la abogada Carmen Soza, que renunció el 6 de agosto de 2026 por 'diferencias insalvables' en la gestión interna."
  metro_santiago:
    nombre: Metro de Santiago
    tipo: empresa
    pais: Chile
    notas: "Empresa de transporte subterráneo de Santiago. El 4 de agosto de 2026 cerró la estación Universidad Católica y suspendió la detención de trenes durante la marcha de estudiantes secundarios."
  slep_santiago_centro:
    nombre: SLEP Santiago Centro
    tipo: servicio_publico
    pais: Chile
    notas: "Servicio Local de Educación Pública a cargo de los liceos de Santiago Centro. El 4 de agosto de 2026 confirmó las tomas de cuatro establecimientos emblemáticos (Instituto Nacional, Liceo N°1 Javiera Carrera, Barros Borgoño y Liceo de Aplicación), activó protocolos, solicitó la orden de desalojo y reportó su restitución voluntaria sin incidentes."
  liceo_1_javiera_carrera:
    nombre: Liceo N°1 Javiera Carrera
    tipo: establecimiento_educacional
    pais: Chile
    notas: "Liceo emblemático de Santiago Centro. Fue ocupado por estudiantes en la mañana del 4 de agosto de 2026 y restituido voluntariamente, según el SLEP Santiago Centro."
  liceo_de_aplicacion:
    nombre: Liceo de Aplicación
    tipo: establecimiento_educacional
    pais: Chile
    notas: "Liceo emblemático de Santiago Centro. Fue ocupado por estudiantes en la mañana del 4 de agosto de 2026 y restituido voluntariamente, según el SLEP Santiago Centro."
  fundacion_teleton:
    nombre: Fundación Teletón
    tipo: fundacion
    pais: Chile
    notas: "Fundación que organiza la campaña benéfica televisada Teletón y mantiene institutos de rehabilitación para personas con discapacidad física en todo Chile. Solicitó al Congreso la creación del Día Nacional de la Teletón y el Día Nacional del Encuentro Familiar; su directora general es María José Zaldívar. La campaña 2026 está programada para el 6 y 7 de noviembre."
