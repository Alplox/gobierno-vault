  fuerzas_especiales:
    nombre: Fuerzas Especiales de Carabineros
    tipo: unidad_policial
    pais: Chile
    notas: "Unidad de control de disturbios de Carabineros de Chile. En octubre de 2019, tres de sus efectivos fueron captados en un video viral aspirando una sustancia blanca en plena calle durante el estallido social ('pacos jalando'); Carabineros atribuyó la sustancia al Mentholatum, explicación desmentida por científicos. También son la unidad responsable de la represión con gases lacrimógenos y escopetas antidisturbios en las protestas."
