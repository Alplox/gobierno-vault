  homicidios_2018:
    nombre: Homicidios consumados durante 2018
    unidad_default: personas
    notas: "845 víctimas. Nivel que el ministro Arrau espera alcanzar en un año plazo."
  promedio_homicidios_2018_2025:
    nombre: Promedio anual de homicidios consumados 2018-2025
    unidad_default: homicidios_por_año
    notas: "8.669 homicidios consumados entre 2018 y 2025 según el Informe de Víctimas de Homicidios Consumados 2025 del Centro para la Prevención de Homicidios y Delitos Violentos, lo que da un promedio anual de 1.083,6, tal como afirmó el presidente Kast en la cadena nacional ACOT (verificado #Real por Fast Check, 6-ago-2026). El mínimo fue 845 en 2018 y el pico 1.330 en 2022."
  homicidios_consumados_2022:
    nombre: Homicidios consumados durante 2022
    unidad_default: personas
    notas: "1.330 víctimas, el pico de la serie 2018-2025 según el Informe de Víctimas de Homicidios Consumados 2025 del Centro para la Prevención de Homicidios y Delitos Violentos."
  robos_violentos_2025:
    nombre: Robos con violencia o intimidación en 2025
    unidad_default: casos
    notas: "69.777 casos en 2025 (61.575 robos con violencia o intimidación + 8.202 robos violentos de vehículo motorizado) según el CEAD de la Subsecretaría para Prevención del Delito. Contradice la cifra de 218.000 robos violentos que el presidente Kast dio en la cadena nacional ACOT (verificado #Falso por Fast Check, 6-ago-2026)."
  robos_violentos_sorpresa_2025:
    nombre: Robos violentos con robos por sorpresa en 2025
    unidad_default: casos
    notas: "109.419 casos en 2025 (CEAD): la cifra suma el robo por sorpresa a los 69.777 robos con violencia o intimidación (61.575 + 8.202 robos violentos de vehículo motorizado). Corresponde a la categoría agregada oficial de 'delitos de robos violentos' del balance de hechos delictuales 2025 (que bajó -9,8% vs los 120.548 de 2024). Aun así, muy lejos de los 218.000 afirmados por el presidente Kast en la cadena nacional ACOT."
  robos_violentos_2024:
    nombre: Robos violentos en 2024
    unidad_default: casos
    notas: "120.548 casos en 2024 según el balance de hechos delictuales 2025 del CEAD (Subsecretaría de Prevención del Delito), que registró 109.419 en 2025 (-9,8%). La comparación respalda la curva descendente señalada por el abogado Rodrigo Rettig en el debate por la cifra de '218 mil robos violentos' del presidente Kast."
  ingresos_irregulares_ene_jul_2026:
    nombre: Ingresos irregulares detectados enero-julio 2026
    unidad_default: personas
    notas: "1.175 ingresos irregulares detectados por la PDI en la Macrozona Norte entre enero y julio de 2026, validado por el Servicio Nacional de Migraciones (Sermig). Representa una caída del 86,5% respecto a los 8.610 del mismo periodo de 2025, cifra citada por Kast en la cadena nacional ACOT y verificada #Real por Fast Check (6-ago-2026)."
  ingresos_irregulares_ene_jul_2025:
    nombre: Ingresos irregulares detectados enero-julio 2025
    unidad_default: personas
    notas: "8.610 ingresos irregulares detectados por la PDI en la Macrozona Norte entre enero y julio de 2025 (BioBioChile, 6-ago-2026)."
  denuncias_paso_no_habilitado_2026:
    nombre: Denuncias de ingreso por paso no habilitado enero-julio 2026
    unidad_default: denuncias
    notas: "11.242 denuncias de ingreso por paso no habilitado contabilizadas por Sermig en enero-julio 2026, un 33% menos que las 16.788 del mismo periodo de 2025 (Informe Estadístico Migratorio PDI, 6-ago-2026). Fast Check aclara que la denuncia no necesariamente se realiza el mismo año en que ingresó la persona, por lo que no pueden atribuirse directamente a 2026."
  expulsiones_ene_jul_2026:
    nombre: Expulsiones materializadas enero-julio 2026
    unidad_default: personas
    notas: "1.330 expulsiones materializadas entre enero y julio de 2026, un 76% más que las 753 del mismo periodo de 2025 y el nivel más alto de los últimos cinco años según el Informe Estadístico Migratorio de la PDI (6-ago-2026). Colombia encabeza con 549 casos, seguido de Venezuela (261) y Bolivia (234)."
  expulsiones_administrativas_ene_jul_2026:
    nombre: Expulsiones administrativas enero-julio 2026
    unidad_default: personas
    notas: "1.183 expulsiones administrativas entre enero y julio de 2026, un 105% más que las 577 del mismo periodo de 2025 (Informe Estadístico Migratorio PDI, 6-ago-2026)."
  expulsiones_judiciales_ene_jul_2026:
    nombre: Expulsiones judiciales enero-julio 2026
    unidad_default: personas
    notas: "147 expulsiones judiciales entre enero y julio de 2026, un 16% menos que las 176 del mismo periodo de 2025 (Informe Estadístico Migratorio PDI, 6-ago-2026)."
  salidas_voluntarias_ene_jul_2026:
    nombre: Salidas voluntarias de extranjeros enero-julio 2026
    unidad_default: personas
    notas: "7.501 extranjeros que ingresaron por pasos no habilitados y abandonaron Chile de manera regular sin orden de expulsión vigente, categoría incorporada por primera vez al Informe Estadístico Migratorio de la PDI (6-ago-2026). 5.826 corresponden a venezolanos (78%) y julio fue el mes con mayor cantidad (1.793). No se contabilizan como expulsiones materializadas."
  vuelos_expulsion_ene_jul_2026:
    nombre: Vuelos de expulsión enero-julio 2026
    unidad_default: vuelos
    notas: "Nueve vuelos de expulsión ejecutados entre enero y julio de 2026 (chárter o Fuerza Aérea), más del doble de los cuatro del mismo periodo de 2025; las personas expulsadas por esta vía subieron de 195 a 484 (+148%). Informe Estadístico Migratorio PDI, 6-ago-2026."
  extranjeros_fiscalizados_ene_jul_2026:
    nombre: Extranjeros controlados en fiscalizaciones enero-julio 2026
    unidad_default: personas
    notas: "30.155 extranjeros controlados en 1.318 operativos de fiscalización entre enero y julio de 2026, un 44% más que los 20.899 del mismo periodo de 2025 (Informe Estadístico Migratorio PDI, 6-ago-2026)."
  movimiento_migratorio_regular_ene_jul_2026:
    nombre: Movimientos migratorios regulares de ingreso enero-julio 2026
    unidad_default: millones
    notas: "7,58 millones de movimientos controlados de ingreso entre enero y julio de 2026, un 7,6% menos que los 8,2 millones del mismo periodo de 2025 (Informe Estadístico Migratorio PDI, 6-ago-2026)."
  detecciones_tarapaca_ene_jul_2026:
    nombre: Detecciones de ingresos irregulares en Tarapacá enero-julio 2026
    unidad_default: personas
    notas: "866 detecciones en la región de Tarapacá entre enero y julio de 2026, un 89% menos que las 8.145 del mismo periodo de 2025; la mayor caída de la Macrozona Norte (Informe Estadístico Migratorio PDI, 6-ago-2026)."
  presupuesto_carabineros_2012:
    nombre: Presupuesto vigente de Carabineros de Chile 2012
    unidad_default: miles_de_pesos_2012
    notas: "Serie histórica DIPRES de ejecución presupuestaria de Carabineros de Chile (Partida 05, Capítulo 31, Programa 01, Ministerio del Interior y Seguridad Pública) en miles de $ de 2012: 2008: 470.836.900; 2009: 513.364.103; 2010: 623.347.599; 2011: 702.234.701; 2012: 786.645.294 (presupuesto vigente). Ejecución acumulada a agosto 2012: 397.559.433."
  presupuesto_carabineros_2008:
    nombre: Presupuesto vigente de Carabineros de Chile 2008
    unidad_default: miles_de_pesos_2012
    notas: "470.836.900 miles de $ de 2012 (serie histórica DIPRES, Partida 05, Capítulo 31, Programa 01)."
  recorte_carabineros_2026:
    nombre: Recorte al presupuesto de Carabineros en 2026
    unidad_default: millones_pesos
    notas: "$51.612 millones (71% del recorte de $72 mil millones al Ministerio de Seguridad Pública anunciado el 23 de marzo de 2026 por la ministra Trinidad Steinert y el subsecretario Andrés Jouannet). El mayor ítem afectado es la compra de vehículos: $33.271 millones (70,6% de ese ítem), seguido de gasto de personal ($11.000 millones), bienes y servicios ($4.700 millones), el Hospital de Carabineros ($1.583 millones) e inversión ($1.057 millones)."
  superficie_plataforma_juan_fernandez:
    nombre: Ampliación de territorio por plataforma continental de Juan Fernández
    unidad_default: km2
    notas: "71.000 km² de suelo y subsuelo marino bajo soberanía nacional si la ONU aprueba la presentación."
  lavado_clan_chen_pesos:
    nombre: Dinero lavado por el Clan Chen en Chile
    unidad_default: millones_pesos
    notas: "Unos 160.000 millones de pesos chilenos (más de US$180 millones) infiltrados al sistema financiero nacional según la fiscalía."
  lavado_clan_chen_dolares:
    nombre: Dinero lavado por el Clan Chen en Chile
    unidad_default: millones_usd
    notas: "Más de US$180 millones provenientes de criptoestafas internacionales blanqueados en Chile según la fiscalía."
  perjuicio_estimado_clan_chen:
    nombre: Perjuicio estimado caso Clan Chen
    unidad_default: millones_usd
    notas: "Cerca de 300 millones de dólares de perjuicio según la exministra Steinert, por lavado de activos, estafas tipo pig butchering y crimen organizado transnacional."
  demandas_laborales_energy:
    nombre: Demandas laborales contra Gimnasios Energy
    unidad_default: demandas
    notas: "67 causas laborales entre 2023 y 2026 contra Alex Wiesner como representante legal de Energy, con desembolsos por $472 millones en avenimientos."
  desembolso_demandas_energy:
    nombre: Desembolso por avenimientos laborales de Gimnasios Energy
    unidad_default: millones_pesos
    notas: "$472 millones pagados entre 2023 y 2026 para terminar conflictos laborales."
  beneficiarios_seguro_social_enero2026:
    nombre: Pensionados que recibieron beneficios del Seguro Social en enero 2026
    unidad_default: personas
    notas: "Más de 1.370.000 personas recibieron el Beneficio por Años Cotizados (BAC) y/o la Compensación por Expectativa de Vida (CEV) en enero de 2026, tras la reforma de pensiones."
  aumento_pension_bac:
    nombre: Aumento mensual por Beneficio por Años Cotizados (BAC)
    unidad_default: pesos
    notas: "0,1 UF por cada 12 meses cotizados con tope de 25 años; hasta casi $100.000 mensuales para quienes cumplen el máximo."
  pensionadas_compensacion_cev:
    nombre: Pensionadas que reciben Compensación por Expectativa de Vida
    unidad_default: personas
    notas: "Más de 730.000 mujeres con piso mínimo de 0,25 UF (aprox. $9.900)."
  cotizacion_empleador_reforma:
    nombre: Cotización de cargo del empleador tras reforma de pensiones
    unidad_default: porcentaje
    notas: "Comienza con 1% en 2025 y sube un punto por año hasta 7% en 2033. En agosto de 2026 llega al 2%."
  expulsados_vuelo_24mayo:
    nombre: Personas expulsadas en el tercer vuelo de expulsión
    unidad_default: personas
    notas: "80 personas (58 colombianas y 22 bolivianas) expulsadas el 24 de mayo de 2026. Primer vuelo en aerolínea comercial. 60 administrativas y 20 judiciales."
  expulsiones_total_2026:
    nombre: Expulsiones ejecutadas durante 2026
    unidad_default: personas
    notas: "780 expulsiones en lo que va de 2026: 683 administrativas y 97 judiciales. A fines de mayo, 484 desde el 11 de marzo. Corte anterior al Informe Estadístico Migratorio PDI de agosto de 2026, que reporta 1.330 expulsiones materializadas a julio (ver expulsiones_ene_jul_2026)."
  salidas_voluntarias_2026:
    nombre: Salidas voluntarias de migrantes en 2026
    unidad_default: personas
    notas: "2.446 salidas voluntarias en 2026 a fines de mayo, 90% de ellas de ciudadanos venezolanos. Corte anterior al Informe Estadístico Migratorio PDI de agosto de 2026, que contabiliza 7.501 salidas voluntarias a julio bajo la nueva categoría oficial (ver salidas_voluntarias_ene_jul_2026)."
  ingresos_pasos_no_habilitados:
    nombre: Ingresos por pasos no habilitados en 2026
    unidad_default: personas
    notas: "4.324 ingresos a la fecha frente a 18.403 en el mismo periodo de 2022, según el Plan Escudo Fronterizo."
  presupuesto_mujeres_rurales:
    nombre: Presupuesto anual del Programa Mujeres Rurales
    unidad_default: millones_de_pesos
    notas: "Unos 3.300 millones de pesos anuales ejecutados en convenio entre INDAP y PRODEMU."
  anios_mujeres_rurales:
    nombre: Años de funcionamiento del Programa Mujeres Rurales
    unidad_default: años
    notas: "34 años ininterrumpidos desde 1992 al momento del cese de ingreso en 2026."
  recorte_prodemu:
    nombre: Recorte aplicado a PRODEMU
    unidad_default: "%"
    notas: "8% según la denuncia, más del doble del 3% que el Ejecutivo anunció como criterio general de ajuste."
  reduccion_convenio_sernameg:
    nombre: Reducción del convenio SERNAMEG-PRODEMU
    unidad_default: millones_de_pesos
    notas: "Superior a 800 millones de pesos según la denuncia."
  votos_proyecto_acuerdo_mujeres_rurales:
    nombre: Votos a favor del proyecto de acuerdo para mantener el Programa Mujeres Rurales
    unidad_default: votos
    notas: "106 votos a favor en la Cámara de Diputadas y Diputados."
  votos_en_contra_proyecto_acuerdo_mujeres_rurales:
    nombre: Votos en contra del proyecto de acuerdo para mantener el Programa Mujeres Rurales
    unidad_default: votos
    notas: "29 votos en contra, con rechazo casi exclusivo de las bancadas oficialistas."
  fallecidos_crisis_bolivia_2026:
    nombre: Fallecidos por la crisis de bloqueos en Bolivia 2026
    unidad_default: personas
    notas: "Al menos 16 muertos, 13 de ellos por falta de acceso oportuno a atención médica según EFE/BioBioChile (13 de junio de 2026)."
  perdidas_economicas_bloqueos_bolivia:
    nombre: Pérdidas económicas por bloqueos en Bolivia 2026
    unidad_default: millones_de_dolares
    notas: "2.500 millones de dólares estimados según EFE/BioBioChile (13 de junio de 2026)."
  ingresos_irregulares_2026:
    nombre: Ingresos irregulares detectados 1 enero a 19 julio 2026
    unidad_default: personas
    notas: "1.168 ingresos irregulares, una caída del 86% respecto de igual período de 2025 y del 95% frente a 2022, según fuentes de gobierno citadas por La Tercera (30 de julio de 2026)."
  aumento_incautaciones_droga_2026:
    nombre: Aumento de incautaciones de droga 2026 vs 2025
    unidad_default: "%"
    notas: "Un 61% más que en igual período de 2025 al 19 de julio de 2026, según fuentes de gobierno citadas por La Tercera. El balance del comité policial del 27 de julio reportó 60%."
  eventos_violencia_macrozona_sur:
    nombre: Eventos de violencia en la Macrozona Sur
    unidad_default: casos
    notas: "De 190 a 157 casos, una baja del 17% con foco en las provincias bajo estado de excepción, según fuentes de gobierno citadas por La Tercera (30 de julio de 2026)."
  quema_maquinaria_macrozona_sur:
    nombre: Reducción de quema de maquinaria en la Macrozona Sur
    unidad_default: "%"
    notas: "Reducción del 80% citada por el ministro Arrau el 28 de julio de 2026. Reportes preliminares señalan reducciones de entre 70% y 80% según provincia, sin desglose público oficial del 80%."
  aprobacion_kast_pulso_ago:
    nombre: Aprobación Kast encuesta Pulso Ciudadano agosto 2026
    unidad_default: "%"
    notas: "25,6%, el nivel más bajo desde que asumió. Baja de 3,3 puntos respecto de la medición anterior (28,9% en julio). Activa Research, 2 de agosto de 2026."
  desaprobacion_kast_pulso_ago:
    nombre: Desaprobación Kast encuesta Pulso Ciudadano agosto 2026
    unidad_default: "%"
    notas: "58,9%, la cifra más alta registrada desde el inicio de su administración. Subió 2,3 puntos respecto de la medición anterior. Activa Research, 2 de agosto de 2026."
  aporte_fcm_las_condes_exencion:
    nombre: Menor aporte de Las Condes al FCM por exención de contribuciones
    unidad_default: millones_pesos
    notas: "$24,7 mil millones, un 15% de lo que aporta actualmente al Fondo Común Municipal. Cifra de Hacienda vía Ley de Transparencia (La Tercera, 1 de agosto de 2026)."
  aporte_fcm_vitacura_exencion:
    nombre: Menor aporte de Vitacura al FCM por exención de contribuciones
    unidad_default: millones_pesos
    notas: "$14,1 mil millones, un 18,8% de lo que aporta al Fondo Común Municipal. Cifra de Hacienda vía Ley de Transparencia (La Tercera, 1 de agosto de 2026)."
  aporte_fcm_lo_barnechea_exencion:
    nombre: Menor aporte de Lo Barnechea al FCM por exención de contribuciones
    unidad_default: millones_pesos
    notas: "$12,5 mil millones, un 16,4% de lo que aporta al Fondo Común Municipal. Cifra de Hacienda vía Ley de Transparencia (La Tercera, 1 de agosto de 2026)."
  perdida_total_fcm_exencion:
    nombre: Pérdida total de recaudación municipal por exención de contribuciones a mayores de 65
    unidad_default: millones_pesos
    notas: "$122.527 millones que los municipios dejarán de recaudar por la exención; el Fisco los repondrá vía Tesorería General de la República. Hacienda vía Ley de Transparencia (La Tercera, 1 de agosto de 2026)."
  perdida_municipal_contribuciones_iglesias:
    nombre: Pérdida municipal total por exención de contribuciones según Agustín Iglesias
    unidad_default: millones_pesos
    notas: "$170.000 millones (unos US$170 millones) de pérdida total para los municipios por la exención de contribuciones a mayores de 65 años, según el alcalde de Independencia Agustín Iglesias (entrevista Radio Futuro PQN, 30 de julio de 2026): 60% corresponde al Fondo Común Municipal y 40% a recaudación directa. La cifra difiere de los $122.527 millones de Hacienda vía Ley de Transparencia (La Tercera, 1 de agosto), que corresponde al aporte que deja de recibir el FCM."
  aporte_directo_las_condes_exencion:
    nombre: Recaudación directa que Las Condes dejaría de percibir por exención según Agustín Iglesias
    unidad_default: millones_pesos
    notas: "$13.000 millones que Las Condes dejaría de percibir por recaudación directa de contribuciones, monto que el gobierno inicialmente no reponía en su fórmula de compensación (entrevista Radio Futuro PQN, 30 de julio de 2026)."
  aporte_directo_providencia_exencion:
    nombre: Recaudación directa que Providencia dejaría de percibir por exención según Agustín Iglesias
    unidad_default: millones_pesos
    notas: "$6.000 millones que Providencia dejaría de percibir por recaudación directa de contribuciones, según el alcalde de Independencia Agustín Iglesias (entrevista Radio Futuro PQN, 30 de julio de 2026)."
  fraude_lavin_leon:
    nombre: Fraude al Fisco imputado a Joaquín Lavín León
    unidad_default: millones_pesos
    notas: "Monto del fraude al Fisco que la Fiscalía imputa al exparlamentario Joaquín Lavín León, elevado a más de $200 millones con los nuevos cargos (agosto 2026), vinculado a un aparente uso irregular de asignaciones parlamentarias."
  fraude_lavin_leon_formalizacion:
    nombre: Perjuicio fiscal estimado en la formalización de Joaquín Lavín León
    unidad_default: millones_pesos
    notas: "Perjuicio fiscal que la Fiscalía Metropolitana Oriente estimó en más de $104 millones al formalizar a Joaquín Lavín León el 8 de mayo de 2026 por fraude al Fisco, tráfico de influencias y falsificación. La cifra fue posteriormente elevada por nuevos cargos (agosto 2026)."
  menores_afectados_ring_raja:
    nombre: Menores afectados por el caso 'ring raja' de Vitacura
    unidad_default: personas
    notas: "Nueve menores de edad que jugaban 'ring raja' en Vitacura fueron perseguidos por el empresario Andrés Arrieta en su camioneta la noche del 10 de julio de 2026; siete fueron subidos al vehículo (dos lograron escapar por la puerta trasera) y retenidos cerca de 40 minutos bajo amenazas de muerte con un arma de fuego. Doce padres presentaron una querella conjunta."
  minutos_retencion_ring_raja:
    nombre: Duración de la retención de menores en el caso 'ring raja'
    unidad_default: minutos
    notas: "Cerca de 40 minutos que el empresario Andrés Arrieta mantuvo retenidos a los menores en su camioneta la noche del 10 de julio de 2026 en Vitacura, según el relato de los padres y los antecedentes de la causa."
  homicidios_cerro_navia_2025:
    nombre: Homicidios en Cerro Navia durante todo 2025
    unidad_default: personas
    notas: "Cifra citada por el alcalde Mauro Tamayo: a julio 2026 la comuna ya había alcanzado la misma cantidad de homicidios que todo el año 2025 (31 julio 2026)."
  reduccion_secuestros_ene_jul_2026:
    nombre: Reducción de secuestros enero-julio 2026 vs 2025
    unidad_default: "%"
    notas: "46% menos según cifras citadas por el presidente Kast en el 107° aniversario de la CCS (31 julio 2026), en comparación con el mismo período del año anterior."
  reduccion_homicidios_ene_jul_2026:
    nombre: Reducción de homicidios enero-julio 2026 vs 2025
    unidad_default: "%"
    notas: "17,6% menos según cifras citadas por el presidente Kast en el 107° aniversario de la CCS (31 julio 2026). Coincide con la cifra de 17,62% del balance preliminar de Carabineros y PDI."
  impactos_balisticos_coquimbo:
    nombre: Impactos balísticos en edificio consistorial de Coquimbo
    unidad_default: impactos
    notas: "Al menos tres proyectiles impactaron en los ventanales del sexto piso del edificio consistorial (madrugada del 31 julio 2026). Sin heridos."
  hogares_subsidio_electrico_expuestos:
    nombre: Hogares expuestos ante el fin del subsidio eléctrico
    unidad_default: hogares
    notas: "Unos 2 millones de hogares vulnerables habrían quedado expuestos según El Mostrador (16 abril 2026) tras las declaraciones de la ministra Ximena Rincón. El Ministerio de Energía rectificó el 19 de abril que el subsidio continúa."
  recursos_pampilla_reconstruccion:
    nombre: Recursos de La Pampilla destinados a reconstrucción
    unidad_default: millones_pesos
    notas: "Más de $1.800 millones que el municipio de Coquimbo destinaría a La Pampilla 2026 fueron reasignados a la reconstrucción tras la cancelación de la fiesta (30 julio 2026)."
  deterioro_fiscal_pib_megarreforma:
    nombre: Deterioro fiscal permanente de la megarreforma en régimen
    unidad_default: pct_pib
    notas: "0,43% del PIB hacia 2050 sin el efecto del crecimiento, según el CFA (5 mayo 2026). En 2030 el balance seguiría deficitario en 0,3% del PIB."
  aporte_codelco_fisco_2025:
    nombre: Aporte de Codelco al Fisco en 2025
    unidad_default: millones_usd
    notas: "US$1.778 millones según resultados oficiales de Codelco (27 marzo 2026), un 16% más que en 2024 (US$1.534 millones). En el debate de julio 2026 sobre privatización, el oficialismo citó 'más de US$4.000 millones anuales', cifra que no corresponde a los aportes recientes: en 2022 el aporte fue US$2.301 millones y en 2021 los excedentes récord alcanzaron US$7.394 millones."
  aporte_codelco_fisco_2024:
    nombre: Aporte de Codelco al Fisco en 2024
    unidad_default: millones_usd
    notas: "US$1.534 millones según resultados oficiales de Codelco (marzo 2026)."
  aporte_codelco_fisco_2022:
    nombre: Aporte de Codelco al Fisco en 2022
    unidad_default: millones_usd
    notas: "US$2.301 millones, una caída de 58,7% respecto a 2021, afectado por menores precios y ventas de cobre (La Tercera, 31 marzo 2023)."
  excedentes_codelco_2021:
    nombre: Excedentes de Codelco en 2021
    unidad_default: millones_usd
    notas: "US$7.394 millones en 2021, el mejor resultado en nueve años, impulsado por el alto precio del cobre (La Tercera, febrero 2022)."
  utilidad_codelco_2025:
    nombre: Utilidad consolidada de Codelco en 2025
    unidad_default: millones_usd
    notas: "US$2.423 millones al cierre de 2025, con un incremento de US$2.178 millones respecto a 2024, impulsada por la utilidad excepcional de US$2.035 millones por la adquisición del 50% más una acción de Novandino Litio. Excluida esa utilidad excepcional, la utilidad fue US$388 millones (Codelco, 27 marzo 2026)."
  gasto_arriendos_vehiculos_diputados_biobio:
    nombre: Gasto anual en arriendo de vehículos de los 13 diputados del Biobío
    unidad_default: pesos
    notas: "$92.463.000 en 2025 (año de campaña electoral) según solicitud de transparencia de Aquí Biobío/El Mostrador a la Cámara (julio 2026). Ocho diputados concentraron el gasto, encabezados por Sergio Bobadilla (UDI, $20.446.757) y Flor Weisse (UDI, $15.480.000)."
  multa_jalaff_factop:
    nombre: Multa total de Álvaro Jalaff en juicio abreviado Caso Factop
    unidad_default: millones_pesos
    notas: "Multa total de $720 millones a beneficio fiscal, que según Emol se descompone en $220 millones por cohecho y soborno y $500 millones por infracciones tributarias (totalizando más de $700 millones). ChileVisión consigna los $720 millones pagaderos en 60 cuotas mensuales de aproximadamente $12 millones (60 x 12 = 720), más una sanción de 12 UTM por los delitos de estafa (julio 2026)."
  autorizaciones_seguridad_minera_declaraciones:
    nombre: Autorizaciones del Reglamento de Seguridad Minera reemplazadas por declaraciones juradas
    unidad_default: autorizaciones
    notas: "21 artículos del Reglamento de Seguridad Minera (DS 132) vieron reemplazada su autorización previa de Sernageomin por declaración jurada, y 16 artículos fueron derogados y consolidados en un nuevo artículo 22 que crea la figura del Proyecto Minero (decreto 2026)."
  umbral_pequena_mineria_toneladas:
    nombre: Umbral de pequeña minería para régimen simplificado
    unidad_default: toneladas_mensuales
    notas: "Elevado de 5.000 a 10.000 toneladas mensuales por el decreto que modifica el Reglamento de Seguridad Minera (artículo 594), ampliando el acceso al régimen simplificado de Declaración Minera (DM)."
  deuda_codelco_2026:
    nombre: Deuda de Codelco
    unidad_default: mil_millones_usd
    notas: "Cerca de US$25 mil millones, según el expresidente ejecutivo de Codelco Diego Hernández en julio de 2026, quien advirtió que ese nivel de deuda dificulta cualquier proceso de apertura al mercado o venta y castigaría el valor de la empresa y sus activos."
  medidas_paquete_economico:
    nombre: Medidas del paquete económico del gobierno de Kast
    unidad_default: medidas
    notas: "Alrededor de 45 medidas según Ex-Ante (7 abril 2026) durante la preparación del paquete que se anunciaría como Plan de Reconstrucción Nacional el 15 de abril de 2026, manteniendo el corazón del proyecto de Lirquén del 14 de marzo con ajustes de beneficios a la clase media."
  votos_aconsejo_bachelet_onu:
    nombre: Votos 'aconsejo' de Bachelet en primer straw poll ONU
    unidad_default: votos
    notas: "6 votos 'aconsejo' (respaldos) en el primer sondeo informal y no vinculante del Consejo de Seguridad de la ONU por la Secretaría General (30 julio 2026), junto a 5 'desaconsejo' y 4 sin opinión, dejándola en cuarto lugar tras Grynspan (10), Rodrigues-Birkett (9) y Grossi (7)."
  votos_desaconsejo_bachelet_onu:
    nombre: Votos 'desaconsejo' contra Bachelet en primer straw poll ONU
    unidad_default: votos
    notas: "5 votos 'desaconsejo' (rechazos) en el primer sondeo del Consejo de Seguridad de la ONU (30 julio 2026), una de las cifras más altas entre los siete postulantes, solo superada por Macky Sall con 7. El origen de los votos negativos, y si alguno proviene de un miembro permanente con veto, se desconoce por el carácter secreto de la consulta."
  imacec_junio_2025:
    nombre: Imacec de junio de 2025
    unidad_default: pct
    notas: "Crecimiento de 3,1% interanual en junio de 2025 según el Banco Central, por debajo del 3,3% proyectado en la Encuesta de Expectativas Económicas (EEE). La serie desestacionalizada cayó 0,4%. Publicado el 1 de agosto de 2025 durante el gobierno de Gabriel Boric."
  imacec_junio_2026:
    nombre: Imacec de junio de 2026
    unidad_default: pct
    notas: "Crecimiento de 2,4% interanual en junio de 2026 según el Banco Central, rompiendo una racha de cinco meses de contracciones (enero a mayo de 2026) y permitiendo que el segundo trimestre creciera 0,1% y evitara la recesión técnica. La serie desestacionalizada avanzó 0,6% mensual y 1,4% en doce meses. El primer semestre cerró con un promedio de -0,2%, el peor desde la pandemia."
  iali_julio_2026:
    nombre: IALI de julio de 2026
    unidad_default: pct
    notas: "El Índice de Avisos Laborales de Internet (IALI) del Banco Central cayó 10,5% interanual en julio de 2026, segundo peor resultado del año tras -10,9% de mayo, completando nueve meses consecutivos en terreno negativo. Se construye con los avisos de trabajando.com, laborum.cl, Chiletrabajos.cl y bne.cl. En junio de 2026 había caído 6,1% (70,7 puntos)."
  aumento_salarial_gonzalez_tobar:
    nombre: Aumento salarial de Mauricio González Tobar (mar-abr 2026)
    unidad_default: pesos
    notas: "Diferencia entre el sueldo que percibía Mauricio González Tobar como funcionario de la Cámara de Diputados ($450.000) y su remuneración mensual como jefe de gabinete de la senadora Camila Flores en el Senado ($3.600.000), según los registros de personal de apoyo revelados por Contrapoder Chile (27-may-2026): $3.150.000 de aumento entre marzo y abril de 2026."
  sueldo_gonzalez_tobar_camara:
    nombre: Sueldo de Mauricio González Tobar en la Cámara de Diputados
    unidad_default: pesos
    notas: "Remuneración mensual de Mauricio González Tobar según el registro de personal de apoyo de marzo de 2026, cuando Camila Flores ejercía como diputada (Contrapoder Chile, 27-may-2026)."
  sueldo_gonzalez_tobar_senado:
    nombre: Sueldo de Mauricio González Tobar en el Senado
    unidad_default: pesos
    notas: "Remuneración mensual de Mauricio González Tobar como jefe de gabinete de la senadora Camila Flores según el registro de personal de apoyo del Senado de abril de 2026 (Contrapoder Chile, 27-may-2026). Es el sueldo más alto del equipo, seguido por la secretaria María Yolanda Olmos ($2.920.000) y el encargado de redes Boris Saavedra ($2.400.000)."
  precio_cobre_record_2026:
    nombre: Precio del cobre en máximo histórico (6 de agosto de 2026)
    unidad_default: usd_libra
    notas: "US$6,55 por libra al cierre de la jornada del 6 de agosto de 2026 (+2,03%), un nuevo máximo histórico en la Bolsa de Metales de Londres, superando por primera vez los US$6,5. Promedio mensual del metal: US$6,44/lb. Cochilco atribuyó el alza a la prohibición de la República Democrática del Congo de exportar concentrados de cobre y cobalto, a la caída de los inventarios de Londres y a la presión por cobre de entrega inmediata (parte localizada en EE.UU. por expectativas arancelarias)."
  desaprobacion_kast_cadem_ago:
    nombre: Desaprobación de Kast en encuesta Cadem de agosto
    unidad_default: pct
    notas: "60% de desaprobación (dos puntos más que la medición anterior) según la encuesta Plaza Pública de Cadem publicada el 2 de agosto de 2026. La aprobación se ubicó en 36%. El Mandatario cerró julio con un promedio de 37% de aprobación, cinco puntos menos que en junio, con caídas en todos los segmentos, especialmente entre quienes se identifican con la derecha."
  aprobacion_kast_cadem_ago:
    nombre: Aprobación de Kast en encuesta Cadem de agosto
    unidad_default: pct
    notas: "36% de aprobación según la encuesta Plaza Pública de Cadem publicada el 2 de agosto de 2026, frente a una desaprobación de 60%. La caída del respaldo se registró en todos los segmentos políticos."
  percepcion_pais_dividido_cadem_ago:
    nombre: Percepción de país dividido según Cadem de agosto
    unidad_default: pct
    notas: "76% de los consultados considera que la sociedad chilena está muy o bastante dividida, principalmente por la política (encuesta Cadem publicada el 2 de agosto de 2026). El 56% cree que Chile vive una 'batalla cultural'. Las mayores tensiones: entre personas de izquierda y derecha (84%), entre votantes de Kast y Jara (76%), entre ricos y pobres (71%) y entre chilenos e inmigrantes (70%)."
  ingresos_mensuales_anabalon:
    nombre: Ingresos mensuales de Marcelo Anabalón
    unidad_default: pesos
    notas: "$5.954.241 mensuales que percibía Marcelo Anabalón, integrante de La Cofradía, como empleado de la Municipalidad de La Reina y asesor del diputado Pier Karlezi (PNL), antes de su desvinculación tras el escándalo (El Mostrador, 3 agosto 2026)."
  sueldo_omegna_congreso:
    nombre: Sueldo de Ítalo Omegna en el Congreso
    unidad_default: pesos
    notas: "$1.800.000 que ganaba Ítalo Omegna como asesor legislativo antes de renunciar tras la polémica por sus dichos sobre niños con TEA (El Mostrador, 3 agosto 2026)."
  becas_mises_cono_sur:
    nombre: Becas internacionales del Instituto Mises Cono Sur
    unidad_default: euros
    notas: "Becas internacionales de 20.000 euros para investigaciones sobre anarco-capitalismo patrocinadas por el Instituto Mises Cono Sur junto a la Fundación Jesús Huerta de Soto (El Mostrador, 3 agosto 2026)."
  capacidad_tren_rapido:
    nombre: Capacidad del tren rápido Santiago-Chillán
    unidad_default: pasajeros
    notas: "238 pasajeros por tren, según la publicación del ministro de Transportes Louis de Grange en redes sociales (agosto 2026). Es el único tren bimodal (eléctrico y diésel) de Sudamérica."
  aprobacion_kast_pulso_mar:
    nombre: Aprobación de Kast según Pulso Ciudadano Activa (marzo 2026)
    unidad_default: pct
    notas: "34,7% en la quincena del 26-27 de marzo de 2026, una caída de 12,8 puntos desde el 47,5% de la primera quincena. La desaprobación subió de 26,3% a 48,7%. Sondeo realizado tras la polémica por el 'bencinazo' (no activación del MEPCO) y el retiro del apoyo a Bachelet en la ONU."
  desaprobacion_kast_pulso_mar:
    nombre: Desaprobación de Kast según Pulso Ciudadano Activa (marzo 2026)
    unidad_default: pct
    notas: "48,7% en marzo Q2 2026, un alza desde el 26,3% de la primera quincena de marzo. El 57,2% se mostró en desacuerdo o muy en desacuerdo con la decisión del gobierno de no activar el MEPCO."
  aprobacion_gabinete_pulso_mar:
    nombre: Aprobación del gabinete según Pulso Ciudadano Activa (marzo 2026)
    unidad_default: pct
    notas: "29,0% de aprobación del gabinete ministerial, con 53,6% de desaprobación, en el sondeo de marzo Q2 2026 de Pulso Ciudadano Activa Research."
  aprobacion_kast_criteria_mar:
    nombre: Aprobación de Kast según Agenda Criteria (marzo 2026)
    unidad_default: pct
    notas: "43% en la medición de marzo 2026, una caída de 7 puntos desde el 50% de inicios de mes. Por primera vez desde el inicio del gobierno, la desaprobación (47%) superó a la aprobación."
  desaprobacion_kast_criteria_mar:
    nombre: Desaprobación de Kast según Agenda Criteria (marzo 2026)
    unidad_default: pct
    notas: "47% en marzo 2026, un alza de 10 puntos desde el 37%. El 64% de los encuestados declaró confiar poco o nada en las explicaciones del gobierno sobre el alza de combustibles."
  desconfianza_razones_bencinazo_criteria:
    nombre: Desconfianza en razones del gobierno por alza de combustibles (Criteria)
    unidad_default: pct
    notas: "64% de los encuestados declaró confiar poco o nada en las explicaciones del gobierno por el alza de combustibles (marzo 2026). Un 42% atribuyó el alza a factores internacionales y un 34% responsabilizó al gobierno de Kast."
  aprobacion_kast_blackwhite_abr:
    nombre: Aprobación de Kast según Black & White (abril 2026)
    unidad_default: pct
    notas: "40% aprueba la forma en que el presidente Kast está conduciendo su gobierno, un alza de 6 puntos respecto de la medición anterior (abril 2026). Un 56% evalúa con nota 1 a 4 al gobierno (promedio 3,6)."
  apoyo_plan_reconstruccion_blackwhite:
    nombre: Apoyo al Plan de Reconstrucción Nacional en general (Black & White)
    unidad_default: pct
    notas: "52% muy de acuerdo (31%) o de acuerdo (21%) con el Plan de Reconstrucción Nacional en general, según Black & White (abril 2026). El apoyo aumenta entre hombres, el segmento ABC1 y a mayor edad. El 61% considera que las medidas deben aprobarse una por una."
  apoyo_eliminacion_iva_viviendas:
    nombre: Apoyo a la eliminación del IVA a viviendas nuevas
    unidad_default: pct
    notas: "74% muy de acuerdo o de acuerdo con la eliminación del IVA a viviendas nuevas, una de las medidas con mayor apoyo del Plan de Reconstrucción (Black & White, abril 2026). El subsidio a la contratación formal alcanzó 71% de apoyo y la eximición de contribuciones a adultos mayores 68%."
  aumento_costos_laborales_42_horas:
    nombre: Aumento de costos laborales por la entrada en vigencia de las 42 horas
    unidad_default: pct
    notas: "4,8% de incremento de los costos laborales estimado por los economistas David Bravo y Juan Bravo ante la reducción de la jornada de 44 a 42 horas (abril 2026), dado que los trabajadores mantienen sus remuneraciones con dos horas menos."
  proyeccion_crecimiento_chile_2027_2028:
    nombre: Proyección de crecimiento de Chile 2027-2028 (Hacienda)
    unidad_default: '%'
    notas: "El Ministerio de Hacienda proyectó un crecimiento de 3,0% para 2027 y 2028, presentado por el ministro Jorge Quiroz ante la Comisión de Hacienda del Senado el 10 de junio de 2026, bajo la meta de 4% del gobierno."
  proyeccion_crecimiento_chile_2030:
    nombre: Proyección de crecimiento de Chile 2030 (Hacienda)
    unidad_default: '%'
    notas: "El Ministerio de Hacienda proyectó un crecimiento de 3,5% hacia 2030, por debajo de la meta de 4% aspirada por el gobierno de Kast, según lo presentado por Jorge Quiroz el 10 de junio de 2026."
  meta_crecimiento_chile_2030:
    nombre: Meta de crecimiento de Chile al 2030 (gobierno Kast)
    unidad_default: '%'
    notas: "La aspiración de crecimiento del gobierno de Kast es alcanzar 4% al final de su mandato en 2030, pese a que la proyección oficial de Hacienda es de 3,5% (10 de junio de 2026)."
  deuda_bruta_gobierno_central_2026:
    nombre: Deuda bruta del Gobierno Central 2026
    unidad_default: pct_pib
    notas: "La deuda bruta del Gobierno Central proyectada en 43,1% del PIB para 2026, según el Informe de Finanzas Públicas del primer trimestre de 2026."
  deuda_bruta_gobierno_central_2028:
    nombre: Deuda bruta del Gobierno Central 2028
    unidad_default: pct_pib
    notas: "La deuda bruta del Gobierno Central proyectada en 45,4% del PIB para 2028, superando ese año el nivel considerado prudente por la autoridad fiscal, según el Informe de Finanzas Públicas del primer trimestre de 2026."
  recorte_aps_arica_2026:
    nombre: Recorte de financiamiento APS Universal en Arica
    unidad_default: millones_pesos
    notas: "Recorte de más de $1.300 millones en el financiamiento de la Atención Primaria de Salud (APS) Universal que obligó a los consultorios (Cesfam) de Arica a reducir sus horarios de atención, afectando principalmente la atención de los días sábado (agosto 2026)."
  proyeccion_crecimiento_chile_cepal_2026:
    nombre: Proyección de crecimiento de Chile 2026 según CEPAL
    unidad_default: pct
    notas: "2,0%, un recorte desde el 2,2% estimado en diciembre de 2025, por mayor tensión global, condiciones financieras restrictivas y presiones inflacionarias (CEPAL, abril 2026). Para América Latina y el Caribe la proyección bajó de 2,3% a 2,2%."
  caja_fisco_cierre_2025:
    nombre: Caja del fisco al cierre de 2025
    unidad_default: millones_usd
    notas: "US$40 millones al 31 de diciembre de 2025, según el ministro de Hacienda Jorge Quiroz (13 de marzo de 2026). El exministro Nicolás Grau refutó la cifra señalando que el último dato público era de US$1.406 millones a fines de enero y alrededor de US$800 millones a inicios de la semana."
  recorte_transversal_gasto:
    nombre: Recorte transversal del gasto de ministerios
    unidad_default: pct
    notas: "Rebaja transversal de 3% del gasto bruto de cada ministerio, aplicada de forma uniforme por la Dipres a los distintos subtítulos presupuestarios mediante decreto de Hacienda (marzo 2026). Se suma una rebaja adicional de US$1.000 millones focalizada por cada cartera, que debían reportar espacios de eficiencia a la Dipres antes del 20 de marzo de 2026."
  aprobacion_kast_cadem_abr:
    nombre: Aprobación de Kast según Cadem (abril 2026)
    unidad_default: pct
    notas: "40% en la quinta semana de abril de 2026, una caída de un punto. Es la medición más baja desde el inicio del mandato, con una desaprobación récord de 57%."
  desaprobacion_kast_cadem_abr:
    nombre: Desaprobación de Kast según Cadem (abril 2026)
    unidad_default: pct
    notas: "57% en la quinta semana de abril de 2026, un alza de cuatro puntos y el nivel más alto desde el inicio de su mandato. Un 63% cree que el Estado tiene suficientes recursos para financiar sus compromisos (+20 pts), mientras que solo un 8% piensa que enfrenta una situación fiscal crítica (-25 pts)."
  informalidad_amj_2026:
    nombre: Tasa de ocupación informal trimestre abril-junio 2026
    unidad_default: "%"
    notas: "27,0% a nivel nacional, un incremento de 1,0 punto en 12 meses. En mujeres la ocupación informal fue de 28,9% y en hombres de 25,5%. Los ocupados informales aumentaron 4,7%, incididos por comercio y servicios administrativos (INE, julio 2026)."
  desocupacion_mujeres_amj_2026:
    nombre: Tasa de desocupación femenina trimestre abril-junio 2026
    unidad_default: "%"
    notas: "10,4%, un aumento de 0,5 puntos en un año, debido a que la fuerza de trabajo femenina creció 2,3% frente al 1,7% de las ocupadas (INE, julio 2026). La tasa supera los dos dígitos, por encima de la masculina."
  desocupacion_hombres_amj_2026:
    nombre: Tasa de desocupación masculina trimestre abril-junio 2026
    unidad_default: "%"
    notas: "8,7%, un aumento de 0,6 puntos en un año, con un alza de la fuerza de trabajo masculina de 0,9% y de solo 0,3% en los ocupados (INE, julio 2026)."
  desocupacion_biobio:
    nombre: Tasa de desocupación en la Región del Bío Bío (abril-junio 2026)
    unidad_default: "%"
    notas: "10,4%, sobre el promedio nacional de 9,4%. La región se ubica entre las de mayor desempleo del país, superada solo por Ñuble (10,5%). La desocupación femenina regional llegó a 11,3% y la informalidad a 28,3% (+3,1 pp en 12 meses) (INE, julio 2026)."
  desocupacion_nuble:
    nombre: Tasa de desocupación en Ñuble (abril-junio 2026)
    unidad_default: "%"
    notas: "10,5%, la más alta del país según Amigos Penquistas citando al INE (julio 2026), por encima del promedio nacional de 9,4%."
  desocupacion_ohiggins:
    nombre: Tasa de desocupación en O'Higgins (abril-junio 2026)
    unidad_default: "%"
    notas: "10,4%, un aumento de 1,1 puntos en doce meses y un punto sobre el promedio nacional. Los desocupados aumentaron 11,8% en un año, llegando a 51.293 personas, con destrucción efectiva de empleo: los ocupados cayeron 0,8% (INE, julio 2026)."
  desocupacion_mujeres_ohiggins:
    nombre: Tasa de desocupación femenina en O'Higgins (abril-junio 2026)
    unidad_default: "%"
    notas: "14,2%, un alza de 5,0 puntos en un año, frente al 7,7% de los hombres en la región (INE, julio 2026). Es el impacto más duro del desempleo regional."
  informalidad_ohiggins:
    nombre: Tasa de ocupación informal en O'Higgins (abril-junio 2026)
    unidad_default: "%"
    notas: "30,3%, afectando a casi un tercio de la fuerza laboral regional, como refugio ante la pérdida de empleo formal (INE, julio 2026)."
  informalidad_biobio:
    nombre: Tasa de ocupación informal en el Bío Bío (abril-junio 2026)
    unidad_default: "%"
    notas: "28,3%, con un alza de 3,1 puntos en un año, según el INE (julio 2026)."
  rechazo_privatizacion_codelco_criteria:
    nombre: Rechazo a la privatización de Codelco (Agenda Criteria)
    unidad_default: "%"
    notas: "74% en el sondeo del 2 de agosto de 2026, estable frente al 73% de 2018 y el 72% de mayo 2026. Un 49% prefiere mantenerla 100% estatal mejorando su gestión, un 31% incorporaría capital privado conservando el control estatal y solo un 5% opta por privatización mayoritaria."
  aprobacion_kast_criteria_ago:
    nombre: Aprobación de Kast según Agenda Criteria (agosto 2026)
    unidad_default: "%"
    notas: "34% en el sondeo del 2 de agosto de 2026, una caída de 2 puntos respecto de la medición del 26 de julio (36%). La desaprobación alcanzó 55% y un 11% respondió no saber."
  desaprobacion_kast_criteria_ago:
    nombre: Desaprobación de Kast según Agenda Criteria (agosto 2026)
    unidad_default: "%"
    notas: "55% en el sondeo del 2 de agosto de 2026, un punto más que la medición del 26 de julio (54%). La aprobación cayó a 34%."
  percepcion_negativa_megarreforma_criteria:
    nombre: Percepción negativa de la megarreforma (Agenda Criteria)
    unidad_default: "%"
    notas: "38% consideró que la Ley de Reconstrucción tendrá un efecto más bien negativo, frente a un 33% positivo y un 29% sin claridad (2 de agosto de 2026). Es la tercera medición consecutiva en que la opinión negativa supera a la positiva, con una distancia de cinco puntos."
  compensacion_municipal_megarreforma:
    nombre: Compensación municipal por exención de contribuciones en la megarreforma
    unidad_default: millones_usd
    notas: "US$200 millones comprometidos por el gobierno para compensar a los municipios por la exención de contribuciones a mayores de 65 años. Los alcaldes de oposición pidieron que los recursos vayan íntegramente al Fondo Común Municipal; el gobierno propone transferencias proporcionales a lo que cada comuna deje de percibir (agosto 2026)."
  compensacion_municipal_directa_total:
    nombre: Compensación municipal directa total aprobada en la megarreforma
    unidad_default: millones_pesos
    notas: "80 mil millones de pesos de compensación directa para los municipios aprobados en la megarreforma (agosto 2026). La alcaldesa de Lo Espejo, Javiera Reyes, denunció que la mitad del monto beneficiará a seis comunas de altos ingresos."
  compensacion_comunas_menos_ingresos:
    nombre: Compensación a comunas de menores ingresos en la megarreforma
    unidad_default: millones_pesos
    notas: "Unos 13 mil millones de pesos destinados a las comunas de menores ingresos según la alcaldesa de Quinta Normal, Karina Delfino, en el debate por la compensación municipal de la megarreforma (agosto 2026)."
  compensacion_comunas_altos_ingresos:
    nombre: Compensación a comunas de altos ingresos en la megarreforma
    unidad_default: millones_pesos
    notas: "Alrededor de 30 mil millones de pesos para Las Condes, Vitacura y Lo Barnechea, según la alcaldesa de Quinta Normal, Karina Delfino, crítico del mecanismo de compensación de la megarreforma (agosto 2026)."
  alcaldes_firmantes_veto:
    nombre: Alcaldes firmantes de la declaración pidiendo veto presidencial
    unidad_default: alcaldes
    notas: "104 alcaldes (más de 100, casi un tercio de los 345 de todo Chile), en su mayoría de oposición, firmaron la declaración pidiendo al presidente Kast un veto aditivo a la compensación por la exención de contribuciones (2 de agosto 2026). Representan a municipios donde residen más de 7,2 millones de personas."
  alcaldes_oficialistas_compensacion:
    nombre: Alcaldes oficialistas que respaldaron la fórmula de compensación
    unidad_default: alcaldes
    notas: "161-162 alcaldes firmaron la carta oficialista que respaldó la fórmula de compensación del gobierno y pidió al Senado aprobarla para las 345 comunas, frente a los 104 de la oposición (agosto 2026). Representan a municipios con unos 5,3 millones de habitantes."
  umbral_combustible_sin_evaluacion:
    nombre: Umbral de almacenamiento de combustible sin evaluación ambiental
    unidad_default: litros
    notas: "1 millón de litros (1.000 toneladas) desde el cambio reglamentario de la administración Boric vigente desde enero 2026, doce veces más que los 80 mil litros anteriores. Permite que los data centers acopien diésel para respaldo sin ingresar al SEIA."
  inversion_data_center_alto_jahuel:
    nombre: Inversión del Data Center Alto Jahuel
    unidad_default: millones_usd
    notas: "US$25 millones. Proyecto de DC Terranova SPA en Buin, a pocos kilómetros de la casa del presidente Kast y de la Viña Santa Rita. Almacenará 990 toneladas de diésel (bajo el límite de 1.000) y se conectará a la subestación Maipo a 250 metros. Primer data center eximido del SEIA por el SEA el 24 de julio de 2026."
  refugiados_reubicados_conar:
    nombre: Refugiados reubicados en el extranjero por el CONAR
    unidad_default: personas
    notas: "Aproximadamente 5.000 personas fueron reubicadas en el extranjero por el Comité Nacional de Ayuda a los Refugiados (CONAR, 1973-1974), según la Vicaría de la Solidaridad, con salvoconductos y apoyo legal y material. Incluye extranjeros perseguidos residentes en Chile y opositores nacionales."
  rechazo_plebiscito_salida_2022:
    nombre: Votos del Rechazo en el plebiscito de salida (septiembre 2022)
    unidad_default: porciento
    notas: "61,86% de los votos válidos (7.882.238 votos) para la opción Rechazo, contra la propuesta de nueva Constitución de la Convención Constitucional. Participación del 85,86% del padrón."
  en_contra_plebiscito_2023:
    nombre: Votos del En Contra en el plebiscito constitucional (diciembre 2023)
    unidad_default: porciento
    notas: "55,76% de los votos válidos (6.890.826 votos) para la opción En Contra, rechazando el texto del Consejo Constitucional. El A Favor obtuvo 44,24%."
  escaños_republicanos_consejo_2023:
    nombre: Escaños del Partido Republicano en el Consejo Constitucional
    unidad_default: escaños
    notas: "23 de 50 escaños (con ~36% de los sufragios) en la elección del 7 de mayo de 2023. Sumando Chile Vamos, la oposición alcanzó 34 escaños, sobre los dos tercios."
  fallecidos_megaincendio_vina_2024:
    nombre: Fallecidos por el megaincendio de Viña del Mar (febrero 2024)
    unidad_default: personas
    notas: "Al menos 134 fallecidos confirmados por el SML al 23 de febrero de 2024; la cifra final se elevó a 136 según informes posteriores de la Fiscalía."
  votos_40_horas_2023:
    nombre: Votos a favor de la ley de 40 horas
    unidad_default: votos
    notas: "127 votos a favor en la Cámara de Diputadas y Diputados (abril 2023), que redujo gradualmente la jornada laboral de 45 a 40 horas semanales (Ley 21.561)."
  votos_reforma_previsional_senado:
    nombre: Votos a favor de la reforma previsional en el Senado
    unidad_default: votos
    notas: "40 votos a favor y 7 en contra en la aprobación en general de la reforma previsional (27 de enero de 2025). La Cámara de Diputados despachó a ley el 29 de enero de 2025."
  votos_reforma_tributaria_rechazo:
    nombre: Votos en contra de la idea de legislar la reforma tributaria
    unidad_default: votos
    notas: "71 votos en contra (frente a 73 a favor y 3 abstenciones) en la votación de la idea de legislar, que rechazó la reforma tributaria de Boric en la Cámara de Diputados el 8 de marzo de 2023."
  poblacion_censo_2024:
    nombre: Población censada en Chile (Censo 2024)
    unidad_default: personas
    notas: "18.480.432 personas censadas entre marzo y julio de 2024. En el Censo 2017 fueron 17.574.003. Primeros resultados entregados por el INE el 27 de marzo de 2025; el 40% se concentra en la Región Metropolitana."
  municipios_adicionales_chile_vamos_2024:
    nombre: Municipios adicionales ganados por Chile Vamos en las elecciones 2024
    unidad_default: municipios
    notas: "Chile Vamos sumó 35 municipios respecto de 2021 en las elecciones municipales y regionales de octubre de 2024, con retroceso del oficialismo."
  votos_jara_primarias_2025:
    nombre: Porcentaje de Jeannette Jara en las primarias de Unidad por Chile 2025
    unidad_default: "%"
    notas: "60,16% de los votos (825.835) en la primaria presidencial de Unidad por Chile del 29 de junio de 2025, que la consagró como candidata del pacto oficialista."
  votos_jara_primera_vuelta_2025:
    nombre: Votos de Jeannette Jara en la primera vuelta presidencial 2025
    unidad_default: votos
    notas: "3.483.490 votos (26,85%) en la primera vuelta del 16 de noviembre de 2025, el primer lugar que la llevó a la segunda vuelta."
  votos_kast_primera_vuelta_2025:
    nombre: Votos de José Antonio Kast en la primera vuelta presidencial 2025
    unidad_default: votos
    notas: "3.104.458 votos (23,93%) en la primera vuelta del 16 de noviembre de 2025, el segundo lugar que lo llevó a la segunda vuelta."
  participacion_primera_vuelta_2025:
    nombre: Participación en la primera vuelta presidencial 2025
    unidad_default: "%"
    notas: "85,42% del padrón (13.478.426 votantes de 15.779.102 habilitados) en la primera vuelta del 16 de noviembre de 2025, con voto obligatorio."
  sueldo_presidente_kast_2026:
    nombre: Sueldo bruto mensual del Presidente de la República (2026)
    unidad_default: pesos chilenos
    notas: "La comisión autónoma creada por la Ley 21.233 fijó un sueldo bruto de $11,07 millones para el Presidente de la República desde el 11 de marzo de 2026 (adecuación al IPC; Boric percibía alrededor de $7 millones). Emol y Meganoticias reportan la renta bruta de Kast en torno a los $11,3 millones."
  sueldo_presidente_boric_2025:
    nombre: Sueldo bruto mensual del Presidente Gabriel Boric (noviembre 2025)
    unidad_default: pesos chilenos
    notas: "Renta bruta de $7.033.974 percibida por el presidente Gabriel Boric en noviembre de 2025 (líquido $5.765.081), según Transparencia. La Comisión para la Fijación de Remuneraciones calculó un promedio mensualizado de $7.787.000 para el trimestre. Reportado por T13 y Diario Usach el 24 de diciembre de 2025."
  diferencia_sueldo_kast_boric:
    nombre: Diferencia de sueldo bruto entre Kast y Boric (2026)
    unidad_default: pesos chilenos
    notas: "$4.036.090 más que el presidente saliente recibirá el presidente electo José Antonio Kast según la renta bruta ($11.070.064 vs $7.033.974 de Boric en noviembre de 2025), tras la decisión de la Comisión para la Fijación de Remuneraciones de diciembre de 2025."
  remuneraciones_reales_interanual_junio_2026:
    nombre: Variación interanual del Índice Real de Remuneraciones (junio 2026)
    unidad_default: "%"
    notas: "+3,2% en doce meses según el boletín del INE publicado el 6 de agosto de 2026, favorecido por un IPC de 0% en junio. Mide la evolución de los sueldos descontando la inflación."
  remuneraciones_reales_semestre_2026:
    nombre: Acumulado del Índice Real de Remuneraciones enero-junio 2026
    unidad_default: "%"
    notas: "+2,3% en el primer semestre de 2026 según el boletín del INE del 6 de agosto de 2026, consolidando la recuperación del poder adquisitivo."
  indice_nominal_remuneraciones_junio_2026:
    nombre: Variación interanual del Índice Nominal de Remuneraciones (junio 2026)
    unidad_default: "%"
    notas: "+7,7% en comparación con igual mes del año anterior, según el INE (boletín del 6 de agosto de 2026). Comercio, industria manufacturera y construcción lideraron el avance."
  indice_costos_laborales_junio_2026:
    nombre: Variación interanual del Índice de Costos Laborales (junio 2026)
    unidad_default: "%"
    notas: "+8,4% en doce meses según el INE (boletín del 6 de agosto de 2026). El costo laboral medio por hora total se ubicó en $8.633 (+8,5% interanual)."
  remuneracion_media_hora_junio_2026:
    nombre: Remuneración media por hora ordinaria (junio 2026)
    unidad_default: pesos_por_hora
    notas: "$7.523 en junio de 2026 (+8% interanual). Mujeres: $7.328 (+8,4%); hombres: $7.703 (+7,7%). Fuente: INE, boletín del 6 de agosto de 2026."
  brecha_salarial_hora_junio_2026:
    nombre: Brecha salarial de género por hora (junio 2026)
    unidad_default: "%"
    notas: "-4,9% en remuneración media por hora (las mujeres ganan 4,9% menos que los hombres); -5,5% en costo laboral medio por hora total. Fuente: INE, boletín del 6 de agosto de 2026."
  contrato_indh_ditecsur:
    nombre: Contrato del INDH con la productora Ditecsur (2026)
    unidad_default: millones_pesos
    notas: "$250 millones suscritos en noviembre de 2025 y vigentes durante 2026 para la organización y producción de eventos del INDH, como la ceremonia de entrega del Informe Anual sobre la Situación de los Derechos Humanos."
  presupuesto_indh_2026:
    nombre: Presupuesto del INDH 2026
    unidad_default: millones_pesos
    notas: "$16.339 millones de fondos totales para el INDH en 2026, provenientes de la partida del Tesoro Público."
  viaje_contreras_ginebra_2023:
    nombre: Costo del viaje de la exdirectora del INDH a Ginebra (2023)
    unidad_default: pesos chilenos
    notas: "$8.183.208 destinados al viaje de la exdirectora del INDH Consuelo Contreras a la asamblea anual de la GANHRI en Ginebra (Suiza) el 19 de marzo de 2023. Un segundo viaje, el 8 de marzo de 2025, costó $4.440.910."
  droga_tacna_milos_2017:
    nombre: Droga incautada a Evelyn Milos en Tacna (2017)
    unidad_default: kilos
    notas: "47 kilos de marihuana tipo cripy incautados en octubre de 2017 en la frontera de Tacna (Perú) a un grupo de cuatro mujeres chilenas de la misma familia —incluida Evelyn Milos Cáceres— en 44 paquetes ocultos en la carrocería de un vehículo, tasados en cerca de US$282 mil."
  condenados_libertad_vigilada_delitos_sexuales:
    nombre: Condenados por delitos sexuales contra menores de 14 años en libertad vigilada
    unidad_default: personas
    notas: "8.815 personas condenadas por delitos sexuales contra menores de 14 años cumplen su pena bajo libertad vigilada sin haber pasado por prisión como condenados, según datos de Gendarmería obtenidos por Ciper vía Ley de Transparencia (agosto 2026)."
  total_condenados_delitos_sexuales_menores:
    nombre: Total de condenados por delitos sexuales contra menores de 14 años
    unidad_default: personas
    notas: "11.668 personas cumplen actualmente condenas por delitos sexuales contra menores de 14 años, de las cuales solo 2.853 están recluidas, según estadísticas de Gendarmería entregadas a Ciper (agosto 2026)."
  reclusos_delitos_sexuales_menores:
    nombre: Recluidos por delitos sexuales contra menores de 14 años
    unidad_default: personas
    notas: "2.853 personas condenadas por delitos sexuales contra menores de 14 años se encuentran recluidas en prisión, frente a las 8.815 que cumplen en libertad vigilada (datos de Gendarmería a Ciper, agosto 2026)."
  total_libertad_vigilada_chile:
    nombre: Total de personas en libertad vigilada en Chile
    unidad_default: personas
    notas: "96.984 personas cumplen penas en libertad vigilada en Chile, cifra superior a las 64.991 personas recluidas al 30 de junio de 2026 (42.596 condenadas y 22.394 imputadas), según Gendarmería."
  multa_aspor_cmf:
    nombre: Multa de la CMF a la aseguradora ASPOR (caso ProCultura)
    unidad_default: UF
    notas: "1.000 UF de multa aplicada por la CMF a la aseguradora ASPOR por incumplir el pago de las pólizas de garantía del programa 'Quédate' (caso ProCultura), confirmada por la Corte Suprema el 4 de agosto de 2026. Las pólizas sumaban más de 31 mil UF (más de $1.000 millones)."
  fondos_programa_quedate:
    nombre: Fondos del programa Quédate (2022)
    unidad_default: millones_pesos
    notas: "$1.600 millones financiados en 2022 por el Gobierno de Santiago para el programa de prevención del suicidio 'Quédate', ejecutado por la Fundación ProCultura, que alcanzó un 40% de ejecución y atendió a casi 12 mil personas."
  sin_ejecutar_procultura:
    nombre: Recursos sin ejecutar del programa Quédate
    unidad_default: millones_pesos
    notas: "Cerca de $1.000 millones quedaron sin ejecutar cuando ProCultura dejó de transferir fondos a las fundaciones especializadas del programa 'Quédate', monto cuyo pago exige el Gobierno de Santiago a la aseguradora ASPOR por las pólizas de garantía."
  senadores_aprueban_teleton_2026:
    nombre: Senadores que aprobaron el Día Nacional de la Teletón
    unidad_default: senadores
    notas: "40 senadores presentes votaron a favor, sin votos en contra ni abstenciones, en la Sesión N°47 del Senado del 4 de agosto de 2026 (Boletín 18231-35)."
  alcaldes_apoyan_megarreforma:
    nombre: Alcaldes que firmaron a favor de la megarreforma
    unidad_default: alcaldes
    notas: "174 alcaldes, poco más del 50% de las 345 municipalidades, adhirieron a una declaración pública del 4 de agosto de 2026 pidiendo al Senado aprobar la megarreforma y su compensación municipal."
  alcaldes_opositores_megarreforma:
    nombre: Alcaldes en contra de la compensación de la megarreforma
    unidad_default: alcaldes
    notas: "104 alcaldes de oposición, encabezados por Tomás Vodanovic (Maipú), firmaron una declaración contra la compensación municipal incluida en la megarreforma, calificada por Vodanovic de 'injusta y regresiva'."
  compensacion_fcm_megarreforma:
    nombre: Compensación anual al Fondo Común Municipal por la megarreforma
    unidad_default: millones_pesos
    notas: "110 mil millones de pesos que la Tesorería entregará anualmente al Fondo Común Municipal para compensar la exención de contribuciones de adultos mayores, según la fórmula aprobada por el Senado el 4 de agosto de 2026; montos estimados por el SII."
  compensacion_municipios_directa:
    nombre: Compensación directa anual a municipios por la megarreforma
    unidad_default: millones_pesos
    notas: "80 mil millones de pesos que la Tesorería entregará anualmente directamente a los municipios para compensar la rebaja del impuesto territorial a adultos mayores, según la fórmula aprobada el 4 de agosto de 2026."
  atenciones_teleton_anuales:
    nombre: Personas atendidas por Teletón en un año
    unidad_default: personas
    notas: "Más de 31.000 personas atendidas y cerca de un millón de prestaciones de rehabilitación en los institutos de Teletón durante el último año, según el ministro Segpres José García Ruminot en la sesión del 4 de agosto de 2026."
  kast_intencion_voto_cadem_2v:
    nombre: Intención de voto de José Antonio Kast en la segunda vuelta 2025 según Cadem
    unidad_default: "%"
    notas: "58% en la medición Plaza Pública Cadem del 23 de noviembre de 2025 y 58% nuevamente en la última medición publicable del 29 de noviembre de 2025 (16 puntos sobre Jeannette Jara). Su estudio privado durante la veda proyectó el mismo 58%, coincidente con el resultado final."
  jara_intencion_voto_cadem_2v:
    nombre: Intención de voto de Jeannette Jara en la segunda vuelta 2025 según Cadem
    unidad_default: "%"
    notas: "42% en las mediciones Plaza Pública Cadem del 23 y del 29 de noviembre de 2025, 16 puntos bajo José Antonio Kast."
  diferencia_cadem_2v:
    nombre: Diferencia entre Kast y Jara en la intención de voto (Cadem)
    unidad_default: puntos_porcentuales
    notas: "16 puntos porcentuales de ventaja de José Antonio Kast (58%) sobre Jeannette Jara (42%) en las mediciones Plaza Pública Cadem del 23 y 29 de noviembre de 2025."
  kast_criteria_2v:
    nombre: Intención de voto de José Antonio Kast en la segunda vuelta 2025 según Criteria
    unidad_default: "%"
    notas: "50% en la medición de Criteria publicada el 23 de noviembre de 2025, ante la pregunta cerrada de voto en el balotaje."
  jara_criteria_2v:
    nombre: Intención de voto de Jeannette Jara en la segunda vuelta 2025 según Criteria
    unidad_default: "%"
    notas: "36% en la medición de Criteria publicada el 23 de noviembre de 2025."
  kast_black_white_2v:
    nombre: Intención de voto de José Antonio Kast en la segunda vuelta 2025 según Black & White
    unidad_default: "%"
    notas: "56% en el sondeo de Black & White de la semana del 23 de noviembre de 2025, 21 puntos sobre Jara."
  jara_black_white_2v:
    nombre: Intención de voto de Jeannette Jara en la segunda vuelta 2025 según Black & White
    unidad_default: "%"
    notas: "35% en el sondeo de Black & White de la semana del 23 de noviembre de 2025."
  kast_panel_ciudadano_2v:
    nombre: Intención de voto de José Antonio Kast en la segunda vuelta 2025 según Panel Ciudadano UDD
    unidad_default: "%"
    notas: "61% contra 39% de Jara entre quienes manifestaron preferencia decidida en la primera medición de Panel Ciudadano UDD tras la primera vuelta de 2025 (54% contra 34% considerando el 12% que no votaría, no sabía o anularía)."
  jara_panel_ciudadano_2v:
    nombre: Intención de voto de Jeannette Jara en la segunda vuelta 2025 según Panel Ciudadano UDD
    unidad_default: "%"
    notas: "39% entre quienes manifestaron preferencia decidida en la primera medición de Panel Ciudadano UDD tras la primera vuelta de 2025 (34% considerando el 12% que no votaría, no sabía o anularía)."
  votos_parisi_a_kast_cadem_2v:
    nombre: Transferencia de votos de Franco Parisi hacia José Antonio Kast (Cadem)
    unidad_default: "%"
    notas: "De los votantes de Franco Parisi en la primera vuelta 2025, un 34% habría votado por Kast en la medición Cadem del 23 de noviembre (22% a Jara, 44% indecisos o nulos) y un 37% en la del 29 de noviembre (22% a Jara, 41% indecisos)."
  votos_kaiser_a_kast_cadem_2v:
    nombre: Transferencia de votos de Johannes Kaiser hacia José Antonio Kast (Cadem)
    unidad_default: "%"
    notas: "De los votantes de Johannes Kaiser en la primera vuelta 2025, un 92% habría votado por Kast en la medición Cadem del 23 de noviembre y un 89% en la del 29 de noviembre, sin transferencia relevante hacia Jara."
  votos_matthei_a_kast_cadem_2v:
    nombre: Transferencia de votos de Evelyn Matthei hacia José Antonio Kast (Cadem)
    unidad_default: "%"
    notas: "De los votantes de Evelyn Matthei en la primera vuelta 2025, un 60% habría votado por Kast en las mediciones Cadem del 23 y 29 de noviembre (21-22% a Jara)."
  expectativa_kast_presidente_cadem:
    nombre: Expectativa de que José Antonio Kast sea el próximo Presidente (Cadem)
    unidad_default: "%"
    notas: "62% de los encuestados por Cadem creía en noviembre de 2025 que Kast sería el próximo Presidente (28% pensaba en Jara el 23 de noviembre; 25% el 29 de noviembre). Su sondeo privado de la veda registró 61% de expectativas."
  votos_kast_segunda_vuelta_2025:
    nombre: Porcentaje de José Antonio Kast en la segunda vuelta presidencial 2025
    unidad_default: "%"
    notas: "58,16% de los votos válidamente emitidos en el balotaje del 14 de diciembre de 2025, que consagró a Kast como presidente electo sobre Jeannette Jara (41,84%). Resultado documentado en el evento 20251214-1 con cobertura de Cooperativa y Emol."
  votos_jara_segunda_vuelta_2025:
    nombre: Porcentaje de Jeannette Jara en la segunda vuelta presidencial 2025
    unidad_default: "%"
    notas: "41,84% de los votos válidamente emitidos en el balotaje del 14 de diciembre de 2025. Resultado documentado en el evento 20251214-1 con cobertura de Cooperativa y Emol."
  tarifa_metro_punta_2019:
    nombre: Tarifa del Metro de Santiago en horario punta (octubre 2019)
    unidad_default: pesos
    notas: "$830 en horario punta desde el 6 de octubre de 2019, $30 más que los $800 anteriores, tras el reajuste anunciado por el Panel de Expertos el 4 de octubre. El alza detonó las evasiones masivas que desencadenaron el estallido social del 18 de octubre."
  estaciones_metro_afectadas_18o:
    nombre: Estaciones del Metro afectadas tras el 18-O
    unidad_default: estaciones
    notas: "77 estaciones del Metro de Santiago afectadas por los disturbios de la jornada del 18-19 de octubre de 2019, según informó Metro tras el primer día del estallido social."
  detenidos_19_oct_2019:
    nombre: Detenidos tras el primer día del estallido social
    unidad_default: personas
    notas: "Más de 300 detenidos reportados el 19 de octubre de 2019, tras decretarse el estado de emergencia en Santiago, Chacabuco, Puente Alto y San Bernardo."
  votos_cuestion_previa_pinera:
    nombre: Votos a favor de la cuestión previa contra la acusación constitucional a Piñera
    unidad_default: votos
    notas: "79 votos a favor y 73 en contra en la votación del 12 de diciembre de 2019 en la Cámara de Diputados, que acogió la 'cuestión previa' y dejó como no interpuesta la acusación constitucional contra Sebastián Piñera. La oposición necesitaba 78 votos para que prosperara."
  heridas_oculares_indh_2019:
    nombre: Personas con heridas oculares durante el estallido (Informe INDH 2019)
    unidad_default: personas
    notas: "347 personas con heridas oculares al 30 de noviembre de 2019 según el Informe Anual del INDH (estallidos de globo ocular, pérdida de visión por trauma ocular irreversible y traumas oculares); el INDH había presentado 29 querellas por ese tipo de afectaciones."
  querellas_tortura_indh_2019:
    nombre: Querellas del INDH por torturas y tratos crueles (estallido 2019)
    unidad_default: querellas
    notas: "476 querellas por torturas y tratos crueles, inhumanos y degradantes presentadas por el INDH entre el 19 de octubre y el 30 de noviembre de 2019, en favor de 568 víctimas: 433 contra funcionarios de Carabineros, 33 con participación de miembros de las Fuerzas Armadas y 10 de la PDI. En los nueve años previos del INDH (2010-primer semestre 2019) las querellas contra Carabineros por tortura habían sido 174."
  querellas_tortura_violencia_sexual_indh:
    nombre: Querellas del INDH por torturas con violencia sexual (estallido 2019)
    unidad_default: querellas
    notas: "96 querellas por torturas o tratos crueles con violencia sexual presentadas por el INDH durante el estallido social de 2019, con 135 víctimas: 71 mujeres (53%) y 64 hombres."
  muertos_estallido_dic_2019:
    nombre: Fallecidos durante el estallido social (a diciembre de 2019)
    unidad_default: personas
    notas: "Al menos 24 fallecidos a mediados de diciembre de 2019 según BBC Mundo, de los cuales 5 atribuidos a agentes del Estado. El gobierno reportaba 23 muertos el 23 de noviembre de 2019 y 19 el 23 de octubre; la cifra oficial continuó ajustándose durante 2020."
  fallecidos_estallido_fiscalia_2025:
    nombre: Fallecidos durante el estallido social (Informe de la Fiscalía, 2025)
    unidad_default: personas
    notas: "30 personas fallecidas entre el 18 de octubre de 2019 y el 31 de marzo de 2020 según el Informe Estadístico del Estallido Social de la Fiscalía (octubre 2025). 93% de las víctimas fatales eran hombres; las principales causas fueron incendios, desórdenes públicos y violencia institucional de agentes del Estado."
  trauma_ocular_fiscalia_2025:
    nombre: Víctimas de trauma ocular en el estallido (Informe de la Fiscalía 2025)
    unidad_default: personas
    notas: "464 víctimas de trauma ocular según el Informe Estadístico del Estallido Social de la Fiscalía (octubre 2025). El 84% sufrió lesiones por proyectiles y 230 personas tuvieron algún grado de pérdida visual, de las cuales dos casos de ceguera total bilateral."
  delitos_estallido_fiscalia_2025:
    nombre: Delitos registrados durante el estallido (Informe Fiscalía 2025)
    unidad_default: delitos
    notas: "35.146 delitos registrados entre el 18 de octubre de 2019 y el 31 de marzo de 2020 según el Informe Estadístico del Estallido Social de la Fiscalía (octubre 2025), con 21.766 imputados conocidos y 20.727 víctimas. El delito más frecuente fue la violencia institucional de agentes del Estado (34,1%), seguido de saqueos y delitos contra la propiedad (31,7%) y desórdenes públicos (22,7%)."
  causas_violencia_institucional_fiscalia_2025:
    nombre: Causas por violencia institucional en el estallido (Fiscalía 2025)
    unidad_default: causas
    notas: "11.506 causas por violencia institucional cometida por agentes del Estado registradas entre el 18 de octubre de 2019 y el 31 de marzo de 2020 según el Informe de la Fiscalía (octubre 2025). De las más de 12 mil denuncias por violencia institucional, solo 219 terminaron con sentencia condenatoria."
  edad_primer_caso_covid_chile:
    nombre: Edad del primer caso de COVID-19 en Chile
    unidad_default: años
    notas: "El primer caso confirmado de COVID-19 en Chile (3 de marzo de 2020) fue un médico de 33 años, oriundo de San Javier, Región del Maule, que había viajado un mes por el Sudeste Asiático (Singapur, Malasia, Indonesia, Maldivas y España) y regresó el 25 de febrero en vuelo desde Madrid."
  casos_covid_18_mar_2020:
    nombre: Casos acumulados de COVID-19 al decretarse el estado de catástrofe
    unidad_default: casos
    notas: "238 contagios acumulados de COVID-19 en Chile al 18 de marzo de 2020 (37 nuevos ese día), según el Gobierno de Chile, al decretarse el Estado de Excepción Constitucional de Catástrofe."
  retiro_10_afp_2020:
    nombre: Retiro del 10% de los fondos de pensiones (2020)
    unidad_default: porciento
    notas: "10% de los fondos acumulados en las cuentas de capitalización individual que la reforma constitucional de la Ley 21.248 (2020) permitió retirar por única vez, con un tope máximo de 150 UF y un mínimo de 35 UF."
  tope_retiro_afp_2020:
    nombre: Tope máximo del retiro del 10% de los fondos de pensiones
    unidad_default: uf
    notas: "150 UF (aproximadamente $4.300.000 al día de publicación de la Ley 21.248, 30 de julio de 2020) como tope máximo del retiro excepcional del 10% de los fondos de pensiones."
  minimo_retiro_afp_2020:
    nombre: Monto mínimo del retiro del 10% de los fondos de pensiones
    unidad_default: uf
    notas: "35 UF (aproximadamente $1.000.000 al día de publicación de la Ley 21.248) como monto mínimo del retiro excepcional; quien tuviera menos de 35 UF en su cuenta podía retirar la totalidad."
  votos_camara_retiro_10_2020:
    nombre: Votos a favor del retiro del 10% en la Cámara de Diputados
    unidad_default: votos
    notas: "116 votos a favor, 28 en contra y 5 abstenciones en el tercer trámite de la Cámara de Diputados el 23 de julio de 2020, que aprobó de manera definitiva la reforma del retiro del 10%."
  votos_senado_retiro_10_2020:
