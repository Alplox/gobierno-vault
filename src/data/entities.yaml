    notas: "Organismo de promoción de exportaciones del Ministerio de Relaciones Exteriores; coorganizó la recepción 'Noche del Salmón Chileno' a bordo del buque escuela Esmeralda en Nueva York."
  subsecretaria_seguridad:
    nombre: Subsecretaría de Seguridad Pública
    tipo: institucion
    pais: Chile
    notas: "Reportó en agosto 2026 las cifras de ingresos irregulares detectados (1.144 hasta el 26-jul-2026 vs 8.471 en 2025) y expulsiones (1.286) usadas por el gobierno de Kast."
  servicio_nacional_migraciones:
    nombre: Servicio Nacional de Migraciones
    tipo: institucion
    pais: Chile
    notas: "Organismo rector en materia migratoria; su exdirector Luis Thayer cuestionó en agosto 2026 los cambios metodológicos en las cifras de ingresos irregulares del gobierno."
  subsecretaria_salud_publica:
    nombre: Subsecretaría de Salud Pública
    tipo: institucion
    pais: Chile
    notas: "Recibió los antecedentes de las denuncias por Ley Karin contra la seremi de Salud de Los Lagos para ser informados al nivel central del Ministerio de Salud."
  embajada_chile_eeuu:
    nombre: Embajada de Chile en Estados Unidos
    tipo: institucion
    pais: Chile
    notas: "Encabezada por el embajador Andrés Ergas durante la negociación del arancel del 12,5%; envió carta a la USTR el 6-jul-2026 pidiendo trato diferenciado para el salmón chileno."
  consejo_salmon:
    nombre: Consejo del Salmón
    tipo: gremio
    pais: Chile
    notas: "Coorganizó con ProChile la recepción 'Noche del Salmón Chileno' a bordo del buque escuela Esmeralda en Nueva York durante la campaña contra el arancel del 12,5%."
  servicio_nacional_aduanas:
    nombre: Servicio Nacional de Aduanas
    tipo: institucion
    pais: Chile
    notas: "Organismo público convocado a participar del Grupo de Trabajo de Exportación de Servicios Financieros anunciado por Hacienda en agosto 2026."
  camara_chileno_norteamericana:
    nombre: Cámara Chileno-Norteamericana de Comercio
    tipo: gremio
    pais: Chile
    notas: "Organizó el cóctel por los 250 años de la independencia de EE.UU. donde el representante de Trump en Santiago, Brandon Judd, criticó a los ministros chilenos que cuestionaron el arancel del 12,5%."
  elhilo:
    nombre: El Hilo
    tipo: medio_comunicacion
    pais: Chile
    notas: "Medio de investigación chileno (elhilo.cl); difundió el 9-ago-2026 la tabla de transparencia de honorarios del comisionado de la Macrozona Norte Alberto Soto Valenzuela."
  presidencia:
    nombre: Presidencia de la República de Chile
    tipo: institucion
    pais: Chile
    notas: "Casa de Gobierno (La Moneda); los asesores del Segundo Piso del presidente Kast, entre ellos el comisionado de la Macrozona Norte, son contratados a honorarios con cargo a la administración central."
  corte_apelaciones_valparaiso:
    nombre: Corte de Apelaciones de Valparaíso
    tipo: tribunal
  consejo_defensa_estado:
    nombre: Consejo de Defensa del Estado
    tipo: institucion
    pais: Chile
    notas: "Organismo encargado de la defensa judicial de los intereses del Estado."
  chiledeportes:
    nombre: Chiledeportes
    tipo: servicio_publico
    pais: Chile
  efe_chile:
    nombre: Empresa de Ferrocarriles del Estado (EFE)
    tipo: empresa_estatal
    pais: Chile
  ejercito:
    nombre: Ejército de Chile
    tipo: fuerza_armada
    pais: Chile
  gore_coquimbo:
    nombre: Gobierno Regional de Coquimbo
    tipo: gobierno_regional
    pais: Chile
  municipalidad_nunoa:
    nombre: Municipalidad de Ñuñoa
    tipo: municipalidad
    pais: Chile
  municipalidad_recoleta:
    nombre: Municipalidad de Recoleta
    tipo: municipalidad
    pais: Chile
  municipalidad_san_joaquin:
    nombre: Municipalidad de San Joaquín
    tipo: municipalidad
    pais: Chile
  riggs_bank:
    nombre: Riggs Bank
    tipo: empresa
    pais: Chile
  universidad_san_sebastian:
    nombre: Universidad San Sebastián
    tipo: universidad
    pais: Chile
  itelecom:
    nombre: Itelecom
    tipo: empresa
    pais: Chile
    notas: "Holding de iluminación led adjudicatario de más de 36 licitaciones municipales en todo el país; protagonista del Caso Luminarias."
  corporacion_cultural_recoleta:
    nombre: Corporación Cultural de Recoleta
    tipo: organizacion_cultural
    pais: Chile
    notas: "Corporación municipal de Recoleta que organiza el festival Womad; recibió una donación de $50 millones de Itelecom en 2020 bajo investigación por el Caso Luminarias."
  municipalidad_antofagasta:
    nombre: Municipalidad de Antofagasta
    tipo: municipalidad
    pais: Chile
  municipalidad_rancagua:
    nombre: Municipalidad de Rancagua
    tipo: municipalidad
    pais: Chile
  municipalidad_puerto_montt:
    nombre: Municipalidad de Puerto Montt
    tipo: municipalidad
    pais: Chile
  municipalidad_arica:
    nombre: Municipalidad de Arica
    tipo: municipalidad
    pais: Chile
  larrainvial:
    nombre: LarrainVial
    tipo: empresa
    pais: Chile
    notas: "Corredora de bolsa chilena. Ocho ejecutivos formalizados en enero de 2025 por su rol en el fondo Capital Estructurado I (caso Factop)."
  grupo_patio:
    nombre: Grupo Patio
    tipo: empresa
    pais: Chile
    notas: "Grupo inmobiliario de los hermanos Jalaff; sus ex socios fueron formalizados en el caso Factop."
  uni:
    nombre: Unión Nacional de Artistas
    tipo: asociacion_gremial
    pais: Chile
    notas: "Agrupación que reúne a alrededor de 20 asociaciones y gremios de artistas. En agosto de 2026 emitió un comunicado contra las bases de Fondos Cultura 2027 por la cláusula que excluye contenido pornográfico o excesivamente violento, sosteniendo que 'la libertad de creación y la libertad de expresión artística están en riesgo'."
  sidarte:
    nombre: Sindicato de Actores de Chile (Sidarte)
    tipo: asociacion_gremial
    pais: Chile
    notas: "Sindicato de Actores y Trabajadores Teatrales de Chile. Su vicepresidente Ernesto Orellana Gómez publicó en agosto de 2026 la columna 'Libertad de creación artística bajo amenaza' contra las nuevas bases de Fondos Cultura."
  shoa:
    nombre: Servicio Hidrográfico y Oceanográfico de la Armada
    tipo: institucion_estatal
    pais: Chile
    notas: "Servicio de la Armada de Chile encargado de la navegación y la oceanografía, incluyendo el sistema nacional de alerta de tsunamis. El 10 de agosto de 2026 descartó que el terremoto de magnitud 7,4 en Colombia reuniera condiciones para generar un tsunami en las costas de Chile."
  expansion:
    nombre: Expansión
    tipo: medio_comunicacion
    pais: España
    notas: "Diario económico español. El 10 de agosto de 2026 publicó el artículo 'Chile cancela dos concesiones a Azvi y pone en alerta a Sacyr y OHLA', sobre la reacción de la industria española de infraestructuras al fin de la concesión de los corredores del Gran Concepción."
  carozzi:
    nombre: Carozzi
    tipo: empresa
    pais: Chile
    notas: "Empresa de alimentos chilena. The Clinic la mencionó (10-ago-2026) como parte de la red empresarial del exsubsecretario Juan Pablo Rodríguez: su dueño Gonzalo Bofill preside la Fundación Piensa, a la que pertenecía el exfuncionario."
  anfp:
    nombre: Asociación Nacional de Fútbol Profesional (ANFP)
    tipo: asociacion_gremial
    pais: Chile
    notas: "Organismo rector del fútbol profesional chileno. En 2009 fue denunciada por no pagar una deuda de $220 millones al Instituto Nacional del Deporte por las clasificatorias a Sudáfrica 2010, según la denuncia del senador Nelson Ávila."
  unidad_analisis_financiero:
    nombre: Unidad de Análisis Financiero (UAF)
    tipo: institucion_estatal
    pais: Chile
    notas: "Organismo público encargado de prevenir el lavado de activos y el financiamiento del terrorismo. En 2017 emitió alerta de movimientos sospechosos sobre el alcalde de San Ramón Miguel Ángel Aguilera e instruyó a las instituciones financieras informar de sus movimientos."
  cema_chile:
    nombre: Fundación CEMA Chile
    tipo: fundacion
    pais: Chile
    notas: "Fundación presidida por Lucía Hiriart de Pinochet. Tras la dictadura vendió propiedades obtenidas gratis del Estado; el CDE pidió en 2016 reabrir el caso Riggs para investigar su patrimonio (CIPER contabilizó más de 243 propiedades y $6.300 millones)."

cifras:
  aprobacion_kast_criteria_ago9:
    nombre: Aprobación de José Antonio Kast según Criteria (9-ago-2026)
    unidad_default: porcentaje
    notas: "35% aprueba y 52% desaprueba (-3 puntos vs medición anterior). El 53% que se mostraba 'esperanzado' en marzo bajó al 36%."
  desaprobacion_kast_criteria_ago9:
    nombre: Desaprobación de José Antonio Kast según Criteria (9-ago-2026)
    unidad_default: porcentaje
    notas: "52%, tres puntos menos que el sondeo anterior (55% el 2-ago)."
  retrocesos_pais_criteria_ago9:
    nombre: Encuestados que creen que el país ha retrocedido bajo Kast (Criteria, 9-ago-2026)
    unidad_default: porcentaje
    notas: "47% siente que ha habido retrocesos en diversas áreas bajo el mandato de Kast."
  megareforma_negativa_criteria_ago9:
    nombre: Percepción negativa de la Ley de Reconstrucción y Desarrollo Económico y Social (Criteria, 9-ago-2026)
    unidad_default: porcentaje
    notas: "37% cree que la megareforma será más bien negativa (33% positiva, 30% sin claridad); 48% dice que favorecerá solo a grandes empresas y personas de altos ingresos."
  toneladas_infladas_codelco_2025:
    nombre: Toneladas incorporadas irregularmente a la producción 2025 de Codelco
    unidad_default: toneladas
    notas: "27 mil toneladas en la 'operación rastrillo': 20 mil de óxido de Chuquicamata + casi 7 mil 'Polvos de Montecristo' (invendibles, con arsénico y sin permisos ambientales; pérdidas de US$7-50 millones)."
  bonos_improcedentes_codelco:
    nombre: Bonos improcedentes pagados por Codelco tras la sobreproducción 2025
    unidad_default: millones_pesos
    notas: "Más de 13 mil millones de pesos (US$14,3 millones) a 6.322 trabajadores y ejecutivos; promedio de $2 millones por funcionario. La empresa busca recuperarlos."
  trabajadores_bonos_codelco:
    nombre: Trabajadores y ejecutivos de Codelco que recibieron bonos improcedentes
    unidad_default: personas
    notas: "6.322, por un estimado de US$14,3 millones."
  ingresos_irregulares_subsecretaria_2026:
    nombre: Ingresos irregulares detectados hasta el 26-jul-2026 (Subsecretaría de Seguridad Pública)
    unidad_default: personas
    notas: "1.144, frente a 8.471 en igual período de 2025 (-86%). Colchane pasó de 8.015 a 866. Cifra del Ejecutivo, distinta de la del informe PDI (1.175) y cuestionada por exautoridades de Migraciones por cambio metodológico."
  expulsiones_2026_subsecretaria:
    nombre: Expulsiones judiciales y administrativas materializadas en 2026 (hasta 26-jul)
    unidad_default: personas
    notas: "1.286, superando las 709 del mismo período de 2025. Entre enero y junio, 7.089 extranjeros solicitaron voluntariamente salir del país (vs 1.758 en 2025)."
  detenidos_operativo_nuble:
    nombre: Detenidos en el operativo conjunto PDI-Carabineros de Ñuble (8-ago-2026)
    unidad_default: personas
    notas: "31 detenidos; 46 migrantes fiscalizados (17 en situación irregular); 4 detenidos por rotura de sellos en un local de juegos clausurado; se recuperó un vehículo robado."
  exportacion_servicios_financieros:
    nombre: Exportaciones anuales de servicios financieros de Chile
    unidad_default: millones_dolares
    notas: "Más de US$3.000 millones y entre 30 y 40 mil empleos; el gobierno de Kast busca que el sector sea el segundo exportador tras el cobre, con hasta 50 mil empleos adicionales."
  participacion_salmon_chileno_eeuu:
    nombre: Participación de Chile en el salmón atlántico del mercado estadounidense
    unidad_default: porcentaje
    notas: "47,3% según SalmonChile; el 96,7% de ese producto es importado. Argumento usado ante la USTR para evitar el arancel del 12,5%, sin éxito."
  plan_calles_sin_violencia_decomisos:
    nombre: Armas decomisadas por el Plan Calles Sin Violencia (a junio de 2023)
    unidad_default: armas
    notas: "Más de 1.700, según la Cuenta Pública 2023; junto a 1.359 detenidos (40% prófugos de la justicia), más de 3.800 infracciones y cerca de 69 mil controles preventivos."
  plan_calles_sin_violencia_detenidos:
    nombre: Detenidos por el Plan Calles Sin Violencia (a junio de 2023)
    unidad_default: personas
    notas: "1.359, de los cuales un 40% eran prófugos de la justicia (Cuenta Pública 2023)."
  plazas_penitenciarias_2026:
    nombre: Nuevas plazas penitenciarias comprometidas al 2026
    unidad_default: plazas
    notas: "4.796 (un 12% de la capacidad actual), más el Centro Penitenciario El Arenal de Atacama (1.710 plazas) y 2.930 plazas en Antofagasta, Alto Hospicio, La Serena y Rancagua al 2028 (Cuenta Pública 2023)."
  sueldo_minimo_alza_real_2023:
    nombre: Alza real del salario mínimo 2023-2024
    unidad_default: "%"
    notas: "20% real, al pasar de $350 mil a $500 mil entre mayo de 2023 y julio de 2024 (Cuenta Pública 2023)."
  beneficiarios_alza_salario_minimo:
    nombre: Personas beneficiadas por el alza del salario mínimo
    unidad_default: personas
    notas: "946 mil personas y sus familias (Cuenta Pública 2023); el subsidio a las mipymes pasaría de 131 mil a 180 mil empresas."
  deudores_pensiones_alimentos_registro:
    nombre: Deudores inscritos en el Registro Nacional de Deudores de Pensiones de Alimentos
    unidad_default: deudores
    notas: "80.074 a junio de 2023 (2.374 mujeres, 2,96%; 77.700 hombres, 97,04%), con una deuda total superior a los $90 mil millones (Cuenta Pública 2023)."
  reduccion_inmigracion_irregular_2023:
    nombre: Disminución de la entrada irregular de migrantes (cinco meses de 2023 vs 2022)
    unidad_default: "%"
    notas: "56%, según Boric en la Cuenta Pública 2023, atribuida al despliegue de las FF.AA. en la frontera norte."
  bono_invierno_2023:
    nombre: Bono Invierno 2023
    unidad_default: pesos
    notas: "$120 mil para 7 millones de personas (Cuenta Pública 2023, dentro del Plan Chile Apoya)."
  duracion_cuenta_publica_2023:
    nombre: Duración de la Cuenta Pública 2023
    unidad_default: horas
    notas: "3 horas y 36 minutos (77 páginas), la más larga desde el retorno a la democracia, superando el récord de Patricio Aylwin de 1993 (190 minutos)."
  sueldo_minimo_2026_539mil:
    nombre: Sueldo mínimo propuesto para enero de 2026
    unidad_default: pesos
    notas: "$539 mil, desde los $350 mil del inicio del gobierno; 'la mayor alza de las últimas décadas' y posicionaría a Chile como el salario mínimo más alto de Sudamérica (Cuenta Pública 2025 de Boric). Sujeto a aprobación del Congreso."
  pgu_250mil_2025:
    nombre: PGU aumentada a partir de septiembre de 2025
    unidad_default: pesos
    notas: "$250 mil mensuales, comenzando con las personas mayores de 82 años (Cuenta Pública 2025)."
  personas_pensiones_reforma_2025:
    nombre: Personas mayores beneficiadas por la reforma de pensiones
    unidad_default: millones_personas
    notas: "2,8 millones verán aumentada su pensión entre un 14% y un 35% (Cuenta Pública 2025, tras la reforma aprobada en enero de 2025)."
  ingresos_irregulares_reduccion:
    nombre: Disminución de ingresos irregulares al país desde 2021
    unidad_default: "%"
    notas: "48% menos, tras la reforma constitucional que habilitó el despliegue de las FF.AA. en la frontera norte (Cuenta Pública 2025)."
  armas_destruidas_tres_anios:
    nombre: Armas destruidas en tres años
    unidad_default: armas
    notas: "Más de 67 mil, el 30% de todas las destruidas desde 1990 (Cuenta Pública 2025)."
  funcionarios_licencias_fraudulentas:
    nombre: Funcionarios públicos que usaron licencias médicas para viajar al extranjero
    unidad_default: funcionarios
    notas: "Más de 25 mil, entre 2023 y 2024, según el Caso Licencias Médicas referido por Boric en la Cuenta Pública 2025; dio origen a la Ley 21.746."
  plazas_penitenciarias_plan_maestro:
    nombre: Nuevas plazas penitenciarias del Plan Maestro de Infraestructura Penitenciaria
    unidad_default: plazas
    notas: "Más de 15 mil en cinco años, para enfrentar el aumento de la población penal y el hacinamiento (anuncio CP 2025)."
  medidas_programa_boric_cumplidas:
    nombre: Medidas del programa de Boric cumplidas a cabalidad
    unidad_default: medidas
    notas: "12 de las 53 medidas concretas del programa de primera vuelta (22,64%), según el análisis de The Clinic del 1-jun-2025, día de la última Cuenta Pública."
  buses_electricos_santiago:
    nombre: Buses eléctricos en operación en Santiago
    unidad_default: buses
    notas: "Más de 2.500 en 2025, con meta de 4.400 (dos de cada tres buses eléctricos) al cierre del gobierno (Cuenta Pública 2025)."
  propuestas_cuenta_publica_2024:
    nombre: Propuestas anunciadas por Boric en la Cuenta Pública 2024
    unidad_default: propuestas
    notas: "Recuento de The Clinic tras dos horas y media de discurso (1-jun-2024)."
  presupuesto_seguridad_2024:
    nombre: Presupuesto de seguridad 2024
    unidad_default: billones_pesos
    notas: "4,2 billones de pesos en 2024, tras 4 billones en 2023: 'el mayor incremento de presupuesto de seguridad de los últimos ocho años' (Cuenta Pública 2024 de Boric)."
  reduccion_homicidios_2023:
    nombre: Reducción de homicidios 2023 vs 2022
    unidad_default: "%"
    notas: "6% menos, quebrando la tendencia al alza de 8 años (Cuenta Pública 2024 de Boric)."
  salario_minimo_500mil:
    nombre: Salario mínimo desde el 1 de julio de 2024
    unidad_default: pesos
    notas: "$500.000 mensuales, promesa de campaña de Boric cumplida en 2024."
  centros_comunitarios_cuidados:
    nombre: Centros Comunitarios de Cuidados comprometidos
    unidad_default: centros
    notas: "Un centenar antes del término del mandato, partiendo por Arica y Puerto Saavedra (Cuenta Pública 2024)."
  adoptados_irregulares_estimados:
    nombre: Personas estimadas afectadas por adopciones forzadas o irregulares antes de 1990
    unidad_default: personas
    notas: "Más de 20 mil, según Boric en la Cuenta Pública 2024 al anunciar una mesa interinstitucional."
  muertos_gaza_jun2024:
    nombre: Muertos en la Franja de Gaza citados por Boric en junio de 2024
    unidad_default: personas
    notas: "Más de 35 mil, cifra citada por Boric en la Cuenta Pública 2024 (cifra del Ministerio de Sanidad gazatí de ese momento; ver también muertos_gaza_2023_2026)."
  transferencia_royalty_2024:
    nombre: Primera transferencia del Royalty minero a municipios
    unidad_default: millones_pesos
    notas: "$93 mil millones a 307 municipios, 'la mayor inyección de recursos frescos a los municipios de los últimos 10 años' (Cuenta Pública 2024)."
  personas_fuera_sistema_financiero_tmc:
    nombre: Personas fuera del sistema financiero por la TMC
    unidad_default: personas
    notas: "Entre 250 mil y 300 mil personas habrían quedado fuera del sistema financiero por la reforma de la Tasa Máxima Convencional de 2013, según el ministro de Hacienda Jorge Quiroz (agosto 2026)."
  muertos_gaza_2023_2026:
    nombre: Muertos en la Franja de Gaza desde el 7 de octubre de 2023
    unidad_default: personas
    notas: "Según el Ministerio de Sanidad de Gaza: más de 73.340 muertos desde el inicio de la ofensiva israelí (7 de octubre de 2023); más de 1.200 muertos desde el último alto el fuego pactado en octubre de 2025. Cifras cuestionadas por el embajador de Israel en Chile, Peleg Lewi (agosto 2026)."
  quorum_reforma_constitucional:
    nombre: Quórum para reformas constitucionales en Chile
    unidad_default: por_ciento
    notas: "El quórum para modificar la Constitución en Chile es de 4/7 de los parlamentarios en ejercicio (57,1%), tras la moción impulsada por los senadores Matías Walker, Pedro Araya, Iván Flores y la exsenadora Ximena Rincón que rebajó el quórum desde los 2/3 anteriores. Es el más bajo de las últimas décadas."
  rechazo_propuesta_constitucional_2023:
    nombre: Rechazo a la propuesta constitucional de 2023
    unidad_default: por ciento
    notas: "La propuesta constitucional redactada por el Consejo Constitucional (con el Partido Republicano como bancada más numerosa) fue rechazada por el 55,76% de los votos válidamente emitidos en el plebiscito del 17 de diciembre de 2023, frente a un 44,24% a favor, según los resultados oficiales del Servel."
  viviendas_fallas_bulnes_villa_santa_fe:
    nombre: Inmuebles con fallas estructurales en Villa Santa Fe de Bulnes
    unidad_default: inmuebles
    notas: "70 inmuebles del comité de la Villa Santa Fe de Bulnes (región de Ñuble) presentaban fallas estructurales tras el sistema frontal, según la denuncia del alcalde Gonzalo Bustamante ante la Comisión de Vivienda de la Cámara (6 de agosto de 2026), recogida por CNN Chile."
  carabineros_operativo_plaza_armas:
    nombre: Funcionarios de Carabineros en el operativo de Plaza de Armas
    unidad_default: efectivos
    notas: "60 funcionarios de Carabineros desplegados en el operativo de copamiento liderado por el presidente José Antonio Kast en la Plaza de Armas de Santiago el 6 de agosto de 2026, según La Tercera."
  pdi_operativo_plaza_armas:
    nombre: Efectivos de la PDI en el operativo de Plaza de Armas
    unidad_default: efectivos
    notas: "55 efectivos de la Policía de Investigaciones (PDI) desplegados junto a 60 carabineros en el operativo de la Plaza de Armas de Santiago del 6 de agosto de 2026, con apoyo de Seguridad Municipal, según La Tercera."
  medicamentos_coludidos_farmacias:
    nombre: Medicamentos coludidos por las farmacias
    unidad_default: medicamentos
    notas: "Al menos 206 medicamentos (anticonceptivos, antibióticos y fármacos para enfermedades crónicas como diabetes o Parkinson) cuyos precios las cadenas Cruz Verde, Ahumada y Salcobrand subieron concertadamente entre diciembre de 2007 y marzo de 2008, según la Sentencia 119/2012 del TDLC."
  multa_farmacias_uta:
    nombre: Multa máxima aplicada a Cruz Verde y Salcobrand
    unidad_default: uta
    notas: "20.000 UTA (≈US$ 19 millones) para cada una de las cadenas Cruz Verde y Salcobrand, la multa máxima del D.L. 211 vigente a la fecha de los hechos, impuesta por el TDLC (Sentencia 119/2012) y confirmada por la Corte Suprema el 7 de septiembre de 2012."
  alzas_simultaneas_farmacias:
    nombre: Alzas simultáneas de precios detectadas por el TDLC
    unidad_default: alzas
    notas: "286 alzas simultáneas de medicamentos entre las cadenas acusadas en la colusión de las farmacias, de las cuales 249 siguieron el patrón '1-2-3' descrito por el TDLC (una cadena sube un día, la segunda otro y la tercera un tercero)."
  mails_salcobrand_revisados_quiroz:
    nombre: Correos de Salcobrand revisados por Quiroz y Asociados
    unidad_default: correos
    notas: "19.768 correos de Salcobrand del período de la posible colusión revisados por la consultora de Jorge Quiroz para su informe de julio de 2009, en el que concluyó que 'no se puede concluir existencia de acuerdo de precios'. Quiroz declaró que además pesquisó otros 25.000 correos anteriores (20.000 enviados por la farmacia)."
  anios_colusion_pollos:
    nombre: Años de duración de la colusión de los pollos
    unidad_default: años
    notas: "Unos 16 años de colusión avícola entre 1994/1995 y 2010: el TDLC (Sentencia 139/2014) acreditó que Agrosuper, Ariztía y Don Pollo se repartieron la oferta de pollo en cuotas mediante el intercambio permanente de información en el seno de la APA."
  multa_pollos_cs_total:
    nombre: Multas totales ratificadas por la Corte Suprema en el caso pollos
    unidad_default: millones_usd
    notas: "Cerca de US$ 60 millones en multas totales confirmadas por la Corte Suprema el 29 de octubre de 2015 contra Agrosuper, Ariztía y Don Pollo por la colusión de los pollos, más la disolución de la APA y el pago adicional de 2.000 UTA por la asociación (Emol)."
  multa_apa_cs:
    nombre: Multa adicional a la APA por la Corte Suprema
    unidad_default: uta
    notas: "2.000 UTA (cerca de $1.000 millones) que la Corte Suprema ordenó pagar a la Asociación de Productores Avícolas (APA) al confirmar la sentencia 139/2014 del TDLC por la colusión de los pollos, además de ratificar su disolución."
  retencion_khamis_israel:
    nombre: Horas de retención del chileno José Nicolás Khamis en Israel
    unidad_default: horas
    notas: "José Nicolás Khamis Thomas fue retenido cerca de 35 horas (36 según BioBioChile) en el aeropuerto Ben-Gurión de Tel Aviv, en condiciones precarias, antes de ser expulsado de Israel el 27 de julio de 2026."
  contagios_covid_chile_mayo_2020:
    nombre: Casos acumulados de COVID-19 en Chile a fines de mayo de 2020
    unidad_default: personas
    notas: "Chile superaba los 50.000 contagios acumulados de covid-19 a fines de mayo de 2020 (3.520 nuevos casos el 22 de mayo, el mayor aumento diario hasta entonces) y más de 630 fallecidos, según Daily Mail. El 90% de las camas de cuidados intensivos de Santiago estaba ocupado."
  imagenes_pornografia_infantil_huechuraba:
    nombre: Imágenes de pornografía infantil halladas al exinformático de Huechuraba
    unidad_default: imagenes
    notas: "Más de 100 fotografías (113 según el vocero de la Fiscalía Centro Norte, Emanuel Ibaceta) de material pornográfico infantil almacenadas en el computador laboral del exinformático de la Municipalidad de Huechuraba, detectadas por la Brigada de Cibercrimen de la PDI en agosto de 2026."
  recorte_ine_2026:
    nombre: Recorte presupuestario al INE en 2026
    unidad_default: millones_pesos
    notas: "Recorte de 652 millones de pesos sufrido por el Instituto Nacional de Estadísticas (INE) en 2026, expuesto por los gremios de trabajadores y DDHH ante la ANEF y la CIDH como ejemplo de los recortes presupuestarios del gobierno de Kast."
  denuncias_ley_karin_dic2025:
    nombre: Denuncias Ley Karin a diciembre de 2025
    unidad_default: denuncias
    notas: "Más de 66 mil denuncias (66.596 según el Diario Financiero) asociadas a la Ley Karin a diciembre de 2025, sostenidas en torno a 22 mil por semestre (cerca de cien diarias). Cifra citada por los impulsores del proyecto de suspensión por cinco años de la ley."
  denuncias_ley_karin_2024_2025:
    nombre: Denuncias Ley Karin entre agosto 2024 y junio 2025
    unidad_default: denuncias
    notas: "44.212 denuncias ingresadas entre el 1 de agosto de 2024 y el 30 de junio de 2025 según la Dirección del Trabajo y la Superintendencia de Seguridad Social: 42% preclasificado como materia propia de la ley (18.367), 40% otras materias (17.980) y 18% pendiente de clasificación (7.865)."
  perdida_fiscal_megarreforma_grau:
    nombre: Pérdida fiscal anual estimada por la megarreforma según Grau
    unidad_default: millones_usd
    notas: "Estimación del exministro de Hacienda Nicolás Grau: la megarreforma de Kast implicaría perder del orden de US$2.000 millones por año en ingresos fiscales (entrevista con T13, agosto 2026)."
  casa_aguilera_la_reina:
    nombre: Valor de la casa del exalcalde Aguilera en La Reina
    unidad_default: millones_pesos
    notas: "Propiedad comprada por el exalcalde de San Ramón Miguel Ángel Aguilera por cerca de $350 millones (~350 millones de pesos). CIPER la reveló en 2018; en agosto de 2026 el Sexto Tribunal Oral en lo Penal de Santiago confirmó que pasa al fisco por haber sido financiada con fondos ilícitos."
  multa_aguilera_aumento_patrimonial:
    nombre: Multa por aumento patrimonial injustificado de Aguilera
    unidad_default: pesos
    notas: "Multa de $246.918.500 impuesta al exalcalde de San Ramón Miguel Ángel Aguilera por aumento patrimonial injustificado, equivalente al incremento patrimonial indebido (sentencia 2025)."
  demanda_aguilera_ciper:
    nombre: Demanda de Aguilera contra CIPER por daño moral
    unidad_default: millones_pesos
    notas: "Demanda civil del exalcalde Miguel Ángel Aguilera contra CIPER por $1.700 millones por daño moral (2021), patrocinada por los abogados Eduardo Lagos y Mario Vargas. No prosperó por abandono de procedimiento."
  perros_abandonados_santiago_2009:
    nombre: Perros abandonados en Santiago en 2009
    unidad_default: canes
    notas: "Más de 250 mil perros abandonados en la Región Metropolitana en 2009, de un total de casi 1.200.000 canes; de ellos, el 50% tiene dueño que no se hace responsable de su mascota. Cifra citada en la campaña de tenencia responsable impulsada por la Asociación Chilena de Municipalidades y la Intendencia Metropolitana (noviembre 2009)."
  canes_region_metropolitana_2009:
    nombre: Población canina estimada de la Región Metropolitana en 2009
    unidad_default: canes
    notas: "Casi 1.200.000 canes en la Región Metropolitana en 2009, de los cuales más de 250 mil se encontraban abandonados, según las estimaciones citadas en la campaña de tenencia responsable de mascotas (noviembre 2009)."
  multa_vif_ortiz_2010:
    nombre: Multa por violencia intrafamiliar impuesta a Álvaro Ortiz en 2010
    unidad_default: utm
    notas: "2 UTM de multa a beneficio de la Gobernación impuesta en enero de 2010 al concejal de Concepción y director regional del INJUV del Bío-Bío, Álvaro Ortiz, condenado por el Juzgado de Familia de Concepción (jueza Mireya Celis) por violencia intrafamiliar denunciada por su conviviente, además de un tratamiento de control de impulsos y agresividad."
  violaciones_ddhh_carabineros_2020:
    nombre: Denuncias de violaciones a los DDHH atribuidas a Carabineros desde octubre de 2019
    unidad_default: denuncias
    notas: "8.575 denuncias de presuntas violaciones a los derechos humanos perpetradas por Carabineros en la represión de las protestas desde octubre de 2019, reportadas por el Ministerio Público en octubre de 2020, con solo 16 agentes dados de baja. Cifra citada por The Guardian en la cobertura del caso Pío Nono."
  heridos_estallido_nov_2019:
    nombre: Heridos atendidos por servicios de emergencia durante el estallido social
    unidad_default: heridos
    notas: "11.564 personas heridas atendidas por los servicios de emergencia durante las manifestaciones entre el 18 de octubre y el 22 de noviembre de 2019, según datos del Ministerio de Salud reportados por Human Rights Watch, de las cuales más de 1.100 presentaban lesiones moderadas o graves."
  condenas_estallido_2026:
    nombre: Condenas por violaciones a los DDHH del estallido social
    unidad_default: condenas
    notas: "Solo 219 condenas de las más de 11.500 causas presentadas por violaciones a los derechos humanos durante el estallido social de 2019, según datos citados por The Guardian en febrero de 2026 en la cobertura de la absolución de Claudio Crespo en el caso Gatica."
  victimas_lesiones_oculares_estallido:
    nombre: Víctimas de lesiones oculares durante el estallido social
    unidad_default: personas
    notas: "464 chilenos fueron víctimas de lesiones oculares durante las protestas del estallido social de 2019, según la Fiscalía de Chile, citados por The Guardian en febrero de 2026 en la cobertura de la absolución de Claudio Crespo."
  limite_exposicion_gas_cs_2020:
    nombre: Límite de exposición al gas CS según el manual de Carabineros
    unidad_default: mg_m3
    notas: "0,4 mg/m3 de gas CS como límite de exposición según las normas internacionales NIOSH y OSHA, citado en el Manual de Operaciones para el Control del Orden Público de Carabineros (revelado por Ciper en noviembre de 2020)."
  concentracion_peligrosa_gas_cs_2020:
    nombre: Concentración de peligrosidad inmediata del gas CS
    unidad_default: mg_m3
    notas: "2 mg/m3 de gas CS como concentración de 'peligrosidad inmediata para la vida o salud' según el Manual de Operaciones para el Control del Orden Público de Carabineros (revelado por Ciper en noviembre de 2020)."
  descargas_gas_plaza_italia_10dic2019:
    nombre: Descargas de gas irritante en Plaza Italia el 10 de diciembre de 2019
    unidad_default: descargas
    notas: "403 descargas de gas irritante (34 granadas de mano y 369 cartuchos) lanzadas por Fuerzas Especiales en las inmediaciones de Plaza Italia el 10 de diciembre de 2019, Día Internacional de los Derechos Humanos, entre las 16:30 y las 21:45 según los reportes de Carabineros a la Justicia citados por Ciper: más de una descarga por minuto."
  cartuchos_gas_lacrimogeno_20dic2019:
    nombre: Cartuchos de gas lacrimógeno lanzados en Plaza de la Dignidad el 20 de diciembre de 2019
    unidad_default: cartuchos
    notas: "594 cartuchos de gas lacrimógeno CS lanzados por Carabineros en Plaza de la Dignidad el 20 de diciembre de 2019, según el conteo de Forensic Architecture difundido por Interferencia (la página oficial de la investigación señala 596). A las 19:12 ya se habían usado 186 cartuchos y entre las 20:30 y las 20:40 se identificaron al menos 82 en 10 minutos."
  concentracion_cs_plaza_dignidad:
    nombre: Concentración de gas CS en Plaza de la Dignidad el 20 de diciembre de 2019
    unidad_default: mg_m3
    notas: "54 mg/m3 de gas CS, 135 veces el límite de exposición de 0,4 mg/m3 establecido por Carabineros en su Manual de Operaciones para el Control del Orden Público, y 27 veces los 2 mg/m3 que la NIOSH/OSHA reconocen como IDLH. Medición de Forensic Architecture difundida por Interferencia."
  deuda_per_capita_salud_municipal_2026:
    nombre: Deuda del reajuste per cápita de salud municipal
    unidad_default: millones_pesos
    notas: "Más de $21.800 millones que el Estado adeuda a los municipios por el reajuste IPC del per cápita basal de salud, congelado por segundo año consecutivo. El gremio Confusam cifró la deuda en $21.800 millones y los medios la reportaron como 'más de $21 mil millones' (julio-agosto 2026)."
  recorte_atencion_primaria_salud_2026:
    nombre: Recorte previo a la atención primaria de salud
    unidad_default: millones_pesos
    notas: "Recorte del 0,5% al presupuesto de atención primaria de aproximadamente $18.000 millones, mencionado por la presidenta de Confusam, Gabriela Flores, al compararlo con la deuda per cápita pendiente (2026)."
  programas_atencion_primaria_en_riesgo:
    nombre: Programas de atención primaria en riesgo de eliminación
    unidad_default: programas
    notas: "Más de 40 programas de atención primaria en peligro de ser eliminados a partir de 2027 según Confusam, ante el desfinanciamiento progresivo de la salud municipal (julio 2026)."
  detenidos_protesta_confusam_jul_2026:
    nombre: Detenidos en protesta de Confusam del 8 de julio de 2026
    unidad_default: personas
    notas: "Al menos 8 personas detenidas tras los incidentes de la protesta de Confusam frente a La Moneda el 8 de julio de 2026, según BioBioChile y El Mostrador."
  cesantia_biobio_2026:
    nombre: Cesantía en la Región del Biobío
    unidad_default: "%"
    notas: "9,2% de desempleo regional según la columna de BioBioChile sobre los recortes del MOP en el Biobío (agosto 2026)."
  informalidad_biobio_2026:
    nombre: Informalidad laboral en la Región del Biobío
    unidad_default: "%"
    notas: "28,2% de informalidad laboral en el Biobío, según la columna de BioBioChile (agosto 2026)."
  fondo_far_biobio:
    nombre: Fondo de Apoyo Regional (FAR) del Biobío
    unidad_default: millones_usd
    notas: "US$650 millones en depósitos bancarios del FAR, fondo destinado a la conectividad vial urbana pública del Biobío (agosto 2026)."
  empleos_perdidos_biobio_3anos:
    nombre: Empleos perdidos en el Biobío en 3 años
    unidad_default: empleos
    notas: "Más de 35.000 empleos perdidos en los últimos 3 años en sectores como industria forestal y pesquera del Biobío (agosto 2026)."
  aserraderos_cerrados_biobio:
    nombre: Aserraderos cerrados en el Biobío
    unidad_default: aserraderos
    notas: "Más de 200 aserraderos cerrados en la Región del Biobío (agosto 2026)."
  inversion_becas_chile:
    nombre: Inversión estatal en Becas Chile
    unidad_default: millones_pesos
    notas: "Más de $690 mil millones invertidos en el programa Becas Chile desde su creación para financiar estudios de posgrado en el extranjero (agosto 2026). El levantamiento del Ministerio de Ciencia (3-ago-2026) precisa $688 mil millones en 12.589 becas (El Dínamo); Bío Bío/Radio Agricultura reportan $690 mil millones."
  becarios_becas_chile:
    nombre: Becarios del programa Becas Chile
    unidad_default: becarios
    notas: "11.340 becarios beneficiados por Becas Chile con una inversión superior a los $690 mil millones (agosto 2026)."
  becarios_incumplimiento_becas_chile:
    nombre: Becarios de Becas Chile en incumplimiento
    unidad_default: becarios
    notas: "1.666 beneficiarios de Becas Chile en incumplimiento de sus obligaciones de retorno, con una deuda cercana a los $92 mil millones (agosto 2026)."
  deuda_becas_chile_incumplimiento:
    nombre: Deuda de becarios de Becas Chile en incumplimiento
    unidad_default: millones_pesos
    notas: "Cerca de $92 mil millones adeudados por 1.666 becarios de Becas Chile que no cumplieron las obligaciones del beneficio (agosto 2026)."
  incumplimiento_becas_chile_2024:
    nombre: Beneficiarios en incumplimiento declarado de Becas Chile (nómina 2024)
    unidad_default: personas
    notas: "150 personas en incumplimiento declarado (82 de Becas Chile + 68 de Becas Nacionales), 73 con demandas judiciales en trámite, según la nómina pública publicada el 5 de abril de 2024 por el Ministerio de Ciencia (Etcheverry) tras la auditoría de la Contraloría a la ANID; además 548 casos en análisis de cumplimiento. ADN (7-ago-2026) citó erróneamente 283/293 personas en otra versión del balance."
  alza_alimentos_2021_2026:
    nombre: Alza acumulada de los alimentos entre 2021 y 2026
    unidad_default: "%"
    notas: "Los productos de la división 'Alimentos y bebidas no alcohólicas' del IPC acumulan un incremento cercano al 40% entre junio de 2021 y junio de 2026 (INE)."
  hogares_gasto_comida_aumentado:
    nombre: Hogares que afirman que su gasto en comida aumentó en 5 años
    unidad_default: "%"
    notas: "87% de los 2.007 encuestados por Cheaf afirma que el gasto mensual de su hogar en comida aumentó en los últimos cinco años (julio 2026)."
  encuestados_preocupados_costo_alimentos:
    nombre: Encuestados preocupados por el costo de los alimentos
    unidad_default: "%"
    notas: "92,3% de los encuestados por Cheaf declaró sentirse 'muy' o 'bastante' preocupado por el valor de los insumos básicos (julio 2026)."
  hogares_reducen_desperdicio_alimentos:
    nombre: Hogares que reducen el desperdicio de alimentos
    unidad_default: "%"
    notas: "88,1% de los encuestados por Cheaf intentó reducir el desperdicio de alimentos durante el último año para cuidar sus finanzas (julio 2026)."
  encuestados_cheaf:
    nombre: Usuarios encuestados por Cheaf
    unidad_default: usuarios
    notas: "2.007 usuarios encuestados por la plataforma Cheaf durante la última semana de julio de 2026 sobre el costo de los alimentos."
  programas_evaluacion_presupuestaria_2027:
    nombre: Programas estatales en evaluación presupuestaria 2027
    unidad_default: programas
    notas: "Cerca de 142 programas estatales incorporados al proceso de evaluación presupuestaria para el Presupuesto 2027 que, según las organizaciones de DDHH, podrían verse afectados (agosto 2026)."
  causas_indultos_pasivos_cidh:
    nombre: Causas por 'indultos pasivos' denunciadas ante la CIDH
    unidad_default: causas
    notas: "Nueve causas relacionadas con cuatro condenados por crímenes de lesa humanidad en que el Estado habría dejado de oponerse a beneficios penitenciarios, según informe presentado ante la CIDH (agosto 2026)."
  condenados_indultos_pasivos_cidh:
    nombre: Condenados por lesa humanidad vinculados a 'indultos pasivos'
    unidad_default: condenados
    notas: "Cuatro condenados por crímenes de lesa humanidad en nueve causas donde el Programa de DDHH no habría intervenido activamente, según informe ante la CIDH (agosto 2026)."
  audiencias_sin_alegar_programa_ddhh:
    nombre: Audiencias en que el Programa de DDHH no alegó
    unidad_default: audiencias
    notas: "20 de 23 audiencias en contra de exagentes de la dictadura en que el Programa de Derechos Humanos no se presentó a alegar o se desistió de recursos, por instrucciones del Ministerio de Justicia, según la denuncia de organizaciones de DDHH ante la CIDH (5 de agosto de 2026). En dos casos se produjo la liberación inmediata del agente y en un tercero la reducción de la condena."
  exagentes_solicitudes_penas_2026:
    nombre: Exagentes con solicitudes de beneficios penitenciarios en 2026
    unidad_default: exagentes
    notas: "47 exagentes condenados por crímenes de lesa humanidad presentaron en lo que va de 2026 solicitudes de reducción de penas, arresto domiciliario, libertades condicionales y acumulación de penas, según la denuncia de organizaciones de DDHH ante la CIDH (5 de agosto de 2026)."
  expedientes_pendientes_pueblos_indigenas:
    nombre: Expedientes pendientes tras eliminación de Unidad de Pueblos Indígenas
    unidad_default: expedientes
    notas: "Cerca de 16 mil expedientes pendientes en La Araucanía tras la eliminación de la Unidad de Pueblos Indígenas del Ministerio de Bienes Nacionales (agosto 2026)."
  funcionarios_salida_migraciones_2026:
    nombre: Funcionarios que salieron del Servicio Nacional de Migraciones
    unidad_default: funcionarios
    notas: "27 funcionarios salieron del Servicio Nacional de Migraciones tras su reestructuración bajo el gobierno de Kast (agosto 2026)."
  recursos_total_reconstruccion_coquimbo:
    nombre: Recursos totales para reconstrucción en Coquimbo en primera etapa
    unidad_default: millones_pesos
    notas: "Más de $3.300 millones que el municipio de Coquimbo dispondrá en la primera etapa de reconstrucción: $1.800 millones liberados por la suspensión de La Pampilla 2026 más $1.500 millones anunciados previamente (30 julio 2026)."
  gremios_pyme_respaldan_veto:
    nombre: Gremios pyme que respaldan el veto al pago a 30 dias
    unidad_default: gremios
    notas: "48 organizaciones gremiales de micro, pequenas y medianas empresas respaldaron el veto presidencial al cambio en el regimen de pago a 30 dias (agosto 2026)."
  ministros_beneficiados_contribuciones:
    nombre: Ministros del gabinete que se beneficiarían de la exención de contribuciones
    unidad_default: ministros
    notas: "Al menos seis ministros (Barros, Campos, Pérez Mackenna, Alvarado, García Ruminot y Parot) con primera vivienda y mayores de 65 años, según declaraciones de patrimonio revisadas por Contrapoder Chile (abril 2026)."
  casos_hantavirus_2026:
    nombre: Casos de hantavirus en 2026
    unidad_default: casos
    notas: "46 contagios hasta julio de 2026, previo a la alerta sanitaria declarada por el Minsal."
  fallecidos_hantavirus_2026:
    nombre: Fallecidos por hantavirus en 2026
    unidad_default: personas
    notas: "18 fallecidos hasta julio de 2026, según el Minsal."
  letalidad_hantavirus_2026:
    nombre: Letalidad del hantavirus en 2026
    unidad_default: porciento
    notas: "39% de letalidad en 2026 (46 contagios y 18 fallecidos), frente al 18% de 2025."
  casos_hantavirus_2025:
    nombre: Casos de hantavirus en 2025
    unidad_default: casos
    notas: "44 contagios en todo 2025."
  fallecidos_hantavirus_2025:
    nombre: Fallecidos por hantavirus en 2025
    unidad_default: personas
    notas: "8 fallecidos por hantavirus en 2025 (letalidad de 18%)."
  regiones_alerta_hantavirus:
    nombre: Regiones bajo alerta sanitaria por hantavirus
    unidad_default: regiones
    notas: "13 regiones, desde Atacama hasta Magallanes (2026-2027)."
  subsidios_tasa_hipotecaria_total:
    nombre: Total de cupos del subsidio a la tasa hipotecaria tras ampliacion
    unidad_default: subsidios
    notas: "Aumento de 50.000 a 80.000 subsidios (proyecto ingresado agosto 2026)."
  tope_vivienda_subsidio_hipotecario:
    nombre: Tope del valor de la vivienda para el subsidio a la tasa hipotecaria
    unidad_default: uf
    notas: "Ampliacion de 4.000 a 6.000 UF para viviendas nuevas (agosto 2026)."
  creditos_hipotecarios_formalizados_subsidio:
    nombre: Creditos hipotecarios formalizados bajo el subsidio
    unidad_default: creditos
    notas: "31.640 creditos formalizados y mas de 40 mil solicitudes a agosto de 2026, según Hacienda."
  oferta_viviendas_nuevas_cchc:
    nombre: Oferta disponible de viviendas nuevas (CChC)
    unidad_default: unidades
    notas: "104.047 unidades al primer trimestre de 2026, según el Informe Nacional Inmobiliario de la CChC; 19.022 en el tramo de 4.000 a 6.000 UF."
  cobertura_stock_viviendas_subsidio:
    nombre: Cobertura de la oferta de viviendas con el nuevo tope de subsidio
    unidad_default: porciento
    notas: "88,1% de la oferta disponible quedaría cubierta con el tope de 6.000 UF, según Hacienda."
  desacuerdo_megarreforma_cadem:
    nombre: Desacuerdo con la megarreforma (Cadem)
    unidad_default: porciento
    notas: "50% de los encuestados en desacuerdo con la megarreforma del gobierno de Kast (Cadem, agosto 2026)."
  rechazo_rebaja_impuesto_empresas:
    nombre: Rechazo a la reduccion gradual del impuesto a las empresas (Cadem)
    unidad_default: porciento
    notas: "56% de los encuestados rechaza la reduccion gradual del impuesto a las empresas contemplada en la megarreforma (Cadem, agosto 2026)."
  rechazo_gestion_quiroz_descifra:
    nombre: Rechazo a la gestion de Jorge Quiroz (Descifra)
    unidad_default: porciento
    notas: "63% evalua negativamente la gestion del ministro de Hacienda Jorge Quiroz, frente a 34% que la valora positivamente (Descifra, julio-agosto 2026)."
  duda_resultados_megarreforma:
