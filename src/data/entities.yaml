    notas: Rasputin de Kast. Contrato 80,9M por 9 meses.
  enrique_basaletti:
    nombre: Enrique Basaletti
    cargo: Diputado (Republicanos)
    notas: "Diputado oficialista del Partido Republicano. Expresó preocupación por el recorte presupuestario a Carabineros."
