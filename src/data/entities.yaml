        hasta: 2010-01
      - cargo: Concejal de Concepción
        organizacion: municipalidad_de_concepcion
        desde: 2008-01
        hasta: 2016-12
    notas: "Político DC. Concejal de Concepción y director regional del INJUV del Bío-Bío en 2009-2010, cuando fue condenado por el Juzgado de Familia de Concepción por violencia intrafamiliar (multa de 2 UTM y tratamiento de control de impulsos, enero 2010) y formalizado por conducción en estado de ebriedad y daños en San Pedro de la Paz. Diputado DC desde 2026, crítico de la megarreforma."
  gloria_gonzalez:
    nombre: Gloria González
    cargo: Exdirectora regional del Sence de Los Lagos
    notas: "Directora regional del Servicio Nacional de Capacitación y Empleo (Sence) en la Región de Los Lagos en 2009. El 17 de diciembre de 2009 participó en la cuenta pública de la Seremi del Trabajo en Puerto Montt luciendo una chapita de campaña de Eduardo Frei ('Vamos a vivir mejor, Frei'), lo que la dirección nacional del Sence calificó como un error por olvido involuntario, amonestándola verbalmente por infringir la instrucción de la presidenta Michelle Bachelet que prohíbe la actividad política de funcionarios públicos en horario laboral."
  juan_manuel_castro:
    nombre: Juan Manuel Castro Rebolledo
    cargo: Director nacional del Sence
    notas: "Director nacional del Servicio Nacional de Capacitación y Empleo (Sence) en 2009. Firmó el comunicado del 21 de diciembre de 2009 en que la dirección nacional reconoció que la directora regional de Los Lagos, Gloria González, cometió un error al portar una chapita de Eduardo Frei en una actividad pública, y anunció su amonestación verbal, invocando las instrucciones de la presidenta Michelle Bachelet que prohíben la actividad política de los funcionarios públicos en horario laboral. Emitió además un documento escrito advirtiendo a todos los directores regionales del Sence."
  carlos_mulet:
    nombre: Carlos Mulet
    cargo: Senador (PDG)
    cargos:
      - cargo: Senador (PDG)
        organizacion: pdg
