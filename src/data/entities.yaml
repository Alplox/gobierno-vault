        organizacion: partido_socialista
        desde: 2026-03-11
    notas: Firmó la denuncia ante Contraloría por el almuerzo de Kast con excompañeros en La Moneda
  victor_jara:
    nombre: Víctor Jara
    cargo: Cantautor
    notas: Asesinado en septiembre de 1973 en el Estadio Chile durante la dictadura
      cívico-militar
  littre_quiroga:
    nombre: Littré Quiroga
    cargo: Exdirector General de Prisiones
    notas: Asesinado en septiembre de 1973 junto a Víctor Jara en el Estadio Chile
  juan_barros:
    nombre: Juan Barros Madrid
    cargo: Exobispo de Osorno
    notas: "Obispo de Osorno designado en 2015 pese a las denuncias de encubrimiento de los abusos del sacerdote Fernando Karadima. Su designación provocó protestas masivas en la diócesis y el Papa Francisco lo respaldó públicamente en octubre de 2015, llamando 'tontos' y 'zurdos' a los manifestantes. En 2018 renunció al obispado tras el escándalo de abusos de la Iglesia chilena."
  fernando_karadima:
    nombre: Fernando Karadima
    cargo: Exsacerdote condenado por abusos sexuales
    notas: "Párroco de El Bosque (Santiago), condenado por la Santa Sede en 2011 por abusos sexuales a menores. Su caso destapó la red de encubrimiento en la Iglesia chilena que involucró a obispos como Juan Barros y Juan Pablo Barros, y motivó las protestas en Osorno tras la designación de Barros."
  erika_guevara_rosas:
    nombre: Erika Guevara-Rosas
    cargo: Directora para las Américas de Amnistía Internacional
    organizacion: amnistia_internacional
    notas: "Directora para las Américas de Amnistía Internacional. El 29 de julio de 2018 condenó el apuñalamiento de tres mujeres en la marcha por el aborto libre de Santiago y criticó 'las tímidas declaraciones del gobierno', señalando que enviaban un mensaje preocupante de que exigir derechos representa un riesgo."
  macarena_castaneda:
    nombre: Macarena Castañeda
    cargo: Portavoz de Mesa de Acción por el Aborto
    notas: "Portavoz de la Mesa de Acción por el Aborto, grupo que lideraba la lucha por el acceso al aborto libre en Chile. El 29 de julio de 2018 calificó de 'terrorismo' el apuñalamiento de tres mujeres en la marcha: 'cuando un grupo quiere intimidar a otro para impedirle expresar sus ideas libremente'."
  natalia_valdebenito:
    nombre: Natalia Valdebenito
    cargo: Comediante y comunicadora
    notas: "Comediante y conductora radial chilena. El 29 de julio de 2018 difundió en vivo por Instagram el apuñalamiento de tres mujeres en una marcha por el aborto libre en Santiago, denunciando que la prensa no cubrió el ataque y que el gobierno no lo condenó."
  jose_miguel_vivanco:
    nombre: José Miguel Vivanco
    cargo: Exdirector para las Américas de Human Rights Watch
    notas: "Abogado chileno, director de la División de las Américas de Human Rights Watch hasta 2022. En noviembre de 2019 lideró la investigación de HRW sobre las violaciones a los derechos humanos de Carabineros durante el estallido social, reunión con Piñera el 26 de noviembre y el informe 'Chile: Police Reforms Needed in the Wake of Protests'."
  karina_soza:
    nombre: Karina Soza
    cargo: Exjefa de Derechos Humanos de Carabineros
    organizacion: carabineros
    notas: "Teniente coronel de Carabineros y jefa de Derechos Humanos de la institución durante el estallido social. En noviembre de 2019, ante la Comisión de DD.HH. del Senado, defendió que los efectivos de Fuerzas Especiales captados en el video viral 'pacos jalando' inhalaban Mentholatum para combatir los gases lacrimógenos, lo que fue desmentido por bioquímicos y científicos. Su declaración fue calificada de 'sumamente grave e irresponsable' por los investigadores."
  claudio_olea_azar:
    nombre: Claudio Olea Azar
    cargo: Bioquímico e investigador de la Universidad de Chile
    notas: "Doctor en Ciencias mención Química e investigador de la Facultad de Ciencias Químicas y Farmacéuticas de la Universidad de Chile. En noviembre de 2019 encabezó el informe de bioquímicos y químicos farmacéuticos que desmintió que el Mentholatum alivie los efectos de los gases lacrimógenos, señalando que incluso podía potenciarlos."
  victor_perez:
    nombre: Víctor Pérez Varela
    cargo: Exministro del Interior y Seguridad Pública
    organizacion: ministerio_del_interior
    notas: "Ministro del Interior y Seguridad Pública del segundo gobierno de Sebastián Piñera entre 2020 y 2021. En octubre de 2020, tras el caso Pío Nono (menor lanzado desde un puente por un carabinero), sectores de la oposición pidieron su renuncia junto a la del director general de Carabineros, Mario Rozas."
  mario_rozas:
    nombre: Mario Rozas Córdova
    cargo: Exdirector general de Carabineros
    organizacion: carabineros
    notas: "Director general de Carabineros entre 2018 y 2020, durante el estallido social. Tras el caso Pío Nono (2 de octubre de 2020), la oposición pidió su renuncia y la del ministro del Interior, Víctor Pérez, por las violaciones a los derechos humanos de la represión policial."
  karla_rubilar:
    nombre: Karla Rubilar Barahona
    cargo: Exintendenta de la Región Metropolitana
    cargos:
      - cargo: Ministra de Desarrollo Social y Familia
        organizacion: ministerio_desarrollo_social
        desde: 2020-07-28
        hasta: 2022-03-11
      - cargo: Ministra Secretaria General de Gobierno
        organizacion: segegob
        desde: 2019-10-28
        hasta: 2020-07-28
    notas: "Intendenta de la Región Metropolitana durante el estallido social (2019-2020). El 25 de octubre de 2019 calificó en Twitter la marcha de alrededor de un millón de personas como 'un día histórico' en que 'la Región Metropolitana es la protagonista de una marcha pacífica'. Exministra de Desarrollo Social y secretaria general de Gobierno."
  enrique_monras:
    nombre: Enrique Monrás
    cargo: Exvocero de Carabineros
    organizacion: carabineros
    notas: "General de Carabineros y vocero institucional en 2020. Tras la caída de un adolescente desde el puente Pío Nono al río Mapocho (2 de octubre de 2020), señaló en una alocución televisada que el joven 'perdió el equilibrio y cayó' durante una detención, aunque no descartó la responsabilidad de la institución."
  sebastian_zamora:
    nombre: Sebastián Zamora
    cargo: Excarabinero formalizado por el caso Pío Nono
    organizacion: carabineros
    notas: "Carabinero formalizado en octubre de 2020 por homicidio en grado de frustrado tras la caída de un adolescente de 16 años desde el puente Pío Nono al río Mapocho durante la represión de una manifestación (2 de octubre de 2020). Quedó en prisión preventiva. Su defensa argumentó que el joven se habría lanzado, mientras peritajes de cámaras y el testimonio de la víctima indicaron que el impacto de Zamora causó la caída."
  patricia_munoz:
    nombre: Patricia Muñoz
    cargo: Exdefensora de la Niñez
    organizacion: defensoria_de_la_ninez
    notas: "Defensora de la Niñez entre 2018 y 2022. En el caso Pío Nono (2020), como querellante, pidió que el carabinero Sebastián Zamora permaneciera en prisión preventiva y condenó la 'acción criminal' de Carabineros contra el adolescente lanzado desde el puente Pío Nono."
  paola_plaza:
    nombre: Paola Plaza
    cargo: Ministra en visita de la Corte de Apelaciones de Santiago
    notas: Ordenó el ingreso a prisión de Nelson Haase Mazzei
  camila_davagnino:
    nombre: Camila Davagnino
    cargo: Concejala de Santiago
    notas: "Concejala de la Municipalidad de Santiago. En marzo de 2026 cuestionó la contratación de la empresa Fullclean Servicios Generales, ligada a la familia del excarabinero Claudio Crespo, por la gestión del alcalde Mario Desbordes, señalando que no se deben utilizar vínculos políticos para beneficiar a empresas ligadas a la ultraderecha y que los concejales deben revisar con más cuidado los antecedentes de las empresas contratadas."
  cristian_araya:
    nombre: Cristián Araya
    cargo: Diputado (Partido Republicano)
    organizacion: partido_republicano
    notas: "Diputado del Partido Republicano por el distrito 11 (Las Condes, Lo Barnechea, Vitacura, La Reina y Peñalolén). En agosto de 2026 quedó en el centro de las críticas por viajar a España entre el 23 y el 31 de julio, coincidiendo con parte de la semana distrital, tras informar su salida al presidente de la Cámara de Diputados, Jorge Alessandri, por 'motivos personales' (artículo 34 del reglamento interno de la corporación)."
  carlos_bianchi:
    nombre: Carlos Bianchi
    cargo: Diputado (PPD-Ind)
    cargos:
      - cargo: Diputado (PPD-Ind)
        organizacion: partido_por_la_democracia
        desde: 2026-03-11
    notas: Calificó de "publicidad engañosa" el proyecto de IVA pañales del PDG
  javier_couso:
    nombre: Javier Couso
    cargo: Abogado constitucionalista y director del Doctorado en Derecho de la UDP
    notas: "Abogado constitucionalista, director del Doctorado en Derecho de la Universidad Diego Portales (UDP). En agosto de 2026 rebatió el anuncio del presidente José Antonio Kast de consagrar por primera vez en la Constitución la obligación estatal de proteger a la población, señalando que el artículo 1° de la Constitución de 1980 ya establece que 'es deber del Estado resguardar la seguridad nacional, dar protección a la población y a la familia' y que 'eso es falso' (entrevista con Al Pan Pan de El Mostrador)."
  jorge_correa_sutil:
    nombre: Jorge Correa Sutil
    cargo: Abogado constitucionalista, exsubsecretario del Interior y exvicepresidente del Banco Mundial
    notas: "Abogado constitucionalista, exsubsecretario del Interior (2000-2005, gobierno de Ricardo Lagos), exconsejero del Banco Mundial y profesor de derecho. En agosto de 2026 advirtió junto a Javier Couso que la obligación de dar protección a la población ya figura en el artículo 1° inciso quinto de la Constitución vigente, por lo que presentarla como una innovación de la ACOT era impreciso (El Mostrador, 7-ago-2026)."
  jorge_jeri:
    nombre: "Jose Jeri"
    cargo: "Presidente de la Republica del Peru"
    notas: "Recibio a Kast en su primera visita bilateral, Lima 7 enero 2026"
  ivette_avaria:
    nombre: Ivette Avaria
    cargo: Diputada del Partido Nacional Libertario
    notas: "Diputada del Partido Nacional Libertario. En agosto de 2026 criticó junto a Johannes Kaiser la cadena nacional del presidente José Antonio Kast sobre la Agenda ACOT, calificándola de 'campañera' y cuestionando que las propuestas no atacaran el problema de fondo de la seguridad (The Clinic, 6-ago-2026)."
  axel_callis:
    nombre: Axel Callis
    cargo: Abogado y académico, exfiscal
    notas: "Abogado penalista y académico, exfiscal. En agosto de 2026 advirtió que el gobierno de José Antonio Kast no podrá aplicar en seguridad la llamada 'doctrina Quiroz' —uso de las Fuerzas Armadas en seguridad interior— sin antes modificar el marco legal vigente, en el contexto de la Agenda ACOT (Cooperativa, 6-ago-2026)."
  daniel_mas:
    nombre: Daniel Mas Valdés
    cargo: Biministro de Economía y Minería
    cargos:
      - cargo: Biministro de Economía y Minería
