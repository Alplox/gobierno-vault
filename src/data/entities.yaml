  karen_rojo:
    nombre: Karen Rojo
    cargo: Ex alcaldesa de Antofagasta
    notas: "Ex alcaldesa independiente de Antofagasta (2012-2020). Declarada culpable por fraude al fisco en diciembre de 2020 en el marco del Caso Main."
  edgardo_vergara:
    nombre: Edgardo Vergara
    cargo: Ex secretario ejecutivo de la Corporación Municipal de Antofagasta
    notas: "Condenado junto a Karen Rojo por fraude al fisco en la Corporación Municipal de Antofagasta (2020)."
  juan_ramon_godoy:
    nombre: Juan Ramón Godoy
    cargo: Ex alcalde de Rancagua (PS)
    notas: "Ex alcalde de Rancagua (2016-2024). Declarado culpable de cohecho agravado y fraude al fisco en diciembre de 2025 tras una investigación iniciada por un reportaje de CIPER."
  javier_cornejo:
    nombre: Javier Cornejo
    cargo: Empresario, proveedor de la Municipalidad de Rancagua
    notas: "Amigo del exalcalde Juan Ramón Godoy. Condenado por soborno tras recibir licitaciones por trato directo de la Corporación Municipal de Rancagua."
  nicolas_nunez:
    nombre: Nicolás Núñez
    cargo: Fiscal de alta complejidad de la Fiscalía Regional de O'Higgins
    notas: "Fiscal de alta complejidad que acreditó los hechos de corrupción del exalcalde de Rancagua Juan Ramón Godoy."
  diego_barba:
    nombre: Diego Barba
    cargo: Empresario, proveedor de la Municipalidad de Rancagua
    notas: "Proveedor municipal que compró un auto para el exalcalde Juan Ramón Godoy, según la investigación fiscal."
  nayalet_mansilla:
    nombre: Nayalet Mansilla
    cargo: Fiscal regional de Ñuble
    notas: "Fiscal regional de Ñuble a cargo de la causa del Caso Luminarias."
  mauricio_smok:
    nombre: Mauricio Smok
    cargo: Concejal UDI de Recoleta
    notas: "Concejal UDI de Recoleta que solicitó a la Contraloría revisar la licitación de Itelecom con el municipio en el Caso Luminarias."
  francisco_melo:
    nombre: Francisco Melo
    cargo: Alcalde de Negrete
    notas: "Alcalde de Negrete detenido en diciembre de 2020 por la Fiscalía en el marco del Caso Luminarias."
  carlos_reyes:
    nombre: Carlos Reyes
    cargo: Ex director de obras de la Municipalidad de Recoleta
    notas: "Ex director de obras de Recoleta condenado por nueve delitos de cohecho y falsificación de instrumento público; vinculó a los ex alcaldes Gonzalo Cornejo y Sol Letelier."
  sol_letelier:
    nombre: Sol Letelier
    cargo: Ex alcaldesa de Recoleta
    notas: "Ex alcaldesa de Recoleta (2004-2012) vinculada por omisión de deberes en la red de coimas de la comuna."
  macarena_canas:
    nombre: Macarena Cañas
    cargo: Fiscal de la Fiscalía Centro Norte
    notas: "Fiscal de la Fiscalía Centro Norte a cargo de la investigación de corrupción en la Municipalidad de Recoleta."
  enrique_herrera:
    nombre: Enrique Herrera
    cargo: Representante legal de sociedades ligadas a la Universidad San Sebastián
    notas: "Ofreció una coima de casi $15 millones al ex director de obras de Recoleta Carlos Reyes para ampliar permisos de la USS (2012)."
  nora_cuevas:
    nombre: Nora Cuevas
    cargo: Ex alcaldesa de San Bernardo (UDI)
    notas: "Ex alcaldesa de San Bernardo por 12 años y ex diputada UDI. Imputada por fraude al fisco y malversación por más de $20 mil millones en subvenciones escolares."
  cristopher_white:
    nombre: Cristopher White
    cargo: Alcalde de San Bernardo (PS)
    notas: "Alcalde de San Bernardo desde 2021 que presentó querella contra su antecesora Nora Cuevas por fraude al fisco."
  leonel_cadiz:
    nombre: Leonel Cádiz
    cargo: Ex concejal de San Bernardo
    notas: "Ex concejal de San Bernardo investigado como imputado por la Fiscalía en el caso de fraude municipal de Nora Cuevas."
  jaime_bellolio:
    nombre: Jaime Bellolio
    cargo: Ex diputado UDI, ex vocero de Gobierno
    notas: "Ex diputado UDI y ex vocero de Gobierno; Nora Cuevas lo reemplazó en la Cámara cuando fue designado vocero."
  pedro_sabat:
    nombre: Pedro Sabat
    cargo: Ex alcalde de Ñuñoa
    notas: "Ex alcalde de Ñuñoa (2000-2016). Condenado en 2023 por dos delitos de negociación incompatible por contratos con un socio de su hijo."
  pedro_sabat_fernandez:
    nombre: Pedro Sabat Fernández
    cargo: Hijo de Pedro Sabat
    notas: "Hijo del ex alcalde de Ñuñoa, socio de Alain Goffard en la empresa SayGo SpA."
  alain_goffard:
    nombre: Alain Goffard
    cargo: Empresario, socio de Pedro Sabat Fernández
    notas: "Socio del hijo del ex alcalde de Ñuñoa Pedro Sabat; recibió contratos municipales por $15,7 millones."
  virginia_reginato:
    nombre: Virginia Reginato
    cargo: Ex alcaldesa de Viña del Mar
    notas: "Ex alcaldesa de Viña del Mar (2004-2021). La Contraloría le ordenó restituir más de $1.122 millones por perjuicio a la Corporación Municipal."
  marco_munoz:
    nombre: Marco Muñoz
    cargo: Fiscal de la Fiscalía Regional de Los Lagos
    notas: "Fiscal que presentó la acusación contra el exalcalde de Puerto Montt Gervoy Paredes por delitos de corrupción (2026)."
  alban_mancilla:
    nombre: Albán Mancilla
    cargo: Ex jefe del DAEM de Puerto Montt
    notas: "Ex jefe del DAEM de Puerto Montt acusado junto a Gervoy Paredes; la Fiscalía pidió más de 12 años de cárcel."
  gerardo_espindola:
    nombre: Gerardo Espíndola
    cargo: Ex alcalde de Arica
    notas: "Ex alcalde de Arica (2016-2024). Investigado por cohecho, negociación incompatible y fraude al fisco en contratos de áreas verdes tras informe de la Contraloría."
  silvia_merlet:
    nombre: Silvia Merlet
    cargo: Socia de Paisajismo y Jardines del Norte SpA
    notas: "Socia fundadora de Paisajismo y Jardines del Norte SpA, empresa que ganó la cuestionada licitación de áreas verdes de Arica."
  jorge_fernandez_merlet:
    nombre: Jorge Fernández Merlet
    cargo: Socio de Norte Verde SpA
    notas: "Hijo de Silvia Merlet y socio de Norte Verde SpA, empresa creada días antes de recibir el trato directo de áreas verdes de la Municipalidad de Arica."
  francisco_ganga:
    nombre: Francisco Ganga
    cargo: Fiscal de Alta Complejidad de Arica
    notas: "Fiscal a cargo de la indagatoria reservada por cohecho y fraude al fisco en contratos de áreas verdes de Arica."
  christian_diaz_ramirez:
    nombre: Christian Díaz Ramírez
    cargo: Ex administrador municipal de Arica
    notas: "Ex administrador municipal de Arica; el correo que envió para el trato directo de áreas verdes no acreditó el envío a cinco proveedores."
  manuel_bulnes:
    nombre: Manuel Bulnes
    cargo: Ex director ejecutivo de LarrainVial
    notas: "Ex director ejecutivo de LarrainVial formalizado en 2025 en el caso Factop."
  felipe_porzio:
    nombre: Felipe Porzio
    cargo: Ex director de finanzas de LarrainVial
    notas: "Ex director de finanzas de LarrainVial formalizado en 2025 en el caso Factop."
  jose_correa:
    nombre: José Correa
    cargo: Director de LarrainVial Activos
    notas: "Director de LarrainVial Activos formalizado en 2025 en el caso Factop."
  jaime_oliveira:
    nombre: Jaime Oliveira
    cargo: Director de LarrainVial Activos
    notas: "Director de LarrainVial Activos formalizado en 2025 en el caso Factop."
  sebastian_cereceda:
    nombre: Sebastián Cereceda
    cargo: Gerente de finanzas corporativas de LarrainVial
    notas: "Gerente de finanzas corporativas de LarrainVial formalizado en 2025 en el caso Factop."
  andres_bulnes:
    nombre: Andrés Bulnes
    cargo: Gerente de distribución institucional de LarrainVial
    notas: "Gerente de distribución institucional de LarrainVial formalizado en 2025 en el caso Factop."
  andrea_larrain:
    nombre: Andrea Larraín
    cargo: Gerenta corporativa de gestión y planificación de LarrainVial
    notas: "Gerenta corporativa de LarrainVial formalizada en 2025 en el caso Factop."
  claudio_yanez:
    nombre: Claudio Yáñez
    cargo: Gerente general de LarrainVial Activos
    notas: "Gerente general de LarrainVial Activos formalizado en 2025 en el caso Factop."
  fernando_larrain:
    nombre: Fernando Larraín
    cargo: Presidente de LarrainVial SpA
    notas: "Presidente de LarrainVial SpA; respaldó por carta a los ocho ejecutivos formalizados en el caso Factop."
  cristian_menichetti:
    nombre: Cristián Menichetti
    cargo: Ex socio del Grupo Patio
    notas: "Ex socio del Grupo Patio formalizado en 2025 en el caso Factop."
  ariel_sauer:
    nombre: Ariel Sauer
    cargo: Socio de Factop
    notas: "Hermano de Daniel Sauer y socio de Factop, formalizado en el caso Factop."
  daniel_sauer:
    nombre: Daniel Sauer
    cargo: Socio de Factop
    notas: "Hermano de Ariel Sauer y socio de Factop, formalizado en el caso Factop."
  rodrigo_topelberg:
    nombre: Rodrigo Topelberg
    cargo: Socio de Factop
    notas: "Socio de Factop formalizado en el caso Factop."
  barbara_negron:
    nombre: Bárbara Negrón
    cargo: Directora del Observatorio de Políticas Culturales
    notas: "Directora del Observatorio de Políticas Culturales. En agosto de 2026 criticó las bases de Fondos Cultura 2027 por la cláusula que excluye proyectos con contenido pornográfico o excesivamente violento, señalando que 'pone por primera vez una explícita exclusión de temas para los fondos'."
  daniel_laguna:
    nombre: Daniel Laguna
    cargo: Secretario ejecutivo del Fondo de Fomento Audiovisual
    notas: "Secretario ejecutivo del Fondo de Fomento Audiovisual. Defendió en agosto de 2026 la cláusula de las bases de Fondos Cultura 2027 que excluye contenido pornográfico o excesivamente violento, reconociendo que el antecedente fue el financiamiento del festival de cine Excéntrico, y aclaró: 'Estamos limitando la postulación a películas pornográficas, no que en una película se vea una escena sexual ni erótica'."
  wilfredo_rosas:
    nombre: Wilfredo Rosas
    cargo: Consejero de Artes Escénicas
    notas: "Consejero de Artes Escénicas. Reveló en agosto de 2026 que la directriz de excluir contenido pornográfico o excesivamente violento de los Fondos Cultura 2027 vino 'de arriba' y no pudo rebatirse en el consejo."
  carlos_lobos:
    nombre: Carlos Lobos
    cargo: Subsecretario de las Culturas y las Artes
    notas: "Subsecretario de las Culturas y las Artes. Su cartera envió por escrito en agosto de 2026 que la exclusión de contenido pornográfico o excesivamente violento de los Fondos Cultura 2027 'no tiene por objeto censurar, ni pretende eliminar este tipo de producciones, busca que no sean financiadas con recursos de los fondos de fomento cultural'."
  ernesto_orellana:
    nombre: Ernesto Orellana Gómez
    cargo: Vicepresidente del Sindicato de Actores de Chile (Sidarte)
    notas: "Vicepresidente del Sindicato de Actores y Trabajadores Teatrales de Chile (Sidarte). Publicó en El Mostrador la columna 'Libertad de creación artística bajo amenaza' (4-ago-2026) contra las bases de Fondos Cultura 2027, advirtiendo que la ley de calificación cinematográfica pasa a operar como filtro previo que limita la libertad de crear y difundir las artes (artículo 19 N°25 de la Constitución)."
  oscar_contardo:
    nombre: Óscar Contardo
    cargo: Escritor y columnista
    notas: "Escritor y columnista chileno. En agosto de 2026 criticó la cláusula de contenido de los Fondos Cultura 2027, advirtiendo que 'eso se va a prestar para censura' por lo subjetivo de su aplicación."
  francisca_corvera:
    nombre: Francisca Corvera
    cargo: Artista visual, creadora de Fondos para Artistas
    notas: "Artista visual y creadora del sitio Fondos para Artistas. En agosto de 2026 apuntó que las becas de los Fondos Cultura 2027 'por primera vez van a privilegiar áreas de estudio', restringiendo qué pueden estudiar los artistas."
  luis_pardo:
    nombre: Luis Pardo
    cargo: Senador RN
    notas: "Senador de Renovación Nacional por la Región de Valparaíso. The Clinic lo mencionó (10-ago-2026) como parte de la red de apoyo del exsubsecretario Juan Pablo Rodríguez en el oficialismo."
  gonzalo_bofill:
    nombre: Gonzalo Bofill Velarde
    cargo: Empresario, dueño de Carozzi y presidente de la Fundación Piensa
    notas: "Empresario chileno, dueño de Carozzi y presidente de la Fundación Piensa. The Clinic lo mencionó (10-ago-2026) como parte del mundo empresarial cercano al exsubsecretario Juan Pablo Rodríguez, a cuya fundación pertenecía el exfuncionario antes de ingresar al Gobierno."
  manuel_valderrama:
    nombre: Manuel Valderrama
    cargo: Ministro en visita
    notas: "Ministro en visita que sobreseyó en mayo de 2010 el caso Pinocheques al no poder determinar que los dineros de los tres cheques de 1989 hubieran terminado en cuentas de Augusto Pinochet."
  gloria_ana_chevesich:
    nombre: Gloria Ana Chevesich
    cargo: Ministra de la Corte Suprema, ex jueza del caso MOP-Gate
    notas: "Jueza que llevó por siete años la investigación del caso MOP-Gate y dictó la sentencia de primera instancia el 1 de julio de 2010, admitiendo que no pudo determinar el destino de los dineros defraudados. Posteriormente integró la Corte Suprema."
  jorge_abbott:
    nombre: Jorge Abbott
    cargo: Ex Fiscal Nacional
    notas: "Fiscal Nacional de Chile entre 2015 y 2022. Como tal designó a la fiscal Claudia Perivancich para investigar el fraude al fisco del Papaya Gate en la Intendencia de Coquimbo (2020) y antes, como fiscal regional de Valparaíso, dispuso formalizar a la diputada Claudia Nogueira (2009)."
  claudia_perivancich:
    nombre: Claudia Perivancich
    cargo: Fiscal regional de Valparaíso
    notas: "Fiscal regional de Valparaíso. Designada por el Fiscal Nacional Jorge Abbott para investigar el Papaya Gate (2020), dirigió la formalización de la exintendenta Lucía Pinto en mayo de 2025 por fraude al fisco."
  victor_osorio:
    nombre: Víctor Osorio Reyes
    cargo: Ex ministro de Bienes Nacionales
    cargos:
      - cargo: Ministro de Bienes Nacionales
        organizacion: ministerio_bienes_nacionales
        desde: 2014-03-11
        hasta: 2016-10-19
    notas: "Ministro de Bienes Nacionales del segundo gobierno de Michelle Bachelet. En enero de 2016 valoró la petición del CDE de reabrir el caso Riggs para investigar las propiedades de CEMA Chile."
  nicolas_bakulic:
    nombre: Nicolás Bakulic
    cargo: Empresario, socio de inmobiliarias del Papaya Gate
    notas: "Empresario vinculado a las inmobiliarias que vendieron los terrenos del Papaya Gate (Guayacán, La Serena, La Herradura, Cerro Grande). En la formalización de mayo de 2025 el tribunal le autorizó ausentarse del país hasta el 30 de junio con caución de 10 millones de pesos."
  pablo_bracchitta:
    nombre: Pablo Bracchitta
    cargo: Gerente general de la Inmobiliaria Guayacán
    notas: "Gerente general de la Inmobiliaria Guayacán, una de las vendedoras de los terrenos del Papaya Gate. Fue formalizado en mayo de 2025 por fraude al fisco."
  carlos_williamson:
    nombre: Carlos Williamson Benapres
    cargo: Ex rector de la Universidad San Sebastián
    notas: "Economista, rector de la Universidad San Sebastián (desde 2018). Firmó el trato directo con el CPEIP para elaborar instrumentos de evaluación docente (julio 2019) y fue sondeado para dirigir la nueva Subsecretaría de Educación Superior, nombramiento que no se concretó."
  marcela_rosales:
    nombre: Marcela Rosales Belmar
    cargo: Dirigenta del Partido Socialista, dueña de la Automotora Vespucio San Ramón
    notas: "Antigua dirigente del PS e integrante del Comité Central del partido. Dueña de la automotora instalada en un terreno municipal concesionado de San Ramón (Parque La Bandera), según reveló CIPER en 2017."
  nelson_avila:
    nombre: Nelson Ávila
    cargo: Ex senador
    notas: "Senador que en agosto de 2009, junto a la Asociación Nacional de Funcionarios de Chiledeportes, pidió a Contraloría una auditoría por irregularidades en Chiledeportes, incluida la deuda de la ANFP con el Instituto Nacional del Deporte."
  jorge_bermudez:
    nombre: Jorge Bermúdez
    cargo: Ex Contralor General de la República
    notas: "Contralor General de la República (2017-2024). En septiembre de 2020 presentó una denuncia reservada ante la Fiscalía Nacional por el fraude al fisco del Papaya Gate, calificando de 'extrema gravedad' que el GORE de Coquimbo prescindiera del control jurídico de la Contraloría."
  raul_figueroa:
    nombre: Raúl Figueroa Salas
    cargo: Ex subsecretario de Educación
    cargos:
      - cargo: Ministro de Educación
        organizacion: ministerio_educacion
        desde: 2020-02-28
        hasta: 2022-03-11
    notas: "Ex subsecretario de Educación del segundo gobierno de Sebastián Piñera. Firmó junto al rector de la USS, Carlos Williamson, el trato directo del CPEIP para instrumentos de evaluación docente (julio 2019)."


