    notas: Diputado del Partido de la Gente. El 4 de agosto de 2026 celebró que la Cámara aprobara con "amplia mayoría" la solicitud de indulto particular para el excapitán de Carabineros Patricio Maturana.
  emiliano_fernandez:
    nombre: Emiliano Fernández
    notas: Panelista del programa de streaming La Cofradía. Aparece en el video
      junto a Omegna.
  fernando_ortiz:
    nombre: Fernando Ortiz
    notas: Panelista del programa de streaming La Cofradía. Cumpleañero en el video
      de la polémica.
  marcelo_anabalon:
    nombre: Marcelo Anabalón
    cargo: Asesor del diputado Pier Karlezi y exfuncionario de la Municipalidad de La Reina
    notas: "Integrante del programa de streaming La Cofradía. Antes del escándalo figuraba como empleado de la Municipalidad de La Reina (lo desvincularon tras los hechos) y asesor del diputado Pier Karlezi (PNL), percibiendo $5.954.241 mensuales. Investigación de El Mostrador (agosto 2026) sobre el financiamiento del ecosistema libertario."
  milton_izamith:
    nombre: Milton Izamith
    cargo: Fundador de la Casa Escuela de Legua Emergencia
    notas: "Profesor de la población Legua Emergencia, fundador de la Casa Escuela con la que colabora la Fundación Novum de Ítalo Omegna. El Mostrador cuestionó sus credenciales académicas: la PUC afirmó que nunca cursó Ingeniería Comercial ni que exista la carrera de Contador Auditor en esa casa de estudios (agosto 2026)."
  pier_karlezi:
    nombre: Pier Karlezi
    cargo: Diputado (PNL)
    cargos:
      - cargo: Diputado
        organizacion: partido_nacional_libertario
        desde: 2026-03-11
    notas: "Diputado del Partido Nacional Libertario. Marcelo Anabalón, integrante de La Cofradía, figuraba como su asesor antes del escándalo (El Mostrador, agosto 2026)."
  claudio_crespo:
    nombre: Claudio Crespo
    cargo: Exteniente coronel de Carabineros
    organizacion: carabineros
    notas: "Exteniente coronel de Fuerzas Especiales de Carabineros. Absuelto en enero de 2026 por el Cuarto Tribunal Oral en lo Penal de Santiago por las lesiones graves a Gustavo Gatica durante el estallido social de 2019 (aplicación de la Ley Nain Retamal y legítima defensa privilegiada). El 3 de agosto de 2026 la Corte de Apelaciones rechazó anular el juicio, dejando firme la absolución."
  gustavo_gatica:
    nombre: Gustavo Gatica
    cargo: Diputado
    notas: "Diputado que perdió la visión durante una manifestación en noviembre de 2019, en el contexto del estallido social, tras recibir perdigones disparados por el exteniente coronel de Carabineros Claudio Crespo. La Corte de Apelaciones confirmó en agosto de 2026 la absolución de Crespo."
  ximena_chong:
    nombre: Ximena Chong
    cargo: Fiscal de la Fiscalía Centro Norte
    notas: "Fiscal de la Fiscalía Centro Norte que lideró la investigación del caso Gatica. Tras el fallo de la Corte de Apelaciones que confirmó la absolución de Claudio Crespo (agosto 2026), señaló que se analizará la presentación de un recurso de queja."
  pedro_orthusteguy:
    nombre: Pedro Orthusteguy
    cargo: Abogado defensor de Claudio Crespo
    notas: "Abogado defensor del exteniente coronel de Carabineros Claudio Crespo. Celebró en X el fallo de la Corte de Apelaciones que rechazó todos los recursos de nulidad en el caso Gatica (agosto 2026), calificándolo de 'triunfo absoluto, unánime, limpio e inapelable' tras seis años de persecución penal."
  beatriz_contreras:
    nombre: Beatriz Contreras
    cargo: Jefa regional metropolitana del INDH
    organizacion: indh
    notas: "Jefa regional metropolitana del Instituto Nacional de Derechos Humanos. Tras el fallo que confirmó la absolución de Claudio Crespo (agosto 2026), manifestó la 'profunda preocupación' del organismo por el impacto en otras causas de graves violaciones de derechos humanos del estallido social y advirtió que constituye 'una nueva señal de impunidad'."
  jacqueline_metayer:
    nombre: Jacqueline Metayer
    cargo: Exfuncionaria del Ministerio de la Mujer
    notas: "Cientista política y exfuncionaria del Ministerio de la Mujer ligada a la exsubsecretaria Daniela Castro. Se le habría ascendido de grado 9 a 12 minutos antes de la salida de Castro el 16 de junio de 2026 (Resolución RA 121583-134-2026). Dejó de ser parte de la cartera el 3 de agosto de 2026 en el marco de la 'poda' de la ministra Judith Marín."
  paula_figueroa:
    nombre: Paula Figueroa
    cargo: Exjefa de la División Jurídica del Ministerio de la Mujer
    notas: "Exjefa de la División Jurídica del Ministerio de la Mujer, exfuncionaria de la alcaldía de Maipú en la administración de Cathy Barriga. Obtuvo un aumento de $1.881.823 por funciones críticas (haberes totales de $8.878.400, superiores a los de la ministra). Dejó de ser parte de la cartera el 3 de agosto de 2026."
  michel_cartes:
    nombre: Michel Cartes
    cargo: Exasesor de la ministra de la Mujer Judith Marín
    notas: "Arquitecto y asesor cercano a la ministra de la Mujer Judith Marín, parte del movimiento socialcristiano. Cuestionado por la falta de título de arquitecto, renunció voluntariamente el 29 de junio de 2026 con efecto al 1 de agosto (remuneración superior a $3 millones). The Clinic accedió a su carta de renuncia."
  oscar_guardiola_rivera:
    nombre: Oscar Guardiola-Rivera
    cargo: Académico y autor
    notas: "Académico, abogado y autor colombiano-británico, profesor en Birkbeck (Universidad de Londres). Autor de la columna de opinión en The Guardian (24 de octubre de 2019) 'The risk to democracy in Chile isn't from protesters. It's from Piñera and the 1%', donde sostiene que la represión del estallido evocaba los métodos de la dictadura de Pinochet y que el modelo neoliberal chileno estaba en el origen de la crisis."
  fabiola_campillai:
    nombre: Fabiola Campillai
    cargo: Senadora (Ind.)
    cargos:
      - cargo: Senadora (Ind.)
        organizacion: senado
        desde: 2026-03-11
    notas: Criticó duramente el video, calificando a los participantes como
      "repulsivos".
  patricio_maturana:
    nombre: Patricio Maturana
    cargo: Excapitán de Carabineros, condenado
    organizacion: carabineros
    notas: "Excapitán de Carabineros condenado a 12 años y 183 días de presidio efectivo por apremios ilegítimos con resultado de lesiones gravísimas: el 26 de noviembre de 2019, en San Bernardo, percutió una bomba lacrimógena que dejó ciega a Fabiola Campillai. En el sumario interno que ventiló su caso (febrero-marzo 2020) declaró no haberse percatado de personas heridas y conocer el comentario '¿se la pitió?' solo tras revisar el video. Con beneficio de salida dominical desde febrero de 2026. En marzo de 2025, José Antonio Kast anunció que revisaría su caso e impulsaría su indulto."
  nubia_vivanco:
    nombre: Nubia Vivanco
    cargo: Abogada defensora de Patricio Maturana
    notas: "Abogada de Patricio Maturana. Ingresó el escrito de solicitud de indulto particular ante el Ministerio de Justicia un día después de la asunción de José Antonio Kast como presidente."
  jaime_fernandez_sepulveda:
    nombre: Capitán Jaime Fernández Sepúlveda
    cargo: Capitán de Carabineros de la Tenencia de San Bernardo
    organizacion: carabineros
    notas: "Capitán de Carabineros de la Tenencia de San Bernardo. Portaba la cámara GoPro en el pecho que grabó el video del caso Campillai. En el sumario administrativo confirmó haber dicho '¿se la pitió, verdad?' y 'El Matu parece que le pegó, le pegó con una' al interior de la patrulla, pero declaró no poder precisar quién efectuó el tercer disparo."
  jorge_guaita:
    nombre: Mayor Jorge Guaita
    cargo: Fiscal de Carabineros en el caso Campillai
    organizacion: carabineros
    notas: "Mayor de Carabineros, fiscal general de su institución que —tras el estallido social— quedó a cargo del sumario administrativo por el caso Campillai. En su informe del 20 de febrero de 2020 reportó que en el video grabado con la GoPro del capitán Fernández se registraba el diálogo '¿se la pitió, verdad?' y pidió que se designara a un nuevo fiscal de la policía uniformada."
  mario_vargas:
    nombre: Mario Vargas
    cargo: Abogado penalista
    notas: "Abogado penalista. En 2020 defendió al capitán Patricio Maturana en el sumario interno por el caso Campillai (el 24 de abril de 2020 la institución le entregó copia del sumario; prevaleció que no existían antecedentes suficientes para atribuir responsabilidad a Maturana). Junto a Eduardo Lagos y Gabriel Silber integró la sociedad de abogados que asesoró a Inmobiliaria Fundamenta y al Consorcio Bielorruso Belaz Movitec (trama bielorrusa) y está bajo la lupa por la arista Fundamenta del caso Audios (ver evento 20260805-29)."
  eduardo_lagos:
    nombre: Eduardo Lagos
    cargo: Abogado penalista
    notas: "Abogado penalista, asesor legal de Inmobiliaria Fundamenta junto a Mario Vargas y Gabriel Silber. Imputado en la 'trama bielorrusa' (causa Consorcio Belaz Movitec con Codelco) por soborno, cohecho y lavado de activos. En la arista Fundamenta del caso Audios, la Fiscalía Regional de Los Lagos detectó que ordenó un depósito de $13 millones a Gonzalo Migueles, pareja de la entonces ministra de la Corte Suprema Ángela Vivanco, cuatro días después del fallo favorable de la Tercera Sala (CIPER, 15-jul-2026)."
  gabriel_silber:
    nombre: Gabriel Silber
    cargo: Abogado
    notas: "Abogado integrante de la sociedad Lagos, Vargas y Silber que asesoró a Inmobiliaria Fundamenta en la disputa de Plaza Egaña SpA (fallo favorable de la Tercera Sala, 1-mar-2023). En julio de 2026 desclasificó una discusión con portazos y gritos en la oficina de Lagos y Vargas por los supuestos pagos a Gonzalo Migueles (La Tercera, 30-jul-2026)."
  gonzalo_migueles:
    nombre: Gonzalo Migueles
    cargo: Pareja de la exministra de la Corte Suprema Ángela Vivanco
    notas: "Pareja de la exministra de la Corte Suprema Ángela Vivanco. Recibió en su cuenta un depósito de $13 millones realizado el 28 de febrero de 2023 por Martín Peña por orden del abogado Eduardo Lagos, cuatro días después del fallo favorable a Inmobiliaria Fundamenta. El OS7 de Carabineros rastreó sus cuentas (informe del 29-jul-2026) por presunto lavado en el caso Fundamenta."
  diego_simpertigue:
    nombre: Diego Simpértigue
    cargo: Exministro de la Corte Suprema
    notas: "Exministro de la Corte Suprema que integró la Tercera Sala para el fallo clave a favor de Inmobiliaria Fundamenta (marzo de 2023) gracias a gestiones de la entonces ministra Ángela Vivanco. Amigo de los abogados Eduardo Lagos y Mario Vargas; viajó con ellos y sus parejas en un crucero por Europa financiado por Vargas (CIPER, nov-2025)."
  sergio_munoz:
    nombre: Sergio Muñoz Gajardo
    cargo: Exministro de la Corte Suprema
    notas: "Exministro de la Corte Suprema que fue inhabilitado en la causa de Inmobiliaria Fundamenta (Plaza Egaña SpA) tras conocerse que su hija, Graciel Muñoz, había firmado una promesa de compraventa en el edificio Egaña. Su salida de la sala destrabó el recurso que favorecía a la inmobiliaria (CIPER, caso Fundamenta)."
  martin_pena:
    nombre: Martín Peña
    cargo: Mecánico, antiguo cliente del abogado Eduardo Lagos
    notas: "Mecánico y antiguo cliente del abogado Eduardo Lagos. Declaró ante la Fiscalía Regional de Los Lagos que por orden de Lagos depositó $13 millones en efectivo en la cuenta de Gonzalo Migueles (28-feb-2023) tras cobrar el cheque de la venta de una retroexcavadora (caso Fundamenta)."
  mario_carroza:
    nombre: Mario Carroza
    cargo: Ministro de la Corte Suprema
    notas: "Ministro de la Corte Suprema que quedó a cargo de redactar el fallo a favor de Inmobiliaria Fundamenta (1-mar-2023). Declaró en la arista Fundamenta (24-jun-2026) que el fallo 'salió muy rápido' y que ello 'no es usual' para esa materia."
  pablo_medina:
    nombre: Pablo Medina
    cargo: Gerente de Inmobiliaria Fundamenta
    notas: "Ejecutivo de Inmobiliaria Fundamenta. Declaró ante la Fiscalía que el pago de 16 mil UF a los abogados Lagos, Vargas y Silber solo se haría si el fallo favorable en la Corte Suprema salía antes del 1 de marzo de 2023 (y desde el 2 de marzo bajaba a 8 mil UF)."
  hector_barros:
    nombre: Héctor Barros
    cargo: Fiscal Regional Metropolitano Sur
    notas: "Fiscal Regional Metropolitano Sur, a cargo de la Operación Tokio (jun-2026), que desarticuló la red de lavado de dinero del Tren de Aragua. Declaró: 'Por primera vez les pegamos donde más les duele'."
  carlos_gomez_moreno:
    nombre: Carlos Gómez Moreno
    cargo: Jefe del Tren de Aragua en Chile (alias 'Bobby')
    notas: "Líder del Tren de Aragua en Chile, alias 'Bobby', jefe de la célula 'Los Piratas'. Ordenó el secuestro y homicidio del teniente Ronald Ojeda y participó en la matanza de cinco personas en Batuco (abr-2023). Capturado en Colombia en diciembre de 2024 en un operativo con detectives chilenos y la DEA; desde la cárcel La Picota en Bogotá siguió dirigiendo extorsiones y la red de lavado desarticulada por la Operación Tokio."
  jose_carlos_perez_asencio:
    nombre: José Carlos Pérez Asencio
    cargo: Ejecutivo de Banco Santander
    notas: "Ciudadano venezolano, ejecutivo de Banco Santander desde 2019. Detenido en la Operación Tokio (jun-2026) por haber diseñado el esquema de apertura de cuentas corrientes para lavar dinero del Tren de Aragua."
  rossana_blanco:
    nombre: Rossana Blanco
    cargo: Ejecutiva de BancoEstado
    notas: "Ejecutiva de BancoEstado (funcionaria de una empresa externa que prestaba servicios al banco) formalizada en la Operación Tokio (jun-2026). La PDI allanó la sucursal de Huérfanos con Morandé tras confirmarse su participación en la red."
  mario_cayul:
    nombre: Mario Cayul
    cargo: Juez del Séptimo Juzgado de Garantía de Santiago
    notas: "Juez del Séptimo Juzgado de Garantía de Santiago. Decretó la prisión preventiva de Manuel Monsalve (19-nov-2024) por violación y abuso sexual; en 2026 conoció también la querella por injurias de Mario Desbordes contra un tuitero."
  xavier_armendariz:
    nombre: Xavier Armendáriz
    cargo: Fiscal de la Fiscalía Metropolitana Centro Norte
    notas: "Fiscal del Ministerio Público que expuso los hechos en la formalización de Manuel Monsalve por violación y abuso sexual (noviembre de 2024)."
  maria_ines_horvitz:
    nombre: María Inés Horvitz
    cargo: Abogada defensora
    notas: "Abogada penalista que encabezó la defensa de Manuel Monsalve en su formalización por violación y abuso sexual (noviembre de 2024), junto a Lino Disi y Cristian Arias."
  maria_elena_santibanez:
    nombre: María Elena Santibáñez
    cargo: Abogada de la denunciante en el caso Monsalve
    notas: "Abogada de la víctima en el caso Monsalve. Tras la prisión preventiva decretada el 19 de noviembre de 2024 señaló que su representada 'está muy emocionada' y que 'no está bien, está con tratamiento sicológico'."
  alfonso_de_urresti:
    nombre: Alfonso de Urresti
    cargo: Senador PS
    notas: "Senador PS. En abril de 2024 participó como invitado en la Comisión de Ciencias de la Cámara, donde denunció 'desorden y discrecionalidad' en la entrega de Becas Chile y criticó el procedimiento de cobranza 'extremadamente dilatorio' a los deudores."
  patricia_cerda:
    nombre: Patricia Cerda
    cargo: Fiscal de la Fiscalía Centro Norte
    notas: "Fiscal del Ministerio Público a cargo de las investigaciones de la Fiscalía Centro Norte contra el Partido de la Gente (PDG) por la denuncia del Servel por gastos no acreditados (falsificación de firmas e irregularidades en rendición de gastos). En agosto de 2026 ordenó diligencias para el levantamiento patrimonial de Franco Parisi y otros 10 militantes del partido por presunto lavado de activos y fraude de subvenciones, requiriendo informes a la UAF."
  patricia_negretti:
    nombre: Patricia Negretti
    cargo: Perito forense del Servicio Médico Legal
    notas: "Perito forense del SML. En su informe sobre el caso Campillai concluyó que 'existe concordancia entre los hallazgos del examen y los alegaciones de abuso', detallando que las lesiones eran explicables por un objeto contundente de alta energía y determinando secuelas funcionales permanentes."
  paola_zarate_ruiz:
    nombre: Paola Zárate Ruiz
    cargo: Fiscal del Ministerio Público
    notas: "Fiscal del Ministerio Público (Fiscalía Occidente). El 9 de abril de 2020 solicitó a Carabinos el sumario administrativo del caso Campillai, incorporado la investigación penal. El sumario acumuló 222 carillas."
  alfredo_echavarria:
    nombre: Alfredo Echavarría
    cargo: Presidente de la Cámara Chilena de la Construcción
    organizacion: cchc
    notas: "Presidente de la CChC. Celebró la ampliación del subsidio a la tasa hipotecaria a 6.000 UF (agosto 2026) como una iniciativa 'largamente esperada por nuestro sector'."
  tamara_ramirez:
    nombre: Tamara Ramírez
    cargo: Subjefa de bancada (PDG)
    notas: Exigió explicaciones públicas y responsabilidades por el video.
  anuar_quesille:
