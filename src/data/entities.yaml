    tipo: tribunal
    pais: Chile
    notas: "Máximo tribunal del país. En octubre de 2024 removió por unanimidad a la ministra Ángela Vivanco (caso Audios), la primera destitución de un ministro del Pleno en 23 años."
  corte_apelaciones_la_serena:
    nombre: Corte de Apelaciones de La Serena
    tipo: tribunal
