    notas: Llamó "manga de cobardes y sinvergüenzas" a Kast y Quiroz
  daniel_matamala:
    nombre: Daniel Matamala
    cargo: Periodista
    notas: "Periodista y conductor del podcast Animales Políticos junto a Cristóbal Bellolio. Entrevistó a Camila Vallejo en julio de 2026."
  francisco_pulgar:
    nombre: Francisco Pulgar
    cargo: Diputado (UDI)
    organizacion: union_democrata_independiente
    notas: "Diputado por el Maule. Impulsó junto a la diputada Consuelo Veloso las denuncias que llevaron al informe de Contraloría sobre pagos irregulares en la Municipalidad de Villa Alegre (2026)."
  jose_castillo:
