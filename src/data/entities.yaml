    organizacion: centro_uc_encuestas
    notas: "Economista laboral, director del Centro UC de Encuestas y Estudios Longitudinales. Sobre la entrada en vigencia de las 42 horas (abril 2026) advirtió que implica un incremento de 4,8% en los costos laborales y un golpe al empleo sin que haya aumentado la productividad."
  juan_bravo:
    nombre: Juan Bravo
    cargo: Director del Observatorio del Contexto Económico de la UDP (OCEC-UDP)
    organizacion: ocec_udp
    notas: "Economista, director del OCEC-UDP. Sobre las 42 horas (abril 2026) estimó un aumento del costo salarial por hora de 4,8% en los segmentos sin opciones de reorganización productiva, afectando a ocupaciones de atención a público, vigilancia, cuidadores y choferes."
  jose_pakomio:
    nombre: José Pakomio
    cargo: Presidente de la Cámara Nacional de Comercio (CNC)
    organizacion: cnc
    notas: "Presidente de la CNC. Ante la entrada en vigencia de las 42 horas (abril 2026) alertó por el aumento del costo laboral directo de las empresas y recordó que el comercio está compuesto en un 96% por pymes."
  paola_assael:
