    organizacion: presidencia_chile
    notas: "Concejala de Las Condes (2021-2024) y fundadora del Partido Republicano. Abogada con paso por el sector público (CPEIP del Mineduc, primer gobierno de Piñera) y el privado (fusiones y adquisiciones). Asumió en reemplazo de Carolina Araya, quien estaba con prenatal."
  claudio_alvarado:
    nombre: Claudio Alvarado Andrade
    cargo: Biministro del Interior y Segegob
    cargos:
      - cargo: Diputado por Chiloé y Palena
        organizacion: camara_diputados
