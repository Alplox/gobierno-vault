    pais: Chile
    notas: "Comisión encargada de certificar competencias laborales. La Mesa de Reactivación Laboral (junio 2026) propuso integrarla al Sistema de Desarrollo Continuo de Habilidades Productivas (SDCHP) con un portal único."
