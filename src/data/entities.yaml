        hasta: 2014-03-11
      - cargo: Subsecretario General de la Presidencia
        organizacion: ministerio_segpres
        desde: 2018-03-11
        hasta: 2019-03-11
      - cargo: Ministro Secretario General de la Presidencia
        organizacion: ministerio_segpres
        desde: 2020-06-04
        hasta: 2020-07-28
      - cargo: Senador por Los Ríos
        organizacion: senado
        desde: 2020-07-28
        hasta: 2026-03-11
      - cargo: Ministro del Interior
        organizacion: ministerio_interior
        desde: 2026-03-11
        hasta: 2026-05-19
      - cargo: Biministro del Interior y Segegob
        organizacion: ministerio_interior
        desde: 2026-05-19
    organizacion: ministerio_interior
    notas: "Militante UDI desde 2001. Ingeniero Comercial de la Escuela de Negocios de Valparaíso. Alcalde designado de Quemchi (1985-1986) bajo Pinochet. Diputado por Chiloé y Palena 1994-2010. Fue subsecretario de la Segpres en ambos gobiernos de Piñera y ministro de la Segpres solo 54 días (jun-jul 2020), hasta asumir el cupo senatorial de Víctor Pérez. Rol histórico de negociador con la oposición; lideró el acuerdo constitucional de 2019. Autor de 9 proyectos que se convirtieron en ley (BCN). Historial de cargos según perfil de la serie r/chile 'Quién es quién en el gabinete' (complementario): fechas aproximadas, validar con BCN/prensa."
  isabel_valenzuela_ahumada:
    nombre: Isabel Valenzuela Ahumada
    cargo: Alcaldesa de Colina
    notas: Colaboradora de opinión en BioBioChile; defendió el rol del servicio público durante el sistema frontal.
  cristian_valenzuela:
    nombre: Cristián Valenzuela Bustos
    cargo: Coordinador de asesores del gabinete presidencial
