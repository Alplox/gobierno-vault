    pais: Chile
    notas: "Seguro social de cesantía financiado con cotizaciones de trabajadores y empleadores. La Mesa de Reactivación Laboral (junio 2026) propuso financiar con una cotización adicional al Seguro de Cesantía la indemnización a todo evento y compensar parcialmente las horas reducidas en el mecanismo de reducción temporal de jornada ante shocks económicos."
  superintendencia_pensiones:
    nombre: Superintendencia de Pensiones
    tipo: organismo_estado
    pais: Chile
    notas: "Organismo fiscalizador del sistema de pensiones. La Mesa de Reactivación Laboral (junio 2026) pidió que el INE explique técnicamente las discrepancias entre la estimación de cotizantes de la ENE y los registros administrativos de la Superintendencia."
