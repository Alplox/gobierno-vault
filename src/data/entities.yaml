    notas: "Presidente de Estados Unidos en su segundo mandato (desde enero de 2025). Su administración buscó relanzar los lazos bilaterales con Chile tras la asunción de José Antonio Kast, con el envío de Marco Rubio al cambio de mando del 11 de marzo de 2026."
  andres_chadwick:
    nombre: Andrés Chadwick Piñera
    cargo: Exministro del Interior de Sebastián Piñera
    cargos:
      - cargo: Ministro del Interior y Seguridad Pública
        organizacion: ministerio_interior
        desde: 2012-11-05
        hasta: 2014-03-11
      - cargo: Ministro del Interior y Seguridad Pública
        organizacion: ministerio_interior
        desde: 2018-03-11
        hasta: 2019-10-28
    organizacion: ministerio_interior
    notas: "Primo de Sebastián Piñera. Imputado en el caso Hermosilla por su rol en gestiones para influir en la Fiscalía y cerrar causas por financiamiento ilegal de la política."
  luis_hermosilla:
    nombre: Luis Hermosilla
    cargo: Abogado imputado en el caso Audios
    notas: "Abogado penalista. Imputado en el caso Audios. Acusado de intermediar entre Andrés Chadwick y el exfiscal Manuel Guerra para influir en investigaciones judiciales. Cumple arresto domiciliario nocturno desde que se le sustituyera el arresto domiciliario total; en agosto de 2026 se reveló que incumplió la medida al no atender a Carabineros en una fiscalización."
  juan_pablo_hermosilla:
    nombre: Juan Pablo Hermosilla
    cargo: Abogado defensor de Luis Hermosilla
    notas: "Hermano y abogado defensor de Luis Hermosilla. El 31 de julio de 2026 informó al 4º Juzgado de Garantía de Santiago el cambio de domicilio de su hermano desde Vitacura a Providencia, solicitando notificar a Carabineros para asegurar el cumplimiento del arresto domiciliario nocturno."
  manuel_guerra:
    nombre: Manuel Guerra
    cargo: Exfiscal Regional Metropolitano Oriente en prisión preventiva
    notas: "Expersecutor Oriente. Cumple prisión preventiva desde marzo de 2026 por cohecho, prevaricación y revelación de secreto en el caso Hermosilla."
  santiago_valdes:
    nombre: Santiago Valdés
    cargo: Exadministrador electoral de la campaña presidencial de Sebastián Piñera (2009-2010)
    notas: "Exadministrador electoral de la campaña presidencial de Sebastián Piñera 2009-2010 e hijo de uno de sus mejores amigos. Investigado por facturas falsas que habrían financiado ilegalmente la campaña."
  paulina_vodanovic:
    nombre: Paulina Vodanovic
    cargo: Senadora y presidenta del Partido Socialista
    cargos:
      - cargo: Presidenta del Partido Socialista
        organizacion: partido_socialista
        desde: 2022-06-11
    organizacion: partido_socialista
    notas: "Senadora. Asumió la presidencia del PS el 11 de junio de 2022 y fue reelecta el 16 de marzo de 2025 encabezando la lista 'Unidad Socialista'."
  gabriela_pizarro:
    nombre: Gabriela Pizarro
    cargo: Editora de Reportea
    organizacion: reportea
    notas: "Periodista de investigación. Editora de Reportea, medio que destapó los chats de Hermosilla con Andrés Chadwick."
  nicolas_sepulveda:
    nombre: Nicolás Sepúlveda
    cargo: Director de Reportea
    organizacion: reportea
    notas: "Periodista de investigación. Director de Reportea. Coautor del reportaje sobre los chats de Hermosilla con Chadwick."
  ignacio_walker:
    nombre: Ignacio Walker Prieto
    cargo: Excanciller
    cargos:
      - cargo: Ministro de Relaciones Exteriores
        organizacion: ministerio_relaciones_exteriores
        desde: 2004-09-29
        hasta: 2006-03-11
    notas: "Abogado y político democratacristiano. Exministro de Relaciones Exteriores (2006-2009) y exsenador. Criticó la diplomacia de EE.UU. hacia Chile."
  juan_gabriel_valdes:
    nombre: Juan Gabriel Valdés Soublette
    cargo: Excanciller
    cargos:
      - cargo: Ministro de Relaciones Exteriores
        organizacion: ministerio_relaciones_exteriores
        desde: 1999-06-22
        hasta: 2000-03-11
    notas: "Político de la Concertación. Exministro de Relaciones Exteriores (1999-2000) y embajador de Chile ante la ONU. Criticó el tono del embajador de EE.UU. Brandon Judd."
  jose_miguel_insulza:
    nombre: José Miguel Insulza Salinas
    cargo: Excanciller y exsecretario general de la OEA
    cargos:
      - cargo: Ministro del Interior
        organizacion: ministerio_interior
        desde: 2000-03-11
        hasta: 2005-05-24
      - cargo: Ministro de Relaciones Exteriores
        organizacion: ministerio_relaciones_exteriores
        desde: 1994-09-20
        hasta: 1999-06-22
    notas: "Político socialista. Exministro de Relaciones Exteriores (1994-1999), exministro del Interior y secretario general de la OEA (2005-2015). Sobre el primer sondeo de la ONU que dejó a Bachelet en cuarto lugar, dijo en Radio Duna que 'lo preocupante son los cinco desestímulos' y que quedaba espacio para revertir el resultado."
  jose_antonio_viera_gallo:
    nombre: José Antonio Viera-Gallo Quesney
    cargo: Exministro y exembajador
    cargos:
      - cargo: Ministro Secretario General de la Presidencia
        organizacion: segpres
        desde: 2007-03-26
        hasta: 2010-03-11
    notas: "Abogado y político del PPD. Exministro secretario general de la Presidencia (1990-1994) y embajador de Chile ante la ONU. Tras el primer sondeo de la ONU señaló que la candidatura de Bachelet tenía un escollo en el gobierno de Donald Trump."
  heraldo_munoz:
    nombre: Heraldo Muñoz Valenzuela
    cargo: Excanciller
    cargos:
      - cargo: Ministro de Relaciones Exteriores
        organizacion: ministerio_relaciones_exteriores
        desde: 2014-03-11
        hasta: 2018-03-11
      - cargo: Ministro Secretario General de Gobierno
        organizacion: segegob
        desde: 2002-01-07
        hasta: 2004-07-13
    notas: "Político y académico del PPD. Exministro de Relaciones Exteriores (2014-2018) y embajador de Chile ante la ONU. Tras el primer sondeo de la ONU explicó que 'no hay nada resuelto y vienen varias votaciones informales más' y que Bachelet analizaría los resultados con Brasil y México."
  alejandro_irarrazaval:
    nombre: Alejandro Irarrázaval
    cargo: Jefe del grupo de asesores del Presidente
    notas: "Abogado y analista político de derecha. El hombre más influyente del equipo de gobierno de José Antonio Kast y jefe de sus asesores en el Segundo Piso de La Moneda. Participó junto a Kast y al ministro Jorge Quiroz en la definición final del paquete económico (abril 2026)."
  irina_karamanos:
    nombre: Irina Karamanos
    cargo: Expareja del presidente Gabriel Boric y exdirectora de la Fundación Cultural
    notas: "Socióloga y cientista política, expareja de Gabriel Boric y exdirectora de la Fundación Cultural. Su lenguaje se volvió símbolo del esfuerzo identitario del Frente Amplio; se llegó a ironizar con que había inventado un 'idioma propio', el 'karamanés' (La Tercera, marzo 2026)."
  alfredo_joignant:
    nombre: Alfredo Joignant
    cargo: Sociólogo y académico de la UDP
    notas: "Sociólogo y politólogo, doctor en Ciencias Políticas de la Universidad de París y profesor de la UDP. Autor junto a Mauro Basaure del libro 'La gran desconexión' sobre la crisis del lenguaje de la izquierda: 'la lengua de la izquierda puede terminar convertida en una lengua muerta, como el latín' (La Tercera, marzo 2026)."
  eugenio_tironi:
    nombre: Eugenio Tironi
    cargo: Sociólogo y consultor
    notas: "Sociólogo, académico y consultor. Analizó cómo Irina Karamanos se convirtió en símbolo del esfuerzo identitario del Frente Amplio y por qué ese discurso no conectaba con el común de la gente (La Tercera, marzo 2026)."
  eugenia_pirzio_biroli:
    nombre: Eugenia Pirzio-Biroli
    cargo: Exalcaldesa de Cisnes
    notas: "La 'bruja de Pinochet': nacida en Italia en 1906, llegó a Chile en 1947, fue autoridad en la Patagonia y alcaldesa de Cisnes durante la dictadura. Su supuesta influencia sobre el dictador a través de tarot y cartas astrales generó controversia (perfil histórico de BioBioChile, agosto 2026)."
  javiera_toro:
    nombre: Javiera Toro Cáceres
    cargo: Ministra de Desarrollo Social y Familia
    cargos:
      - cargo: Ministra de Desarrollo Social y Familia
        organizacion: ministerio_desarrollo_social
        desde: 2022-08-25
        hasta: 2026-03-11
    notas: "Abogada y militante de Comunes. Ministra de Desarrollo Social y Familia del gobierno de Gabriel Boric. Defendió al Frente Amplio del 'lenguaje caricaturesco' que instaló la derecha sobre su agenda (La Tercera, marzo 2026)."
  bettina_horst:
    nombre: Bettina Horst
    cargo: Economista de Libertad y Desarrollo
    organizacion: libertad_y_desarrollo
    notas: "Economista de Libertad y Desarrollo. Ha cuestionado la lógica proteccionista de la administración Trump hacia Chile."
  nicolas_eyzaguirre:
    nombre: Nicolás Eyzaguirre Guzmán
    cargo: Exministro de Hacienda
    cargos:
      - cargo: Ministro de Hacienda
        organizacion: ministerio_hacienda
        desde: 2000-03-11
        hasta: 2006-03-11
      - cargo: Ministro de Hacienda
        organizacion: ministerio_hacienda
        desde: 2017-08-31
        hasta: 2018-03-11
      - cargo: Ministro de Educación
        organizacion: ministerio_educacion
        desde: 2014-03-11
        hasta: 2015-06-27
    notas: "Economista y político PPD. Exministro de Hacienda (2006-2010). Afirmó que 'Estados Unidos actúa como un matón' y que 'el ofensor se da por ofendido' respecto al arancel de 12,5%."
  cristian_monckeberg:
    nombre: Cristián Monckeberg Bruner
    cargo: Exministro y expresidente de Renovación Nacional
    cargos:
      - cargo: Ministro de Vivienda y Urbanismo
        organizacion: ministerio_vivienda
        desde: 2018-03-11
        hasta: 2020-06-04
      - cargo: Ministro de Desarrollo Social y Familia
        organizacion: ministerio_desarrollo_social
        desde: 2020-06-04
        hasta: 2020-07-28
    notas: "Abogado y político RN. Expresidente de Renovación Nacional y exministro. Criticó que el embajador Judd mande 'a leer el tratado' a ministros chilenos."
  leonardo_prieto:
    nombre: Leonardo Prieto
    cargo: Socio y conductor de Porcel TV
    organizacion: porcel_tv
    notas: "Realizador audiovisual, propietario de Porcel TV SpA a través de La Cava del Capitán SpA. Exsocio de Felipe Costabal. Arrendatario del Estudio 5 de TVN para el programa Próceres."
  patricio_dussaillant:
    nombre: Patricio Dussaillant
    cargo: Presidente del directorio de TVN
    organizacion: tvn
    notas: "Presidente del directorio de Televisión Nacional de Chile. Exdirector de Periodismo de la Universidad de Los Andes. Conoce a Felipe Costabal desde 2001."
  renato_garin:
    nombre: Renato Garín
    cargo: Exdiputado
    notas: "Exdiputado. Conductor del programa Sin Filtros. Reveló que Porcel TV realiza su programa en dependencias de TVN."
  macarena_santelices:
    nombre: Macarena Santelices Cañas
    cargo: Diputada (Republicanos)
    cargos:
      - cargo: Ministra de la Mujer y la Equidad de Género
        organizacion: ministerio_mujer
        desde: 2020-05-06
        hasta: 2020-06-09
    notas: "Diputada del Partido Republicano. Cónyuge de Leonardo Prieto. Felipe Costabal fue proveedor de campaña de la parlamentaria."
  pamela_le_roy:
    nombre: Pamela Le Roy
    cargo: Conductora de Próceres (Porcel TV)
    organizacion: porcel_tv
    notas: "Exintegrante del equipo de CQC. Conduce el programa Próceres de Porcel TV junto a Gonzalo Feito, realizado en un estudio de TVN."
  gonzalo_feito:
    nombre: Gonzalo Feito
    cargo: Conductor de Próceres (Porcel TV)
    organizacion: porcel_tv
    notas: "Exintegrante del equipo de CQC. Conduce el programa Próceres de Porcel TV junto a Pamela Le Roy, realizado en un estudio de TVN."
  jose_francisco_lagos:
    nombre: José Francisco Lagos
    cargo: Subsecretario General de Gobierno (Segegob)
    notas: "Subsecretario General de Gobierno. Dio a conocer en el Congreso el proyecto de ley que crearía un fondo patrimonial de US$30 millones para TVN."
  jose_luis_murillo:
    nombre: José Luis Murillo
    cargo: Gerente general de Aguas del Valle
    notas: "Gerente general de la sanitaria Aguas del Valle. Describió los daños en las instalaciones tras el desbordamiento del río Elqui en julio de 2026."
  miguel_krassnoff:
    nombre: Miguel Krassnoff
    cargo: Brigadier (r) del Ejército
    notas: "Exoficial de la DINA. Condenado por crímenes de lesa humanidad, suma más de mil años de condena. Recluso en el ex penal Punta Peuco."
  alvaro_corbalan:
    nombre: Álvaro Corbalán
    cargo: Teniente coronel (r) del Ejército
    notas: "Exjefe de operaciones de la CNI. Condenado por crímenes de lesa humanidad, incluyendo la Operación Albania. Recluso en el ex penal Punta Peuco."
  carlos_herrera_jimenez:
    nombre: Carlos Herrera Jiménez
    cargo: Mayor (r) del Ejército
    notas: "Exagente de la CNI. Condenado por el asesinato del presidente de la ANEF, Tucapel Jiménez. Recluso en el ex penal Punta Peuco."
  raul_iturriaga:
    nombre: Raúl Iturriaga Neumann
    cargo: General (r) del Ejército
    notas: "Exjefe de la División Exterior de la DINA. Condenado por crímenes de lesa humanidad. Recluso en el ex penal Punta Peuco."
  jaime_gajardo:
    nombre: Jaime Gajardo Falcón
    cargo: Exministro de Justicia
    cargos:
      - cargo: Ministro de Justicia y Derechos Humanos
        organizacion: ministerio_justicia
        desde: 2024-10-17
        hasta: 2026-03-11
    notas: "Exministro de Justicia del gobierno de Gabriel Boric. Criticó la idea de restituir a Punta Peuco como cárcel especial."
  maria_jesus_wulf:
    nombre: María Jesús Wulf Le May
    cargo: Ministra de Desarrollo Social y Familia
    organizacion: ministerio_desarrollo_social
    cargos:
      - cargo: Ministra de Desarrollo Social y Familia
        organizacion: ministerio_desarrollo_social
        desde: 2026-03-11
    notas: "Ministra de Desarrollo Social y Familia del gobierno de José Antonio Kast. Anunció el proyecto que estudia usar ClaveÚnica para verificación de edad en redes sociales."
  diego_schalper:
    nombre: Diego Schalper
    cargo: Diputado (Renovación Nacional)
    organizacion: renovacion_nacional
    notas: "Diputado RN. Jefe de bancada. Impulsor del proyecto que prohíbe el acceso de menores de 16 años a redes sociales y plataformas digitales. El 6 de agosto de 2026 calificó la Agenda ACOT de Kast como 'respuesta clara y contundente'."
  maria_jose_gatica:
    nombre: María José Gatica
    cargo: Senadora (Renovación Nacional)
    organizacion: renovacion_nacional
    notas: "Senadora RN y jefa de bancada. El 6 de agosto de 2026 respaldó la Agenda ACOT de Kast como 'firme para combatir el crimen organizado', destacando la colaboración de las Fuerzas Armadas con las policías."
  constanza_martinez:
    nombre: Constanza Martínez
    cargo: Presidenta del Frente Amplio
    organizacion: frente_amplio
    notas: "Presidenta del Frente Amplio y carta de la continuidad en la elección interna de la colectividad. El 6 de agosto de 2026 criticó con dureza el plan de seguridad de Kast, afirmando que 'acusaron el golpe' y que apelan a 'normas represivas que no resuelven el problema en las poblaciones'."
  joel_velasco:
    nombre: Joel Velasco
    cargo: Vicepresidente de UnitedHealth Group
    organizacion: unitedhealth_group
    notas: "Ejecutivo estadounidense, vicepresidente de UnitedHealth Group, dueño del 96% de Banmédica desde 2018. Participó en el almuerzo de José Antonio Kast en Washington D.C. en noviembre de 2021."
  maria_paulina_uribe:
    nombre: María Paulina Uribe
    cargo: Gerenta de Marketing de PepsiCo
    organizacion: pepsico
    notas: "Ejecutiva colombiana, gerenta de Marketing de PepsiCo. Participó en el almuerzo de José Antonio Kast en Washington D.C. en noviembre de 2021."
  isa_kort:
    nombre: Isa Kort
    cargo: Embajador de Chile ante la OEA
    notas: "Embajador de Chile ante la Organización de Estados Americanos (OEA). Llegó y se retiró del restaurante La Taberna del Alabardero a la misma hora que José Antonio Kast durante su almuerzo en Washington D.C. (noviembre de 2021), aunque no participó de la reunión."
  luis_araya_valdecchy:
    nombre: Luis Araya Valdecchy
    cargo: Candidato a vicepresidencia regional del Partido Republicano en Arica
    organizacion: partido_republicano
    notas: "Representante en Chile del Grupo de Transporte Internacional Vargas Nogales SRL de Bolivia. Imputado por contaminación grave imprudente tras el derrame de aceite en el Lago Chungará (noviembre de 2025). Excandidato a consejero regional y aspirante a la vicepresidencia regional del Partido Republicano en Arica. Fue requerido por Interpol por presunto contrabando en Perú."
  diego_paco:
    nombre: Diego Paco
    cargo: Gobernador regional de Arica y Parinacota
    notas: "Gobernador regional de Arica y Parinacota. Solicitó al Consejo de Defensa del Estado ampliar la querella por el derrame de aceite en el Lago Chungará a la empresa transportista."
  stephani_jeldres:
    nombre: Stephani Jeldres
    cargo: Diputada
    notas: "Diputada. Apareció haciendo campaña en redes sociales junto a Luis Araya Valdecchy, candidato a la vicepresidencia regional del Partido Republicano en Arica."
  osvaldo_zuniga:
    nombre: Osvaldo Zúñiga
    cargo: Presidente de la Confederación Nacional Ranquil
    organizacion: confederacion_ranquil
    notas: "Dirigente agrario. Presidente de la Confederación Nacional Ranquil, que agrupa sindicatos y federaciones de campesinos. Rechazó la consulta pública del SAG sobre comercialización de semillas (2026) por permitir la privatización de semillas vía UPOV 91."
  danae_castanon:
    nombre: Danae Castañón
    cargo: Integrante de Semilla Soberana
    organizacion: semilla_soberana
    notas: "Integrante de Semilla Soberana, red que agrupa a Colectivo Ecológico en Acción, Escuela de Activismo Agroecológico Reberde, Dedos Verdes, Ruka Wichan Mapu de Laja, Agrupación Cultural Newen Mapuche y Coordinadora No al TPP. Se opuso a la consulta no vinculante del SAG sobre semillas (2026)."
  aly_valderrama:
    nombre: Aly Valderrama
    cargo: Ex delegada presidencial de Linares
    notas: "Ingeniera agrónoma y doctora en ciencias con mención en investigación y desarrollo de productos bioactivos de la Universidad de Talca; posdoctorada de la Universidad Autónoma de México. Ex delegada presidencial de Linares. Advirtió riesgos para la seguridad alimentaria por la resolución del SAG sobre semillas (2026)."
  maria_elena_rozas:
    nombre: María Elena Rozas
    cargo: Coordinadora nacional de RAP-Chile
    organizacion: rap_chile
    notas: "Coordinadora nacional de la Red de Acción en Plaguicidas y sus Alternativas (RAP-Chile). Autora de la columna 'Una aclaración no protege las semillas' en Interferencia (julio 2026), que pidió retirar el proyecto de resolución del SAG sobre comercialización de semillas."
  leo_ferres:
    nombre: Leo Ferres
    cargo: Investigador principal del Instituto de Data Science UDD
    organizacion: instituto_data_science_udd
    notas: "Científico de datos. Investigador principal del estudio sobre el impacto de las alertas SAE durante los incendios de Valparaíso de 2024, colaboración entre la UDD, L3S (Alemania), Central European University (Austria) e ISI Foundation (Italia)."
  natalia_flores_gonzalez:
    nombre: Natalia Flores González
    cargo: Coordinadora de Feminismo del Instituto Igualdad
    organizacion: instituto_igualdad
    notas: "Autora de la columna de opinión en El Mostrador sobre el fin del Programa Mujeres Rurales (julio 2026)."
  jose_joaquin_brunner:
    nombre: José Joaquín Brunner Ried
    cargo: Académico y exministro secretario general de Gobierno
    cargos:
      - cargo: Ministro Secretario General de Gobierno
        organizacion: segegob
        desde: 1994-09-20
        hasta: 1998-08-01
    notas: "Sociólogo, académico y político chileno. Exministro secretario general de Gobierno de Eduardo Frei Ruiz-Tagle y exdirector de FLACSO. Autor de la columna 'La estrategia de Kast: lo que conocemos y lo que aún desconocemos' en El Líbero (diciembre 2025), que analiza la estrategia de ocultamiento valórico de José Antonio Kast."
  rodrigo_paz:
    nombre: Rodrigo Paz
    cargo: Presidente de Bolivia
    cargos:
      - cargo: Presidente de Bolivia
        organizacion: bolivia
        desde: 2025-11-01
    organizacion: bolivia
    notas: "Presidente de Bolivia. Asistió a la investidura de José Antonio Kast en marzo de 2026 y ha manifestado su intención de avanzar en una nueva agenda comercial con Chile. Su gobierno enfrentó protestas y bloqueos de carreteras en 2026 promovidos por sindicatos campesinos, la COB y sectores afines a Evo Morales."
  evo_morales:
    nombre: Evo Morales
    cargo: Expresidente de Bolivia (2006-2019)
    cargos:
      - cargo: Presidente de Bolivia
        organizacion: bolivia
        desde: 2006-01-22
        hasta: 2019-11-10
    organizacion: bolivia
    notas: "Expresidente de Bolivia (2006-2019). Sectores afines a Morales impulsaron las protestas y bloqueos de carreteras contra el gobierno de Rodrigo Paz en 2026 que provocaron desabastecimiento en el país."
  jaime_gazmuri:
    nombre: Jaime Gazmuri
    cargo: Embajador de Chile en Venezuela (retirado 2024)
    notas: "Embajador de Chile en Venezuela. En abril de 2024 fue llamado a consultas por el presidente Gabriel Boric en medio de las tensiones bilaterales, y en julio de 2024 Nicolás Maduro ordenó su retiro junto al resto del cuerpo diplomático chileno tras las críticas del gobierno de Boric al proceso electoral venezolano."
  felix_plasencia:
    nombre: Félix Plasencia
    cargo: Canciller de Venezuela
    cargos:
      - cargo: Canciller de Venezuela
        organizacion: venezuela
        desde: 2026-01-05
    organizacion: venezuela
    notas: "Canciller de Venezuela durante la presidencia encargada de Delcy Rodríguez. Difundió en redes sociales el anuncio conjunto del 30 de julio de 2026 sobre la reactivación de las relaciones consulares con Chile."
  pavel_castillo:
    nombre: Pavel Castillo
    cargo: Gerente de Intelligence y economista conductual de CORPA
    organizacion: corpa
    notas: "Gerente de Intelligence y economista conductual de la consultora CORPA. Comentó el estudio de victimización del bimestre mayo-junio 2026 de la Región Metropolitana."
  marcelo_pena:
    nombre: Marcelo Peña
    cargo: Académico de la Universidad Central
    notas: "Académico de la Universidad Central. Explicó a The Clinic el significado de los umbrales de detección en test de drogas de pelo (500 ng/g vs 300 ng/g) en el contexto del caso del exsubsecretario de Hacienda Juan Pablo Rodríguez."
  gabriel_rodriguez:
    nombre: Gabriel Rodríguez
    cargo: Periodista y escritor
    notas: "Periodista y escritor, Premio Nacional a la Trayectoria Literaria 2024. Autor del libro 'Auschwitz, Colonia Dignidad y más, historias de héroes y canallas'. Denunció que el seremi de las Culturas del Maule, Pablo Amaro, censuró la presentación de su libro en el Museo O'Higginiano de Talca (agosto 2026)."
  rocio_alorda:
    nombre: Rocío Alorda
    cargo: Presidenta del Colegio de Periodistas de Chile
    notas: "Periodista, presidenta del Colegio de Periodistas de Chile. Calificó como censura previa la suspensión de la presentación del libro de Gabriel Rodríguez en Talca (agosto 2026)."
  roberto_celedon:
    nombre: Roberto Celedón
    cargo: Diputado independiente
    notas: "Diputado independiente afín al Frente Amplio. Criticó como censura previa la suspensión de la presentación del libro de Gabriel Rodríguez en Talca (agosto 2026)."
  rosanna_costa:
    nombre: Rosanna Costa
    cargo: Presidenta del Banco Central de Chile
    notas: "Presidenta del Banco Central de Chile. Impulsó mesas de trabajo con la industria para desarrollar pagos inmediatos interoperables estilo Pix; se refirió al tema en el Chile Day de Nueva York (mayo 2026)."
  juan_antonio_figueroa:
    nombre: Juan Antonio Figueroa
    cargo: Director ejecutivo de ChilePay
    notas: "Director ejecutivo de ChilePay, organismo que reúne a los medios de pago en Chile. Comentó el desarrollo de un sistema de pagos inmediatos estilo Pix chileno (agosto 2026)."
  sergio_bobadilla:
    nombre: Sergio Bobadilla
    cargo: Diputado (UDI)
    cargos:
      - cargo: Diputado
        organizacion: udi
        desde: 2026-03-11
    notas: "Diputado por el distrito 20 (Provincia de Concepción). Encabezó el ranking de gastos 2025 en arriendo de vehículos de los diputados del Biobío con $20.446.757, según reportaje de Aquí Biobío/El Mostrador (julio 2026). Justificó arrendar dos vehículos: uno para el distrito y otro para viajar de Santiago a Valparaíso."
  francesca_munoz:
    nombre: Francesca Muñoz
    cargo: Diputada (PSC)
    cargos:
      - cargo: Diputada
        organizacion: partido_social_cristiano
        desde: 2026-03-11
    notas: "Diputada por el distrito 20 o 21 (Región del Biobío). Gastó $11.689.442 en arriendo de vehículos en 2025 (4° del ranking del Biobío) y $915.241 en taxis, según reportaje de Aquí Biobío/El Mostrador (julio 2026)."
  leonidas_romero:
    nombre: Leonidas Romero
    cargo: Diputado (PNL)
    cargos:
      - cargo: Diputado
        organizacion: partido_nacional_libertario
        desde: 2026-03-11
    notas: "Diputado por el distrito 20 o 21 (Región del Biobío). Gastó $8.378.429 en arriendo de vehículos en 2025, según reportaje de Aquí Biobío/El Mostrador (julio 2026)."
  felix_gonzalez:
    nombre: Félix González
    cargo: Diputado (PEV)
    cargos:
      - cargo: Diputado
        organizacion: partido_ecologista_verde
        desde: 2026-03-11
    notas: "Diputado por el distrito 20 (Provincia de Concepción), del Partido Ecologista Verde. Gastó $5.903.504 en arriendo de vehículos en 2025 (no arrendó en febrero) y $390.607 en mantención de auto particular, según reportaje de Aquí Biobío/El Mostrador (julio 2026)."
  joanna_perez:
    nombre: Joanna Pérez
    cargo: Diputada (Demócratas)
    cargos:
      - cargo: Diputada
        organizacion: partido_democratas
        desde: 2026-03-11
    notas: "Diputada por el distrito 21 (Región del Biobío). No registró arriendos de vehículos con fondos públicos en 2025, pero pidió $2.439.760 para mantención de su auto particular, el mayor monto de ese ítem entre los diputados del Biobío. Explicó que no usa arriendos y que en 2025 sufrió la pérdida total de un vehículo de trabajo (Aquí Biobío/El Mostrador, julio 2026)."
  eric_aedo:
    nombre: Eric Aedo
    cargo: Diputado (DC)
    cargos:
      - cargo: Diputado
        organizacion: partido_democratacristiano
        desde: 2026-03-11
    notas: "Diputado por el distrito 20 (Provincia de Concepción). No registró arriendos de vehículos con fondos públicos en 2025, según reportaje de Aquí Biobío/El Mostrador (julio 2026)."
  maria_candelaria_acevedo:
    nombre: María Candelaria Acevedo
    cargo: Diputada (PC)
    cargos:
      - cargo: Diputada
        organizacion: partido_comunista
        desde: 2026-03-11
    notas: "Diputada por el distrito 20 o 21 (Región del Biobío). No registró arriendos de vehículos con fondos públicos en 2025, según reportaje de Aquí Biobío/El Mostrador (julio 2026)."
  clara_sagardia:
    nombre: Clara Sagardía
    cargo: Diputada (FA)
    cargos:
      - cargo: Diputada
        organizacion: frente_amplio
        desde: 2026-03-11
    notas: "Diputada por el distrito 20 o 21 (Región del Biobío). No registró arriendos de vehículos en 2025, pero solicitó $811.104 para mantención de auto particular y $1.254.209 en peajes y tag, según reportaje de Aquí Biobío/El Mostrador (julio 2026)."
  karen_medina:
    nombre: Karen Medina
    cargo: Diputada (PDG)
    cargos:
      - cargo: Diputada
        organizacion: pdg
        desde: 2026-03-11
    notas: "Diputada por el distrito 20 o 21 (Región del Biobío). No registró arriendos de vehículos, pero rindió $1.965.000 en taxis, el mayor monto de ese ítem entre los diputados del Biobío (Aquí Biobío/El Mostrador, julio 2026)."
  jorge_guzman:
    nombre: Jorge Guzmán
    cargo: Diputado (Evópoli)
    cargos:
      - cargo: Diputado
        organizacion: evopoli
        desde: 2026-03-11
    notas: "Diputado de Evópoli. Calificó de 'paradójico que el Partido Republicano, que es el corazón del Gobierno, sea el primero en poner obstáculos' a la agenda del Ejecutivo, emplazando a Kast a 'dejar de escuchar tanto al corazón' (julio 2026)."
  tomas_hirsch:
    nombre: Tomás Hirsch
    cargo: Exdiputado y activista humanista
    notas: "Exdiputado humanista y activista. Autor del proyecto de ley que busca prohibir y sancionar la organización de carreras de perros en Chile (tramitado en la Cámara de Diputados, votación del 3 de agosto de 2026)."
  mayra_cabezas:
    nombre: Mayra Cabezas
    cargo: Directora de Incidencia de la Fundación Derecho y Defensa Animal
    organizacion: fundacion_derecho_defensa_animal
    notas: "Directora de Incidencia de la Fundación Derecho y Defensa Animal. Ante la votación sobre carreras de perros y canódromos (julio 2026) señaló que 'regular canódromos sin resolver las apuestas ilegales, el dopaje y el maltrato documentado no es ordenar una actividad, es blanquearla' y llamó a que Chile se sume a la región y las prohíba."
  diego_rojas:
    nombre: Diego Rojas
    cargo: Abogado
    notas: "Abogado citado por El Desconcierto en el análisis del decreto que modifica el Reglamento de Seguridad Minera (julio 2026). Cuestionó el traslado del análisis de riesgos desde la Administración a los particulares y el desacople de la RCA respecto de la autorización minera de Sernageomin."
  felipe_sepulveda:
    nombre: Felipe Sepúlveda
    cargo: Fiscal jefe de Alta Complejidad (Metropolitana Oriente)
    notas: "Fiscal jefe de Alta Complejidad de la Fiscalía Metropolitana Oriente. Argumentó en el juicio abreviado del Caso Factop (julio 2026) que varias personas aportaron fondos a Factop y que Álvaro Jalaff tuvo participación relevante para que los engaños se produjeran."
  sergio_gahona:
    nombre: Sergio Gahona
    cargo: Senador UDI
    organizacion: senado
    notas: "Senador UDI. En el marco de la votación de la Ley de Reconstrucción Nacional (agosto 2026), habría terminado votando a favor del informe de la Comisión Mixta, pese a haber condicionado su voto."
  eduardo_cretton:
    nombre: Eduardo Cretton
    cargo: Diputado UDI
    organizacion: camara_diputados
    notas: "Diputado UDI. Junto al subjefe de bancada Sergio Bobadilla anunció (agosto 2026) el reingreso en septiembre del proyecto que establece el pago de la dieta de expresidentes desde los 65 años, en reacción al reposteo del expresidente Gabriel Boric."
  andres_longton:
    nombre: Andrés Longton
    cargo: Senador RN
    organizacion: senado
    notas: "Senador de Renovación Nacional. Ante la propuesta del gobierno de crear un quinto estado de excepción con despliegue de FF.AA. (agosto 2026), pidió conocer primero en qué se diferenciaría esta nueva herramienta del actual estado de emergencia."
  luis_fernando_sanchez:
    nombre: Luis Fernando Sánchez
    cargo: Diputado Partido Republicano
    organizacion: partido_republicano
    notas: "Diputado del Partido Republicano. Valoró el avance del proyecto que faculta a militares a realizar controles de identidad en estados de excepción (junio 2026), señalando que permite un uso más eficiente del recurso humano."
  jaime_mulet:
    nombre: Jaime Mulet
    cargo: Diputado y presidente de la Comisión de Constitución de la Cámara (FRVS)
    organizacion: frente_regionalista_verde_social
    notas: "Diputado de la Federación Regionalista Verde Social (FRVS) y presidente de la Comisión de Constitución de la Cámara. Aprobó en general el proyecto de controles de identidad de militares (junio 2026) pero advirtió sobre un eventual uso malicioso en un golpe de Estado, planteando la hipótesis de que un presidente use las FF.AA. para detener opositores."
  ximena_ossandon:
    nombre: Ximena Ossandón
    cargo: Diputada (RN)
    organizacion: renovacion_nacional
    cargos:
      - cargo: Diputada (RN)
        organizacion: renovacion_nacional
        desde: 2026-03-11
    notas: "Diputada RN. En febrero de 2026 advirtió que 'las lealtades se construyen con gestos' ante la baja representación partidaria en la nómina de subsecretarios de José Antonio Kast. Junto al jefe de bancada Diego Schalper solicitó al Gobierno (agosto 2026) poner urgencia al proyecto que permite el apoyo de las Fuerzas Armadas a las policías, presentado el 6 de julio de 2026. Fue coautora del proyecto 'Escucha su corazón'; posteriormente retiró su patrocinio."
  henry_leal:
    nombre: Henry Leal
    cargo: Diputado UDI
    organizacion: udi
    notas: "Diputado UDI. En febrero de 2026 defendió el derecho de José Antonio Kast a armar su gabinete de subsecretarios sin condiciones partidarias, ante el debate por la baja representación de Chile Vamos."
  stephan_schubert:
    nombre: Stephan Schubert
    cargo: Diputado y presidente de la Comisión de Relaciones Exteriores de la Cámara
    organizacion: camara_diputados
    notas: "Diputado y presidente de la Comisión de Relaciones Exteriores de la Cámara de Diputados. Valoró el cambio en la relación bilateral con Venezuela tras la reactivación consular (agosto 2026)."
  gilberto_aranda:
    nombre: Gilberto Aranda
    cargo: Analista internacional de la Universidad de Chile
    notas: "Analista internacional de la Universidad de Chile. Sobre la reactivación consular con Venezuela (agosto 2026) destacó que recuperar los servicios permitirá resolver problemas de documentos de venezolanos y cooperar contra el crimen organizado."
  luis_felipe_vergara:
    nombre: Luis Felipe Vergara
    cargo: Analista internacional de la Universidad Andrés Bello
    notas: "Analista internacional de la Universidad Andrés Bello. Sobre la reactivación consular con Venezuela (agosto 2026) señaló que el acercamiento debería consolidarse en el corto y mediano plazo."
  nicolas_valenzuela:
    nombre: Nicolás Valenzuela
    cargo: Jefe de diseño de la Secretaría de Comunicaciones (Secom)
    organizacion: secom
    notas: "Jefe de diseño de la Secom del gobierno de José Antonio Kast. En un chat de WhatsApp filtrado admitió que la gráfica presentada el 11 de marzo de 2026 era 'horrible' y no un logo nuevo, sino 'una acción rápida para instaurar rápido el slogan', aclarando que el logo original (de 2020) se mantiene con nuevo slogan."
  hernan_nunez:
    nombre: Hernán Núñez
    cargo: Director general de Asuntos Consulares
    notas: "Director general de Asuntos Consulares de la Cancillería. Encabezó la avanzada que viajó a Caracas a inicios de agosto de 2026 para habilitar los servicios consulares entre Chile y Venezuela."
  claudio_soto:
    nombre: Claudio Soto Solís
    cargo: Concejal de Lago Verde
    notas: "Concejal de Lago Verde (Aysén), de 43 años. Falleció en un incendio en el hospedaje Casona El Bosque, en Villa Amengual, donde se alojaba con la delegación municipal que participaría en el Festival de la Lana (1 agosto 2026)."
  claudia_valdes:
    nombre: Claudia Valdés
    cargo: Alcaldesa de Lago Verde
    notas: "Alcaldesa de Lago Verde (Aysén). Tras el incendio en que falleció el concejal Claudio Soto (agosto 2026) expresó sus condolencias y calificó lo sucedido como una tragedia que enluta a la comunidad."
  luz_maria_vicuna:
    nombre: Luz María Vicuña
    cargo: Delegada presidencial regional de Aysén
    notas: "Delegada presidencial regional de Aysén. Confirmó que la Fiscalía instruyó diligencias a la SIP y al Labocar de Coyhaique tras el incendio en Villa Amengual que cobró la vida del concejal Claudio Soto (agosto 2026)."
  daniel_diaz:
    nombre: Daniel Díaz Olguín
    cargo: Director de Codelco (cupo FTC)
    organizacion: codelco
    notas: "Dirigente del Sindicato Minero de Chuquicamata y consejero nacional de la Federación de Trabajadores del Cobre. El 28 de mayo de 2026 fue designado por el presidente José Antonio Kast como director de Codelco en representación de los trabajadores (2026-2030), elegido de la quina de la FTC. La investigación de Contrapoder Chile (mayo 2026) denunció que posee empresas ligadas a la minería (NEDX SpA, Global Commodity Brokers SpA) y nexos con empresarios chinos en Calama, lo que él desmintió."
  hector_roco:
    nombre: Héctor Roco Aguilar
    cargo: Presidente de la Federación de Trabajadores del Cobre
    organizacion: federacion_trabajadores_cobre
    notas: "Presidente de la Federación de Trabajadores del Cobre. La investigación de Contrapoder Chile (mayo 2026) señaló que habría impulsado activamente la nominación de Daniel Díaz Olguín al cupo laboral del directorio de Codelco."
  juan_carlos_olguin:
    nombre: Juan Carlos Olguín
    cargo: Expresidente de la Federación de Trabajadores del Cobre
    organizacion: federacion_trabajadores_cobre
    notas: "Expresidente de la FTC. Mencionado en la investigación de Contrapoder Chile sobre la designación de Daniel Díaz al directorio de Codelco (mayo 2026); ejerció su derecho a réplica señalando que su relación con Díaz fue institucional y que la sociedad que compartieron fue un emprendimiento familiar de helados que nunca operó."
  osvaldo_urrutia:
    nombre: Osvaldo Urrutia
    cargo: Subsecretario de Pesca y Acuicultura
    notas: "Subsecretario de Pesca y Acuicultura (SUBPESCA). A inicios de agosto de 2026 manifestó que el gobierno está abierto a evaluar el levantamiento de la veda y una eventual caza selectiva de lobos marinos ante los conflictos con la pesca artesanal del sur, lo que generó rechazo ambientalista. El 3 de agosto respondió a la petición de los pescadores ante la Comisión de Pesca señalando que cualquier cambio requerirá respaldo técnico y científico."
  dionisio_ulloa:
    nombre: Dionisio Ulloa
    cargo: Abogado defensor
    notas: "Abogado defensor del excarabinero de la Subcomisaría de Paillaco absuelto en agosto de 2026 en el segundo juicio por violación. Tras la absolución por deficiencia probatoria, anunció que presentará recursos administrativos para buscar el reintegro del exfuncionario a Carabineros."
  jorge_bustos:
    nombre: Jorge Bustos
    cargo: Presidente del Consejo Regional para la Pesca Artesanal (Corepa)
    organizacion: corepa
    notas: "Presidente del Consejo Regional para la Pesca Artesanal (Corepa). Expuso ante la Comisión de Pesca de la Cámara de Diputados en agosto de 2026 pidiendo levantar la veda de caza del lobo marino por los daños a las faenas de pesca artesanal."
  jose_verdugo:
    nombre: José Verdugo
    cargo: Representante de pescadores artesanales de Puerto Montt
    notas: "Pescador artesanal de Puerto Montt. Ante la Comisión de Pesca de la Cámara en agosto de 2026 denunció el daño económico que los lobos marinos causan a las capturas de merluza, jurel y a los equipos de pesca."
  carlos_gatica:
    nombre: Carlos Gatica
    cargo: Alcalde de Coyhaique
    notas: "Alcalde de Coyhaique (Aysén). Presentó en agosto de 2026 la 'aldea de emergencia' municipal con capacidad para 200 personas ante la ola de frío y nevadas, financiada por el GORE de Aysén y el municipio."
  lorena_castillo:
    nombre: Lorena Castillo
    cargo: Directora nacional subrogante del IND
    notas: "Directora nacional subrogante del Instituto Nacional de Deportes. La ministra del Deporte Natalia Duco habría solicitado su destitución, según reportó ADN Radio (agosto 2026), en el marco de las tensiones por el concierto de BTS en el Estadio Nacional."
  jorge_silva:
    nombre: Jorge Silva
    cargo: Jefe subrogante del Departamento de Alto Rendimiento del IND
    notas: "Jefe subrogante del Departamento de Alto Rendimiento del IND. El Mindep defendió su asignación por su trayectoria en gestión deportiva, en el contexto del conflicto entre la ministra Natalia Duco y los funcionarios del IND (agosto 2026)."
  andres_otero:
    nombre: Andrés Otero
    cargo: Subsecretario del Deporte
    notas: "Subsecretario del Deporte. Junto a la ministra Natalia Duco fue señalado por la Asociación Nacional de Funcionarios de Chiledeportes (ANFUCHID) como responsable de no responder a las solicitudes de reunión de los trabajadores del IND (julio-agosto 2026)."
  sebastian_edwards:
    nombre: Sebastián Edwards
    cargo: Economista de la UCLA
    notas: "Economista de la Universidad de California en Los Ángeles. En el seminario de Moneda Patria Investment (julio 2026) dijo que Codelco necesita una 'cirugía' mayor, en el marco del debate sobre capitales privados en la estatal."
  felipe_morande:
    nombre: Felipe Morandé Lavín
    cargo: Presidente del Consejo Directivo del Sistema de Empresas SEP
    cargos:
      - cargo: Ministro de Transportes y Telecomunicaciones
        organizacion: ministerio_transportes
        desde: 2010-03-11
        hasta: 2011-01-14
    notas: "Presidente del Consejo Directivo del Sistema de Empresas Públicas (SEP). Descartó en agosto de 2026 una privatización inmediata de las empresas del sistema, aunque no descartó la entrada de privados en un plazo mayor si hay estabilidad financiera."
  marcos_barraza:
    nombre: Marcos Barraza Gómez
    cargo: Diputado Partido Comunista
    cargos:
      - cargo: Ministro de Desarrollo Social
        organizacion: ministerio_desarrollo_social
        desde: 2015-05-11
        hasta: 2018-03-11
    organizacion: partido_comunista
    notas: "Diputado del Partido Comunista. Participó junto a Jaime Araya y Consuelo Veloso en el streaming 'Un Día Menos' donde se originó la polémica por los dichos sobre el Servel (julio 2026)."
  dario_quiroga:
    nombre: Darío Quiroga
    cargo: Exasesor de Jeannette Jara y conductor del streaming 'Un Día Menos'
    notas: "Exasesor de la exministra del Trabajo Jeannette Jara. Conduce el streaming 'Un Día Menos', espacio donde los diputados Jaime Araya y Consuelo Veloso cuestionaron la credibilidad del Servel (julio 2026)."
  alejandro_riquelme:
    nombre: Alejandro Riquelme
    cargo: Diputado Partido Republicano
    organizacion: partido_republicano
    notas: "Diputado del Partido Republicano. Tras los dichos de Araya y Veloso sobre el Servel (julio 2026) calificó como 'impresionante la desfachatez' de los parlamentarios y defendió la institucionalidad electoral."
  felipe_ross:
    nombre: Felipe Ross
    cargo: Diputado Partido Republicano
    organizacion: partido_republicano
    notas: "Diputado del Partido Republicano. Cuestionó especialmente a la diputada Consuelo Veloso por los dichos sobre el Servel (julio 2026), señalando que 'está cuestionando la votación más contundente de la historia de nuestra democracia'."
  alejandra_valdebenito:
    nombre: Alejandra Valdebenito
    cargo: Diputada UDI
    organizacion: udi
    notas: "Diputada de la UDI e integrante de la Comisión de Derechos Humanos de la Cámara. En agosto de 2026 impulsó la ofensiva presupuestaria de su bancada contra el INDH por el contrato de $250 millones con la productora Ditecsur, afirmando que 'este despilfarro de plata' justifica la posición de eliminar la institución por considerarla 'políticamente capturada por la extrema izquierda'."
  juan_antonio_coloma:
    nombre: Juan Antonio Coloma
    cargo: Secretario general de la UDI
    organizacion: udi
    notas: "Secretario general de la UDI. El 4 de agosto de 2026 adelantó que la directiva del partido llevaría al Presidente José Antonio Kast, en la cita en Cerro Castillo, peticiones de seguridad centradas en la protección y fortalecimiento de las policías."
  consuelo_contreras:
    nombre: Consuelo Contreras
    cargo: Exdirectora del INDH
    organizacion: indh
    notas: "Exdirectora del Instituto Nacional de Derechos Humanos. Sus viajes a la sede de la ONU en Ginebra (Suiza) para las asambleas anuales de la GANHRI —por $8.183.208 en marzo de 2023 y $4.440.910 en marzo de 2025— fueron cuestionados por la bancada UDI en su ofensiva presupuestaria de agosto de 2026 contra el organismo."
  gaston_saavedra:
    nombre: Gastón Saavedra
    cargo: Senador PS por la Región del Biobío
    organizacion: partido_socialista
    notas: "Senador del Partido Socialista por la circunscripción del Biobío (2022-2030), exalcalde de Talcahuano. Autor de la columna de opinión en BioBioChile del 4 de agosto de 2026 'Tantos años queriendo ser Presidente de Chile para que quien mande... sea el Ministro de Hacienda', que critica que Hacienda paralice la inversión pública anunciada por el Presidente."
  marcos_oviedo:
    nombre: Marcos Oviedo González
    cargo: Director regional (S) del Sernac de Arica y Parinacota
    organizacion: sernac
    notas: "Director regional subrogante del Servicio Nacional del Consumidor de Arica y Parinacota y excandidato a consejero regional por Renovación Nacional (2017). Según la Unidad de Investigación de El Mostrador (agosto 2026), solicitó por correo a la seremi de Economía de la región autorización para contrataciones directas de militantes de 'RN o Republicanos'."
  evelyn_milos:
    nombre: Evelyn Milos Cáceres
    cargo: Asistente social contratada en el Sernac de Arica
    organizacion: renovacion_nacional
    notas: "Asistente social, militante de Renovación Nacional desde el 4 de abril de 2026. Fue contratada a contrata en el Sernac de Arica desde el 1 de julio de 2026 (grado 8, $4.030.777). En octubre de 2017 fue detenida en Tacna (Perú) junto a otras tres mujeres de su familia con 47 kilos de marihuana cripy ocultos en un vehículo con patente chilena. Caso revelado por El Mostrador en agosto de 2026."
  romina_cifuentes:
    nombre: Romina Cifuentes González
    cargo: Seremi de Economía de Arica y Parinacota
    organizacion: ministerio_economia
    notas: "Seremi de Economía de la Región de Arica y Parinacota y vicepresidenta nacional del Partido Republicano. Según la Unidad de Investigación de El Mostrador (agosto 2026), recibió el correo del director (S) del Sernac de Arica, Marcos Oviedo, solicitando autorización para contrataciones directas de militantes de 'RN o Republicanos'."
  francisco_undurraga:
    nombre: Francisco Undurraga Gazitúa
    cargo: Ministro de las Culturas, las Artes y el Patrimonio
    organizacion: ministerio_culturas
    cargos:
      - cargo: Ministro de las Culturas, las Artes y el Patrimonio
        organizacion: ministerio_culturas
        desde: 2026-03-11
    notas: "Ministro de las Culturas, las Artes y el Patrimonio (desde 11-mar-2026). Ante la interpelación de la senadora Beatriz Sánchez en la Comisión de Cultura del Senado (3 de agosto de 2026) por la suspensión del lanzamiento del libro de Gabriel Rodríguez en Talca, declaró que la decisión 'inconsulta' del seremi del Maule, Pablo Amaro, no era de conocimiento del ministerio."
  fidel_espinoza:
    nombre: Fidel Espinoza
    cargo: Senador PS
    organizacion: partido_socialista
    notas: "Senador del Partido Socialista. Se inhabilitó en la votación del Senado del 4 de agosto de 2026 que aprobó el mecanismo de compensación a los municipios de la megarreforma, sin efectos en el resultado (27 a favor, 22 en contra). En agosto de 2026 quedó bajo investigación de la Fiscalía por un episodio de presunta violencia intrafamiliar en Viña del Mar, tras lo cual el PS suspendió su militancia y abrió una causa en su Tribunal Supremo."
  jorge_diaz:
    nombre: Jorge Díaz
    cargo: Diputado (DC)
    cargos:
      - cargo: Diputado (DC)
        organizacion: partido_democratacristiano
        desde: 2026-03-11
    organizacion: partido_democratacristiano
    notas: "Diputado de la Democracia Cristiana. En el marco del caso Sernac de Arica (agosto 2026) solicitó la renuncia de la seremi de Economía, Romina Cifuentes, señalando que si conocía los antecedentes de la contratación irregular debía explicarlos y asumir responsabilidades."
  elia_piedras:
    nombre: Elia Piedras
    cargo: Presidenta del Colegio de Periodistas de Maule Norte
    organizacion: colegio_periodistas
    notas: "Presidenta del Colegio de Periodistas de Maule Norte. En agosto de 2026 calificó como 'acto de censura' la suspensión del lanzamiento del libro de Gabriel Rodríguez en Talca ordenada por el seremi de las Culturas del Maule, Pablo Amaro, señalando que atenta contra la libertad de expresión y el derecho de la ciudadanía a acceder a la cultura."
  michelle_vera:
    nombre: Michelle Vera Machuca
    cargo: Seremi de la Mujer y Equidad de Género del Bío Bío
    organizacion: ministerio_mujer
    notas: "Fonoaudióloga egresada de la Universidad de Las Américas (UDLA) con posgrado en la Universidad Católica de Temuco, militante del Partido Cristiano de Chile (PCC). Asumió el 1 de agosto de 2026 como seremi de la Mujer y Equidad de Género del Bío Bío, completando el gabinete regional tras la vacancia dejada por la licencia por embarazo de Camila Contreras."
  claudio_orrego:
    nombre: Claudio Orrego Larraín
    cargo: Gobernador de la Región Metropolitana
    cargos:
      - cargo: Ministro de Vivienda y Urbanismo
        organizacion: ministerio_vivienda
        desde: 2000-03-11
        hasta: 2000-12-29
      - cargo: Ministro de Bienes Nacionales
        organizacion: ministerio_bienes_nacionales
        desde: 2000-03-11
        hasta: 2000-12-29
    organizacion: gore_metropolitano
    notas: "Gobernador de la Región Metropolitana. En el marco del caso ProCultura impulsó desde el inicio las acciones administrativas y judiciales para cobrar las pólizas de garantía del programa 'Quédate' a la aseguradora ASPOR, que la Corte Suprema confirmó el 4 de agosto de 2026: 'Lo dijimos desde el primer día, Aspor debía pagar'."
  daniel_pacheco:
    nombre: Daniel Pacheco
    cargo: Seremi de Gobierno del Bío Bío
    organizacion: segegob
    notas: "Seremi de Gobierno de la Región del Bío Bío. En agosto de 2026 confirmó la designación de Michelle Vera como seremi de la Mujer y Equidad de Género, señalando que con ella el gabinete regional quedó completo."
  camila_contreras:
    nombre: Camila Contreras
    cargo: Exseremi de la Mujer del Bío Bío
    organizacion: ministerio_mujer
    notas: "Exseremi de la Mujer y Equidad de Género del Bío Bío, profesora de historia designada en marzo de 2024 bajo el gobierno de Boric y una de las últimas autoridades de esa administración que se mantuvo en el gobierno de Kast gracias al fuero maternal (renunció el 11 de marzo de 2026, confirmó su embarazo dos semanas después y el Ministerio de la Mujer la mantuvo en el cargo). Su embarazo impidió que su reemplazante, Antaris Varela, asumiera la titularidad. En agosto de 2026 dejó el cargo despidiéndose con un polémico mensaje en Instagram ('último día en esta tortura llamada ser seremi de Kast'), que luego aclaró como un descargo por la exposición y las críticas públicas, no como un ataque al presidente. La vacancia se resolvió con la designación de Michelle Vera."
  yerko_ljubetic:
    nombre: Yerko Ljubetic Godoy
    cargo: Director Nacional del INDH
    cargos:
      - cargo: Ministro del Trabajo y Previsión Social
        organizacion: ministerio_trabajo
        desde: 2005-04-22
        hasta: 2006-03-11
    organizacion: indh
    notas: "Director Nacional del Instituto Nacional de Derechos Humanos. El 4 de agosto de 2026, en Radio 13C, discrepó de la absolución de Claudio Crespo: 'un joven perdió la vista y el autor de esas lesiones quedó sin castigo'."
  raul_leiva:
    nombre: Raúl Leiva
    cargo: Diputado (PS)
    organizacion: partido_socialista
    notas: "Diputado del Partido Socialista. El 4 de agosto de 2026 sostuvo que los Presidentes no debieran emitir opiniones calificando resoluciones judiciales, en el marco del fallo de Crespo."
  marcos_ilabaca:
    nombre: Marcos Ilabaca
    cargo: Diputado (PS)
    organizacion: partido_socialista
    notas: "Diputado del Partido Socialista. El 4 de agosto de 2026 señaló que los fallos se respetan y que no corresponde comentarlos desde el Ejecutivo, en el marco del caso Crespo."
  tatiana_urrutia:
    nombre: Tatiana Urrutia
    cargo: Diputada (Frente Amplio)
    organizacion: frente_amplio
    notas: "Diputada del Frente Amplio. El 4 de agosto de 2026 emplazó al Presidente Kast a frenar los indultos para carabineros condenados que promueven diputados de su partido, tras su opinión sobre el fallo de Crespo."
  benjamin_moreno:
    nombre: Benjamín Moreno
    cargo: Jefe de bancada de diputados republicanos
    organizacion: partido_republicano
    notas: "Diputado y jefe de bancada del Partido Republicano. El 4 de agosto de 2026 defendió el pronunciamiento del Presidente Kast sobre el fallo de Crespo: 'es la justicia la que señala si se actuó conforme a la ley'."
  francisco_orrego:
    nombre: Francisco Orrego
    cargo: Diputado (Ind-RN)
    organizacion: renovacion_nacional
    notas: "Diputado independiente en renovación nacional. El 4 de agosto de 2026 celebró el post de Kast sobre Crespo y pidió una ley de indultos para carabineros condenados por el estallido social."
  maria_jose_zaldivar:
    nombre: María José Zaldívar Larraín
    cargo: Directora General de Fundación Teletón
    cargos:
      - cargo: Ministra del Trabajo y Previsión Social
        organizacion: ministerio_trabajo
        desde: 2019-10-28
        hasta: 2021-04-07
    organizacion: fundacion_teleton
    notas: "Directora General de la Fundación Teletón. El 4 de agosto de 2026 valoró el respaldo transversal del Senado al proyecto del Día Nacional de la Teletón y confió en igual acogida en la Cámara de Diputadas y Diputados."
  sebastian_urrejola:
    nombre: Sebastián Urrejola Aranda
    cargo: Delegado Presidencial Provincial de Chañaral
    organizacion: delegacion_presidencial_chanaral
    notas: "Delegado presidencial provincial de Chañaral designado por el gobierno de José Antonio Kast. En agosto de 2026 la Contraloría Regional de Atacama acreditó su ocupación ilegal de un bien fiscal de ~1.000 m² en el sector Portofino de Chañaral, con una ocupación de ~16 años, vulnerando la probidad administrativa; ordenó procedimiento disciplinario en la Subsecretaría del Interior, la restitución del terreno y un cobro retroactivo por el uso del bien."
  sebastian_keitel:
    nombre: Sebastián Keitel
    cargo: Senador, presidente de la Comisión de Adulto Mayor y Discapacidad
    organizacion: senado
    notas: "Senador y presidente de la Comisión de Adulto Mayor y Discapacidad, que aprobó por unanimidad el proyecto del Día Nacional de la Teletón. El 4 de agosto de 2026 destacó en Sala que la iniciativa busca que el día posterior a la campaña sea una instancia de encuentro familiar."
  claudia_pascual:
    nombre: Claudia Pascual Grau
    cargo: Senadora (PC)
    cargos:
      - cargo: Ministra de la Mujer y la Equidad de Género
        organizacion: ministerio_mujer
        desde: 2016-06-03
        hasta: 2018-03-11
    notas: "Senadora. El 4 de agosto de 2026 hizo reserva de constitucionalidad de la fórmula de compensación municipal de la megarreforma aprobada por la Sala."
  francisco_huenchumilla:
    nombre: Francisco Huenchumilla Jaramillo
    cargo: Senador (DC)
    cargos:
      - cargo: Ministro Secretario General de la Presidencia
        organizacion: segpres
        desde: 2003-03-03
        hasta: 2004-09-29
    notas: "Senador. El 4 de agosto de 2026 hizo reserva de constitucionalidad de la fórmula de compensación municipal de la megarreforma y votó en contra de ella en la Sala."
  ruth_hurtado:
    nombre: Ruth Hurtado
    cargo: Secretaria general del Partido Republicano
    organizacion: partido_republicano
    notas: "Secretaria general del Partido Republicano durante la campaña presidencial de segunda vuelta de 2025. Integró la barra de Kast en el debate ARCHI del 3 de diciembre y, previo al debate ANATEL del 9 de diciembre, expresó su esperanza de que el foro 'no sea algo tan confrontacional'."
  alejandra_krauss:
    nombre: Alejandra Krauss Valle
    cargo: Exministra del Trabajo (DC)
    cargos:
      - cargo: Ministra del Trabajo y Previsión Social
        organizacion: ministerio_trabajo
        desde: 2016-11-18
        hasta: 2018-03-11
      - cargo: Ministra de Planificación y Cooperación
        organizacion: ministerio_desarrollo_social
        desde: 2000-03-11
        hasta: 2002-01-07
    organizacion: partido_democratacristiano
    notas: "Figura de la Democracia Cristiana y exministra del Trabajo. Integró el comando de Jeannette Jara en la campaña de segunda vuelta de 2025 y acompañó a la candidata en el debate ARCHI del 3 de diciembre de 2025."
  susana_gonzalez:
    nombre: Susana González
    cargo: Jefa de comunicaciones del comando de Jeannette Jara
    organizacion: partido_comunista
    notas: "Jefa de comunicaciones del comando de Jeannette Jara en la campaña de segunda vuelta de 2025. Participó junto a Ricardo Solari en la preparación de la candidata previo al debate ARCHI del 3 de diciembre."
  ricardo_solari:
    nombre: Ricardo Solari Saavedra
    cargo: Exministro del Trabajo (PS)
    cargos:
      - cargo: Ministro del Trabajo y Previsión Social
        organizacion: ministerio_trabajo
        desde: 2000-03-11
        hasta: 2005-04-22
    organizacion: partido_socialista
    notas: "Exministro del Trabajo durante el gobierno de Ricardo Lagos. Uno de los principales asesores del comando de Jeannette Jara en la campaña de segunda vuelta de 2025; participó en la preparación de la candidata previo al debate ARCHI del 3 de diciembre."
  carlos_pena:
    nombre: Carlos Peña González
    cargo: Rector de la Universidad Diego Portales
    organizacion: universidad_diego_portales
    notas: "Abogado y filósofo, rector de la Universidad Diego Portales desde 2003. Columnista habitual en Reportajes de El Mercurio. En julio de 2026 criticó las misas organizadas por el gobierno de Kast en La Moneda, argumentando que un ministro en calidad de tal no debe invitar a celebrar un culto por infringir sus deberes públicos."
  carlos_montes:
    nombre: Carlos Montes Cisternas
    cargo: Ministro de Vivienda y Urbanismo (PS)
    cargos:
      - cargo: Ministro de Vivienda y Urbanismo
        organizacion: ministerio_vivienda
        desde: 2022-03-11
        hasta: 2026-03-11
    notas: "Ministro de Vivienda y Urbanismo del gobierno de Gabriel Boric. En el debate ANATEL del 9 de diciembre de 2025, la candidata Jeannette Jara discrepó públicamente de sus dichos sobre las filas para acceder a la vivienda en el contexto de la megatoma de San Antonio."
  jose_carlos_meza:
    nombre: José Carlos Meza
    cargo: Diputado (Partido Republicano)
    organizacion: partido_republicano
    notas: "Diputado del Partido Republicano. Sus dichos sobre la posibilidad de otorgar indultos humanitarios a violadores de niños con enfermedades terminales abrieron uno de los mayores flancos de la campaña de José Antonio Kast en la segunda vuelta de 2025 y fueron abordados en el debate ANATEL del 9 de diciembre."
  carolina_urrejola:
    nombre: Carolina Urrejola
    cargo: Periodista (TVN)
    organizacion: tvn
    notas: "Periodista de TVN. Moderó el debate presidencial ANATEL del 9 de diciembre de 2025 entre Jeannette Jara y José Antonio Kast."
  julia_vial:
    nombre: Julia Vial
    cargo: Periodista (TV+)
    notas: "Periodista de TV+. Moderó el debate presidencial ANATEL del 9 de diciembre de 2025 entre Jeannette Jara y José Antonio Kast."
  ivan_valenzuela:
    nombre: Iván Valenzuela
    cargo: Periodista (Canal 13)
    notas: "Periodista de Canal 13. Moderó el debate presidencial ANATEL del 9 de diciembre de 2025 entre Jeannette Jara y José Antonio Kast."
  constanza_santa_maria:
    nombre: Constanza Santa María
    cargo: Periodista (Mega)
    notas: "Periodista de Mega. Moderó el debate presidencial ANATEL del 9 de diciembre de 2025 entre Jeannette Jara y José Antonio Kast."
  macarena_pizarro:
    nombre: Macarena Pizarro
    cargo: Periodista (Chilevisión)
    notas: "Periodista de Chilevisión. Moderó el debate presidencial ANATEL del 9 de diciembre de 2025 entre Jeannette Jara y José Antonio Kast."
  javier_iturriaga:
    nombre: Javier Iturriaga del Campo
    cargo: General de Ejército (r), ex jefe de la Defensa Nacional
    organizacion: ejercito_chile
    notas: "General de Ejército designado como jefe de la Defensa Nacional tras el estado de emergencia decretado el 19 de octubre de 2019 por el estallido social, con el Ejército a cargo de la seguridad en Santiago. Decretó el primer toque de queda en la capital desde 1987 y declaró que 'no estoy en guerra con nadie', contrastando con la frase de Piñera de estar 'en guerra'."
  sergio_micco:
    nombre: Sergio Micco
    cargo: Ex director del Instituto Nacional de Derechos Humanos
    organizacion: indh
    notas: "Director del Instituto Nacional de Derechos Humanos entre 2018 y 2022. El 23 de diciembre de 2019 presentó el Informe Anual 2019 del INDH, centrado en el estallido social, calificando las violaciones a los derechos humanos como 'graves y muy numerosas' y 'las más graves desde 1989'."
  jaime_quintana:
    nombre: Jaime Quintana
    cargo: Senador (PPD), expresidente del Senado
    notas: "Senador PPD y presidente del Senado en 2019. Encabezó el anuncio del Acuerdo por la Paz Social y la Nueva Constitución, firmado el 15 de noviembre de 2019 en el ex Congreso Nacional."
  carmen_hertz:
    nombre: Carmen Hertz
    cargo: Diputada (PC), abogada de derechos humanos
    organizacion: partido_comunista
    notas: "Diputada del Partido Comunista y abogada de derechos humanos. Impulsora de la acusación constitucional contra Sebastián Piñera por las violaciones a los DD.HH. del estallido social (2019). Tras su rechazo en la Cámara (12 de diciembre de 2019) declaró que buscarían 'otras vías' porque 'esto ha sido una política de Estado'."
  patricio_arrau:
    nombre: Patricio Arrau
    cargo: Economista
    notas: "Economista chileno, cofundador de la consultora Gerens junto a Jorge Quiroz."
  paola_morales:
    nombre: Paola Morales
    cargo: Presidenta de ASOF (Confederación Nacional de Ferias Libres de Chile)
    organizacion: asof
    notas: "Presidenta de la Confederación Nacional de Ferias Libres de Chile (ASOF). Tras el cruce entre las senadoras Camila Flores y Fabiola Campillai (5 de agosto de 2026), en el que Flores usó la expresión 'señora de feria' como descalificación, respondió que 'ser mujer de feria es un orgullo' y llamó a no utilizar la identidad de las feriantes como un calificativo ofensivo."
  gonzalo_bustamante:
    nombre: Gonzalo Bustamante
    cargo: Alcalde de Bulnes
    organizacion: municipalidad_bulnes
    notas: "Alcalde de Bulnes (región de Ñuble). El 6 de agosto de 2026 denunció ante la Comisión de Vivienda de la Cámara que 70 inmuebles del comité de la Villa Santa Fe de la comuna presentaban fallas estructurales tras el sistema frontal, pidiendo solución a las familias afectadas."
  raphael_bergoeing:
    nombre: Raphael Bergoeing
    cargo: Economista, académico UAI
    organizacion: universidad_adolfo_ibanez
    notas: "Economista y académico de la Universidad Adolfo Ibáñez, expresidente de la Comisión Nacional de Productividad. En El Primer Café de Cooperativa (6 de agosto de 2026) sostuvo que la megarreforma mantiene deudas estructurales en tres pilares: educación, mercado laboral y modernización del Estado."
  rodrigo_wagner:
    nombre: Rodrigo Wagner
    cargo: Economista, académico UAI
    organizacion: universidad_adolfo_ibanez
    notas: "Economista y académico de la Universidad Adolfo Ibáñez. En El Primer Café de Cooperativa (6 de agosto de 2026) afirmó que la megarreforma generará más actividad económica, pero menor de la que se espera."
  alejandro_kusanovic:
    nombre: Alejandro Kusanovic
    cargo: Senador independiente por Magallanes
    notas: "Senador independiente por Magallanes (periodo 2022-2030). En agosto de 2026 figuraba entre los senadores imputados por la Fiscalía que podrían ser desaforados, factor considerado por el gobierno al definir la estrategia de tramitación de la reforma constitucional de seguridad por el Senado."
  miguel_angel_aguilera:
    nombre: Miguel Ángel Aguilera
    cargo: Exalcalde de San Ramón
    notas: "Exalcalde de San Ramón (2012-2021) y exmilitante socialista. CIPER reveló en 2018 que compró una propiedad en La Reina por cerca de $350 millones con fondos ilícitos. En 2025 fue condenado por lavado de activos (4 años de reclusión bajo libertad vigilada y multa de 200 UTM) y aumento patrimonial injustificado (multa de $246.918.500). En agosto de 2026 el Sexto Tribunal Oral en lo Penal de Santiago confirmó que la casa pasa al fisco. En 2021 demandó a CIPER por $1.700 millones por daño moral; abandonó el proceso."
  jorge_chino_pinto:
    nombre: Jorge "Chino" Pinto
    cargo: Narcotraficante
    notas: "Narcotraficante vinculado al exalcalde de San Ramón Miguel Ángel Aguilera, nexos revelados por Informe Especial en octubre de 2018 en plena crisis del edil, que también enfrentaba investigaciones de la Fiscalía y la Contraloría."
  felipe_givovich:
    nombre: Felipe Givovich
    cargo: Economista
    notas: "Economista de la consultora Quiroz y Asociados. Cofirmó junto a Jorge Quiroz el informe 'Estructura, Características y Funcionamiento del Mercado del Asfalto en Chile' elaborado para la defensa de Asfaltos Chilenos en la colusión del asfalto."
  paula_hurtado:
    nombre: Paula Hurtado
    cargo: Economista
    notas: "Economista de la consultora Quiroz y Asociados. Cofirmó junto a Jorge Quiroz el informe 'Mercado relevante del car carrier hacia Chile y participación de MOL' encargado por la naviera MOL en 2016."
  ramon_avila:
    nombre: Ramón Ávila
    cargo: Exgerente comercial de Salcobrand
    notas: "Exgerente comercial de Salcobrand. Autor del correo del 19 de diciembre de 2007 al jefe de control de gestión de la cadena en que proponía coordinar con los laboratorios el alza de precios ('ofrecimos ser la cadena que primero subiera los precios'), que el TDLC consideró en la sentencia de la colusión de las farmacias una 'prueba manifiesta de la existencia de una coordinación expresa entre las cadenas de farmacias'."
  jorge_ariztia:
    nombre: Jorge Ariztía
    cargo: Gerente general de Empresas Ariztía
    notas: "Gerente general de Empresas Ariztía durante la colusión de los pollos. Declaró ante el TDLC que las avícolas no solo utilizaban las proyecciones de demanda de Jorge Quiroz (el 'modelo Quiroz') sino que el economista también las ajustaba cuando se requería."
  guillermo_diaz:
    nombre: Guillermo Díaz del Río
    cargo: Gerente general de Agrosuper
    notas: "Gerente general de Agrosuper durante la colusión de los pollos. Declaró ante el TDLC que se encargó un modelo de proyecciones de ventas a 'don Jorge Quiroz' y que incluso se pidió una segunda versión del modelo. Su correo electrónico con José Guzmán fue clave para evidenciar las instrucciones de cargas coordinadas desde la APA."
  maria_soledad_valenzuela:
    nombre: María Soledad Valenzuela
    cargo: Gerenta de estudios de la APA
    notas: "Gerenta del área de estudios de la Asociación de Productores Avícolas (APA) durante la colusión de los pollos. Declaró ante el TDLC que con el estudio de Jorge Quiroz se elaboraron las proyecciones de venta de Agrosuper, Ariztía y Don Pollo; la FNE obtuvo sus cuadernos con apuntes de reuniones con Quiroz para discutir su modelo."
  juan_miguel_ovalle:
    nombre: Juan Miguel Ovalle
    cargo: Director ejecutivo de la APA
    notas: "Director ejecutivo de la Asociación de Productores Avícolas (APA) durante la colusión de los pollos. Según el expediente del TDLC, operó como articulador del cartel: fijaba precios de referencia, enviaba proyecciones de ventas y coordinaba las 'cargas' de producción entre Agrosuper, Ariztía y Don Pollo."
  victoria_escalante_gonzalez:
    nombre: Victoria Escalante González
    cargo: Presidenta de FENADAJ
    organizacion: fenadaj
    notas: "Presidenta de la Federación Nacional de Acceso a la Justicia (FENADAJ). En agosto de 2026 confirmó el respaldo de la federación a la denuncia ante la CIDH por los recortes presupuestarios del gobierno de Kast, advirtiendo que la reducción de recursos compromete el ejercicio de derechos fundamentales y los riesgos para la implementación del Servicio Nacional de Acceso a la Justicia y Defensoría de Víctimas."
  margarita_romero_mendez:
    nombre: Margarita Romero Méndez
    cargo: Presidenta de la Asociación por la Memoria y los DDHH Colonia Dignidad
    notas: "Médica, defensora de los DDHH y presidenta de la Asociación por la Memoria y los Derechos Humanos Colonia Dignidad. En agosto de 2026 publicó una columna en El Mostrador sobre la audiencia ante la CIDH ('cuatro meses en que Chile retrocedió décadas en materia de DDHH'), denunciando que los decretos de ajuste presupuestario recortaron más de $1.800 millones que afectan a programas de reparación y salud, y describiendo los cambios como 'un patrón coherente de debilitamiento institucional'."
  montserrat_solano:
    nombre: Montserrat Solano
    cargo: Representante del ACNUDH para las Américas
    organizacion: acnudh
    notas: "Representante de la Oficina Regional para las Américas del Alto Comisionado de Naciones Unidas para los Derechos Humanos (ACNUDH). En la audiencia de la CIDH del 5 de agosto de 2026 recordó que Chile construyó desde el retorno a la democracia una 'arquitectura institucional relevante y robusta' en DDHH y pidió que cualquier modificación institucional o presupuestaria que afecte al Programa de Derechos Humanos o al Plan Nacional de Búsqueda sea evaluada a la luz de las obligaciones internacionales, evitando retrocesos."
  claudio_nash:
    nombre: Claudio Nash
    cargo: Académico y coordinador de la cátedra de DDHH de la U. de Chile
    notas: "Coordinador de la cátedra de derechos humanos de la Facultad de Derecho de la Universidad de Chile. Citado por IPS (julio 2026) afirmando que los cambios del gobierno de Kast revelan 'una estrategia coordinada de desmantelamiento progresivo de la institucionalidad de protección de derechos humanos'."
  nelson_caucoto:
    nombre: Nelson Caucoto
    cargo: Abogado de derechos humanos
    notas: "Abogado chileno que ha llevado más de 300 causas de derechos humanos. Citado por IPS (julio 2026) sobre las políticas negacionistas del gobierno de Kast: 'Nadie puede sorprenderse de lo que están actuando en derechos humanos porque las nuevas autoridades son completamente refractarias a esta temática partiendo por el presidente que es pinochetista'."
  benjamin_salas_kantor:
    nombre: Benjamín Salas Kantor
    cargo: Exasesor internacional de la Presidencia
    notas: "Exasesor internacional de la Presidencia. Autor de la columna de Nuevo Poder (6 de agosto de 2026) 'Exigencia de rigor a la CIDH', que critica la decisión de la Comisión Interamericana de convocar la audiencia sobre el supuesto 'desmantelamiento' de la institucionalidad de DDHH en Chile, planteando que la CIDH debería actuar con mayor prudencia y rigor."

  gervoy_paredes:
    nombre: Gervoy Paredes
    cargo: Exalcalde de Puerto Montt
    notas: "Alcalde de Puerto Montt al momento del paro de camioneros de agosto de 2020. Exigió al gobierno acción ante el bloqueo de camioneros que impidió el paso de los recolectores de basura en plena pandemia, advirtiendo riesgo sanitario y criticando la inacción del Ministerio del Interior."

  cristina_cabello:
    nombre: Cristina Cabello
    cargo: Jueza presidenta del Cuarto Tribunal Oral en lo Penal de Santiago
    notas: "Jueza presidenta del Cuarto Tribunal Oral en lo Penal de Santiago durante el juicio contra Claudio Crespo por el caso Gustavo Gatica. En la jornada 35 (27 de diciembre de 2024) consideró 'irrelevante para el tribunal' detenerse en el detalle del mechón de pelo exhibido por la fiscal Ximena Chong en el contrainterrogatorio."

  francisco_ledesma:
    nombre: Francisco Ledesma
    cargo: Fiscal del caso Gustavo Gatica
    notas: "Fiscal que imputó a Claudio Crespo haber disparado a Gustavo Gatica con 'ánimo' de castigarlo durante el estallido social, según el relato del propio Crespo en su contrainterrogatorio del 27 de diciembre de 2024."

  jorge_cantallopts:
    nombre: Jorge Cantallopts
    cargo: Director ejecutivo del Centro de Estudios del Cobre y la Minería (CESCO)
    notas: "Director ejecutivo de CESCO. Tras el anuncio de revisión de la cartera de inversiones de Codelco (agosto de 2026) señaló que no necesariamente implica una crisis, sino una práctica habitual de la industria, advirtiendo por el impacto en proyectos estratégicos y en los contratistas."

  alvaro_garcia:
    nombre: Álvaro García
    cargo: Decano de la Facultad de Ciencias Económicas y Empresariales de la Universidad de los Andes
    notas: "Decano de la FCEyE de la Universidad de los Andes. Sobre la revisión de la cartera de inversiones de Codelco (agosto de 2026) planteó la tensión entre mantener los aportes de la estatal al Estado y disponer de recursos para financiar su plan de inversiones, sugiriendo que parte de la venta de activos podría financiar el plan estratégico."

  diego_caceres_solis:
    nombre: Diego Cáceres Solís
    cargo: Arquitecto en ciberseguridad, docente de la Pontificia Universidad Católica
    notas: "Especialista en hacking ético. En agosto de 2026 explicó a Bío Bío Investiga que el correo extorsivo recibido por cientos de fiscales (remitente asociadosanf-bounces@fiscales.cl) correspondía a una suplantación del dominio institucional: la casilla 'bounces' se usa para rebotes de correos y una configuración deficiente permitiría que terceros envíen mensajes que aparenten provenir del organismo."

  veronica_oporto:
    nombre: Verónica Oporto González
    cargo: Madre de la senadora Camila Flores
    notas: "Según el certificado de nacimiento de la senadora Camila Flores, Oporto González es su madre. En 2025 gestionaba la regularización de un inmueble rural en la Región de Los Ríos (comuna de Futrono, superficie inferior a 5.000 m², Ley 20.234), tramitación que la entonces diputada Flores impulsó con oficios a Bienes Nacionales (revelado por Contrapoder, 17-feb-2026)."

  jorge_pacheco:
    nombre: Jorge Pacheco
    cargo: Secretario regional ministerial de Bienes Nacionales de la Región de Los Ríos (2025)
    notas: "Respondió en menos de 24 horas al oficio del 28 de agosto de 2025 de la diputada Camila Flores sobre la tramitación del inmueble de Verónica Oporto González, indicando que el expediente estaba en etapa final y que debía consultarse a la Dirección de Obras de Futrono (Ley 20.234) y a DIFROL por tratarse de zona fronteriza."

  karina_riquelme:
    nombre: Karina Riquelme
    cargo: Abogada de derechos humanos, defensora de los hijos de Julia Chuñil
    notas: "Defensora de los hijos de la dirigenta mapuche Julia Chuñil (Región de Los Ríos). En agosto de 2026 el Ministerio Público utilizó 'fiscales sin rostro' en una causa en su contra; el persecutor, que compareció por videoconferencia, aseguró que no se investiga a la abogada (Araucanía Diario, 8-ago-2026)."

  julia_chunil:
    nombre: Julia Chuñil
    cargo: Dirigenta mapuche de la Región de Los Ríos, desaparecida
    notas: "Dirigenta mapuche desaparecida. Sus hijos fueron imputados por su homicidio (parricidio) tras el hallazgo de restos humanos en su predio en abril de 2026. En julio de 2026 una madre y su hijo fueron condenados a 7 años por amenazas a un fiscal del caso y tenencia de explosivos. El caso es seguido por el vault (evento 20260808-1)."

  carolina_gainza:
    nombre: Carolina Gainza Cortés
    cargo: Exsubsecretaria de Ciencia, Tecnología, Conocimiento e Innovación
    notas: "Exsubsecretaria de Ciencia del gobierno de Gabriel Boric (2022-2024). Académica y directora ejecutiva del proyecto Massi-Conocimientos 2030 de la UDP. El 7 de agosto de 2026 cuestionó en ADN Radio la cifra de morosos de Becas Chile presentada por la ministra Ximena Lincolao."
  pilar_giannini:
    nombre: Pilar Giannini
    cargo: Subsecretaria de Seguridad Pública
    notas: "Subsecretaria de Seguridad Pública del gobierno de José Antonio Kast. El 8 de agosto de 2026 destacó el megaoperativo nacional ACOT de Carabineros y PDI."

  laurence_golborne:
    nombre: Laurence Golborne Riveros
    cargo: Ex ministro de Minería y Obras Públicas de Piñera
    cargos:
      - cargo: Ministro de Obras Públicas
        organizacion: ministerio_de_obras_publicas
        desde: 2011-07-18
        hasta: 2012-11-05
      - cargo: Ministro de Minería
        organizacion: ministerio_mineria
        desde: 2010-03-11
        hasta: 2011-07-18
      - cargo: Ministro de Energía
        organizacion: ministerio_energia
        desde: 2011-01-16
        hasta: 2011-07-18
    notas: "Ex ministro de Minería (2010-2011) y de Obras Públicas (2011-2012) del primer gobierno de Sebastián Piñera. Precandidato presidencial UDI en 2013; su campaña fue financiada de forma irregular (caja Penta, 'lista de Carrasco'), lo que lo excluyó de la carrera y derivó en una querella del SII y una formalización por el caso Penta en 2016."
  roberto_carrasco:
    nombre: Roberto Carrasco
    cargo: Empresario e ingeniero comercial
    notas: "Dueño de las empresas Asesorías VSA y Siglo Outsourcing. Amigo personal de Laurence Golborne, declaró ante la Fiscalía de Alta Complejidad el 4 de noviembre de 2015 haber emitido facturas ideológicamente falsas para recaudar fondos para la campaña presidencial de Golborne ('lista de Carrasco'). Fue formalizado en febrero de 2016."
  alonso_guzman:
    nombre: Alonso Guzmán
    cargo: Director financiero de Aclara Technologies
    notas: "Director financiero de la filial Aclara Technologies de Aclara Resources. En una entrevista con el medio especializado MetalMiner (agosto 2026) confirmó que la empresa mantiene conversaciones con usuarios finales en Estados Unidos y Japón —incluidos contratistas militares— para la venta de tierras raras del proyecto Módulo Penco."
  camila_arriagada:
    nombre: Camila Arriagada
    cargo: Vocera de Penco-Lirquén Libre de Mineras
    notas: "Vocera de la campaña Penco-Lirquén Libre de Mineras. El 8 de agosto de 2026 advirtió que las tierras raras del proyecto Aclara en Penco podrían abastecer a la industria armamentista y denunció un acuerdo del gobierno de Kast con Donald Trump previo a la aprobación ambiental del proyecto."
  oscar_carrillo_zuniga:
    nombre: Oscar Carrillo Zúñiga
    cargo: Integrante de la Corporación Parque para Penco
    notas: "Integrante de la Corporación Parque para Penco; prepara presentaciones legales para impugnar la aprobación del proyecto minero de tierras raras de Aclara en Penco (agosto 2026)."
  rodrigo_carcamo:
    nombre: Rodrigo Cárcamo
    cargo: Experto en defensa
    notas: "Experto en defensa citado por El Periodista sobre el uso de tierras raras en la industria militar (aviones F-35, submarinos, drones, radares y sistemas de propulsión)."
  rodrigo_vera_penco:
    nombre: Rodrigo Vera
    cargo: Alcalde de Penco
    notas: "Alcalde de Penco (Región del Biobío). Junto a todo su concejo municipal ha manifestado rechazo al proyecto minero de tierras raras de Aclara."
  julia_orostegui:
    nombre: Julia Oróstegui
    cargo: Directora ejecutiva del SLEP Puerto Cordillera
    cargos:
      - cargo: Directora ejecutiva del SLEP Puerto Cordillera
        organizacion: slep_puerto_cordillera
        desde: 2026-08-05
    notas: "Directora ejecutiva del Servicio Local de Educación Pública (SLEP) Puerto Cordillera, designada por el presidente José Antonio Kast mediante el Sistema de Alta Dirección Pública y presentada el 5 de agosto de 2026. Fue multada (20% de remuneraciones) por salir de Chile con licencia médica; lo atribuye a una urgencia médica por enfermedad autoinmune."
  pedro_larrain_aguirre:
    nombre: Pedro Larraín Aguirre
    cargo: Director de Educación Pública
    notas: "Director de Educación Pública (ministerio de Educación). Presentó oficialmente a la directora del SLEP Puerto Cordillera el 5 de agosto de 2026."
  marcelo_salvo_meneses:
    nombre: Marcelo Salvo Meneses
    cargo: Seremi de Educación de la Región de Coquimbo
    notas: "Seremi de Educación de la Región de Coquimbo. Participó en la presentación oficial de la directora del SLEP Puerto Cordillera el 5 de agosto de 2026."
  miguel_diaz_canel:
    nombre: Miguel Díaz-Canel
    cargo: Presidente de Cuba
    notas: "Presidente de Cuba y primer secretario del Comité Central del Partido Comunista de Cuba. Se ha reunido con el presidente del PC chileno Lautaro Carmona en sus visitas a la isla."
  luis_cuello:
    nombre: Luis Cuello
    cargo: Diputado (PC)
    notas: "Diputado del Partido Comunista de Chile. Calificó como 'censuradora' la ofensiva de la UDI contra el viaje del PC a Cuba."
  boris_barrera:
    nombre: Boris Barrera
    cargo: Diputado (PC)
    notas: "Diputado del Partido Comunista de Chile. Respondió a la UDI por el viaje del PC a Cuba recordando el apoyo gremialista a la dictadura de Pinochet."
  axel_kaiser:
    nombre: Axel Kaiser
    cargo: Subdirector académico de la Fundación Faro
    notas: "Abogado y filósofo liberal chileno, hermano de Johannes Kaiser. Subdirector académico de la Fundación Faro (Argentina) desde noviembre de 2024 y figura del círculo del gobierno de Javier Milei."
  federico_sturzenegger:
    nombre: Federico Sturzenegger
    cargo: Ministro de Desregulación y Transformación del Estado de Argentina
    notas: "Ministro de Desregulación y Transformación del Estado de la Nación Argentina. Considerado el principal nexo entre el PNL chileno y la Casa Rosada."
  victor_espinosa:
    nombre: Víctor Espinosa
    cargo: Encargado económico del programa presidencial del PNL
    notas: "Economista, encargado del programa económico de Johannes Kaiser y principal referente económico del Partido Nacional Libertario. Se reunió en tres ocasiones con Federico Sturzenegger."
  nicolas_marquez:
    nombre: Nicolás Márquez
    cargo: Biógrafo de Javier Milei
    notas: "Escritor e influencer argentino, biógrafo de Javier Milei y autor de obras de derecha radical; organizador del Viva la Derecha Fest. Pregonó que Johannes Kaiser sería el próximo presidente de Chile."
  agustin_laje:
    nombre: Agustín Laje
    cargo: Líder de la Fundación Faro
    notas: "Escritor y conferencista argentino de la derecha radical, organizador del Viva la Derecha Fest y líder de la Fundación Faro, think tank cercano a Javier Milei."
  ricardo_ramirez:
    nombre: Ricardo Ramírez
    cargo: Encargado del programa cultural del PNL
    notas: "Militante del Partido Nacional Libertario, encargado del programa cultural del partido; expuso en el Viva la Derecha Fest de Buenos Aires (octubre 2024)."
  irene_del_real:
    nombre: Irene del Real
    cargo: Geóloga de la Pontificia Universidad Católica de Chile
    notas: "Geóloga de la UC que visitó la planta piloto de Aclara en San Pedro de la Paz; señaló que las tierras raras también se usan para material bélico y que no existe trazabilidad sobre su destino final."
  ricardo_yanez:
    nombre: Ricardo Yáñez
    cargo: General director de Carabineros (2022-2024)
    notas: "General director de Carabineros durante el gobierno de Boric; en la Cuenta Pública 2023 fue interpelado directamente por el Presidente ('¿Estoy en lo correcto general Yáñez?'). Posteriormente formalizado por la justicia por apremios durante el estallido social."
  elisa_loncon:
    nombre: Elisa Loncón
    cargo: Expresidenta de la Convención Constitucional
    notas: "Lingüista mapuche, presidenta de la Convención Constitucional (2021-2022); mencionada por Boric en la Cuenta Pública 2023 entre los casos de ataques de la oposición."
  marco_antonio_avila:
    nombre: Marco Antonio Ávila Lavanal
    cargo: Exministro de Educación (2022-2023)
    cargos:
      - cargo: Ministro de Educación
        organizacion: ministerio_educacion
        desde: 2022-03-11
        hasta: 2023-08-16
    notas: "Ministro de Educación del gobierno de Boric; mencionado por Boric en la Cuenta Pública 2023 por los dichos homofóbicos que recibió desde la oposición."
  luis_thayer:
    nombre: Luis Thayer
    cargo: Exdirector del Servicio Nacional de Migraciones (2022-2024)
    notas: "Exdirector del Sermig; cuestionó en agosto de 2026 la nueva metodología de conteo de ingresos irregulares del gobierno de Kast ('introducir una nueva cifra para mostrar eventualmente un mejor resultado es una práctica que yo encuentro que es poco transparente')."
  francisca_alamos:
    nombre: Francisca Álamos
    cargo: Jefa de la Oficina de Mercado de Capitales del Ministerio de Hacienda
    notas: "Subrayó en el anuncio del Grupo de Trabajo de Exportación de Servicios Financieros (agosto 2026) que es indispensable eliminar barreras operativas y regulatorias para expandir los servicios financieros a clientes internacionales."
  cesar_marquez:
    nombre: César Márquez
    cargo: Exgerente de Presupuesto y Control de Gestión de Codelco
    notas: "Único ejecutivo desvinculado por el abultamiento irregular de la producción 2025 de Codelco (despedido el 20-may-2026 por artículo 160); declaró ante la comisión investigadora de la Cámara sobre la 'operación rastrillo' y tiene una demanda abierta contra el Estado."
  tamara_agnic:
    nombre: Tamara Agnic
    cargo: Directora de Codelco y presidenta del Comité de Auditoría, Compensaciones y Ética (CACE)
    notas: "Dirigió la revisión del cierre de producción 2025 de Codelco tras la denuncia anónima de febrero 2026; declaró ante la comisión investigadora de la Cámara de Diputados."
  ruben_alvarado:
    nombre: Rubén Alvarado
    cargo: Presidente ejecutivo de Codelco (2022-2026)
    notas: "Defendió ante la comisión investigadora de la Cámara la 'operación rastrillo' como búsqueda de 'oportunidades operacionales legítimas para reducir inventarios', rechazando la caracterización de producción inflada."
  braim_chiple:
    nombre: Braim Chiple
    cargo: Vicepresidente de Comercialización (VCO) de Codelco
    notas: "Autor del correo del 9-dic-2025 al presidente ejecutivo Rubén Alvarado sobre la 'cuenta del carnicero respecto a la operación rastrillo 2025', citado en la investigación por bonos irregulares de BBCl Investiga."
  patricio_melero:
    nombre: Patricio Melero Abaroa
    cargo: Presidente de SalmonChile; exministro del Trabajo
    cargos:
      - cargo: Ministro del Trabajo y Previsión Social
        organizacion: ministerio_trabajo
        desde: 2021-04-07
        hasta: 2022-03-11
    notas: "Exministro del Trabajo de Piñera; preside el gremio SalmonChile, que presentó ante la USTR de EE.UU. una solicitud a nombre de las 48 empresas que representa contra el arancel del 12,5%."
  andres_ergas:
    nombre: Andrés Ergas
    cargo: Embajador de Chile en Estados Unidos
    notas: "Empresario sin experiencia diplomática previa, elegido por el gobierno de Kast por su cercanía al mundo MAGA de Florida; a cargo de la embajada en Washington durante la negociación del arancel del 12,5%. Los gremios lo describieron como poco informado sobre la estrategia negociadora."
  eduardo_urbina:
    nombre: Eduardo Urbina
    cargo: Secretario general regional de RN Valparaíso
    notas: "Impulsó elevar al Tribunal Supremo de RN los dichos de la senadora Camila Flores contra Fabiola Campillai ('señora de feria'), señalando que corresponde al máximo órgano disciplinario del partido determinar si constituyen una infracción."
  nelson_contreras:
    nombre: Nelson Contreras Irrazabal
    cargo: Prefecto de la PDI en Ñuble
    notas: "Vocero del operativo conjunto PDI-Carabineros del 8-ago-2026 en la Región de Ñuble que dejó 31 detenidos."
  hector_ponce:
    nombre: Héctor Ponce
    cargo: Seremi de Seguridad Pública de Ñuble
    notas: "Coordinó junto al prefecto de la PDI y al delegado presidencial los operativos masivos de seguridad en la Región de Ñuble de agosto 2026."
  jorge_baradit:
    nombre: Jorge Baradit Morales
    cargo: Escritor y periodista
    notas: "Criticó en redes el 9-ago-2026 la zanja fronteriza del Plan Escudo Fronterizo tras cruzar la frontera con Perú (#LaZanja): 'me dio vergüenza ajena'."
  rodrigo_perez_stiepovic:
    nombre: Rodrigo Pérez Stiepovic
    cargo: Principal asesor legal del Presidente (Segundo Piso)
    notas: "Exgerente legal de Colbún (18 años) y amigo de Kast desde la universidad; el asesor mejor pagado de La Moneda con $9,5 millones brutos mensuales (planillas abril 2026)."
  sebastian_torrealba:
    nombre: Sebastián Torrealba del Río
    cargo: Asesor de Gobierno Digital e Inteligencia Artificial (Segundo Piso)
    notas: "Ingeniero civil industrial; segundo asesor mejor pagado de La Moneda con $9,2 millones brutos mensuales (planillas abril 2026)."
  victor_valdes:
    nombre: Víctor Valdés
    cargo: Jefe de gabinete del jefe de asesores del Presidente
    notas: "Ingeniero comercial; asesor de La Moneda con $6,9 millones brutos mensuales, cuestionado por mantener su cargo remunerado como consejero regional metropolitano (Core)."
  alvaro_bellolio:
    nombre: Álvaro Bellolio
    cargo: Jefe de Políticas Públicas del Segundo Piso
    notas: "Ingeniero civil industrial y exdirector del Servicio Nacional de Migraciones; asesor de La Moneda con $6,9 millones brutos mensuales, cuestionado por su doble rol como Core remunerado."
  francisco_riveros_cantuarias:
    nombre: Francisco Riveros Cantuarias
    cargo: Abogado del Segundo Piso (proyecto 'Inspección Total')
    notas: "Asesor de La Moneda con $6,99 millones brutos mensuales; coordinó el cierre de la primera carga masiva de información de la 'Inspección Total' de auditorías al gobierno anterior."
  alex_gonzalo_troncoso_araya:
    nombre: Álex Gonzalo Troncoso Araya
    cargo: Abogado de deudores del CAE
    notas: "Abogado que obtuvo los fallos de las Cortes de Apelaciones de La Serena y Valparaíso que declararon ilegal el cobro del CAE por procedimiento tributario (agosto 2026)."
  augusto_pinochet_hiriart:
