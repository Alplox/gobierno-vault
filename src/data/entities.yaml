        hasta: 2026-03-11
    organizacion: presidencia_chile
  helmuth_frenz:
    nombre: Helmut Frenz
    cargo: Obispo de la Iglesia Evangélica Luterana en Chile (1969-1975)
    notas: "Obispo luterano, figura clave en la creación del Comité Nacional de Ayuda a los Refugiados (CONAR, 24 septiembre 1973) y cofundador en octubre de 1973 del Comité de Cooperación para la Paz en Chile (Copachi) junto al obispo católico Fernando Ariztía. Expulsado de Chile en 1975 por su defensa de los perseguidos políticos. Recibió en 1979 la medalla Fridtjof Nansen del ACNUR."
  izkia_siches:
    nombre: Izkia Siches Pastén
    cargo: Exministra del Interior
    cargos:
      - cargo: Ministra del Interior y Seguridad Pública
        organizacion: ministerio_interior
        desde: 2022-03-11
        hasta: 2022-09-07
    organizacion: ministerio_interior
  sabas_chahuan:
    nombre: Sabas Chahuán
    cargo: Fiscal Nacional
    organizacion: ministerio_publico
    notas: "Fiscal Nacional de Chile (2007-2015). En enero de 2010 dictó una instrucción general que prohibía a los fiscales adjuntos ingresar a las salas de juego de los casinos del país, medida que la Tercera Sala de la Corte Suprema declaró ilegal el 19 de enero de 2010 (recurso de protección de la Asociación Nacional de Fiscales). Tras el fallo señaló que no quedaba más que respetarlo y acatarlo."
  milton_juica:
    nombre: Milton Juica
    cargo: Presidente de la Corte Suprema
    organizacion: corte_suprema
    notas: "Ministro y presidente de la Corte Suprema de Chile (2010-2012). El 20 de enero de 2010 sostuvo una reunión protocolar con el fiscal nacional Sabas Chahuán, quien se refirió al fallo de la Tercera Sala que revocó la prohibición de ingreso de fiscales a los casinos de juego."
  guillermo_teillier:
    nombre: Guillermo Teillier
    cargo: Presidente del Partido Comunista
    organizacion: partido_comunista
    notas: "Presidente del Partido Comunista de Chile (2005-2021) y diputado. En diciembre de 2009 oficializó el apoyo del PC a la candidatura de Eduardo Frei para la segunda vuelta presidencial del 17 de enero de 2010 contra Sebastián Piñera, tras suscribir el comando de Frei un documento programático de 12 puntos."
  jorge_arrate:
    nombre: Jorge Arrate Mac Niven
    cargo: Exministro y excandidato presidencial
    cargos:
      - cargo: Ministro Secretario General de Gobierno
        organizacion: segegob
        desde: 1998-08-01
        hasta: 1999-06-22
      - cargo: Ministro del Trabajo y Previsión Social
        organizacion: ministerio_trabajo
        desde: 1994-03-11
        hasta: 1998-08-01
    notas: "Exministro de Estado (Educación y Minería, 2006-2010), excandidato presidencial del Juntos Podemos en 2009. Tras quedar fuera de la segunda vuelta, respaldó a Eduardo Frei en el balotaje del 17 de enero de 2010; el Partido Comunista anunció que no descartaba su participación activa en la campaña de Frei."
  andres_velasco:
    nombre: Andrés Velasco Brañes
    cargo: Ex ministro de Hacienda
    organizacion: ministerio_hacienda
    cargos:
      - cargo: Ministro de Hacienda
        organizacion: ministerio_hacienda
        desde: 2006-03-11
        hasta: 2010-03-11
    notas: "Economista y ministro de Hacienda del gobierno de Michelle Bachelet (2006-2010). En diciembre de 2009 acompañó al candidato presidencial Eduardo Frei en el relanzamiento de su campaña en Valparaíso y Viña del Mar, reconociendo que la tarea de Frei sería mejorar la calidad de la política chilena."
  igor_garafulic:
    nombre: Igor Garafulic
    cargo: Intendente Metropolitano
    notas: "Intendente de la Región Metropolitana (2006-2010) bajo el gobierno de Michelle Bachelet. En noviembre de 2009 impulsó con la Asociación Chilena de Municipalidades una campaña masiva de tenencia responsable de mascotas para reducir los más de 250 mil perros abandonados de la RM."
  rosario_navarro:
    nombre: Rosario Navarro
    cargo: Presidenta de la Sofofa
    notas: "Presidenta de la Sociedad de Fomento Fabril (Sofofa). En noviembre de 2024, ante la propuesta de reforma tributaria de Hacienda (ministro Mario Marcel), valoró la rebaja del impuesto de primera categoría pero criticó el sistema dual por no simplificar el complejo sistema tributario chileno."
  roberto_belmar:
    nombre: Roberto Belmar
    cargo: Seremi de Salud de la Región Metropolitana
    notas: "Seremi de Salud de la Región Metropolitana en 2009. En el marco de la campaña de tenencia responsable de mascotas señaló que el problema no pasa por mayores acciones punitivas."
  gonzalo_navarrete:
    nombre: Gonzalo Navarrete
    cargo: Presidente de la Comisión de Salud de la Asociación Chilena de Municipalidades
    notas: "Edil y presidente de la comisión de salud de la Asociación Chilena de Municipalidades en 2009. Descartó la eutanasia masiva como solución para reducir el número de perros abandonados en la Región Metropolitana."
  carolina_toha:
    nombre: Carolina Tohá Morales
    cargo: Exministra del Interior
    cargos:
      - cargo: Ministra del Interior y Seguridad Pública
        organizacion: ministerio_interior
        desde: 2022-09-06
        hasta: 2026-03-11
    organizacion: ministerio_interior
    notas: "Exalcaldesa de Santiago (PPD). Asumió el Ministerio del Interior y Seguridad Pública el 6 de septiembre de 2022, tras la salida de Izkia Siches, y permaneció en el cargo hasta el fin del gobierno de Boric."
  ronald_ojeda:
    nombre: Ronald Ojeda Moreno
    cargo: Exmilitar venezolano y disidente político
    notas: "Teniente (R) del Ejército de Venezuela asilado en Chile. Secuestrado la madrugada del 21 de febrero de 2024 en Independencia por sujetos disfrazados de la PDI; su cuerpo fue hallado el 1 de marzo de 2024 bajo un bloque de cemento en una toma de Maipú. La Fiscalía ECOH vinculó el crimen a células del Tren de Aragua y apuntó a un posible encargo político del régimen de Nicolás Maduro."
  antonio_jalaff:
    nombre: Antonio Jalaff
    cargo: Empresario, cofundador de Factop
    notas: "Hermano de Álvaro Jalaff e imputado en el caso Audios-Factop. La minuta de formalización de enero de 2025 detalla cómo los hermanos Jalaff recibieron financiamiento de Factop disimulado como operaciones de factoring."
  victor_pino:
    nombre: Víctor Pino
    cargo: Delegado presidencial de Coquimbo
    organizacion: ministerio_interior
    notas: "Diputado de Demócratas. Asumió como delegado presidencial regional de Coquimbo en el gobierno de José Antonio Kast, cargo en el que participó de la tramitación de la megareforma. El organigrama del gobierno de El País (11-mar-2026) lo confirma entre los 16 delegados regionales."
  german_codina:
    nombre: German Codina
    cargo: Delegado Presidencial Region Metropolitana
    cargos:
      - cargo: Delegado Presidencial Region Metropolitana
        organizacion: delegacion_presidencial_rm
        desde: 2026-03-11
  carlos_melo:
    nombre: Carlos Melo
    cargo: Gerente corporativo de Planificación y Clientes de Metro de Santiago
    cargos:
      - cargo: Gerente corporativo de Planificación y Clientes
        organizacion: metro_santiago
  felipe_bravo:
    nombre: Felipe Bravo
    cargo: Gerente general de Metro de Santiago
    cargos:
      - cargo: Gerente general
        organizacion: metro_santiago
  ariel_lopez:
    nombre: Ariel López
    cargo: Ingeniero en Transportes y columnista de Contrapoder
    notas: "Ingeniero en Transportes que publica columnas en el medio digital Contrapoder Chile. El 6 de agosto de 2026 difundió una columna advirtiendo que varias estaciones de la Línea 5 del Metro no contarían con extintores tras el incendio de Santa Isabel."
  carmen_soza:
    nombre: Carmen Soza del Río
    cargo: Abogada y exdirectora ejecutiva de Ideas Republicanas
    notas: "Abogada y directora ejecutiva de Ideas Republicanas, el centro de estudios del Partido Republicano, gestora del programa de gobierno de José Antonio Kast y parte del 'círculo de hierro' del presidente. Quedó fuera del gabinete en 2026. El 6 de agosto de 2026 renunció a la dirección de Ideas Republicanas por 'diferencias insalvables' en la gestión interna y el trato en el proyecto, tras diferencias con el jefe de asesores del Segundo Piso, Alejandro Irarrázaval."
  alfredo_ugarte:
    nombre: Alfredo Ugarte
    cargo: Académico de la Universidad de Chile y abogado en derecho tributario
    notas: "Abogado y académico de la Universidad de Chile, experto en derecho financiero tributario. El 6 de agosto de 2026 criticó en The Clinic y Cambio21 la invariabilidad tributaria de la megarreforma como inconstitucional."
  aisen_etcheverry:
    nombre: Aisén Etcheverry Escudero
    cargo: Exministra de Ciencia, Tecnología, Conocimiento e Innovación
    cargos:
      - cargo: Ministra de Ciencia, Tecnología, Conocimiento e Innovación
        organizacion: ministerio_ciencia
        desde: 2023-03-10
        hasta: 2025-07-22
    notas: "Exministra de Ciencia de la administración de Gabriel Boric. El 6 de agosto de 2026 envió una carta a El Mercurio alertando por los cambios al Fondecyt bajo el gobierno de Kast."
  teresa_paneque:
    nombre: Teresa Paneque
    cargo: Astrónoma y divulgadora científica
    notas: "Astrónoma y divulgadora científica chilena. En agosto de 2026 cuestionó los cambios a las bases del Fondecyt que priorizan áreas y exigen residencia definitiva a investigadores extranjeros."
  gustavo_sanhueza:
    nombre: Gustavo Sanhueza
    cargo: Senador (UDI)
    cargos:
      - cargo: Senador (UDI)
        organizacion: udi
        desde: 2026-03-11
  ivan_flores:
    nombre: Ivan Flores
    cargo: Senador (DC)
    cargos:
      - cargo: Senador (DC)
        organizacion: partido_democratacristiano
        desde: 2026-03-11
      - cargo: Intendente de Los Ríos
        desde: 2008-01
        hasta: 2009-12
    notas: "Senador DC desde 2026. En diciembre de 2009 renunció a la Intendencia de Los Ríos tras ser captado con un folleto de campaña de Eduardo Frei en un acto oficial, en plena segunda vuelta presidencial. Su renuncia fue citada por el Sence como antecedente en la amonestación a la directora regional de Los Lagos por usar una chapita de Frei."
  javier_macaya:
    nombre: Javier Macaya
    cargo: Senador (UDI)
    cargos:
      - cargo: Senador (UDI)
        organizacion: udi
        desde: 2026-03-11
  jorge_quiroz:
    nombre: Jorge Antonio Quiroz Castro
    cargo: Ministro de Hacienda
    cargos:
      - cargo: Coordinador económico de campaña de José Antonio Kast
        organizacion: partido_republicano
        desde: 2025-07-10
        hasta: 2026-03-11
      - cargo: Ministro de Hacienda
        organizacion: ministerio_hacienda
        desde: 2026-03-11
    organizacion: ministerio_hacienda
    bio: "<p>Economista chileno nacido en Valparaíso en 1962, hijo de profesores universitarios humanistas. Estudió en el Colegio Alemán de Valparaíso y la Escuela Experimental de la Universidad Santa María de Viña del Mar, y luego Ingeniería Comercial en la Universidad de Chile. Obtuvo un doctorado en economía en Duke University, institución donde también estudiaron Ricardo Lagos y Walter Molano.</p><p>Fue académico de la Pontificia Universidad Católica, de ILADES Georgetown (1991-94) y profesor adjunto de la Facultad de Ingeniería Industrial de la Universidad de Chile (1994-99). Cofundó la consultora Gerens junto al economista Patricio Arrau y en 2001 fundó la consultora Quiroz y Asociados, donde se dedicó durante más de dos décadas a asesorar a empresas en litigios económicos y de libre competencia. Forma parte del directorio de la Bolsa de Comercio de Santiago.</p><p>Autor de los libros 'Cuentos Pendientes' (2015) y 'Chile entre sus dos terremotos' (2017, con su hija), ha sido columnista de El Mercurio. Durante la campaña presidencial de José Antonio Kast fue coordinador económico, y asumió como ministro de Hacienda el 11 de marzo de 2026.</p>"
  alvaro_gonzalez:
    nombre: Álvaro González
    cargo: Subsecretario de Minería
    cargos:
      - cargo: Subsecretario de Minería
        organizacion: ministerio_mineria
        desde: 2026-03-11
    notas: Encabezó delegación chilena en reactivación del Tratado Minero Binacional (julio 2026).
  jose_antonio_kast:
    nombre: José Antonio Kast Rist
    cargo: Presidente de la República de Chile
    cargos:
      - cargo: Presidente de la República de Chile
        organizacion: presidencia_chile
        desde: 2026-03-11
    aliases:
      - Kast
      - JAK
  patricio_pinilla:
    nombre: Patricio Pinilla
    cargo: Diputado (DC)
    organizacion: partido_democratacristiano
    notas: "Diputado de la DC, integrante de la comisión de Seguridad Ciudadana de la Cámara. Tras la revelación de las cirugías estéticas de Janet Morales, esposa del general director de Carabineros, planteó que era complicado llevar a cabo el sumario en contra del General Director y su esposa en una institución tan jerarquizada como Carabineros (agosto 2026)."
  patricio_elgueta:
    nombre: Patricio Elgueta
    cargo: Presidente de la Federación de Trabajadores del Cobre (FTC)
    organizacion: federacion_trabajadores_cobre
    notas: "Dirigente sindical, presidente de la Federación de Trabajadores del Cobre. En diciembre de 2021 llamó a votar por Gabriel Boric en la segunda vuelta ante la 'amenaza real de que Chile pierda su principal fuente de ingresos', aludiendo a Codelco y a las interpretaciones sobre una eventual privatización planteada por José Antonio Kast."
  niu_qingbao:
    nombre: Niu Qingbao
    cargo: Embajador de China en Chile
    cargos:
      - cargo: Embajador Extraordinario y Plenipotenciario de China en Chile
        organizacion: embajada_china_chile
        desde: 2021-02-22
    organizacion: embajada_china_chile
    notas: "Nacido en julio de 1965 en Huixian, provincia de Henan. Máster en literatura. Embajador de China en Chile desde 2021; previamente embajador en Jamaica (2015-2017) y cónsul general en Mumbai y Auckland. Se reunió con el presidente Kast en La Moneda el 31 de julio de 2026."
  lee_jae_myung:
    nombre: Lee Jae Myung
    cargo: Presidente de la República de Corea del Sur
    cargos:
      - cargo: Presidente de la República de Corea del Sur
        organizacion: corea_del_sur
        desde: 2025-06-01
    notas: "Presidente de Corea del Sur del Partido Demócrata. Asumió en junio de 2025. Realizó visita oficial a Chile el 30 de julio de 2026."
  javier_milei:
    nombre: Javier Milei
    cargo: Presidente de Argentina
    cargos:
      - cargo: Presidente de Argentina
        organizacion: argentina
        desde: 2023-12-10
    notas: Aliado ideológico de Kast
  gustavo_petro:
    nombre: Gustavo Petro
    cargo: Expresidente de Colombia
    cargos:
      - cargo: Presidente de Colombia
        organizacion: colombia
        desde: 2022-08-07
    notas: Cuestionó la conducta de Kast tras el incidente en Villarrica
  juan_luis_castro:
    nombre: Juan Luis Castro
    cargo: Senador (PS)
    cargos:
      - cargo: Senador (PS)
        organizacion: partido_socialista
        desde: 2026-03-11
    jefe_comite: Socialismo Democratico
  rodrigo_rettig:
    nombre: Rodrigo Rettig
    cargo: Abogado y analista
    notas: "Abogado y militante del Partido Liberal, analista habitual de coyuntura política y seguridad en medios. El 7 de agosto de 2026 difundió en X un hilo cuestionando la cifra de '218 mil robos violentos' del presidente Kast en la cadena nacional ACOT, señalando que con los datos del CEAD se observa una curva descendente: 2025 habría registrado menos robos violentos que 2024 y 2023, y menos robos con violencia o intimidación que 2024, 2023, 2022, 2019 y 2018 (balance CEAD 2025: -9,8% vs 2024)."
  raul_soto:
    nombre: Raúl Soto
    cargo: Diputado y presidente del PPD
    organizacion: partido_por_la_democracia
    notas: "Diputado y presidente del Partido por la Democracia (PPD). El 7 de agosto de 2026, tras la cadena nacional de la ACOT, señaló que 'el gran ausente de esta megarreforma de seguridad es el alzamiento del secreto bancario. No se puede perseguir la ruta del dinero, no se puede atacar el corazón del crimen organizado si no debilitamos su poder económico'."
  juan_cristobal_mera:
    nombre: Juan Cristóbal Mera Muñoz
    cargo: Ministro de la Corte de Apelaciones de Santiago
    organizacion: corte_apelaciones_santiago
    notas: "Ministro de la Corte de Apelaciones de Santiago que en 2026 presidió la Segunda Sala. Bío Bío Investiga documentó el 'Factor Mera': intervino cuatro veces en las causas de Joaquín Lavín León y Cathy Barriga (26-ene-2024, 27-mar-2025, 9-abr-2025 y 6-ago-2026) votando siempre a favor de sus intereses; su voto permitió a Lavín pasar a arresto domiciliario total. Su perfil aparece en los chats Hermosilla-Sabaj ('muy culto... de derecha al máximo')."
  juan_castaneda:
    nombre: Juan Castañeda
    cargo: Investigador de la Universidad Autónoma, experto en criminología
    organizacion: universidad_autonoma
    notas: "Investigador de la Universidad Autónoma y experto en criminología. El 7 de agosto de 2026, en el marco del debate por el levantamiento del secreto bancario en la ACOT, señaló a Emol que el marco legal ya permite levantarlo con autorización judicial, que perfeccionarlo 'está lejos de ser la única respuesta' y que la pretensión de que un funcionario del gobierno de turno pueda requerir la medida 'resulta altamente controversial a nivel internacional'."
  louis_de_grange:
    nombre: Louis de Grange Concha
    cargo: Ministro de Transporte y Telecomunicaciones
    cargos:
      - cargo: Ministro de Transporte y Telecomunicaciones
        organizacion: ministerio_transportes
        desde: 2026-03-11
        hasta: 2026-05-19
      - cargo: Biministro de Obras Públicas y Transportes
        organizacion: ministerio_transportes
        desde: 2026-05-19
    notas: Independiente.
  magdalena_retamal:
