people:
  romy_rutherford:
    nombre: Romy Rutherford
    cargo: Ministra de la Corte de Apelaciones de Santiago
    notas: "Ministra de la Corte de Apelaciones de Santiago. Desde 2017 investiga causas de corrupción militar (fraudes en el Ejército con fondos de la Ley Reservada del Cobre), procesando a ex comandantes en Jefe como Humberto Oviedo y Juan Miguel Fuente-Alba. En 2021 denunció espionaje en su despacho por agentes de la Dirección de Inteligencia del Ejército (DINE), antecedentes que envió al Ministerio Público."
  cesar_neira_medina:
    nombre: César Neira Medina
    cargo: Sargento primero del Regimiento de Inteligencia N° 1 "Soberanía" (DINE)
    notas: "Sargento primero del Ejército destinado a la Dirección de Inteligencia del Ejército (DINE). Identificado por CIPER (2021) junto a otro agente haciendo 'punto fijo' frente al despacho de la ministra Romy Rutherford en 2019. Fue reconocido por el ex sargento Juan Pablo Díaz, testigo de los procesos por corrupción militar."
  juan_pablo_diaz:
    nombre: Juan Pablo Díaz
    cargo: Ex sargento segundo del Ejército y testigo de causas de corrupción militar
    notas: "Ex sargento segundo del Ejército, antiguo miembro del área de Inteligencia. Testigo en los procesos de corrupción castrense que lleva la ministra Romy Rutherford y blanco de la Operación Topógrafo (interceptaciones ilegales del Ejército a los denunciantes). Organizó la grabación de los agentes de la DINE que espiaban el despacho de la jueza (CIPER, 2021)."
  mauricio_daza:
    nombre: Mauricio Daza
    cargo: Abogado y exconvencional constituyente
    notas: "Abogado, magíster en Derecho Penal (UDP), exconstituyente de la Convención Constitucional por el distrito 28 (Magallanes, 2021-2022). El 6 de agosto de 2026 criticó la reforma constitucional de la Agenda ACOT de Kast señalando que el anuncio del deber del Estado de proteger la seguridad ya está en el artículo 1° de la Constitución vigente: 'Kast es tan iluminado que anuncia como gran medida el primer artículo que ya está en la Constitución'."
  jose_toribio_merino:
    nombre: José Toribio Merino
    cargo: Almirante, miembro de la Junta Militar
    notas: "Almirante de la Armada, miembro de la Junta Militar de Gobierno de la dictadura de Pinochet (1973-1990) y comandante en jefe de la Armada. Bajo su control operaba la Oficina de Estudios Sociológicos de la Armada (OESA), unidad que diseñó la estrategia de cierre de la dictadura tras la derrota en el plebiscito de 1988, según los 'Papeles de la Dictadura' de CIPER (2023)."
  angel_valencia:
    nombre: Ángel Valencia
    cargo: Fiscal Nacional de Chile
    notas: "Fiscal Nacional de Chile. En julio de 2026 resolvió que la Fiscalía Centro Norte asuma la investigación por la denuncia del Servicio Electoral (Servel) contra el Partido de la Gente (PDG) por gastos no acreditados, tras el análisis de la Unidad Especializada en Anticorrupción."
  augusto_pinochet:
    nombre: Augusto Pinochet
    cargo: Dictador de Chile (1973-1990)
    notas: "General del Ejército, líder de la dictadura militar chilena (1973-1990) tras el golpe de Estado del 11 de septiembre de 1973. Derrotado en el plebiscito de 1988. Los 'Papeles de la Dictadura' de CIPER documentan la estrategia de su régimen para condicionar la transición a la democracia."
  patricio_aylwin:
    nombre: Patricio Aylwin
    cargo: Presidente de Chile (1990-1994)
    notas: "Presidente de Chile entre 1990 y 1994, primer mandatario tras la dictadura. Líder de la Concertación. La estrategia de cierre de la dictadura diseñada por la Armada buscó evitar que la oposición fuese liderada por alguien más radical que Aylwin."
  maria_angelica_de_miguel:
    nombre: María Angélica de Miguel
    cargo: Fiscal jefe de Osorno
    notas: "Fiscal jefe de la Fiscalía Local de Osorno. En agosto de 2026 detalló la formalización del estudiante de 15 años del Liceo Rahue por amenazas y delitos contra la autoridad de Carabineros, tras el incidente con destornillador."
  alicia_cebrian:
    nombre: Alicia Cebrian
    cargo: Directora Nacional de Senapred
    cargos:
      - cargo: Directora Nacional de Senapred
        organizacion: senapred
        desde: 2024-10-01
    organizacion: senapred
  ali_manouchehri:
    nombre: Ali Manouchehri
    cargo: Alcalde de Coquimbo
    cargos:
      - cargo: Alcalde de Coquimbo
        organizacion: municipalidad_coquimbo
        desde: 2024-12-06
    organizacion: municipalidad_coquimbo
  agustin_iglesias:
    nombre: Agustín Iglesias
    cargo: Alcalde de Independencia (UDI)
    cargos:
      - cargo: Alcalde de Independencia
        organizacion: municipalidad_independencia
        desde: 2024-12-06
    organizacion: municipalidad_independencia
    notas: "Alcalde de Independencia, militante de la UDI. Se desmarcó públicamente del oficialismo por la exención universal de contribuciones y la fórmula de compensación municipal de la megarreforma (julio-agosto 2026): calificó de 'brutalidad' reponer con impuestos generales los recursos de las comunas más ricas, pidió veto presidencial y afirmó que 'en esta pasada la derecha se equivocó'. En mayo de 2026 ya había advertido que la eliminación de contribuciones obligaría a recortar parte importante de lo que hace el municipio."
  joaquin_lavin_leon:
    nombre: Joaquín Lavín León
    cargo: Exparlamentario UDI
    organizacion: union_democrata_independiente
    notas: "Exparlamentario de la UDI, hijo del exalcalde de Las Condes Joaquín Lavín. Formalizado el 8 de mayo de 2026 por fraude al Fisco, tráfico de influencias, falsificación, uso malicioso de instrumento privado mercantil e infracciones electorales, cumplió prisión preventiva en el Anexo Penitenciario Capitán Yáber. El 6 de agosto de 2026 la Segunda Sala de la Corte de Apelaciones de Santiago revocó la medida por dos votos contra uno y la sustituyó por arresto domiciliario total en su domicilio de Peñaflor."
  arnaldo_dominguez:
    nombre: Arnaldo Domínguez
    cargo: Exasesor parlamentario
    notas: "Exasesor del exparlamentario Joaquín Lavín León y coimputado en la causa por corrupción que derivó en la formalización del 8 de mayo de 2026. El Séptimo Juzgado de Garantía de Santiago le decretó prisión preventiva por cohecho, infracciones tributarias y delitos electorales, entre otros; fue derivado al penal Santiago 1. Según la tesis del juez Daniel Urrutia, ejercía influencias sobre funcionarios municipales para favorecer a la imprenta MMG."
  cathy_barriga:
    nombre: Cathy Barriga
    cargo: Exalcaldesa de Maipú
    organizacion: municipalidad_maipu
    notas: "Exalcaldesa de Maipú (2016-2021) y esposa del exparlamentario Joaquín Lavín León. El juez Daniel Urrutia sostuvo en la formalización del 8 de mayo de 2026 que Lavín se aprovechó de su condición de esposo de la entonces alcaldesa para imponer una 'posición de injerencia' sobre el municipio maipucino, contexto en que se adjudicó material de campaña a las imprentas MMG y Total Print. Su propio proceso judicial por fraude al Fisco contra el municipio se tramita por separado; el padre de Lavín, Joaquín Lavín Infante, declaró en mayo de 2026 que cree '100 por 100 en la inocencia' de ambos."
  joaquin_lavin_infante:
    nombre: Joaquín Lavín Infante
    cargo: Exministro y exalcalde de Las Condes
    notas: "Exministro de Educación y de Desarrollo Social, exalcalde de Las Condes y padre del exparlamentario Joaquín Lavín León. El 11 de mayo de 2026 concurrió al Anexo Penitenciario Capitán Yáber para enrolarse en Gendarmería y visitar a su hijo tras la prisión preventiva, declarando que cree '100 por 100 en la inocencia de Cathy y de Joaquín' y pidió no prejuzgar. Su campaña presidencial en las primarias de Chile Vamos de 2021 aparece vinculada a pagos irregulares a asesores detectados en la investigación."
  daniela_riquelme:
    nombre: Daniela Riquelme
    cargo: Abogada de deudores del CAE
    notas: "Abogada patrocinante, junto a Florencia Pinto, del recurso de protección acogido por la Corte de Apelaciones de La Serena que declaró ilegal el doble cobro del CAE por parte de la Tesorería General de la República (juicio civil + cobranza administrativa simultánea), ordenando paralizar el procedimiento administrativo (agosto 2026)."
  daniel_urrutia:
    nombre: Daniel Urrutia
    cargo: Juez de Garantía
    notas: "Magistrado del Séptimo Juzgado de Garantía de Santiago. El 8 de mayo de 2026 dictó prisión preventiva para Joaquín Lavín León y Arnaldo Domínguez tras cinco días de audiencia, calificando los hechos como 'macrocriminalidad' y 'corrupción sistémica': 'la corrupción no es un problema de manzanas podridas, sino de huertos capturados'."
  cristobal_bonacic:
    nombre: Cristóbal Bonacic
    cargo: Abogado defensor
    notas: "Abogado defensor del exparlamentario Joaquín Lavín León en la causa por fraude al Fisco e infracciones electorales. Tras la revocación de la prisión preventiva (agosto 2026) sostuvo que 'ninguna razón de fondo' justificaba mantener a su cliente privado de libertad."
  andres_arrieta:
    nombre: Andrés Arrieta
    cargo: Gerente general de Restomarket
    organizacion: restomarket
    notas: "Empresario y exreservista del Ejército, gerente general de Restomarket. Detenido y formalizado por sustracción de menores, lesiones menos graves, amenazas y porte ilegal de arma de fuego tras retener y amenazar de muerte a niños que jugaban 'ring raja' en Vitacura (10 de julio de 2026). La empresa lo suspendió de todas sus funciones mientras dura la investigación."
  jennifer_bacovic:
    nombre: Jennifer Marihan Bacovic Rodríguez
    cargo: Ex cabo 2° de Carabineros
    organizacion: carabineros
    notas: "Ex cabo segundo de la Tenencia de Carreteras Valdivia Norte de Carabineros. La noche del viernes 19 de junio de 2026, tras su turno, usó un vehículo policial para compras personales en un minimarket de Máfil: artículos de aseo, una bebida, comida, una botella de pisco y una bolsa de hielo (según el regente del local), sin poseer la licencia Clase F requerida. Carabineros le decretó la baja por conducta mala con efectos inmediatos el 22 de junio de 2026, tras viralizarse un video del hecho. Con 6 años y 5 meses de servicio, quedó desvinculada a la espera del sumario administrativo. Su abogado, Luis Parra, denunció discriminación de género y recurrió de protección, rechazado por la Corte de Apelaciones de Valdivia (2-1) y apelado ante la Corte Suprema en agosto de 2026."
  luis_parra:
    nombre: Luis Parra
    cargo: Abogado
    notas: "Abogado de la excarabinera Jennifer Bacovic en la causa por su baja de Carabineros tras usar una patrulla para compras personales en Máfil. Sostiene que la desvinculación fue arbitraria e ilegal y denuncia discriminación de género: la uniformada era la única mujer de la Tenencia Carreteras Valdivia Norte y atravesaba una contingencia biológica al momento de las compras."
  rodrigo_mena_vogel:
    nombre: Rodrigo Mena Vogel
    cargo: Fiscal de Las Condes
    notas: "Fiscal de la Fiscalía Metropolitana Oriente a cargo de la investigación del caso del empresario que persiguió, retuvo y amenazó de muerte a niños que jugaban 'ring raja' en Vitacura (10 de julio de 2026). Bajo su dirección el imputado Andrés Arrieta fue formalizado por sustracción de menores, lesiones menos graves, amenazas y porte ilegal de arma de fuego y quedó en prisión preventiva."
  luis_mariano_rendon:
    nombre: Luis Mariano Rendón Escobar
    cargo: Activista, abogado y presidente de la Fundación Memoria Histórica
    organizacion: fundacion_memoria_historica
    notas: "Activista y abogado, presidente de la Fundación Memoria Histórica. En febrero de 2026 denunció ante la Contraloría el uso del escudo nacional en la banda presidencial de José Antonio Kast. En agosto de 2026 respondió al llamado del senador Rodolfo Carter a indultar a los 'injustamente condenados' por hacer su trabajo durante el estallido social con un video que compila imágenes de carabineros golpeando a manifestantes pacíficos, y el 7 de agosto denunció ante la Contraloría al presidente Kast por la cifra de '218 mil robos violentos' entregada en su cadena nacional del 5 de agosto, que el CEAD contrasta con 69.777 casos reales en 2025."
  matias_toledo:
    nombre: Matías Toledo
    cargo: Alcalde de Puente Alto (Ind.)
    cargos:
      - cargo: Alcalde de Puente Alto
        organizacion: municipalidad_puente_alto
        desde: 2024-12-06
    organizacion: municipalidad_puente_alto
    notas: "Alcalde independiente de Puente Alto, la comuna más poblada de Chile. El 5 de agosto de 2026 acusó abandono del gobierno y criticó al ministro de Seguridad Martín Arrau y al delegado presidencial de la RM Germán Codina, afirmando que 'la agenda de seguridad está para la tele'."
  paulina_bobadilla:
    nombre: Paulina Bobadilla
    cargo: Alcaldesa de Quilicura
    cargos:
      - cargo: Alcaldesa de Quilicura
        organizacion: municipalidad_quilicura
        desde: 2024-12-06
    organizacion: municipalidad_quilicura
    notas: "Alcaldesa de Quilicura. Tras el cuarto incendio de la planta química Panimex (agosto 2026) exigió el cierre de la empresa y criticó que las multas previas no impidieran su funcionamiento."
  mauricio_gonzalez_tobar:
    nombre: Mauricio González Tobar
    cargo: Jefe de gabinete de la senadora Camila Flores (RN)
    organizacion: senado
    notas: "Jefe de gabinete de la senadora Camila Flores (RN). Contrapoder Chile reveló (mayo 2026) que recibió un aumento salarial de $3.150.000 entre marzo y abril de 2026: pasó de percibir $450.000 como funcionario de la Cámara de Diputados a $3.600.000 mensuales como jefe de gabinete en el Senado. Empresario nocturno ligado al Pub Hollywood y al restaurante Casa Cochoa de la Quinta Región; candidato a concejal por Viña del Mar en 2008 (1% de los votos). Mencionado en la demanda de divorcio culposo de Percy Marín contra la senadora."
  percy_marin:
    nombre: Percy Marín
    cargo: Exesposo de la senadora Camila Flores
    notas: "Exesposo de la senadora Camila Flores (RN). En mayo de 2026 se filtró y viralizó la demanda por divorcio culposo que presentó contra la parlamentaria; el Juzgado de Familia de Viña del Mar decretó la prohibición de informar o divulgar el contenido de la acción judicial y la Corte de Apelaciones de Valparaíso inició una investigación para hallar a los responsables de la filtración."
  filomena_navia:
    nombre: Filomena Navia
    cargo: Alcaldesa de La Cruz
    cargos:
      - cargo: Alcaldesa de La Cruz
        organizacion: municipalidad_la_cruz
        desde: 2024-12-06
    organizacion: municipalidad_la_cruz
    notas: "Alcaldesa de La Cruz (Región de Valparaíso). En agosto de 2026 quedó en el centro de una polémica por un audio filtrado en que regaña a un funcionario que habría detectado una plantación de marihuana con drones, lo que motivó un oficio de la Contraloría Regional de Valparaíso. En la charla le pide al funcionario no actuar contra el hallazgo ('mi rol no es perseguir la delincuencia') y habla de una 'limpieza estratégica' al demoler casas del sector."
  maria_francisca_mella:
    nombre: María Francisca Mella
    cargo: Concejala de La Cruz
    organizacion: municipalidad_la_cruz
    notas: "Concejala de La Cruz. Tras la filtración del audio de la alcaldesa Filomena Navia sobre un terreno con marihuana (agosto 2026), anunció que ingresó dos oficios: uno dirigido a la alcaldesa y otro a la Unidad de Control Municipal, solicitando información sobre la situación contractual de un funcionario y sobre los protocolos aplicados."
  valentina_rodriguez:
    nombre: Valentina Rodríguez
    cargo: Concejala de La Cruz
    organizacion: municipalidad_la_cruz
    notas: "Concejala de La Cruz. Tras la filtración del audio de la alcaldesa Filomena Navia sobre un terreno con marihuana (agosto 2026), calificó los antecedentes como 'bastante graves' y pidió que sean esclarecidos con total transparencia, cuestionando el tono de la alcaldesa hacia un funcionario municipal."
  jorge_coloma:
    nombre: Jorge Coloma
    cargo: Presidente regional de la CChC de Concepción
    organizacion: cchc
    notas: "Presidente regional de la Cámara Chilena de la Construcción de Concepción. Tras el congelamiento de los corredores de transporte del Gran Concepción (agosto 2026) calificó la medida como 'un nuevo golpe al empleo y al desarrollo' de la región."
  victor_hugo_robles:
    nombre: Víctor Hugo Robles
    cargo: Activista y panelista de Sin Filtros
    notas: "Activista LGTB conocido como el Che de los Gays. Panelista de Sin Filtros. En agosto de 2026 abandonó el programa junto a otros tres panelistas tras la aparición como invitado de Claudio Crespo, a quien trató de 'carnicero'."
  ignacio_briones:
    nombre: Ignacio Briones Rojas
    cargo: Expresidente de Horizontal, exministro de Hacienda
    cargos:
      - cargo: Ministro de Hacienda
        organizacion: ministerio_hacienda
        desde: 2019-10-28
        hasta: 2021-01-26
    organizacion: horizontal
    notas: "Economista, exministro de Hacienda del segundo gobierno de Piñera y presidente del think tank Horizontal. En agosto de 2026 valoró la megarreforma pero criticó la falta de compensaciones fiscales, la permisología 'corta' y la exención de contribuciones para mayores de 65 años como 'probablemente la política más regresiva de la que tengamos registro'."
  gloria_de_la_fuente:
    nombre: Gloria de la Fuente
    cargo: Exsubsecretaria de Relaciones Exteriores
    notas: "Exsubsecretaria de Relaciones Exteriores (gobierno de Boric). Tras el anuncio del retiro de Chile del Movimiento de Países No Alineados (agosto 2026) cuestionó la decisión: 'Es difícil saber qué está buscando el Gobierno' y advirtió que dilapidar la autonomía estratégica es un riesgo para el prestigio internacional de Chile."
  salvador_allende:
    nombre: Salvador Allende
    cargo: Expresidente de Chile (1970-1973)
    notas: "Presidente de Chile entre 1970 y 1973. Durante su gobierno (1971) Chile se incorporó al Movimiento de Países No Alineados."
  florencia_pinto:
    nombre: Florencia Pinto
    cargo: Abogada de deudores del CAE
    notas: "Abogada patrocinante, junto a Daniela Riquelme, del recurso de protección acogido por la Corte de Apelaciones de La Serena que declaró ilegal el doble cobro del CAE por parte de la Tesorería General de la República (agosto 2026)."
  felipe_harboe:
    nombre: Felipe Harboe
    cargo: Exsubsecretario de Prevención del Delito y exsenador (PPD)
    organizacion: partido_por_la_democracia
    notas: "Exsubsecretario de Prevención del Delito (2006-2010) y exsenador (2010-2022) del PPD. En agosto de 2026 criticó el copamiento policial del gobierno de Kast: 'no se logra disuadir al crimen organizado con copamiento policial', descartó la utilidad de un nuevo estado de excepción (despliegue militar en el sur renovado ~60 veces) y pidió un sistema robusto de protección de testigos."
  felipe_parada:
    nombre: Felipe Parada
    cargo: Panelista de Sin Filtros
    notas: "Panelista de Sin Filtros. En agosto de 2026 abandonó el programa tras la aparición del excarabinero Claudio Crespo, calificando su presencia como un 'lavado de imagen'."
  inti_salamanca:
    nombre: Inti Salamanca
    cargo: Panelista de Sin Filtros
    notas: "Panelista de Sin Filtros. En agosto de 2026 abandonó el programa tras la aparición como invitado del excarabinero Claudio Crespo."
  natalia_paredes:
    nombre: Natalia Paredes
    cargo: Gerente general de Cheaf Chile
    organizacion: cheaf
    notas: "Gerente general de la plataforma Cheaf Chile, autora del análisis de la encuesta sobre el costo de los alimentos en los hogares chilenos (agosto 2026)."
  paulina_zamorano:
    nombre: Paulina Zamorano
    cargo: Vocera de organizaciones de derechos humanos
    notas: "Vocera de las agrupaciones chilenas que presentaron ante la CIDH (agosto 2026) un informe que acusa retrocesos y 'desmantelamiento' institucional en materia de derechos humanos bajo el gobierno de Kast."
  magdalena_garces:
    nombre: Magdalena Garcés
    cargo: Abogada de derechos humanos
    notas: "Abogada de organizaciones de DDHH. Expuso ante la CIDH (5 de agosto de 2026) denunciando que el Ministerio de Justicia y DDHH habría prohibido a los abogados del Programa de Derechos Humanos intervenir en procesos de revisión de penas de condenados por graves violaciones a los DDHH: 47 exagentes presentaron solicitudes de reducción de penas y el Programa no se presentó a alegar en 20 de 23 audiencias."
  tamara_lagos:
    nombre: Tamara Lagos
    cargo: Representante de organizaciones de derechos humanos
    notas: "Representante de organizaciones de DDHH chilenas que expusieron ante la CIDH en Washington el 5 de agosto de 2026."
  paola_peebles:
    nombre: Paola Peebles
    cargo: Hija de víctima de Colonia Dignidad
    notas: "Hija de Enrique Peebles, sobreviviente de torturas en Colonia Dignidad. Expuso ante la CIDH (5 de agosto de 2026) recordando que más de 100 personas desaparecieron allí y cuestionó que el enclave siga siendo propiedad privada de los perpetradores."
  erika_hennings:
    nombre: Erika Hennings
    cargo: Presidenta de Londres 38, espacio de memorias
    organizacion: londres_38
    notas: "Presidenta de la corporación Londres 38, espacio de memorias. En la audiencia de la CIDH del 5 de agosto de 2026 alertó por la situación de los sitios de memoria y su financiamiento, exponiendo que en Chile existen 1.132 lugares identificados como centros de detención, tortura y exterminio, aunque solo 72 cuentan con reconocimiento oficial como sitios de memoria."
  nuvia_guajardo:
    nombre: Nuvia Guajardo
    cargo: Directora Nacional de la ANEF
    organizacion: anef
    notas: "Directora Nacional de la Agrupación Nacional de Empleados Fiscales (ANEF). En la audiencia de la CIDH del 5 de agosto de 2026 advirtió que las medidas del gobierno no corresponden 'solo a ajustes presupuestarios' sino a 'la reducción sistemática de las capacidades del Estado chileno para garantizar derechos humanos', cuestionó la modificación del presupuesto mediante decreto ('Gobernar por decreto es, en sí mismo, violatorio de la propia carta fundamental') y sostuvo que la reforma tributaria del gobierno erosionará la recaudación en US$4.500 millones anuales."
  jose_miguel_castro:
    nombre: José Miguel Castro
    cargo: Representante de Chile ante la OEA
    notas: "Exdiputado de Renovación Nacional y representante de Chile ante la OEA. Encabezó los descargos del gobierno de Kast en la audiencia de la CIDH del 5 de agosto de 2026, calificando de 'absolutamente incompatibles con la realidad fáctica' las denuncias de desmantelamiento de la institucionalidad de DDHH."
  felipe_kipreos:
    nombre: Felipe Kipreos
    cargo: Abogado de la cancillería
    notas: "Abogado del Ministerio de Relaciones Exteriores. En la audiencia de la CIDH del 5 de agosto de 2026 defendió los despidos en el Programa de DDHH como parte de un 'reordenamiento organizacional' y rechazó el calificativo de 'gobierno de ultraderecha' usado por las organizaciones denunciantes."
  jorge_hagedorn:
    nombre: Jorge Hagedorn
    cargo: Abogado de la Subsecretaría de DDHH
    notas: "Abogado de la Subsecretaría de Derechos Humanos. En la audiencia de la CIDH del 5 de agosto de 2026 negó la existencia de una instrucción general de no comparecer en causas de exagentes, afirmando que el análisis es 'caso a caso'."
  hector_osses_yanez:
    nombre: Héctor Osses Yáñez
    cargo: Exoficial de Carabineros condenado por crímenes de lesa humanidad
    notas: "Exoficial de Carabineros que encabezó la matanza de pobladores de La Granja. Según la denuncia ante la CIDH (agosto 2026), fue el exagente con más audiencias de revisión de pena en 2026: seis, en ninguna de las cuales el Programa de DDHH se presentó a alegar."
  cesar_manriquez:
    nombre: César Manríquez Bravo
    cargo: Exagente de la DINA condenado por crímenes de lesa humanidad
    notas: "Exagente de la DINA condenado por crímenes de lesa humanidad. Según la denuncia de las organizaciones ante la CIDH (agosto 2026), la justicia determinó su excarcelación y entrega a su esposa en 2026, en un caso en que el Programa de DDHH no intervino."
  walter_klug_rivera:
    nombre: Walter Klug Rivera
    cargo: Exoficial del SIM condenado por crímenes de lesa humanidad
    notas: "Exoficial del Servicio de Inteligencia Militar, condenado por siete homicidios calificados y 23 secuestros calificados en el marco del caso Endesa (Bío Bío). Posee pasaporte alemán; fue detenido en 2019 en Parma (Italia), se fugó hacia Argentina y fue recapturado en Buenos Aires en 2021. Según la denuncia ante la CIDH (2026), el Programa de DDHH no se presentó a alegar contra su pretensión de unificación de penas, que le fue favorable."
  tomas_jordan:
    nombre: Tomás Jordán
    cargo: Abogado constitucionalista
    notas: "Abogado constitucionalista que coordinó la ofensiva jurídica de la oposición ante el Tribunal Constitucional contra la megarreforma de Kast en 2026 (tres requerimientos: dos de senadores y uno de diputados)."
  constanza_garrido:
    nombre: Constanza Garrido
    cargo: Directora del Programa de Derechos Humanos
    organizacion: programa_derechos_humanos
    notas: "Directora del Programa de Derechos Humanos del Ministerio de Justicia y DDHH. En abril de 2026 fue autora de un correo interno, revelado por BioBioChile, en el que reconoce haber recibido instrucciones de 'no alegar o apelar en causas en etapa de cumplimiento' de condenados por crímenes de lesa humanidad, contradiciendo la versión oficial del ministro Fernando Rabat. El correo fue usado por las organizaciones de DDHH en la denuncia ante la CIDH (agosto 2026) como evidencia de los 'indultos pasivos'."
  alejandra_pizarro:
