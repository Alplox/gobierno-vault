    pais: Chile
  universidad_adolfo_ibanez:
    nombre: Universidad Adolfo Ibáñez
    tipo: universidad
    pais: Chile
  fundacion_memoria_historica:
    nombre: Fundación Memoria Histórica
    tipo: organizacion_social
    pais: Chile
    notas: "Organización de derechos humanos. Su presidente es el abogado Luis Mariano Rendón Escobar, quien en 2026 presentó denuncias ante la Contraloría relacionadas con el presidente José Antonio Kast (uso del escudo nacional en la banda presidencial, febrero 2026; cifras de la cadena nacional sobre robos violentos, agosto 2026)."
  fundacion_paz_ciudadana:
    nombre: Fundación Paz Ciudadana
    tipo: organizacion_social
    pais: Chile
    notas: "Fundación dedicada al estudio y prevención de la delincuencia. El exministro Sergio Bitar fue su vicepresidente. En junio de 2026, sus análisis fueron citados por VerificaUDP para contextualizar la afirmación del presidente Kast sobre la seguridad en América Latina."
  parque_forestral:
    nombre: Parque Forestal
    tipo: espacio_publico
    pais: Chile
    notas: Parque ubicado en Santiago, sede del Centro Cultural Liquén
  chilevision:
    nombre: Chilevisión
    tipo: canal_television
    pais: Chile
  huachipato:
    nombre: Club Deportivo Huachipato
    tipo: club_futbol
    pais: Chile
    notas: Club de fútbol de la Región de Biobío. Vinculado a denuncias de
      sobreprecios en traspasos a Azul Azul.
  achm:
    nombre: Asociación Chilena de Municipalidades
    tipo: asociacion_gremial
    pais: Chile
    notas: Gremio que agrupa a municipalidades de Chile. Tensión interna por postura
      frente a megarreforma. Tras el despacho de la ley (agosto 2026) su presidente Gustavo Alessandri anunció como prioridades modernizar el Fondo Común Municipal y avanzar en una nueva Ley de Rentas Municipales.
  crcp:
    nombre: Cámara Regional del Comercio de Valparaíso
    tipo: gremio
    pais: Chile
    notas: "Gremio empresarial regional. Su 30° encuentro anual reunió al presidente José Antonio Kast el 5 de agosto de 2026, quien destacó allí el despacho de la megarreforma como un 'antes y un después'."
  amnistia_internacional:
    nombre: Amnistía Internacional
    notas: "Organización internacional de derechos humanos. Su directora para las Américas, Erika Guevara-Rosas, condenó el apuñalamiento de tres mujeres en la marcha por el aborto libre de julio de 2018 y criticó las declaraciones del gobierno chileno."
  indh:
    nombre: Instituto Nacional de Derechos Humanos
    tipo: organismo_estado
    pais: Chile
    notas: Organismo autónomo encargado de promover y proteger los derechos humanos
      en Chile.
  programa_derechos_humanos:
    nombre: Programa de Derechos Humanos
    tipo: servicio_publico
    pais: Chile
    notas: "Programa del Ministerio de Justicia y DDHH que ejerce la querella criminal y representa al Estado en las causas por crímenes de lesa humanidad de la dictadura. En 2026, según la denuncia de organizaciones de DDHH ante la CIDH (5 de agosto), habría dejado de alegar en 20 de 23 audiencias de exagentes por instrucciones del Ministerio de Justicia; el gobierno lo atribuyó a un 'reordenamiento organizacional' y a un análisis 'caso a caso'."
  tribunal_constitucional:
    nombre: Tribunal Constitucional
    tipo: poder_judicial
    pais: Chile
    notas: "Órgano encargado del control de constitucionalidad. El 6 de agosto de 2026 admitió a trámite y declaró admisibles los tres requerimientos de la oposición contra la megarreforma (Ley de Reconstrucción Nacional), fijando la audiencia de alegatos para el jueves 13 de agosto de 2026."
  instituto_salud_publica:
    nombre: Instituto de Salud Pública (ISP)
    tipo: servicio_publico
    pais: Chile
    notas: "Instituto de Salud Pública de Chile, dependiente del Ministerio de Salud. En 2020 elaboró por encargo del Departamento de Armamento y Municiones de Carabineros un informe técnico sobre la granada de humo SS-601/BR, obtenido vía Ley de Transparencia, que documenta efectos nocivos a largo plazo de sus componentes: problemas sanguíneos, daños al sistema nervioso central y periférico, dermatitis y bronquitis crónica."
  partido_nacional_libertario:
    nombre: Partido Nacional Libertario
    tipo: partido_politico
    pais: Chile
    notas: Partido fundado por disidencias del Partido Republicano. Enfrentó
      polémica por video de asesor con burlas a niños autistas.
  fenaut:
    nombre: Federación Nacional de Autismo
    tipo: ong
    pais: Chile
    notas: Organización que agrupa a personas con autismo y sus familias. Exigió
      renuncia de Omegna.
  fundacion_fuan:
    nombre: Fundación FUAN
    tipo: fundacion
    pais: Chile
    notas: Fundación que condenó las expresiones del video, destacando
      vulnerabilidad de personas autistas ante violencia sexual.
  instituto_mises_cono_sur:
    nombre: Instituto Mises Cono Sur
    tipo: think_tank
    pais: Chile
    notas: Organización liberal. Desvinculó a Ítalo Omegna como Director de
      Vinculación tras el video.
  fundacion_novum:
    nombre: Fundación Novum
    tipo: fundacion
    pais: Chile
    notas: Organización que trabaja con niños vulnerables. Ítalo Omegna es su
      presidente.
  la_cofradia:
    nombre: La Cofradía
    tipo: programa_streaming
    pais: Chile
    notas: Programa de streaming donde se grabó el video polémico con burlas a niños
      autistas.
  partido_republicano:
    nombre: Partido Republicano de Chile
    tipo: partido_politico
    pais: Chile
  partido_igualdad:
    nombre: Partido Igualdad
    tipo: partido_politico
    pais: Chile
    notas: Partido fundado por José Antonio Kast. Ganó la segunda vuelta
      presidencial de diciembre 2025.
  partido_progresista:
    nombre: Partido Progresista
    tipo: partido_politico
    pais: Chile
    notas: "Partido fundado por Marco Enríquez-Ominami."
  chile_vamos:
    nombre: Chile Vamos
    tipo: partido_politico
    pais: Chile
    notas: "Coalición de centroderecha integrada por la UDI, Renovación Nacional y Evópoli. En febrero de 2026 manifestó su desazón por la baja representación partidaria en la nómina de subsecretarios de José Antonio Kast."
  apruebo_dignidad:
    nombre: Apruebo Dignidad
    tipo: partido_politico
    pais: Chile
    notas: "Coalición de izquierda (Frente Amplio, Partido Comunista y Partido Socialista) que llevó a Gabriel Boric a la presidencia en 2021. En la elección de la Convención Constitucional de mayo de 2021 obtuvo 28 escaños."
  lista_del_pueblo:
    nombre: Lista del Pueblo
    tipo: partido_politico
    pais: Chile
    notas: "Agrupación de candidatos independientes de izquierda surgida del estallido social de 2019. En la elección de la Convención Constitucional de mayo de 2021 obtuvo 24 escaños."
  partido_social_cristiano:
    nombre: Partido Social Cristiano
    tipo: partido_politico
    pais: Chile
    notas: Partido político de centroderecha. La seremi fallida de Economía de
      Atacama, Daniela Gallegos, fue candidata a diputada por este partido.
  conaf:
    nombre: Corporación Nacional Forestal
    tipo: servicio_publico
    pais: Chile
    notas: Servicio público encargado de la prevención y combate de incendios
