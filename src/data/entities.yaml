  no_mas_lacrimogenas:
    nombre: No + Lacrimógenas
    tipo: ong
    pais: Chile
    notas: "Agrupación médico-activista y vecinal chilena que visibiliza las consecuencias para la salud de los vecinos del uso de gas lacrimógeno. Encargó a Forensic Architecture la investigación 'Tear Gas in Plaza de la Dignidad' sobre el uso de gas CS durante la jornada del 20 de diciembre de 2019."
  comision_chilena_ddhh:
    nombre: Comisión Chilena de Derechos Humanos
    tipo: ong
    pais: Chile
    notas: "Organización de derechos humanos. En diciembre de 2020 presentó una denuncia contra las unidades de control de orden público de Carabineros por el uso ilegal de armas químicas contra manifestantes en Plaza de la Dignidad entre octubre y diciembre de 2020, documentando infecciones químicas y dermatitis."
