  sofofa:
    nombre: Sociedad de Fomento Fabril
    tipo: gremio
    notas: Gremio empresarial chileno. Participó en reunión con cancillería por arancel de 12,5%.
  cpc:
    nombre: Confederación de la Producción y el Comercio
    tipo: gremio
    notas: Confederación empresarial. Calificó arancel de 12,5% como "retroceso para la economía chilena".
  camara_minera:
    nombre: Cámara Minera de Chile
    tipo: gremio
    notas: Gremio minero que criticó el nombramiento de un agrónomo al frente del Ministerio de Minería.
  frutas_de_chile:
    nombre: Frutas de Chile
    tipo: gremio
    notas: Gremio exportador de fruta fresca. Expuso ante USTR que oferta chilena complementa la producción estadounidense.
  dmc:
    nombre: Dirección Meteorológica de Chile
    tipo: servicio_publico
    notas: Servicio meteorológico estatal. Emite alertas y pronósticos de sistemas frontales.
  quiroz_puelma_arquitectos:
    nombre: Quiroz y Puelma Arquitectos
    tipo: empresa
    pais: Chile
    notas: Estudio de arquitectura de Viña del Mar. Liderado por Víctor Quiroz, hermano del ministro de Hacienda. Diseñó el proyecto Alto Santorini y el edificio Kandinsky.
  lote21_spa:
    nombre: Lote 21 SpA
    tipo: empresa
    pais: Chile
    notas: Inmobiliaria impulsora del proyecto Alto Santorini en dunas de Concón. Inversión de US$35 millones.
  vimac:
    nombre: Inmobiliaria Vimac
    tipo: empresa
    pais: Chile
    notas: Inmobiliaria dueña original del proyecto Alto Santorini. Tiene 8 proyectos entre Viña del Mar y Concón.
  fundacion_yarur_bascunan:
    nombre: Fundación Yarur Bascuñán
    tipo: fundacion
    pais: Chile
    notas: Fundación que busca declarar ilegal el permiso de edificación del proyecto Alto Santorini.
  duna_viva:
    nombre: Duna Viva
    tipo: organizacion_social
    pais: Chile
    notas: Agrupación ciudadana que defiende el Campo Dunar de Concón. Litigó contra el proyecto Alto Santorini.
  fundacion_america_transparente:
    nombre: Fundación América Transparente
    tipo: ong
    pais: Chile
    notas: Organización dedicada a la transparencia y probidad pública. Su director Juan José Lyon criticó al ministro Quiroz.
  sea:
    nombre: Servicio de Evaluación Ambiental
    tipo: servicio_publico
    pais: Chile
    notas: Organismo público que evalúa el impacto ambiental de proyectos. Aprobó el EIA de Alto Santorini.
  municipalidad_vina_del_mar:
    nombre: Municipalidad de Viña del Mar
    tipo: municipio
    pais: Chile
    notas: Municipio que modificó el Plan Regulador para impedir nuevas edificaciones en dunas de Concón.
  codelco:
    nombre: Corporación Nacional del Cobre de Chile
    tipo: empresa_estatal
    pais: Chile
    notas: Empresa estatal minera de cobre. Propuesta de privatización por Republicanos generó controversia.
  corfo:
    nombre: Corporación de Fomento de la Producción (Corfo)
    tipo: servicio_publico
    pais: Chile
    notas: "Corporación de Fomento de la Producción, organismo estatal que administra participaciones del Estado en empresas. En agosto de 2026 el Gobierno evaluaba cómo estructurar la venta de la participación estatal en las sanitarias Aguas Andinas, Essbio, Esval y Suralis a través de Corfo, en el marco de la revisión de activos prescindibles del biministro de Economía, Daniel Mas."
  cesco:
    nombre: Centro de Estudios del Cobre y la Minería
    tipo: think_tank
    pais: Chile
    notas: "Centro de estudios especializado en minería del cobre, cuyo director ejecutivo es Jorge Cantallopts."
  universidad_andes:
    nombre: Universidad de los Andes
    tipo: establecimiento_educacional
    pais: Chile
    notas: "Universidad privada chilena. Su decano de la Facultad de Ciencias Económicas y Empresariales, Álvaro García, analizó la revisión de inversiones de Codelco en agosto de 2026."
  affindh:
    nombre: Asociación de Funcionarias y Funcionarios del INDH (AFFINDH)
    tipo: sindicato
    pais: Chile
    notas: "Gremio de funcionarias y funcionarios del Instituto Nacional de Derechos Humanos. El 6 de agosto de 2026 emitió un pronunciamiento público ante los cuestionamientos, propuestas de reformas regresivas y amagos de eliminación del organismo: 'en un Estado de Derecho, que las instituciones de derechos humanos incomoden a otros poderes demuestra que están cumpliendo su función, no se trata de una anomalía a corregir'. Rechazó las acusaciones de 'sesgada' o 'partidista' e invocó el principio de no regresividad."
  cochilco:
    nombre: Comisión Chilena del Cobre (Cochilco)
    tipo: servicio_publico
    pais: Chile
    notas: "Organismo técnico del Estado dependiente del Ministerio de Minería que analiza el mercado del cobre. El 6 de agosto de 2026 atribuyó el alza del metal a récords históricos (US$6,55/lb) principalmente a la decisión de la República Democrática del Congo de prohibir las exportaciones de concentrados de cobre y cobalto, a la caída de inventarios en Londres y a la presión por cobre de entrega inmediata."
  somo_fabuloso:
    nombre: Somos Fabuloso
    tipo: empresa
    pais: Chile
    notas: "Canal chileno de comedia y entretenimiento transmitido por streaming en vivo, productor del programa 'No Hacemos Uno'. En agosto de 2026 el comediante Lucho Miranda respondió desde el espacio a los dichos de la senadora Camila Flores sobre Fabiola Campillai."
  el_ciudadano:
    nombre: El Ciudadano
    tipo: medio_comunicacion
    pais: Chile
    notas: "Medio de comunicación digital chileno fundado en 2005. En noviembre de 2023 el Departamento de Estado de EE.UU. lo mencionó en su informe 'Esfuerzos del Kremlin para propagar desinformación encubiertamente en América Latina', lo que el medio desmintió categóricamente. En abril de 2026 circuló una noticia falsa atribuida a Cooperativa que lo vinculaba a una red de desinformación internacional; el alcalde de Santiago Mario Desbordes la compartió en X y luego la eliminó."
  google:
    nombre: Google
    tipo: empresa
    pais: Estados Unidos
    notas: "Empresa tecnológica estadounidense. En agosto de 2026 ingresó una nueva consulta de pertinencia al SEA por el Data Center Cerrillos (US$200 millones), que en su versión anterior fue revocado por el Tribunal Ambiental por su consumo de agua para enfriamiento; la nueva versión no usará agua."
  grenergy:
    nombre: Grenergy
    tipo: empresa
    pais: España
    notas: "Empresa española de energías renovables. A través de su plataforma GR Data proyecta data centers en Alto Jahuel (US$20 millones, GR Huiña SPA), Polpaico y Antofagasta, sumando 1.000 MW de capacidad, según el Diario Financiero (mayo 2026)."
  federacion_trabajadores_cobre:
    nombre: Federación de Trabajadores del Cobre (FTC)
    tipo: sindicato
    pais: Chile
    notas: "Agrupación de sindicatos de la minería del cobre, liderada en 2021 por Patricio Elgueta. En la segunda vuelta presidencial de 2021 llamó a votar por Gabriel Boric ante la amenaza de una eventual privatización de Codelco."
  fesuc:
    nombre: Federación de Supervisores del Cobre (FESUC)
    tipo: sindicato
    pais: Chile
    notas: "Sindicato de supervisores de la minería del cobre. En julio de 2026 manifestó su 'más absoluto rechazo' a cualquier iniciativa de privatizar total o parcialmente Codelco, tras la propuesta del presidente del Partido Republicano, Arturo Squella: 'Codelco no es un juguete del gobierno de turno, ni del Congreso Nacional'."
  sindicatos_codelco_norte:
    nombre: Sindicatos de Codelco Norte
    tipo: sindicato
    pais: Chile
    notas: "Sindicatos de la división Codelco Norte (Chuquicamata, Radomiro Tomic, Ministro Hales). En diciembre de 2021 publicaron una misiva declarando a José Antonio Kast 'persona no grata' en Calama durante la campaña de segunda vuelta."
  conar:
    nombre: Comité Nacional de Ayuda a los Refugiados (CONAR)
    tipo: organizacion_social
    pais: Chile
    notas: "Primer comité de ayuda a víctimas de la dictadura cívico-militar. Comenzó a funcionar el 24 de septiembre de 1973, impulsado por las iglesias protestantes y evangélicas y presidido por el obispo luterano Helmut Frenz. Operó en Avenida Ricardo Lyon 565, Providencia (donde funcionaba Diaconía). Autorización inicial de solo tres meses. Reubicó aproximadamente 5.000 refugiados en el extranjero. Su continuador fue FASIC (abril 1975)."
  fasic:
    nombre: Fundación de Ayuda Social de las Iglesias Cristianas (FASIC)
    tipo: organizacion_social
    pais: Chile
    notas: "Organismo ecuménico de defensa de los derechos humanos, continuador directo del CONAR. Inició funciones en abril de 1975, asumiendo programas de apoyo a prisioneros políticos, familiares y víctimas de tortura. Su archivo documental (CONAR 1973-1974 y FASIC 1975-1990, unos 420 metros lineales) fue declarado Monumento Histórico mediante el Decreto Nº 509 de 2017 y forma parte de los archivos reconocidos por la UNESCO en el programa Memoria del Mundo."
  diaconia:
    nombre: Diaconía
    tipo: organizacion_social
    pais: Chile
    notas: "Organización de desarrollo y servicio social de las iglesias protestantes. En sus dependencias de Avenida Ricardo Lyon 565 (Providencia) comenzó a funcionar el 24 de septiembre de 1973 el Comité Nacional de Ayuda a los Refugiados (CONAR)."
  senado:
    nombre: Senado de Chile
    tipo: institucion_publica
    pais: Chile
    notas: Cámara alta del Congreso Nacional de Chile.
  camara_diputados:
    nombre: Cámara de Diputadas y Diputados de Chile
    tipo: institucion_publica
    pais: Chile
    notas: Cámara baja del Congreso Nacional de Chile. Tramita proyectos de ley.
  secretaria_gobierno_digital:
    nombre: Secretaría de Gobierno Digital
    tipo: institucion_publica
    pais: Chile
    notas: Organismo del Ministerio de Hacienda a cargo de ClaveÚnica y gobierno digital.
  claveunica:
    nombre: ClaveÚnica
    tipo: institucion_publica
    pais: Chile
    notas: Sistema de autenticación electrónica del Estado chileno. Emitida por el Servicio de Registro Civil e Identificación, permite acceder a servicios públicos en línea. Más de 16 millones de usuarios activos.
  ministerio_desarrollo_social:
    nombre: Ministerio de Desarrollo Social y Familia
    tipo: institucion_publica
    pais: Chile
    notas: "Ministerio a cargo de políticas sociales y protección de la infancia. En 2026 lidera el Plan Nacional de Entornos Digitales Seguros."
  municipalidad_chillan_viejo:
    nombre: Municipalidad de Chillán Viejo
    tipo: institucion_publica
    pais: Chile
    notas: Municipio de la comuna de Chillán Viejo, Región de Ñuble.
  seremi_salud_arica:
    nombre: Seremi de Salud de Arica y Parinacota
    tipo: seremi
    pais: Chile
    notas: Secretaría Regional Ministerial de Salud de Arica y Parinacota.
  seremi_seguridad_araucania:
    nombre: Seremi de Seguridad de La Araucanía
    tipo: seremi
    pais: Chile
    notas: Secretaría Regional Ministerial de Seguridad de La Araucanía, dependiente del Ministerio de Seguridad Pública.
  seremi_trabajo_araucania:
    nombre: Seremi del Trabajo de La Araucanía
    tipo: seremi
    pais: Chile
    notas: Secretaría Regional Ministerial del Trabajo y Previsión Social de La Araucanía.
  seremi_trabajo_nuble:
    nombre: Seremi del Trabajo de Ñuble
    tipo: seremi
    pais: Chile
    notas: Secretaría Regional Ministerial del Trabajo y Previsión Social de Ñuble. El 4 de agosto de 2026 su titular, Edmundo Novoa Puga, participó en la entrega de kits de emergencia en Chillán a familias afectadas por el sistema frontal.
  seremi_economia_atacama:
    nombre: Seremi de Economía de Atacama
    tipo: seremi
    pais: Chile
    notas: Secretaría Regional Ministerial de Economía, Fomento y Turismo de Atacama.
  delegacion_presidencial_araucania:
    nombre: Delegación Presidencial Regional de La Araucanía
    tipo: institucion_publica
    pais: Chile
    notas: Representación del Gobierno central en la Región de La Araucanía. Depende del Ministerio del Interior.
  delegacion_presidencial_chanaral:
    nombre: Delegación Presidencial Provincial de Chañaral
    tipo: servicio_publico
    pais: Chile
  delegacion_presidencial_atacama:
    nombre: Delegación Presidencial Regional de Atacama
    tipo: institucion_publica
    pais: Chile
    notas: Representación del Gobierno central en la Región de Atacama. Depende del Ministerio del Interior.
  delegacion_presidencial_antofagasta:
    nombre: Delegación Presidencial Regional de Antofagasta
    tipo: institucion_publica
    pais: Chile
    notas: Representación del Gobierno central en la Región de Antofagasta. Depende del Ministerio del Interior. Su titular es la delegada Katherine López.
  embajada_eeuu_chile:
    nombre: Embajada de Estados Unidos en Chile
    tipo: mision_diplomatica
    pais: Chile
    notas: Representación diplomática de EE.UU. en Chile.
  embajada_china_chile:
    nombre: Embajada de China en Chile
    tipo: mision_diplomatica
    pais: Chile
    notas: "Representación diplomática de la República Popular China en Chile. Embajador: Niu Qingbao desde 2021."
  ministerio_economia_argentina:
    nombre: Ministerio de Economia de Argentina
    tipo: institucion_publica
    pais: Argentina
    notas: Cartera economica del gobierno argentino.
  atlas_network:
    nombre: Atlas Network
    tipo: think_tank
    pais: Estados Unidos
    notas: "Red global de think tanks neoliberales fundada en 1981 por Antony Fisher. 589 entidades en 103 paises. Financiada por grandes corporaciones (Exxon, Koch, Philip Morris). Vinculada a campanas de desinformacion y desestabilizacion politica global."
  fundacion_participa:
    nombre: Fundacion Participa
    tipo: think_tank
    pais: Chile
    notas: "Think tank progresista ligado al PPD. Ha recibido $1.669 millones desde el Estado (2017-2023). Dirigido por Daniel Ibanez."
  centro_estudios_desarrollo:
    nombre: Centro de Estudios del Desarrollo (CED)
    tipo: think_tank
    pais: Chile
    notas: "Think tank historico ligado a la DC. Fundado en 1981 por Gabriel Valdes. Ha recibido $1.449 millones desde el Estado (2005-2019)."
  ical:
    nombre: Instituto de Ciencias Alejandro Lipschutz (ICAL)
    tipo: think_tank
    pais: Chile
    notas: "Think tank vinculado al Partido Comunista. Ha recibido $932 millones desde el Estado (2005-2018)."
  instituto_libertad:
    nombre: Instituto Libertad
    tipo: think_tank
    pais: Chile
    notas: "Think tank ligado a RN. Ha recibido $262 millones desde municipalidades, principalmente Vitacura. Socio de Atlas Network."
  fundacion_jaime_guzman:
    nombre: Fundacion Jaime Guzman
    tipo: think_tank
    pais: Chile
    notas: "Think tank ligado a la UDI. Ha recibido $284 millones desde el Estado, 91% de municipios UDI/RN."
  horizontal:
    nombre: Horizontal
