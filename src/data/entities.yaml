    notas: "Ministro de Desarrollo Social y Familia del segundo gobierno de Piñera (2019-2020). Presentó junto al Presidente el proyecto de Ingreso Familiar de Emergencia (IFE) en abril de 2020. Candidato presidencial en 2021."
  alejandra_candia:
