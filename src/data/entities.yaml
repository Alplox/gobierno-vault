  corte_apelaciones_santiago:
    nombre: Corte de Apelaciones de Santiago
    tipo: tribunal
    pais: Chile
    notas: "Tribunal de alzada de la Región Metropolitana. Su ministro Juan Cristóbal Mera, presidente de la Segunda Sala en 2026, fue señalado por Bío Bío Investiga como quien 'siempre vota a favor de los Lavín-Barriga' en las causas de Joaquín Lavín León y Cathy Barriga (agosto 2026)."
