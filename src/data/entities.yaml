    tipo: establecimiento_educacional
    pais: Chile
    notas: "Liceo de enseñanza media de Osorno (Región de Los Lagos). El 3 de agosto de 2026 un estudiante de primero medio agredió a una compañera y amenazó con un destornillador a la comunidad escolar, siendo reducido y detenido por Carabineros. El establecimiento activó el protocolo Aula Segura, suspendió la jornada de la tarde y convocó a apoderados para el 11 de agosto."
  ministerio_publico:
    nombre: Ministerio Público de Chile
    tipo: organismo_publico
    pais: Chile
    notas: "Institución autónoma a cargo de la persecución penal (Fiscalía de Chile). En 2010 su fiscal nacional, Sabas Chahuán, dictó una instrucción que prohibía a los fiscales adjuntos ingresar a las salas de juego de los casinos, declarada ilegal por la Tercera Sala de la Corte Suprema el 19 de enero de 2010 por invadir materias propias de ley."
  asociacion_nacional_fiscales:
    nombre: Asociación Nacional de Fiscales del Ministerio Público
    tipo: organizacion_social
    pais: Chile
    notas: "Asociación gremial que agrupa a los fiscales del Ministerio Público. En enero de 2010 presentó un recurso de protección contra la instrucción del fiscal nacional Sabas Chahuán que prohibía a los fiscales adjuntos ingresar a las salas de juego de los casinos, recurso que fue acogido por la Tercera Sala de la Corte Suprema."
  asociacion_chilena_municipalidades:
    nombre: Asociación Chilena de Municipalidades
    tipo: organizacion_social
    pais: Chile
    notas: "Organización que reúne a los municipios de Chile. En noviembre de 2009, junto a la Intendencia Metropolitana, impulsó una campaña masiva de tenencia responsable de mascotas para reducir los más de 250 mil perros abandonados de la Región Metropolitana y exigió que el proyecto de ley de tenencia de mascotas en trámite proveyera financiamiento para las nuevas atribuciones municipales."
  intendencia_metropolitana:
