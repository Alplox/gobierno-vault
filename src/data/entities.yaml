    pais: Chile

  municipalidad_coquimbo:
    nombre: Municipalidad de Coquimbo
    tipo: municipalidad
    pais: Chile
  municipalidad_puente_alto:
    nombre: Municipalidad de Puente Alto
    tipo: municipalidad
    pais: Chile
  municipalidad_quilicura:
    nombre: Municipalidad de Quilicura
    tipo: municipalidad
    pais: Chile
  municipalidad_la_cruz:
    nombre: Municipalidad de La Cruz
    tipo: municipalidad
    pais: Chile
  sence:
    nombre: Servicio Nacional de Capacitación y Empleo (Sence)
    tipo: servicio_publico
    pais: Chile
    notas: "Servicio público dependiente del Ministerio del Trabajo y Previsión Social, encargado de la capacitación y el empleo. En diciembre de 2009 su dirección nacional amonestó verbalmente a la directora regional de Los Lagos, Gloria González, por lucir una chapita de campaña de Eduardo Frei en una actividad pública, invocando la instrucción de la presidenta Michelle Bachelet que prohíbe la actividad política de funcionarios en horario laboral."
  municipalidad_quillota:
    nombre: Municipalidad de Quillota
    tipo: municipalidad
    pais: Chile
    notas: "Municipio de la Región de Valparaíso. En enero de 2010 preparó un catastro de unos veinte fondos concursables y programas sociales, culturales y deportivos para informar a las organizaciones de la comuna sobre alternativas de financiamiento, con reuniones informativas en los territorios de La Said y El Sendero."
  municipalidad_de_concepcion:
    nombre: Municipalidad de Concepción
    tipo: municipalidad
    pais: Chile
    notas: "Municipio de la Región del Bío-Bío. En 2010 su concejal Álvaro Ortiz Vera fue condenado por violencia intrafamiliar por el Juzgado de Familia de Concepción, además de enfrentar un proceso por conducción en estado de ebriedad y daños en San Pedro de la Paz."
  municipalidad_independencia:
    nombre: Municipalidad de Independencia
    tipo: municipalidad
    pais: Chile
  fenadaj:
    nombre: Federación Nacional de Acceso a la Justicia
    tipo: organizacion_social
    pais: Chile
    notas: "Federación Nacional de Acceso a la Justicia (FENADAJ). En agosto de 2026 confirmó su respaldo a la denuncia ante la CIDH por los recortes presupuestarios del gobierno de Kast, advirtiendo los riesgos para la implementación del Servicio Nacional de Acceso a la Justicia y Defensoría de Víctimas y para el acceso de la población a la justicia."
  acnudh:
    nombre: Alto Comisionado de Naciones Unidas para los Derechos Humanos
    tipo: organismo_internacional
    pais: Estados Unidos
    notas: "Alto Comisionado de las Naciones Unidas para los Derechos Humanos (ACNUDH). En la audiencia de la CIDH del 5 de agosto de 2026 su Oficina Regional para las Américas, representada por Montserrat Solano, llamó a preservar las capacidades estatales en materia de DDHH y a evaluar los cambios institucionales y presupuestarios a la luz de las obligaciones internacionales de Chile."
  red_observadoras_justicia_y_memoria:
    nombre: Red de Observadoras en Justicia y Memoria
    tipo: organizacion_social
    pais: Chile
    notas: "Red chilena que integró la delegación de organizaciones de DDHH ante la CIDH (5 de agosto de 2026), con Tamara Lagos, Magdalena Garcés y Paulina Zamorano. Denunció un patrón de 'desmantelamiento institucional' del Estado en verdad, justicia, reparación y memoria."
  restomarket:
    nombre: Restomarket
    tipo: empresa
    pais: Chile
    notas: "Empresa de retail de alimentos. En agosto de 2026 suspendió de todas sus funciones a su gerente general, Andrés Arrieta, tras su formalización por el caso de los niños que jugaban 'ring raja' en Vitacura."
  colegio_manquehue:
    nombre: Colegio Sagrados Corazones de Manquehue
    tipo: organizacion_social
    pais: Chile
    notas: "Establecimiento educacional de Vitacura del que eran estudiantes los menores afectados por el caso 'ring raja' (10 de julio de 2026) y del que el imputado Andrés Arrieta era apoderado y exlíder de exalumnos. Tras hacerse público el caso, la rectora Sandra Durán emitió un comunicado activando protocolos internos de apoyo y acompañamiento psicológico para estudiantes y familias, sin emitir juicios sobre el proceso judicial."
  cidh:
    nombre: Comisión Interamericana de Derechos Humanos
    tipo: organismo_internacional
    pais: Estados Unidos
    notas: "Organismo de la OEA con sede en Washington. En agosto de 2026 celebró la audiencia 'Impacto de las políticas administrativas en los derechos humanos en Chile' solicitada por organizaciones chilenas."
  londres_38:
    nombre: Londres 38, espacio de memorias
    tipo: organizacion_social
    pais: Chile
    notas: "Espacio de memoria y derechos humanos. Integró la delegación que presentó ante la CIDH el informe sobre retrocesos en DDHH bajo el gobierno de Kast (agosto 2026)."
  anef:
    nombre: Asociación Nacional de Empleados Fiscales
    tipo: sindicato
    pais: Chile
    notas: "Sindicato de funcionarios públicos. Participó en la audiencia de la CIDH de agosto 2026 exponiendo cuestionamientos por desvinculaciones de funcionarios desde el cambio de gobierno."
  colonia_dignidad:
    nombre: Colonia Dignidad
    tipo: organizacion_social
    pais: Chile
    notas: "Ex enclave alemán en la Región del Maule, centro de detención y tortura durante la dictadura. El gobierno de Kast abandonó el proceso de expropiación para transformarla en sitio de memoria, cuestión denunciada ante la CIDH en agosto de 2026."
  sin_filtros:
    nombre: Sin Filtros
    tipo: medio_comunicacion
    pais: Chile
    notas: "Programa de streaming de análisis político conducido por Fernando Solabarrieta. En agosto de 2026 vivió un episodio tenso cuando cuatro panelistas abandonaron el set tras la aparición del excarabinero Claudio Crespo, terminando el programa anticipadamente."
  cheaf:
    nombre: Cheaf Chile
    tipo: empresa
    pais: Chile
    notas: "Plataforma de gestión de despensa y ahorro alimentario. Realizó una encuesta a 2.007 usuarios en julio de 2026 sobre el costo de los alimentos en los hogares chilenos."
  mnoal:
    nombre: Movimiento de Países No Alineados
    tipo: organismo_internacional
    notas: "Organización internacional surgida en la Guerra Fría como alternativa de autonomía frente a los bloques de Estados Unidos y la Unión Soviética. Chile integró el movimiento desde 1971 hasta su retiro en agosto de 2026, bajo el gobierno de José Antonio Kast. Su presidencia la ejerce Uganda."
  prensa_opal:
    nombre: Prensa Opal
    tipo: medio_comunicacion
    pais: Chile
  biobiochile:
    nombre: BioBioChile
    tipo: medio_comunicacion
    pais: Chile
  anatel:
    nombre: Asociación Nacional de Televisión (ANATEL)
    tipo: asociacion_gremial
    pais: Chile
    notas: "Asociación Nacional de Televisión de Chile. Organizó el debate presidencial de la segunda vuelta de 2025 (9 de diciembre), transmitido en cadena por los canales de televisión abierta desde el Estudio 2 de TVN."
  archi:
    nombre: Asociación de Radiodifusores de Chile (ARCHI)
    tipo: asociacion_gremial
    pais: Chile
    notas: "Asociación de Radiodifusores de Chile. Organizó el debate presidencial del 3 de diciembre de 2025 entre Jeannette Jara y José Antonio Kast, realizado en el Campus Oriente de la Universidad Católica."
  panel_ciudadano_udd:
    nombre: Panel Ciudadano UDD
    tipo: encuestadora
    pais: Chile
    notas: "Encuestadora de la Universidad del Desarrollo. En la primera semana tras la primera vuelta de 2025 (17-23 de noviembre) publicó dos mediciones del balotaje entre Jeannette Jara y José Antonio Kast: una que dio 61% a 39% entre quienes manifestaron preferencia decidida, y una segunda que midió la transferencia de votos de Parisi, Matthei y Kaiser hacia ambos candidatos."
  partido_radical:
    nombre: Partido Radical
    tipo: partido_politico
    pais: Chile
    notas: "Partido político chileno. En la votación del 12 de diciembre de 2019 sus diputados Carlos Abel Jarpa y Fernando Meza votaron a favor de la 'cuestión previa' que hizo caer la acusación constitucional contra Sebastián Piñera, junto a sectores de la DC y de la ex Nueva Mayoría."
  tdlc:
    nombre: Tribunal de Defensa de la Libre Competencia
    tipo: servicio_publico
    pais: Chile
  fne:
    nombre: Fiscalía Nacional Económica
    tipo: servicio_publico
    pais: Chile
  asfaltos_chilenos:
    nombre: Asfaltos Chilenos S.A.
    tipo: empresa
    pais: Chile
    notas: "Empresa chilena de productos asfálticos. Condenada por el TDLC (Sentencia 148/2015) junto a Dynal, Enex y Química Latinoamericana por acuerdos de reparto de mercado en la provisión de asfalto a constructoras entre 2011 y 2012, con multa de 1.630 UTA. Jorge Quiroz elaboró un informe y declaró como testigo en su defensa ante el TDLC."
  dynal:
    nombre: Dynal Industrial S.A.
    tipo: empresa
    pais: Chile
    notas: "Empresa chilena de productos asfálticos. Condenada por el TDLC (Sentencia 148/2015) junto a Asfaltos Chilenos, Enex y Química Latinoamericana por reparto de mercado en la provisión de asfalto, con multa de 718 UTA."
  enex:
    nombre: Empresa Nacional de Energía Enex S.A.
    tipo: empresa
    pais: Chile
    notas: "Empresa chilena de combustibles y asfalto. En la colusión del asfalto (Sentencia TDLC 148/2015) se acogió a delación compensada ante la FNE en 2012 y quedó eximida de multa."
  quimica_latinoamericana:
    nombre: Química Latinoamericana S.A.
    tipo: empresa
    pais: Chile
    notas: "Empresa chilena de productos asfálticos. Condenada por el TDLC (Sentencia 148/2015) por reparto de mercado en la provisión de asfalto, con la mayor multa del caso: 1.790 UTA."
  mol:
    nombre: Mitsui O.S.K. Lines Ltd.
    tipo: empresa
    pais: Japón
    notas: "Naviera japonesa condenada por el TDLC (Sentencia 171/2019) por integrar el cartel del transporte marítimo de vehículos hacia Chile. Jorge Quiroz elaboró un informe encargado por MOL cuestionando el monto de la multa solicitada por la FNE (US$ 12 millones), que finalmente fue fijada en US$ 2,5 millones."
  csav:
    nombre: Compañía Sudamericana de Vapores
    tipo: empresa
    pais: Chile
    notas: "Naviera chilena del grupo Luksic. En la colusión del transporte marítimo de vehículos (Sentencia TDLC 171/2019) fue eximida de multa por delación compensada. Se acogió también a colaboración en los carteles globales investigados en EE.UU. y Canadá desde 2012."
  cmc:
    nombre: Compañía Marítima de Chile
    tipo: empresa
    pais: Chile
    notas: "Naviera chilena, ex Compañía Chilena de Navegación Interoceánica (CCNI). Sancionada por la Corte Suprema (2020) por integrar el cartel del transporte marítimo de vehículos hacia Chile, con multa de 7.636 UTA, después de quedar absuelta en primera instancia por prescripción."
  eukor:
    nombre: Eukor Car Carriers Inc.
    tipo: empresa
    pais: Corea del Sur
    notas: "Naviera coreana de transporte de vehículos. Sancionada por la Corte Suprema (2020) en la colusión del transporte marítimo hacia Chile, con multa de 10.517 UTA, tras quedar absuelta en primera instancia del TDLC por prescripción."
  kline:
    nombre: Kawasaki Kisen Kaisha Ltd.
    tipo: empresa
    pais: Japón
    notas: "Naviera japonesa. Sancionada por la Corte Suprema (2020) en la colusión del transporte marítimo de vehículos hacia Chile, con multa de 7.636 UTA, al acogerse parcialmente la reclamación de la FNE contra su absolución de primera instancia."
  nyk:
    nombre: Nippon Yusen Kabushiki Kaisha
    tipo: empresa
    pais: Japón
    notas: "Naviera japonesa. Condenada por el TDLC (Sentencia 171/2019) como segundo delator en la colusión del transporte marítimo de vehículos hacia Chile, con multa inicial de US$ 6,5 millones que la Corte Suprema incrementó en 3.818 UTA adicionales."
  quiroz_asociados:
    nombre: Quiroz y Asociados
    tipo: empresa
    pais: Chile
    notas: "Consultora de consultoría económica fundada por Jorge Quiroz en 2001, dedicada a asesorar a empresas en litigios económicos, procesos tarifarios, estrategia competitiva y análisis de libre competencia. Elaboró informes en defensa de empresas condenadas por colusión (pollos, farmacias, asfalto, navieras)."
  gerens:
    nombre: Gerens
    tipo: empresa
    pais: Chile
    notas: "Consultora de gestión cofundada por el economista Jorge Quiroz junto a Patricio Arrau."
  bolsa_santiago:
    nombre: Bolsa de Comercio de Santiago
    tipo: empresa
    pais: Chile
    notas: "Principal bolsa de valores de Chile. Jorge Quiroz forma parte de su directorio."
  salcobrand:
    nombre: Salcobrand S.A.
    tipo: empresa
    pais: Chile
    notas: "Cadena chilena de farmacias. Condenada junto a Cruz Verde y Farmacias Ahumada por colusión en el precio de medicamentos (TDLC, 2012). Jorge Quiroz elaboró informes y declaró como perito de Salcobrand ante el TDLC negando la existencia de colusión."
  don_pollo:
    nombre: Don Pollo S.A.
    tipo: empresa
    pais: Chile
    notas: "Productora avícola chilena. Condenada junto a Agrosuper y Ariztía por la colusión de los pollos (TDLC, Sentencia 139/2014, multa de 12.000 UTA)."
  cruz_verde:
    nombre: Farmacias Cruz Verde S.A.
    tipo: empresa
    pais: Chile
    notas: "Cadena chilena de farmacias. Condenada por el TDLC (Sentencia 119/2012) junto a Salcobrand por colusión en el precio de 206 medicamentos, con multa máxima de 20.000 UTA (≈US$ 19 millones), confirmada por la Corte Suprema en septiembre de 2012."
  farmacias_ahumada:
    nombre: Farmacias Ahumada S.A. (FASA)
    tipo: empresa
    pais: Chile
    notas: "Cadena chilena de farmacias. Participó en la colusión de las farmacias (2007-2008) pero se acogió a la delación compensada ante la FNE en abril de 2009, confesando el cartel y quedando eximida de la sanción del TDLC de 2012 tras pagar cerca de US$ 1 millón."
  asociacion_productores_avicolas:
    nombre: Asociación de Productores Avícolas de Chile
    tipo: gremio
    pais: Chile
    notas: "Asociación gremial de productores de pollo. Disuelta por el TDLC (Sentencia 139/2014) tras acreditarse la colusión de los pollos; su modelo de proyección de consumo fue identificado como el 'modelo Quiroz'."
  rumbo_colectivo:
    nombre: Rumbo Colectivo
    tipo: think_tank
    pais: Chile
    notas: "Centro de pensamiento ligado al Frente Amplio. Su director es Nicolás Grau, exministro de Hacienda y Economía del gobierno de Gabriel Boric, quien ha criticado la megarreforma tributaria de José Antonio Kast."
  asof:
    nombre: Confederación Nacional de Ferias Libres de Chile (ASOF)
    tipo: gremio
    pais: Chile
    notas: "Gremio nacional de ferias libres presidido por Paola Morales. El 6 de agosto de 2026 rechazó el uso despectivo de la expresión 'señora de feria' tras el cruce entre las senadoras Camila Flores y Fabiola Campillai, reivindicando que 'ser mujer de feria es un orgullo' y que las feriantes 'alimentan a Chile' y sostienen parte de la economía familiar."


  inmobiliaria_ecomac:
    nombre: Inmobiliaria Ecomac
    tipo: empresa_privada
    pais: Chile
    notas: "Empresa del grupo familiar de Daniel Más Valdés (ex Constructora Carel, luego Ecomac). En 2016 CIPER la vinculó a la 'lista de Carrasco': pagó $25 millones en facturas falsas (dos de $12,5 millones) a Asesorías VSA de Roberto Carrasco, que financiaron la campaña presidencial de Laurence Golborne."
  inmobiliaria_fundamenta:
    nombre: Inmobiliaria Fundamenta
    tipo: empresa
    pais: Chile
    notas: "Inmobiliaria controladora de Plaza Egaña SpA, proyecto que implicaba una inversión de US$300 millones y obtuvo un fallo favorable de la Tercera Sala de la Corte Suprema el 1 de marzo de 2023 tras gestiones de la entonces ministra Ángela Vivanco. Asesorada por los abogados Eduardo Lagos, Mario Vargas y Gabriel Silber, les pagó más de $600 millones por el fallo. Epicentro de la arista Fundamenta del caso Audios."
  os7:
    nombre: OS7 de Carabineros
    tipo: unidad_policial
    pais: Chile
    notas: "Sección de Investigación Patrimonial y Anticorrupción de Carabineros de Chile. En 2026 elaboró un informe pericial (25 páginas, enviado el 29-jul a la Fiscalía Regional de Los Lagos) que rastreó la ruta de los $13 millones recibidos por Gonzalo Migueles en el caso Fundamenta."
  banco_santander:
    nombre: Banco Santander Chile
    tipo: empresa
    pais: Chile
    notas: "Banco chileno. En la Operación Tokio (jun-2026) se investigó a su ejecutivo José Carlos Pérez Asencio por diseñar el esquema de cuentas corrientes para lavar dinero del Tren de Aragua."
  fiscalia_metropolitana_sur:
    nombre: Fiscalía Regional Metropolitana Sur
    tipo: fiscalia
    pais: Chile
    notas: "Fiscalía del Ministerio Público a cargo de la Operación Tokio (2026), que desarticuló la red de lavado de dinero del Tren de Aragua bajo la conducción del fiscal regional Héctor Barros."
  fiscalia_regional_los_lagos:
    nombre: Fiscalía Regional de Los Lagos
    tipo: fiscalia
    pais: Chile
    notas: "Fiscalía del Ministerio Público que investiga la arista Fundamenta del caso Audios (fiscal Marco Muñoz): el depósito de $13 millones a Gonzalo Migueles y el alzamiento de secreto bancario autorizado el 8 de junio de 2026 por el Séptimo Juzgado de Garantía."

