    notas: Ministerio de Salud de Chile.
  pd:
    nombre: Partido de la Gente
    tipo: partido
    notas: Partido político fundado por Franco Parisi y Kast.
  federacion_nacional_autismo:
    nombre: Federación Nacional del Autismo
    tipo: organizacion_social
    notas: Organización que agrupa a personas con autismo y sus familias en Chile.
  ustr:
